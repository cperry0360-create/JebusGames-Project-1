# Build and publish to GitHub Pages.
#
# This is no longer triggered by a push. It is called by the Checks workflow,
# which runs the tests and typecheck first and only reaches this once they are
# green — see .github/workflows/checks.yml. Triggering it on `push: main` again
# would put an unverified deploy back on the site.
name: Deploy to GitHub Pages

on:
  workflow_call:
  # Manual escape hatch: re-publish the current main without waiting on a push.
  # Deliberately skips the gate, so it is a human decision, not the default.
  workflow_dispatch:

# Allow the workflow to publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # No package-lock.json is committed yet, so this resolves fresh rather
      # than using `npm ci`. Swap to `npm ci` (and enable setup-node's npm
      # cache) once a lockfile lands.
      - run: npm install --no-audit --no-fund

      # Redundant when called from Checks, which has already run this. Kept so
      # a manual workflow_dispatch is not a way to publish untested code.
      - run: npm test

      - run: npm run build

      # THE ATTRIBUTE HAS TO SURVIVE THE BUILD, and nothing local can check it.
      #
      # `npm install` answers 403 in the agent environment, so Vite cannot be
      # run there and "the crossorigin attribute is in index.html" is only ever
      # a claim about the SOURCE. What ships is `dist/index.html`, which Vite
      # rewrites: it replaces the hand-authored `src="/src/main.ts"` with the
      # hashed bundle. If it dropped the attribute while doing that, three more
      # crash reports would come back reading "Script error." and nobody would
      # know why.
      #
      # So it is asserted here, on the real build output, by the machine that
      # actually runs Vite. A deploy that would silently un-mute nothing fails
      # instead. The page also reports its own `scriptCrossOrigin` at runtime
      # (see CrashContext.ts), so the next crash report says it too.
      - name: the module script keeps its crossorigin attribute
        run: |
          tag=$(grep -o '<script[^>]*type="module"[^>]*>' dist/index.html | head -1)
          echo "emitted module script tag: $tag"
          case "$tag" in
            *crossorigin*) echo "OK: crossorigin survived the build" ;;
            *) echo "FAIL: Vite emitted the module script WITHOUT crossorigin."
               echo "An exception in it would report as a bare 'Script error.'"
               exit 1 ;;
          esac

      # THE MANIFEST HAS TO SURVIVE THE BUILD TOO, for the same reason and by
      # the same method. It lives in `public/`, which Vite copies wholesale to
      # the output root -- a mechanism that works right up until someone sets
      # `publicDir: false` or moves the file, and then the home screen app
      # quietly goes back to having no display mode and no icon, which looks
      # like nothing at all until a phone rotates.
      #
      # `npm install` answers 403 in the agent environment, so this cannot be
      # checked where the file is written. It is checked here, on the real
      # output, by the machine that runs Vite.
      - name: the web app manifest and its icons survive the build
        run: |
          fail=0
          test -f dist/manifest.webmanifest \
            || { echo "FAIL: dist/manifest.webmanifest was not emitted"; fail=1; }
          if [ -f dist/manifest.webmanifest ]; then
            node -e '
              // Not require(): node resolves .webmanifest through no loader.
              const m = JSON.parse(require("fs").readFileSync("dist/manifest.webmanifest", "utf8"));
              const want = { display: "fullscreen", orientation: "landscape",
                             background_color: "#10161d", theme_color: "#10161d" };
              let bad = 0;
              for (const [k, v] of Object.entries(want)) {
                if (m[k] !== v) { console.log(`FAIL: manifest.${k} is ${m[k]}, expected ${v}`); bad = 1; }
              }
              if (!Array.isArray(m.icons) || m.icons.length === 0) {
                console.log("FAIL: manifest lists no icons"); bad = 1;
              }
              if (bad) process.exit(1);
              console.log(`OK: manifest emitted, display=${m.display} orientation=${m.orientation} icons=${m.icons.length}`);
            ' || fail=1
          fi
          grep -q 'rel="manifest"' dist/index.html \
            && echo "OK: dist/index.html links the manifest" \
            || { echo "FAIL: the emitted index.html does not link the manifest"; fail=1; }
          grep -q 'apple-touch-icon' dist/index.html \
            && echo "OK: dist/index.html carries the apple-touch-icon link" \
            || { echo "FAIL: no apple-touch-icon in the emitted index.html"; fail=1; }
          for i in icon-192.png icon-512.png icon-maskable-512.png apple-touch-icon.png; do
            test -s "dist/icons/$i" \
              && echo "OK: dist/icons/$i ($(stat -c%s "dist/icons/$i") bytes)" \
              || { echo "FAIL: dist/icons/$i missing or empty"; fail=1; }
          done
          exit $fail

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # One deploy at a time; let an in-flight run finish rather than cancelling
    # it. Job-level rather than workflow-level because this workflow is called
    # by another one and shares its run.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
