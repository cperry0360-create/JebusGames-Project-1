<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Courjahan Defense</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #14181f;
        overflow: hidden;
      }

      /* Phaser injects its canvas here; centering lives in CSS so the
         Scale manager only has to worry about the canvas itself. */
      #game {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100%;
      }

      canvas {
        display: block;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
