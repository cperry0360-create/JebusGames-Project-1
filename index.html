<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <!--
      GitHub Pages will not let us set Cache-Control, so these are best effort:
      some browsers honour them for the document, many ignore them. The real
      mechanism is the version check at the bottom of this file.
    -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta name="build" content="__BUILD_ID__" />
    <title>Courjahan Defense</title>
    <style>
      /* Kenney font package, CC0. Bundled so the game needs no network. */
      @font-face {
        font-family: 'KenneyFuture';
        src: url('./assets/fonts/KenneyFuture.ttf') format('truetype');
        font-display: block;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #10161d;
        overflow: hidden;
        /* The game owns every gesture on the canvas. Without these, Safari
           pans and rubber-bands the page instead of panning the map. */
        overscroll-behavior: none;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }

      /* Phaser injects its canvas here; centering lives in CSS so the
         Scale manager only has to worry about the canvas itself. */
      /* The canvas fills the viewport. There is no letterbox and no centring:
         the Scale manager resizes to the parent and the camera decides what
         part of the map is on screen. dvh follows Safari's collapsing bars. */
      #game {
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        overflow: hidden;
      }

      canvas {
        display: block;
        touch-action: none;
      }

      /* The safe area, made readable from JS.
         env(safe-area-inset-*) is a CSS value with no scripting equivalent, so
         it is applied as padding on a hidden probe and read back through
         getComputedStyle. The map fills the display, notch included; the HUD
         needs to know where the hardware is so it can stay out from under it. */
      #safe-area {
        position: fixed;
        top: 0;
        left: 0;
        width: 0;
        height: 0;
        visibility: hidden;
        pointer-events: none;
        padding-top: env(safe-area-inset-top, 0px);
        padding-right: env(safe-area-inset-right, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
        padding-left: env(safe-area-inset-left, 0px);
      }

      #boot {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #f6ecd9;
        font-family: monospace;
        font-size: 14px;
        letter-spacing: 0.2em;
      }
    </style>
  </head>
  <body>
    <div id="safe-area"></div>
    <div id="game"></div>
    <div id="boot">LOADING</div>
    <script>
      // Caught before anything else runs.
      //
      // Its own block, ahead of the module, for the reason the prototype gave:
      // a failure while the game script is being parsed or run still has to
      // produce something readable instead of a black rectangle. The real
      // panel is in ErrorPanel.ts and drains this queue once it loads; this
      // exists for the errors that happen before it can.
      ;(function () {
        window.__earlyErrors = []
        function note(message, stack) {
          window.__earlyErrors.push({ message: String(message), stack: stack || '' })
          // If the module never loads, nothing else will ever show this.
          setTimeout(function () {
            if (window.__errorPanelReady) return
            var el = document.getElementById('boot')
            if (!el) return
            el.style.color = '#ffd9d4'
            el.style.font = '12px/1.5 ui-monospace,monospace'
            el.style.whiteSpace = 'pre-wrap'
            el.style.padding = '14px'
            el.style.textAlign = 'left'
            el.textContent = 'Courjahan Defense could not start\n\n' +
              window.__earlyErrors.map(function (e) {
                return e.message + (e.stack ? '\n' + e.stack : '')
              }).join('\n\n')
          }, 2500)
        }
        window.addEventListener('error', function (e) {
          note(e.message, e.error && e.error.stack)
        })
        window.addEventListener('unhandledrejection', function (e) {
          var r = e.reason
          note(r && r.message ? r.message : String(r), r && r.stack)
        })
      })()

      // Self-healing cache check.
      //
      // Pages gives no control over headers, so a phone can hold this file for
      // days. That is worse than stale: the hashed bundle this HTML points at
      // is deleted by the next deploy, so an old index.html boots to nothing.
      //
      // version.json is fetched with no-store, which is a request-level flag
      // the browser does honour. If it names a different build than the one
      // stamped into this file, we are stale and reload once. The sessionStorage
      // guard stops that looping when even the reload comes from cache.
      (function () {
        var BUILT = '__BUILD_ID__'
        if (BUILT === '__BUILD' + '_ID__') return // dev server, nothing to check
        try {
          fetch('./version.json', { cache: 'no-store' })
            .then(function (r) { return r.ok ? r.json() : null })
            .then(function (v) {
              if (!v || v.build === BUILT) return
              if (sessionStorage.getItem('courjahan.reloaded') === v.build) return
              sessionStorage.setItem('courjahan.reloaded', v.build)
              location.reload()
            })
            .catch(function () {})
        } catch (e) {}
      })()
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
