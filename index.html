<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Courjahan Defense</title>
    <style>
      /* Kenney font package, CC0. Bundled so the game needs no network. */
      @font-face {
        font-family: 'KenneyFuture';
        src: url('./assets/fonts/KenneyFuture.ttf') format('truetype');
        font-display: block;
      }
      @font-face {
        font-family: 'KenneyFutureNarrow';
        src: url('./assets/fonts/KenneyFutureNarrow.ttf') format('truetype');
        font-display: block;
      }
      @font-face {
        font-family: 'KenneyMiniSquare';
        src: url('./assets/fonts/KenneyMiniSquare.ttf') format('truetype');
        font-display: block;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #10161d;
        overflow: hidden;
      }

      /* Phaser injects its canvas here; centering lives in CSS so the
         Scale manager only has to worry about the canvas itself. */
      #game {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100%;
      }

      canvas {
        display: block;
      }

      #boot {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #f6ecd9;
        font-family: monospace;
        font-size: 14px;
        letter-spacing: 0.2em;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="boot">LOADING</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
