/* ============================================================
   Screens: splash, menu, world map, credits
   ============================================================ */

var SCREEN = SCREEN_SPLASH;
var screenTime = 0;
var SPLASH_LEN = 4.0;
var splashDone = false;

var mapReveal = 0;      /* how far the trail has been drawn, in nodes */
var mapRevealTarget = 0;
var mapFocus = 0;

function setScreen(name) {
  SCREEN = name;
  screenTime = 0;
  if (name === SCREEN_MAP) {
    mapRevealTarget = PROGRESS.unlocked;
    if (mapReveal > mapRevealTarget) mapReveal = mapRevealTarget;
  }
  if (name === SCREEN_CREDITS) creditsY = VIEW_H + 40;
}

/* ---------------- splash ---------------- */

var SPLASH_SHARDS = null;

function initSplash() {
  SPLASH_SHARDS = [];
  var r = makeRng(0xBEEF);
  /* the mark: a blocky anvil built from cells, which fly in and settle */
  var markRows = [
    '..###########...',
    '.#############..',
    '..###########...',
    '....#######.....',
    '.....#####......',
    '......###.......',
    '......###.......',
    '.....#####......',
    '...#########....',
    '..###########...'
  ];
  var cell = 13;
  var w = markRows[0].length * cell, h = markRows.length * cell;
  var ox = VIEW_W / 2 - w / 2, oy = 176;
  for (var y = 0; y < markRows.length; y++) {
    for (var x = 0; x < markRows[y].length; x++) {
      if (markRows[y].charAt(x) !== '#') continue;
      var a = r() * Math.PI * 2;
      var d = 300 + r() * 420;
      SPLASH_SHARDS.push({
        tx: ox + x * cell, ty: oy + y * cell,
        sx: VIEW_W / 2 + Math.cos(a) * d, sy: VIEW_H / 2 + Math.sin(a) * d,
        delay: r() * 0.5, size: cell - 1,
        rot: (r() * 2 - 1) * 4
      });
    }
  }
}

var LOGO_DRAW_W = 400;
var IMPACT_T = 0.72;
var SPLASH_SPARKS = null;
var SPLASH_EMBERS = null;

function initSplashFx() {
  var r = makeRng(0xA11CE5);
  SPLASH_SPARKS = [];
  for (var i = 0; i < 74; i++) {
    var a = r() * Math.PI * 2;
    SPLASH_SPARKS.push({
      a: a,
      sp: 130 + r() * 420,
      size: 2 + Math.floor(r() * 3),
      warm: r() < 0.6,
      spin: (r() * 2 - 1) * 3
    });
  }
  SPLASH_EMBERS = [];
  for (i = 0; i < 46; i++) {
    SPLASH_EMBERS.push({
      x: r(), phase: r() * 6.28, sp: 14 + r() * 30,
      size: 1 + Math.floor(r() * 2), drift: (r() * 2 - 1) * 14
    });
  }
}

function drawSplash(ctx, t) {
  if (!SPLASH_SHARDS) initSplash();
  if (!SPLASH_SPARKS) initSplashFx();

  ctx.fillStyle = PAL.ink;
  ctx.fillRect(0, 0, VIEW_W, VIEW_H);

  /* embers drifting up the whole time, so the frame is never still */
  for (var i = 0; i < SPLASH_EMBERS.length; i++) {
    var em = SPLASH_EMBERS[i];
    var ey = VIEW_H - ((t * em.sp + em.phase * 90) % (VIEW_H + 60));
    var ex = em.x * VIEW_W + Math.sin(t * 0.8 + em.phase) * em.drift;
    var fade = clamp(ey / VIEW_H, 0, 1);
    ctx.fillStyle = 'rgba(217,164,65,' + (0.10 + fade * 0.22).toFixed(3) + ')';
    ctx.fillRect(ex, ey, em.size, em.size);
  }

  /* the landing shakes the frame */
  var shake = 0;
  if (t > IMPACT_T && t < IMPACT_T + 0.5) {
    shake = 13 * Math.pow(1 - (t - IMPACT_T) / 0.5, 2);
  }
  ctx.save();
  if (shake > 0) ctx.translate(Math.sin(t * 91) * shake, Math.cos(t * 77) * shake * 0.7);

  var cx = VIEW_W / 2, cy = 240;

  if (logoReady) {
    drawSplashRays(ctx, t, cx, cy);
    drawSplashLogo(ctx, t, cx, cy);
  } else {
    drawSplashFallback(ctx, t);
  }

  drawSplashImpact(ctx, t, cx, cy);
  ctx.restore();

  /* white flash on the beat */
  if (t > IMPACT_T && t < IMPACT_T + 0.10) {
    ctx.fillStyle = 'rgba(255,246,214,' + (0.15 * (1 - (t - IMPACT_T) / 0.10)).toFixed(3) + ')';
    ctx.fillRect(0, 0, VIEW_W, VIEW_H);
  }

  if (t > 1.8 && !logoReady) {
    var nk = clamp((t - 1.8) / 0.55, 0, 1);
    ctx.globalAlpha = nk;
    drawTextShadow(ctx, 'JEBUSGAMES', VIEW_W / 2, lerp(370, 344, 1 - Math.pow(1 - nk, 3)), 5, PAL.brass, 'center');
    ctx.globalAlpha = 1;
  }

  /* a brass rule opens outward, then the word sits on it */
  if (t > 2.35) {
    var rk = clamp((t - 2.35) / 0.5, 0, 1);
    var rw = 150 * (1 - Math.pow(1 - rk, 3));
    ctx.fillStyle = PAL.brassDim;
    ctx.fillRect(VIEW_W / 2 - rw, 436, rw * 2, 2);
    ctx.globalAlpha = clamp((t - 2.55) / 0.45, 0, 1) * 0.9;
    drawText(ctx, 'PRESENTS', VIEW_W / 2, logoReady ? 448 : 400, 2, PAL.parch, 'center');
    ctx.globalAlpha = 1;
  }

  ctx.globalAlpha = 0.5 + 0.35 * Math.sin(t * 4);
  drawText(ctx, 'TAP TO SKIP', VIEW_W / 2, VIEW_H - 26, 1, PAL.stone, 'center');
  ctx.globalAlpha = 1;

  if (t > SPLASH_LEN - 0.5) {
    ctx.fillStyle = 'rgba(16,12,24,' + clamp((t - (SPLASH_LEN - 0.5)) / 0.5, 0, 1).toFixed(3) + ')';
    ctx.fillRect(0, 0, VIEW_W, VIEW_H);
  }
}

/* slow wheel of light behind the mark once it has landed */
function drawSplashRays(ctx, t, cx, cy) {
  if (t < IMPACT_T - 0.1) return;
  var k = clamp((t - IMPACT_T + 0.1) / 0.6, 0, 1);
  var hold = 0.10 + 0.05 * Math.sin(t * 1.6);
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.globalAlpha = k * hold;
  ctx.translate(cx, cy);
  ctx.rotate(t * 0.22);
  for (var i = 0; i < 12; i++) {
    ctx.rotate(Math.PI * 2 / 12);
    var g = ctx.createLinearGradient(0, 0, 460, 0);
    g.addColorStop(0, 'rgba(217,164,65,0.85)');
    g.addColorStop(1, 'rgba(217,164,65,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(460, -34);
    ctx.lineTo(460, 34);
    ctx.closePath();
    ctx.fill();
  }
  ctx.restore();
}

/* shockwave rings and a burst of sparks at the moment of landing */
function drawSplashImpact(ctx, t, cx, cy) {
  var dt = t - IMPACT_T;
  if (dt < 0 || dt > 1.1) return;

  for (var ring = 0; ring < 2; ring++) {
    var rk = (dt - ring * 0.09) / 0.55;
    if (rk <= 0 || rk >= 1) continue;
    ctx.strokeStyle = 'rgba(255,246,214,' + ((1 - rk) * 0.5).toFixed(3) + ')';
    ctx.lineWidth = 4 * (1 - rk) + 1;
    ctx.beginPath();
    ctx.ellipse(cx, cy + 120, 40 + rk * 460, (40 + rk * 460) * 0.26, 0, 0, Math.PI * 2);
    ctx.stroke();
  }

  var sk = clamp(dt / 0.9, 0, 1);
  for (var i = 0; i < SPLASH_SPARKS.length; i++) {
    var s = SPLASH_SPARKS[i];
    var d = s.sp * dt;
    var x = cx + Math.cos(s.a) * d;
    var y = cy + 110 + Math.sin(s.a) * d * 0.42 + 300 * dt * dt;
    ctx.fillStyle = (s.warm ? 'rgba(217,164,65,' : 'rgba(255,246,214,') + (1 - sk).toFixed(3) + ')';
    ctx.fillRect(x, y, s.size, s.size);
  }
}

/* The mark falls in hard, lands with a squash, then breathes. */
function drawSplashLogo(ctx, t, cx, cy) {
  var w0 = LOGO_DRAW_W;
  var h0 = w0 * (logoImg.height / logoImg.width);

  var fall = clamp((t - 0.12) / (IMPACT_T - 0.12), 0, 1);
  var yOff = -300 * (1 - fall * fall);          /* accelerating, not easing out */
  var entryScale = lerp(1.16, 1, fall * fall);

  var sx = 1, sy = 1;
  var dt = t - IMPACT_T;
  if (dt >= 0 && dt < 0.42) {
    var decay = Math.pow(1 - dt / 0.42, 2) * Math.cos(dt * 26);
    sx = 1 + 0.13 * decay;
    sy = 1 - 0.13 * decay;
  }
  var bob = t > 1.1 ? Math.sin((t - 1.1) * 1.7) * 3.5 : 0;

  var w = w0 * entryScale * sx;
  var h = h0 * entryScale * sy;
  var x = Math.round(cx - w / 2);
  var y = Math.round(cy - h / 2 + yOff + bob);

  /* motion ghosts while it is still falling */
  if (fall < 1) {
    for (var g = 1; g <= 2; g++) {
      ctx.globalAlpha = 0.13 / g;
      ctx.drawImage(logoImg, x, Math.round(y - g * 46), Math.round(w), Math.round(h));
    }
    ctx.globalAlpha = 1;
  }

  if (t > IMPACT_T - 0.05) {
    var glow = ctx.createRadialGradient(cx, cy, 20, cx, cy, w * 0.8);
    glow.addColorStop(0, 'rgba(217,164,65,0.20)');
    glow.addColorStop(1, 'rgba(217,164,65,0)');
    ctx.fillStyle = glow;
    ctx.fillRect(0, 0, VIEW_W, VIEW_H);
  }

  ctx.globalAlpha = clamp(t / 0.3, 0, 1);
  ctx.drawImage(logoImg, x, y, Math.round(w), Math.round(h));
  ctx.globalAlpha = 1;

  if (t > 1.25 && t < 2.45) {
    var buf = logoShine((t - 1.25) / 1.2);
    if (buf) {
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = 0.7;
      ctx.drawImage(buf, x, y, Math.round(w), Math.round(h));
      ctx.restore();
    }
  }
}

function drawSplashFallback(ctx, t) {
  var i;
  for (i = 0; i < SPLASH_SHARDS.length; i++) {
    var s = SPLASH_SHARDS[i];
    var k = clamp((t - s.delay) / 1.0, 0, 1);
    var e = 1 - Math.pow(1 - k, 3);
    var x = lerp(s.sx, s.tx, e);
    var y = lerp(s.sy, s.ty, e);
    ctx.save();
    if (k < 1) {
      ctx.translate(x + s.size / 2, y + s.size / 2);
      ctx.rotate(s.rot * (1 - e));
      ctx.translate(-s.size / 2, -s.size / 2);
      ctx.fillStyle = '#8c6a26';
      ctx.fillRect(0, 0, s.size, s.size);
    } else {
      ctx.fillStyle = PAL.brass;
      ctx.fillRect(x, y, s.size, s.size);
      ctx.fillStyle = 'rgba(255,240,200,0.30)';
      ctx.fillRect(x, y, s.size, 3);
    }
    ctx.restore();
  }

}

/* ---------------- menu ---------------- */

/* TEMPORARY: a test shortcut on the start screen that unlocks every level so
   levels can be checked without playing up to them. Set this to false (or
   delete the flag and the two blocks that read it) to remove it. */
var DEV_UNLOCK = true;

var BTN_ASPECT = 340 / 162;

/* One layout, used by both the drawing and the hit testing, so the plates and
   the tap targets cannot drift apart. The rects are the same whether or not
   the art decoded. */
function menuButtons() {
  var canContinue = PROGRESS.unlocked > 1 || totalStars() > 0;
  var ids = canContinue ? ['new', 'continue', 'credits'] : ['new', 'credits'];
  var art = { 'new': 'newgame', 'continue': 'continueBtn', 'credits': 'credits' };
  var labels = { 'new': 'NEW GAME', 'continue': 'CONTINUE', 'credits': 'CREDITS' };

  var n = ids.length;
  var gap = 10;
  var band = 394;
  var h = Math.min(150, Math.floor((band - (n - 1) * gap) / n));
  var w = Math.round(h * BTN_ASPECT);
  var stack = n * h + (n - 1) * gap;
  var top = VIEW_H - 26 - stack;

  var out = [];
  for (var i = 0; i < n; i++) {
    out.push({
      id: ids[i],
      x: Math.round(VIEW_W / 2 - w / 2),
      y: top + i * (h + gap),
      w: w, h: h,
      img: art[ids[i]],
      label: labels[ids[i]],
      scale: 2,
      accent: ids[i] === 'new' ? PAL.brass : PAL.brassDim
    });
  }

  if (DEV_UNLOCK) {
    out.push({
      id: 'unlockAll',
      x: VIEW_W - 186, y: VIEW_H - 42 - (storageBroken ? 34 : 0),
      w: 172, h: 30,
      label: 'UNLOCK ALL (TEST)',
      accent: PAL.blood
    });
  }
  return out;
}

var MENU_BG = null;
function drawMenu(ctx, t) {
  var art = menuArt('title');
  if (art) {
    ctx.drawImage(art, 0, 0, VIEW_W, VIEW_H);
  } else {
    if (!MENU_BG) MENU_BG = paintMenuBackdrop();
    ctx.drawImage(MENU_BG, 0, 0);
    ctx.fillStyle = 'rgba(16,12,24,0.35)';
    ctx.fillRect(0, 0, VIEW_W, VIEW_H);
    drawTextShadow(ctx, 'COURJAHAN', VIEW_W / 2, 96, 8, PAL.brass, 'center');
    drawTextShadow(ctx, 'DEFENSE', VIEW_W / 2, 168, 8, PAL.parch, 'center');
    ctx.fillStyle = PAL.brassDim;
    ctx.fillRect(VIEW_W / 2 - 180, 228, 360, 2);
    drawText(ctx, 'HOLD THE ROAD. THE HORDE DOES NOT REST.', VIEW_W / 2, 244, 1, PAL.parchDim, 'center');
  }

  var list = menuButtons();
  for (var i = 0; i < list.length; i++) drawButton(ctx, list[i]);

  if (totalStars() > 0) {
    panel(ctx, 14, VIEW_H - 40, 128, 28, { fill: 'rgba(20,16,32,0.72)' });
    drawStar(ctx, 32, VIEW_H - 26, 9, true);
    drawText(ctx, totalStars() + '/' + (LEVEL_COUNT * 3), 48, VIEW_H - 33, 2, PAL.brass);
  }
  if (storageBroken) {
    panel(ctx, VIEW_W - 340, VIEW_H - 40, 326, 28, { fill: 'rgba(43,15,20,0.85)', edge: PAL.blood });
    drawText(ctx, 'PROGRESS CANNOT BE SAVED HERE', VIEW_W - 24, VIEW_H - 33, 1, '#ffd9d4', 'right');
  }
}

function paintMenuBackdrop() {
  var cv = newCanvas(VIEW_W, VIEW_H);
  var c = cv.getContext('2d');
  var r = makeRng(99);
  var g = c.createLinearGradient(0, 0, 0, VIEW_H);
  g.addColorStop(0, '#241a30');
  g.addColorStop(0.55, '#3a2c40');
  g.addColorStop(1, '#1b1830');
  c.fillStyle = g;
  c.fillRect(0, 0, VIEW_W, VIEW_H);
  /* silhouetted ridgeline and a keep */
  for (var layer = 0; layer < 3; layer++) {
    c.fillStyle = ['#2a2038', '#221a2e', '#1a1426'][layer];
    c.beginPath();
    c.moveTo(0, VIEW_H);
    var y = 330 + layer * 46;
    c.lineTo(0, y);
    for (var x = 0; x <= VIEW_W; x += 40) {
      c.lineTo(x, y + Math.sin(x * 0.012 + layer * 2) * 26 + (r() * 14 - 7));
    }
    c.lineTo(VIEW_W, VIEW_H);
    c.closePath();
    c.fill();
  }
  return cv;
}

/* ---------------- world map ---------------- */

function mapButtons() {
  var out = [];
  for (var i = 0; i < LEVEL_COUNT; i++) {
    var unlocked = i < PROGRESS.unlocked;
    out.push({
      id: 'level:' + i, shape: 'circle',
      cx: MAP_NODES[i].x, cy: MAP_NODES[i].y, r: 30,
      enabled: unlocked && mapReveal >= i + 0.98,
      node: i
    });
  }
  out.push({ id: 'menu', x: 18, y: VIEW_H - 54, w: 130, h: 38, label: 'MAIN MENU' });
  if (PROGRESS.beaten) out.push({ id: 'credits', x: VIEW_W - 158, y: VIEW_H - 54, w: 140, h: 38, label: 'CREDITS' });
  return out;
}

var MAP_BG = null;
function drawMap(ctx, t) {
  if (!MAP_BG) MAP_BG = paintParchment();
  ctx.drawImage(MAP_BG, 0, 0);

  drawTextShadow(ctx, 'THE COURJAHAN MARCH', VIEW_W / 2, 34, 3, '#5b4a2e', 'center');

  /* dotted trail, revealed as levels unlock */
  for (var i = 0; i < MAP_NODES.length - 1; i++) {
    var a = MAP_NODES[i], b = MAP_NODES[i + 1];
    var seg = clamp(mapReveal - (i + 1), 0, 1);
    var steps = Math.floor(dist(a.x, a.y, b.x, b.y) / 16);
    for (var s = 0; s <= steps; s++) {
      var k = s / steps;
      if (k > seg) break;
      var x = lerp(a.x, b.x, k), y = lerp(a.y, b.y, k) - Math.sin(k * Math.PI) * 22;
      ctx.fillStyle = '#6b5535';
      ctx.fillRect(x - 2, y - 2, 4, 4);
    }
  }

  var list = mapButtons();
  for (i = 0; i < LEVEL_COUNT; i++) {
    var n = MAP_NODES[i];
    var unlocked = i < PROGRESS.unlocked && mapReveal >= i + 0.98;
    var stars = PROGRESS.stars[i];

    ctx.fillStyle = 'rgba(80,62,36,0.35)';
    ctx.beginPath(); ctx.arc(n.x, n.y + 4, 30, 0, Math.PI * 2); ctx.fill();

    ctx.fillStyle = unlocked ? '#8c6a26' : '#6a6154';
    ctx.beginPath(); ctx.arc(n.x, n.y, 28, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = unlocked ? '#d9a441' : '#837a6b';
    ctx.beginPath(); ctx.arc(n.x, n.y, 23, 0, Math.PI * 2); ctx.fill();

    if (unlocked) {
      drawText(ctx, String(i + 1), n.x, n.y - 4, 2, '#3a2c14', 'center');
    } else {
      /* padlock */
      ctx.fillStyle = '#4a4238';
      ctx.fillRect(n.x - 7, n.y - 2, 14, 12);
      ctx.strokeStyle = '#4a4238'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(n.x, n.y - 3, 6, Math.PI, 0); ctx.stroke();
    }

    for (var s2 = 0; s2 < 3; s2++) {
      drawStar(ctx, n.x - 16 + s2 * 16, n.y + 40, 7, s2 < stars);
    }
    drawText(ctx, LEVELS[i].name, n.x, n.y + 52, 1, unlocked ? '#4a3a20' : '#8a8072', 'center');

    if (unlocked && i === PROGRESS.unlocked - 1 && stars === 0) {
      ctx.strokeStyle = 'rgba(193,68,58,' + (0.45 + 0.35 * Math.sin(t * 4)).toFixed(3) + ')';
      ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(n.x, n.y, 34, 0, Math.PI * 2); ctx.stroke();
    }
  }

  for (i = 0; i < list.length; i++) {
    if (list[i].shape === 'circle') continue;
    drawButton(ctx, list[i]);
  }

  drawText(ctx, 'STARS ' + totalStars() + '/' + (LEVEL_COUNT * 3), VIEW_W / 2, VIEW_H - 40, 1, '#5b4a2e', 'center');
}

function paintParchment() {
  var cv = newCanvas(VIEW_W, VIEW_H);
  var c = cv.getContext('2d');
  var r = makeRng(4242);
  c.fillStyle = '#e6d7b0';
  c.fillRect(0, 0, VIEW_W, VIEW_H);
  for (var i = 0; i < 2600; i++) {
    var x = r() * VIEW_W, y = r() * VIEW_H;
    var d = Math.floor(r() * 26 - 13);
    c.fillStyle = shade('#e6d7b0', d);
    c.fillRect(x, y, 3, 3);
  }
  /* burnt edges */
  var g = c.createRadialGradient(VIEW_W / 2, VIEW_H / 2, 180, VIEW_W / 2, VIEW_H / 2, 560);
  g.addColorStop(0, 'rgba(120,92,48,0)');
  g.addColorStop(1, 'rgba(92,68,32,0.55)');
  c.fillStyle = g;
  c.fillRect(0, 0, VIEW_W, VIEW_H);
  /* stylised coast and trees */
  c.strokeStyle = 'rgba(122,98,60,0.5)';
  c.lineWidth = 2;
  c.beginPath();
  c.moveTo(0, 120);
  for (var x2 = 0; x2 <= VIEW_W; x2 += 30) c.lineTo(x2, 120 + Math.sin(x2 * 0.02) * 18 + r() * 8);
  c.stroke();
  for (i = 0; i < 40; i++) {
    var tx = r() * VIEW_W, ty = 150 + r() * (VIEW_H - 220);
    if (MAP_NODES.some(function (n) { return dist(n.x, n.y, tx, ty) < 76; })) continue;
    c.fillStyle = 'rgba(96,110,66,0.55)';
    c.beginPath();
    c.moveTo(tx, ty - 12); c.lineTo(tx + 7, ty + 4); c.lineTo(tx - 7, ty + 4);
    c.closePath(); c.fill();
    c.fillStyle = 'rgba(110,84,48,0.6)';
    c.fillRect(tx - 1, ty + 4, 2, 5);
  }
  return cv;
}

var CREDITS_LAYOUT = null;

function creditsLayout() {
  /* image lines have no height until their art decodes, so the layout is
     rebuilt if that availability changes rather than cached from the first
     frame */
  var key = (logoReady ? 1 : 0) + (menuArt('knight') ? 2 : 0);
  if (CREDITS_LAYOUT && CREDITS_LAYOUT_KEY === key) return CREDITS_LAYOUT;
  CREDITS_LAYOUT_KEY = key;
  var items = [], y = 0;
  for (var i = 0; i < CREDITS.length; i++) {
    var kind = CREDITS[i][0];
    var h = CREDITS_LINE_H;
    if (kind === 'logo') {
      h = (logoReady ? CREDITS_LOGO_W * (logoImg.height / logoImg.width) : 60) + 40;
    } else if (kind === 'knight') {
      var kn = menuArt('knight');
      h = (kn ? CREDITS_KNIGHT_W * (kn.height / kn.width) : 60) + 30;
    } else if (kind === 'names') h = 96;
    else if (kind === 't') h = 34;
    else if (kind === 's') h = 28;
    items.push({ kind: kind, text: CREDITS[i][1], who: CREDITS[i][2] || 'CORY', y: y, h: h });
    y += h;
  }
  CREDITS_LAYOUT = { items: items, total: y };
  return CREDITS_LAYOUT;
}

  var x = Math.round(VIEW_W / 2 - total / 2);

var gameCanvas = null;
var gameCtx = null;
var lastFrame = 0;
var bootErrors = [];
var frameCount = 0;

function fitCanvas() {
  if (!gameCanvas) return;
  var doc = docRef();
  /* measure the safe-area box, not the raw window, so a notch or a home
     indicator never sits on top of the on-screen controls */
  var box = doc.getElementById('wrap');
  var w = (box && box.clientWidth) || globalThis.innerWidth || VIEW_W;
  var h = (box && box.clientHeight) || globalThis.innerHeight || VIEW_H;
  if (!w) w = globalThis.innerWidth || VIEW_W;
  if (!h) h = globalThis.innerHeight || VIEW_H;
  var scale = Math.min(w / VIEW_W, h / VIEW_H);
  if (!isFinite(scale) || scale <= 0) scale = 1;
  gameCanvas.style.width = Math.floor(VIEW_W * scale) + 'px';
  gameCanvas.style.height = Math.floor(VIEW_H * scale) + 'px';
}

function toView(clientX, clientY) {
  if (!gameCanvas || !gameCanvas.getBoundingClientRect) return { x: clientX, y: clientY };
  var r = gameCanvas.getBoundingClientRect();
  var w = r.width || VIEW_W, h = r.height || VIEW_H;
  return {
    x: (clientX - r.left) * (VIEW_W / w),
    y: (clientY - r.top) * (VIEW_H / h)
  };
}

/* ---------------- tap routing ---------------- */

function currentButtons() {
  if (SCREEN === SCREEN_MENU) return menuButtons();
  if (SCREEN === SCREEN_MAP) return mapButtons();
  if (SCREEN === SCREEN_CREDITS) return creditsButtons();
  if (SCREEN === SCREEN_LEVEL) return levelButtons();
  return [];
}

function handleTap(x, y) {
  if (SCREEN === SCREEN_SPLASH) { finishSplash(); return 'splashSkip'; }

  var btn = hitButton(currentButtons(), x, y);

  if (SCREEN === SCREEN_MENU) {
    if (!btn) return null;
    if (btn.id === 'new') { clearProgress(); mapReveal = 1; setScreen(SCREEN_MAP); }
    else if (btn.id === 'continue') { mapReveal = PROGRESS.unlocked; setScreen(SCREEN_MAP); }
    else if (btn.id === 'credits') setScreen(SCREEN_CREDITS);
    else if (btn.id === 'unlockAll') {
      /* TEMPORARY test shortcut, see DEV_UNLOCK */
      PROGRESS.unlocked = LEVEL_COUNT;
      PROGRESS.beaten = true;
      saveProgress();
      mapReveal = LEVEL_COUNT;
      mapRevealTarget = LEVEL_COUNT;
      setScreen(SCREEN_MAP);
    }
    return btn.id;
  }

  if (SCREEN === SCREEN_MAP) {
    if (!btn) return null;
    if (btn.id === 'menu') setScreen(SCREEN_MENU);
    else if (btn.id === 'credits') setScreen(SCREEN_CREDITS);
    else if (btn.id.indexOf('level:') === 0) {
      var idx = parseInt(btn.id.split(':')[1], 10);
      enterLevel(idx);
    }
    return btn.id;
  }

  if (SCREEN === SCREEN_CREDITS) {
    if (btn && btn.id === 'creditsDone') setScreen(SCREEN_MAP);
    return btn ? btn.id : null;
  }

  if (SCREEN !== SCREEN_LEVEL || !RUN) return null;

  /* --- level --- */
  if (btn) {
    switch (btn.id) {
      case 'pause': RUN.paused = !RUN.paused; return 'pause';
      case 'speed': RUN.speed = RUN.speed > 1 ? 1 : 2; return 'speed';
      case 'quit': setScreen(SCREEN_MAP); return 'quit';
      case 'rain':
        RUN.aimMode = RUN.aimMode === 'rain' ? null : 'rain';
        RUN.radial = null; RUN.selectedTower = null;
        return 'rain';
      case 'reinforce':
        RUN.aimMode = RUN.aimMode === 'reinforce' ? null : 'reinforce';
        RUN.radial = null; RUN.selectedTower = null;
        return 'reinforce';
      case 'hero':
        RUN.aimMode = RUN.aimMode === 'hero' ? null : 'hero';
        RUN.radial = null; RUN.selectedTower = null;
        return 'hero';
      case 'call': callWaveEarly(); return 'call';
      case 'radialClose': RUN.radial = null; return 'radialClose';
      case 'upgrade': upgradeTower(RUN.selectedTower); return 'upgrade';
      case 'sell': sellTower(RUN.selectedTower); RUN.selectedTower = null; RUN.rallyMode = false; return 'sell';
      case 'rally': RUN.rallyMode = !RUN.rallyMode; return 'rally';
      case 'deselect': RUN.selectedTower = null; RUN.rallyMode = false; return 'deselect';
      case 'next':
        if (RUN.index >= LEVEL_COUNT - 1) { setScreen(SCREEN_CREDITS); }
        else { mapReveal = Math.max(mapReveal, RUN.index + 1); enterLevel(RUN.index + 1); }
        return 'next';
      case 'retry': enterLevel(RUN.index); return 'retry';
      case 'toMap': setScreen(SCREEN_MAP); return 'toMap';
      default:
        if (btn.id.indexOf('build:') === 0) {
          var type = btn.id.split(':')[1];
          var t = buildTower(RUN.radial.spotIndex, type);
          if (t) { RUN.radial = null; RUN.selectedTower = t; }
          return 'build';
        }
        if (btn.id.indexOf('spec:') === 0) {
          specialiseTower(RUN.selectedTower, btn.id.split(':')[1]);
          return 'spec';
        }
    }
    return btn.id;
  }

  if (RUN.status !== 'playing') return null;
  if (y < HUD_H) return null;

  /* casting an ability */
  if (RUN.aimMode) {
    if (RUN.aimMode === 'rain') castRain(x, y);
    else if (RUN.aimMode === 'hero') moveHero(x, y);
    else castReinforce(x, y);
    RUN.aimMode = null;
    return 'cast';
  }

  /* moving a rally point */
  if (RUN.rallyMode && RUN.selectedTower && TOWERS[RUN.selectedTower.type].isBarracks) {
    setRally(RUN.selectedTower, x, y);
    RUN.rallyMode = false;
    return 'setRally';
  }

  /* bribing the sign-holder */
  if (signIsAvailable() && plateFor(0) && pointInRect(x, y, signTapRect())) {
    if (RUN.gold >= SIGN_BRIBE) {
      RUN.gold -= SIGN_BRIBE;
      RUN.signFlipped = true;
      addFx('ring', x, y, { color: PAL.brass });
      toast('50 PEANUTS. THE SIGN TURNS AROUND.');
      return 'bribe';
    }
    toast('HE WANTS ' + SIGN_BRIBE + ' PEANUTS');
    return 'bribeRefused';
  }

  /* a build pad or an existing tower */
  for (var i = 0; i < RUN.spots.length; i++) {
    var s = RUN.spots[i];
    if (!pointInCircle(x, y, s.x, s.y, 26)) continue;
    if (s.tower) {
      RUN.selectedTower = s.tower;
      RUN.radial = null;
      RUN.rallyMode = false;
      return 'selectTower';
    }
    RUN.radial = { spotIndex: i };
    RUN.selectedTower = null;
    return 'openRadial';
  }

  RUN.radial = null;
  RUN.selectedTower = null;
  RUN.rallyMode = false;
  return 'clear';
}

function enterLevel(idx) {
  if (idx < 0 || idx >= LEVEL_COUNT) return false;
  startLevel(idx);
  setScreen(SCREEN_LEVEL);
  return true;
}

function finishSplash() {
  if (splashDone) return;
  splashDone = true;
  setScreen(SCREEN_MENU);
}

/* ---------------- loop ---------------- */

/* The rotate card covers the board, but the clock has to stop with it.
   Otherwise the splash plays out behind the card and is gone by the time the
   phone comes round. Same media query as the CSS, so the two cannot disagree. */
var orientationBlocked = false;

function isPortraitBlocked() {
  try {
    var mm = globalThis.matchMedia;
    if (typeof mm !== 'function') return false;
    var q = mm('(orientation: portrait)');
    return !!(q && q.matches);
  } catch (e) {
    return false;
  }
}

function stepGame(dt) {
  var blocked = isPortraitBlocked();
  if (blocked !== orientationBlocked) {
    orientationBlocked = blocked;
    if (!blocked) {
      fitCanvas();
      /* if they never saw the splash, start it over rather than skipping it */
      if (SCREEN === SCREEN_SPLASH) screenTime = 0;
    }
  }
  if (blocked) return;

  screenTime += dt;
  if (SCREEN === SCREEN_SPLASH) {
    if (screenTime >= SPLASH_LEN) finishSplash();
  } else if (SCREEN === SCREEN_MAP) {
    if (mapReveal < mapRevealTarget) mapReveal = Math.min(mapRevealTarget, mapReveal + dt * 1.4);
  } else if (SCREEN === SCREEN_CREDITS) {
    stepCredits(dt);
  } else if (SCREEN === SCREEN_LEVEL && RUN) {
    var steps = RUN.speed > 1 ? 2 : 1;
    for (var i = 0; i < steps; i++) stepLevel(dt);
  }
}

function renderGame() {
  if (!gameCtx) return;
  gameCtx.save();
  gameCtx.imageSmoothingEnabled = false;
  if (SCREEN === SCREEN_SPLASH) drawSplash(gameCtx, screenTime);
  else if (SCREEN === SCREEN_MENU) drawMenu(gameCtx, screenTime);
  else if (SCREEN === SCREEN_MAP) drawMap(gameCtx, screenTime);
  else if (SCREEN === SCREEN_CREDITS) drawCredits(gameCtx, screenTime);
  else if (SCREEN === SCREEN_LEVEL && RUN) drawLevel(gameCtx);
  gameCtx.restore();
  frameCount++;
}

function frame(ts) {
  var t = typeof ts === 'number' ? ts : 0;
  if (!lastFrame) lastFrame = t;
  var dt = (t - lastFrame) / 1000;
  lastFrame = t;
  if (!isFinite(dt) || dt < 0) dt = 0;
  if (dt > 0.1) dt = 0.1;
  try {
    stepGame(dt);
    renderGame();
  } catch (err) {
    reportError(err);
  }
  if (globalThis.requestAnimationFrame) globalThis.requestAnimationFrame(frame);
}

function reportError(err) {
  bootErrors.push(String(err && err.stack ? err.stack : err));
  if (globalThis.CJD_SHOW_ERROR) globalThis.CJD_SHOW_ERROR(err && err.message ? err.message : String(err), err && err.stack);
}

/* ---------------- input ---------------- */

var pressActive = false;

function onPressStart(clientX, clientY, ev) {
  var p = toView(clientX, clientY);
  pressActive = true;
  if (RUN) RUN.pointer = p;
  if (ev && ev.pointerId !== undefined && gameCanvas && gameCanvas.setPointerCapture) {
    try { gameCanvas.setPointerCapture(ev.pointerId); } catch (e) { /* not fatal */ }
  }
}

function onPressMove(clientX, clientY) {
  var p = toView(clientX, clientY);
  if (RUN) RUN.pointer = p;
}

function onPressEnd(clientX, clientY) {
  if (!pressActive) return;
  pressActive = false;
  var p = toView(clientX, clientY);
  try {
    handleTap(p.x, p.y);
  } catch (err) {
    reportError(err);
  }
}

function releaseHeld() {
  pressActive = false;
}

function bindInput(canvas) {
  var doc = docRef();
  var hasPointer = typeof globalThis.PointerEvent === 'function';

  if (hasPointer) {
    canvas.addEventListener('pointerdown', function (e) {
      e.preventDefault();
      onPressStart(e.clientX, e.clientY, e);
    }, { passive: false });
    canvas.addEventListener('pointermove', function (e) {
      onPressMove(e.clientX, e.clientY);
    }, { passive: true });
    canvas.addEventListener('pointerup', function (e) {
      e.preventDefault();
      onPressEnd(e.clientX, e.clientY);
    }, { passive: false });
    canvas.addEventListener('pointercancel', function () { releaseHeld(); }, { passive: true });
  }

  /* touch and mouse fallbacks for engines without PointerEvent */
  canvas.addEventListener('touchstart', function (e) {
    if (hasPointer) return;
    if (e.cancelable) e.preventDefault();
    var t = e.changedTouches && e.changedTouches[0];
    if (t) onPressStart(t.clientX, t.clientY, null);
  }, { passive: false });
  canvas.addEventListener('touchmove', function (e) {
    if (hasPointer) return;
    var t = e.changedTouches && e.changedTouches[0];
    if (t) onPressMove(t.clientX, t.clientY);
  }, { passive: true });
  canvas.addEventListener('touchend', function (e) {
    if (hasPointer) return;
    if (e.cancelable) e.preventDefault();
    var t = e.changedTouches && e.changedTouches[0];
    if (t) onPressEnd(t.clientX, t.clientY);
  }, { passive: false });
  canvas.addEventListener('touchcancel', function () { if (!hasPointer) releaseHeld(); }, { passive: true });

  canvas.addEventListener('mousedown', function (e) {
    if (hasPointer) return;
    onPressStart(e.clientX, e.clientY, null);
  });
  canvas.addEventListener('mousemove', function (e) {
    if (hasPointer) return;
    onPressMove(e.clientX, e.clientY);
  });
  canvas.addEventListener('mouseup', function (e) {
    if (hasPointer) return;
    onPressEnd(e.clientX, e.clientY);
  });

  canvas.addEventListener('contextmenu', function (e) { e.preventDefault(); });

  if (globalThis.addEventListener) {
    globalThis.addEventListener('blur', releaseHeld);
    globalThis.addEventListener('resize', fitCanvas);
    globalThis.addEventListener('orientationchange', fitCanvas);
    globalThis.addEventListener('keydown', function (e) {
      if (SCREEN === SCREEN_SPLASH) { finishSplash(); return; }
      if (SCREEN === SCREEN_CREDITS && screenTime >= CREDITS_SKIP_AFTER) { setScreen(SCREEN_MAP); return; }
      if (SCREEN !== SCREEN_LEVEL || !RUN) return;
      if (e.key === ' ' || e.key === 'p' || e.key === 'P') { RUN.paused = !RUN.paused; e.preventDefault(); }
      else if (e.key === 'f' || e.key === 'F') RUN.speed = RUN.speed > 1 ? 1 : 2;
      else if (e.key === 'Escape') { RUN.radial = null; RUN.selectedTower = null; RUN.aimMode = null; RUN.rallyMode = false; }
    });
  }
}

/* ---------------- boot ---------------- */

function boot() {
  var doc = docRef();
  gameCanvas = doc.getElementById('game');
  if (!gameCanvas) throw new Error('canvas #game not found');
  gameCanvas.width = VIEW_W;
  gameCanvas.height = VIEW_H;
  gameCtx = gameCanvas.getContext('2d');
  if (!gameCtx) throw new Error('2d context unavailable');
  gameCtx.imageSmoothingEnabled = false;

  buildArt();
  loadProgress();
  mapReveal = PROGRESS.unlocked;
  mapRevealTarget = PROGRESS.unlocked;
  bindInput(gameCanvas);
  fitCanvas();

  setScreen(SCREEN_SPLASH);
  splashDone = false;

  if (globalThis.requestAnimationFrame) globalThis.requestAnimationFrame(frame);
  return true;
}

/* ---------------- test surface ---------------- */

var CJD = {
  version: '1.0.0',
  VIEW_W: VIEW_W,
  VIEW_H: VIEW_H,
  boot: boot,
  step: stepGame,
  render: renderGame,
  tap: handleTap,
  buttons: currentButtons,
  hitButton: hitButton,
  enterLevel: enterLevel,
  finishSplash: finishSplash,
  setScreen: setScreen,
  startLevel: startLevel,
  stepLevel: stepLevel,
  buildTower: buildTower,
  upgradeTower: upgradeTower,
  specialiseTower: specialiseTower,
  sellTower: sellTower,
  setRally: setRally,
  callWaveEarly: callWaveEarly,
  castRain: castRain,
  castReinforce: castReinforce,
  moveHero: moveHero,
  HERO: HERO,
  starsFor: starsFor,
  towerStats: towerStats,
  towerInvested: towerInvested,
  saveProgress: saveProgress,
  loadProgress: loadProgress,
  clearProgress: clearProgress,
  hasSave: hasSave,
  pathLength: pathLength,
  pathPointAt: pathPointAt,
  distToPath: distToPath,
  LEVELS: LEVELS,
  TOWERS: TOWERS,
  ENEMIES: ENEMIES,
  ABILITIES: ABILITIES,
  SPEC_COST: SPEC_COST,
  CREDITS: CREDITS,
  creditsHeight: creditsHeight,
  creditsSpeed: creditsSpeed,
  CREDITS_DURATION: CREDITS_DURATION,
  CREDITS_SKIP_AFTER: CREDITS_SKIP_AFTER,
  get screen() { return SCREEN; },
  get run() { return RUN; },
  get progress() { return PROGRESS; },
  get errors() { return bootErrors; },
  get frames() { return frameCount; },
  get storageBroken() { return storageBroken; },
  get logoReady() { return logoReady; },
  plateFor: plateFor,
  menuArt: menuArt,
  signTapRect: signTapRect,
  SIGN_BRIBE: SIGN_BRIBE,
  get devUnlock() { return DEV_UNLOCK; },
  get plates() { return PLATES; },
  get orientationBlocked() { return orientationBlocked; },
  isPortraitBlocked: isPortraitBlocked,
  get logoImage() { return logoImg; },
  LOGO_BYTES: LOGO_DATA.length,
  get mapReveal() { return mapReveal; },
  set mapReveal(v) { mapReveal = v; },
  get screenTime() { return screenTime; },
  set screenTime(v) { screenTime = v; },
  get creditsY() { return creditsY; },
  set creditsY(v) { creditsY = v; }
};

globalThis.CJD = CJD;

if (docRef() && docRef().readyState !== 'loading') {
  try { boot(); } catch (e) { reportError(e); }
} else if (docRef()) {
  docRef().addEventListener('DOMContentLoaded', function () {
    try { boot(); } catch (e) { reportError(e); }
  });
}

</script>
</body>
