<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#100c18">
<title>Courjahan Defense</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: #0b0812;
    overflow: hidden;
    touch-action: none;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
    overscroll-behavior: none;
  }
  body {
    display: flex; align-items: center; justify-content: center;
    font-family: ui-monospace, Menlo, Consolas, monospace;
  }
  #wrap {
    position: absolute;
    left: env(safe-area-inset-left, 0px);
    right: env(safe-area-inset-right, 0px);
    top: env(safe-area-inset-top, 0px);
    bottom: env(safe-area-inset-bottom, 0px);
    display: flex; align-items: center; justify-content: center;
    line-height: 0;
  }
  canvas#game {
    display: block;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    background: #100c18;
    touch-action: none;
  }
  #rotate {
    display: none;
    position: fixed; inset: 0; z-index: 500;
    background: #100c18; color: #e6d7b0;
    align-items: center; justify-content: center; text-align: center;
    font: 14px/1.7 ui-monospace, Menlo, Consolas, monospace;
    padding: 32px;
  }
  #rotate .mark { color: #d9a441; font-size: 19px; letter-spacing: 2px; display: block; margin-bottom: 14px; }
  #rotate .sub { color: #6b6280; display: block; margin-top: 12px; font-size: 12px; }
  @media (orientation: portrait) {
    #rotate { display: flex; }
    #wrap { visibility: hidden; }
  }
  #errpanel {
    display: none;
    position: fixed; left: 0; right: 0; top: 0;
    z-index: 9999;
    background: #2b0f14;
    color: #ffd9d4;
    border-bottom: 3px solid #c1443a;
    font: 12px/1.45 ui-monospace, Menlo, Consolas, monospace;
    padding: 10px 12px;
    max-height: 55%;
    overflow: auto;
    white-space: pre-wrap;
    word-break: break-word;
  }
  #errpanel b { color: #ff9a8f; display: block; margin-bottom: 4px; font-size: 13px; }
  #errpanel .hint { color: #d9a441; display: block; margin-top: 6px; }
</style>
</head>
<body>
<div id="errpanel"></div>
<div id="wrap"><canvas id="game" width="960" height="540"></canvas></div>
<div id="rotate"><div>
  <span class="mark">COURJAHAN DEFENSE</span>
  Turn your phone sideways to hold the road.
  <span class="sub">The game is paused until you do. Nothing is running behind this.</span>
</div></div>

<!-- Error reporter. Its own script block, before the game, so that a failure
     while the game script is being parsed or run still produces something
     readable instead of a black rectangle. -->
<script>
(function () {
  var panel = document.getElementById('errpanel');
  var shown = 0;
  function show(msg, stack) {
    if (!panel) return;
    if (shown > 6) return;
    shown++;
    panel.style.display = 'block';
    var b = document.createElement('b');
    b.textContent = 'Courjahan Defense hit an error';
    var pre = document.createElement('div');
    pre.textContent = String(msg || 'unknown error') + (stack ? '\n\n' + stack : '');
    var hint = document.createElement('span');
    hint.className = 'hint';
    hint.textContent = 'The game may still be running underneath this panel.';
    panel.appendChild(b);
    panel.appendChild(pre);
    panel.appendChild(hint);
  }
  window.CJD_SHOW_ERROR = show;
  window.onerror = function (msg, src, line, col, err) {
    show(msg + '  (' + (src || '?') + ':' + line + ':' + col + ')', err && err.stack);
    return false;
  };
  window.addEventListener('unhandledrejection', function (e) {
    show('Unhandled promise rejection: ' + (e.reason && e.reason.message ? e.reason.message : e.reason),
         e.reason && e.reason.stack);
  });
})();
</script>

function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function lerp(a, b, t) { return a + (b - a) * t; }
function distSq(ax, ay, bx, by) { var dx = ax - bx, dy = ay - by; return dx * dx + dy * dy; }
function dist(ax, ay, bx, by) { return Math.sqrt(distSq(ax, ay, bx, by)); }
function pointInRect(px, py, r) {
  return px >= r.x && px <= r.x + r.w && py >= r.y && py <= r.y + r.h;
}
function pointInCircle(px, py, cx, cy, r) { return distSq(px, py, cx, cy) <= r * r; }

/* deterministic rng so the simulation suite is reproducible */
function makeRng(seed) {
  var s = (seed >>> 0) || 1;
  return function () {
    s ^= s << 13; s >>>= 0;
    s ^= s >> 17;
    s ^= s << 5; s >>>= 0;
    return s / 4294967296;
  };
}
var rng = makeRng(0x5eed1234);

function pick(arr, r) { return arr[Math.floor((r || rng)() * arr.length) % arr.length]; }

var GLYPH_W = 5, GLYPH_H = 7;

var GLYPH_CACHE = {};
function glyphRows(ch) {
  var c = GLYPH_CACHE[ch];
  if (c) return c;
  var g = GLYPHS[ch] || GLYPHS['?'];
  c = g.join('');
  GLYPH_CACHE[ch] = c;
  return c;
}

function textWidth(str, scale) {
  var s = scale || 1;
  var t = String(str);
  if (t.length === 0) return 0;
  return (t.length * (GLYPH_W + 1) - 1) * s;
}

function drawText(ctx, str, x, y, scale, color, align) {
  var s = scale || 1;
  var t = String(str).toUpperCase();
  var w = textWidth(t, s);
  var ox = x;
  if (align === 'center') ox = Math.round(x - w / 2);
  else if (align === 'right') ox = Math.round(x - w);
  ctx.fillStyle = color || PAL.white;
  for (var i = 0; i < t.length; i++) {
    var rows = glyphRows(t.charAt(i));
    var gx = ox + i * (GLYPH_W + 1) * s;
    for (var ry = 0; ry < GLYPH_H; ry++) {
      var run = -1;
      for (var rx = 0; rx <= GLYPH_W; rx++) {
        var on = rx < GLYPH_W && rows.charAt(ry * GLYPH_W + rx) === '#';
        if (on && run < 0) run = rx;
        if (!on && run >= 0) {
          ctx.fillRect(gx + run * s, y + ry * s, (rx - run) * s, s);
          run = -1;
        }
      }
    }
  }
  return w;
}

function drawTextShadow(ctx, str, x, y, scale, color, align) {
  drawText(ctx, str, x + (scale || 1), y + (scale || 1), scale, 'rgba(8,5,14,0.7)', align);
  drawText(ctx, str, x, y, scale, color, align);
}

var logoImg = null;
var logoReady = false;
var logoShineBuf = null;

function loadLogo() {
  try {
    var Ctor = globalThis.Image;
    if (typeof Ctor !== 'function') return;
    logoImg = new Ctor();
    logoImg.onload = function () {
      if (logoImg.width > 0 && logoImg.height > 0) logoReady = true;
    };
    logoImg.onerror = function () { logoReady = false; };
    logoImg.src = LOGO_DATA;
    /* a data URI can already be decoded by the time we get here */
    if (logoImg.complete && logoImg.width > 0) logoReady = true;
  } catch (e) {
    logoReady = false;
  }
}

/* Light sweep shaped to the mark itself. Compositing the gradient straight
   onto the board would light up the background too and read as a grey slab,
   so the shine is built against the logo alpha off-screen first. */
function logoShine(sweep) {
  if (!logoReady) return null;
  var w = logoImg.width, h = logoImg.height;
  if (!logoShineBuf || logoShineBuf.width !== w) logoShineBuf = newCanvas(w, h);
  var c = logoShineBuf.getContext('2d');
  c.clearRect(0, 0, w, h);
  c.drawImage(logoImg, 0, 0);
  c.globalCompositeOperation = 'source-atop';
  var band = w * 0.34;
  var cx = -band + sweep * (w + band * 2);
  var g = c.createLinearGradient(cx - band, 0, cx + band, 0);
  g.addColorStop(0, 'rgba(255,246,214,0)');
  g.addColorStop(0.5, 'rgba(255,246,214,0.38)');
  g.addColorStop(1, 'rgba(255,246,214,0)');
  c.fillStyle = g;
  c.fillRect(0, 0, w, h);
  c.globalCompositeOperation = 'source-over';
  return logoShineBuf;
}

var PLATES = {};

function loadPlates() {
  var Ctor = globalThis.Image;
  if (typeof Ctor !== 'function') return;
  for (var key in PLATE_DATA) {
    (function (k) {
      try {
        var im = new Ctor();
        im.onload = function () { if (im.width > 0) PLATES[k] = im; };
        im.onerror = function () { delete PLATES[k]; };
        im.src = PLATE_DATA[k];
        if (im.complete && im.width > 0) PLATES[k] = im;
      } catch (e) { /* fall back to procedural terrain */ }
    })(key);
  }
}

function plateFor(levelIndex) {
  var p = PLATES[String(levelIndex + 1)];
  return (p && p.width > 0) ? p : null;
}

var MENU_ART = {};

function loadMenuArt() {
  var Ctor = globalThis.Image;
  if (typeof Ctor !== 'function') return;
  for (var key in MENU_ART_DATA) {
    (function (k) {
      try {
        var im = new Ctor();
        im.onload = function () { if (im.width > 0) MENU_ART[k] = im; };
        im.onerror = function () { delete MENU_ART[k]; };
        im.src = MENU_ART_DATA[k];
        if (im.complete && im.width > 0) MENU_ART[k] = im;
      } catch (e) { /* procedural fallback */ }
    })(key);
  }
}

function menuArt(name) {
  var im = MENU_ART[name];
  return (im && im.width > 0) ? im : null;
}

/* ============================================================
   Art: every pixel is generated at boot from hand-authored maps.
   No image files, no network, no external atlas.
   ============================================================ */

var ART = {};

function newCanvas(w, h) {
  var cv;
  if (typeof OffscreenCanvas === 'function') {
    try { cv = new OffscreenCanvas(w, h); } catch (e) { cv = null; }
  }
  if (!cv) {
    cv = docRef().createElement('canvas');
    cv.width = w; cv.height = h;
  }
  return cv;
}

/* indirection so no top-level identifier is named `document` */
function docRef() { return globalThis.document; }
function winRef() { return globalThis; }

function makeSprite(rows, palette, scale) {
  var s = scale || 2;
  var h = rows.length, w = rows[0].length;
  var cv = newCanvas(w * s, h * s);
  var c = cv.getContext('2d');
  for (var y = 0; y < h; y++) {
    var row = rows[y];
    for (var x = 0; x < w; x++) {
      var ch = row.charAt(x);
      if (ch === '.' || ch === ' ') continue;
      var col = palette[ch];
      if (!col) continue;
      c.fillStyle = col;
      c.fillRect(x * s, y * s, s, s);
    }
  }
  cv.spriteW = w * s;
  cv.spriteH = h * s;
  return cv;
}

/* recolour a finished sprite by swapping palette keys */
function makeSpriteVariant(rows, palette, overrides, scale) {
  var p = {};
  for (var k in palette) p[k] = palette[k];
  for (var o in overrides) p[o] = overrides[o];
  return makeSprite(rows, p, scale);
}

  return ART.tower[t.type][clamp(t.tier, 1, 3) - 1];
}

/* ---------------- procedural terrain ---------------- */

function shade(hex, amt) {
  var n = parseInt(hex.slice(1), 16);
  var r = clamp(((n >> 16) & 255) + amt, 0, 255);
  var g = clamp(((n >> 8) & 255) + amt, 0, 255);
  var b = clamp((n & 255) + amt, 0, 255);
  return 'rgb(' + r + ',' + g + ',' + b + ')';
}

function paintNoise(c, x, y, w, h, base, amt, density, r) {
  c.fillStyle = base;
  c.fillRect(x, y, w, h);
  var count = Math.floor((w * h) / 64 * (density || 1));
  for (var i = 0; i < count; i++) {
    var px = x + Math.floor(r() * w);
    var py = y + Math.floor(r() * h);
    var d = Math.floor((r() * 2 - 1) * amt);
    c.fillStyle = shade(base, d);
    c.fillRect(px, py, 4, 4);
  }
}

/* Paint a level's static background once and cache it. */
function paintTerrain(def) {
  var cv = newCanvas(VIEW_W, VIEW_H);
  var c = cv.getContext('2d');
  var r = makeRng(def.seed);
  var theme = def.theme;

  var ground = theme.ground;
  paintNoise(c, 0, 0, VIEW_W, VIEW_H, ground, theme.noise || 14, 1.2, r);

  /* scenery blobs: trees, rocks, dunes - shape driven by theme */
  var i, x, y;
  for (i = 0; i < (theme.blobs || 60); i++) {
    x = r() * VIEW_W; y = 90 + r() * (VIEW_H - 150);
    if (nearAnyPath(def, x, y, 46)) continue;
    var rad = 10 + r() * 22;
    var tint = Math.floor((r() * 2 - 1) * 10);
    c.fillStyle = shade(theme.blob, tint - 14);
    c.beginPath(); c.arc(x, y + rad * 0.18, rad, 0, Math.PI * 2); c.fill();
    c.fillStyle = shade(theme.blob, tint);
    c.beginPath(); c.arc(x, y, rad * 0.92, 0, Math.PI * 2); c.fill();
    c.fillStyle = shade(theme.blob, tint + 20);
    c.beginPath(); c.arc(x - rad * 0.22, y - rad * 0.26, rad * 0.52, 0, Math.PI * 2); c.fill();
  }

  if (theme.water) {
    for (i = 0; i < theme.water.length; i++) {
      var wd = theme.water[i];
      c.fillStyle = '#2f5f7a';
      c.fillRect(wd.x, wd.y, wd.w, wd.h);
      for (var j = 0; j < 90; j++) {
        c.fillStyle = j % 2 ? '#4a86a8' : '#6fc3d8';
        c.fillRect(wd.x + r() * wd.w, wd.y + r() * wd.h, 6 + r() * 10, 2);
      }
    }
  }

  if (theme.ridges) {
    for (i = 0; i < theme.ridges.length; i++) {
      var rg = theme.ridges[i];
      c.fillStyle = theme.ridgeDark || '#4a4460';
      c.beginPath();
      c.moveTo(rg.x, rg.y);
      c.lineTo(rg.x + rg.w / 2, rg.y - rg.h);
      c.lineTo(rg.x + rg.w, rg.y);
      c.closePath();
      c.fill();
      c.fillStyle = theme.ridgeLight || '#6f6a86';
      c.beginPath();
      c.moveTo(rg.x + rg.w / 2, rg.y - rg.h);
      c.lineTo(rg.x + rg.w * 0.62, rg.y - rg.h * 0.42);
      c.lineTo(rg.x + rg.w * 0.38, rg.y - rg.h * 0.42);
      c.closePath();
      c.fill();
    }
  }

  /* roads, drawn thick then edged then speckled */
  for (i = 0; i < def.paths.length; i++) {
    strokePath(c, def.paths[i], 40, theme.roadEdge || PAL.roadDk);
    strokePath(c, def.paths[i], 32, theme.road || PAL.road);
  }
  for (i = 0; i < 420; i++) {
    var pi = Math.floor(r() * def.paths.length);
    var pp = pathPointAt(def.paths[pi], r() * pathLength(def.paths[pi]));
    c.fillStyle = shade(theme.road || PAL.road, r() > 0.5 ? 16 : -16);
    c.fillRect(pp.x + (r() * 24 - 12), pp.y + (r() * 24 - 12), 3, 3);
  }

  drawBridges(c, def, theme);

  /* the keep at the end of every path, and the spawn mouths */
  for (i = 0; i < def.paths.length; i++) {
    var p = def.paths[i];
    var start = p[0];
    drawSpawnMouth(c, start.x, start.y);
  }
  var goal = def.paths[0][def.paths[0].length - 1];
  drawKeep(c, goal.x, goal.y);

  /* build spots */
  for (i = 0; i < def.spots.length; i++) {
    drawBuildPad(c, def.spots[i].x, def.spots[i].y);
  }

  return cv;
}

function strokePath(c, pts, width, color) {
  c.strokeStyle = color;
  c.lineWidth = width;
  c.lineJoin = 'round';
  c.lineCap = 'round';
  c.beginPath();
  c.moveTo(pts[0].x, pts[0].y);
  for (var i = 1; i < pts.length; i++) c.lineTo(pts[i].x, pts[i].y);
  c.stroke();
}

/* Roads must not simply run over open water. Wherever a route passes through
   a water band, lay a plank deck with rails along it. */
function drawBridges(c, def, theme) {
  if (!theme.water) return;
  for (var w = 0; w < theme.water.length; w++) {
    var wd = theme.water[w];
    for (var pi = 0; pi < def.paths.length; pi++) {
      var p = def.paths[pi];
      var total = pathLength(p);
      var inside = false, entry = 0;
      for (var d = 0; d <= total; d += 3) {
        var pt = pathPointAt(p, d);
        var isIn = pt.y >= wd.y - 12 && pt.y <= wd.y + wd.h + 12;
        if (isIn && !inside) { inside = true; entry = d; }
        else if (!isIn && inside) { inside = false; paintBridge(c, p, entry, d); }
      }
      if (inside) paintBridge(c, p, entry, total);
    }
  }
}

function paintBridge(c, p, d0, d1) {
  var d, pt;
  for (d = d0; d <= d1; d += 9) {
    pt = pathPointAt(p, d);
    c.save();
    c.translate(pt.x, pt.y);
    c.rotate(pt.angle);
    c.fillStyle = '#6b4f30';
    c.fillRect(-3, -19, 6, 38);
    c.fillStyle = '#8a6a44';
    c.fillRect(-3, -19, 6, 2);
    c.restore();
  }
  for (var side = -1; side <= 1; side += 2) {
    c.strokeStyle = '#4a3320';
    c.lineWidth = 3;
    c.beginPath();
    var first = true;
    for (d = d0; d <= d1; d += 6) {
      pt = pathPointAt(p, d);
      var nx = Math.cos(pt.angle + Math.PI / 2) * 18 * side;
      var ny = Math.sin(pt.angle + Math.PI / 2) * 18 * side;
      if (first) { c.moveTo(pt.x + nx, pt.y + ny); first = false; }
      else c.lineTo(pt.x + nx, pt.y + ny);
    }
    c.stroke();
  }
}

function drawBuildPad(c, x, y) {
  c.fillStyle = 'rgba(20,16,28,0.35)';
  c.beginPath(); c.arc(x, y + 4, 23, 0, Math.PI * 2); c.fill();
  c.fillStyle = '#6b6455';
  c.beginPath(); c.arc(x, y, 22, 0, Math.PI * 2); c.fill();
  c.fillStyle = '#8b8272';
  c.beginPath(); c.arc(x, y - 2, 18, 0, Math.PI * 2); c.fill();
  c.fillStyle = '#5a5346';
  for (var i = 0; i < 6; i++) {
    var a = i * Math.PI / 3;
    c.fillRect(x + Math.cos(a) * 12 - 2, y + Math.sin(a) * 12 - 2, 4, 4);
  }
}

function drawKeep(c, x, y) {
  /* the goal can sit right on the edge of the board; keep the art on screen */
  x = clamp(x, 52, VIEW_W - 54);
  y = clamp(y, 96, VIEW_H - 44);
  c.fillStyle = 'rgba(16,12,24,0.4)';
  c.fillRect(x - 42, y + 26, 84, 12);
  c.fillStyle = '#8e8676';
  c.fillRect(x - 38, y - 26, 76, 54);
  c.fillStyle = '#a49b88';
  c.fillRect(x - 38, y - 26, 76, 10);
  c.fillStyle = '#4a4238';
  c.fillRect(x - 12, y - 2, 24, 30);
  for (var i = 0; i < 5; i++) {
    c.fillStyle = '#8e8676';
    c.fillRect(x - 38 + i * 17, y - 38, 10, 14);
  }
  c.fillStyle = PAL.brass;
  c.fillRect(x + 26, y - 58, 3, 22);
  c.fillStyle = PAL.blood;
  c.fillRect(x + 29, y - 58, 16, 10);
}

function drawSpawnMouth(c, x, y) {
  c.fillStyle = '#20182c';
  c.beginPath(); c.arc(x, y, 26, 0, Math.PI * 2); c.fill();
  c.fillStyle = '#3a2c48';
  c.beginPath(); c.arc(x, y, 18, 0, Math.PI * 2); c.fill();
  c.fillStyle = '#120d1a';
  c.beginPath(); c.arc(x, y, 11, 0, Math.PI * 2); c.fill();
}

   Data: geometry, enemies, towers, levels, waves
   ============================================================ */

/* ---------------- path geometry ---------------- */

function pathMeta(pts) {
  if (pts.$meta) return pts.$meta;
  var segs = [], total = 0;
  for (var i = 1; i < pts.length; i++) {
    var a = pts[i - 1], b = pts[i];
    var len = dist(a.x, a.y, b.x, b.y);
    segs.push({ a: a, b: b, len: len, start: total, angle: Math.atan2(b.y - a.y, b.x - a.x) });
    total += len;
  }
  pts.$meta = { segs: segs, total: total };
  return pts.$meta;
}

function pathLength(pts) { return pathMeta(pts).total; }

function pathPointAt(pts, d) {
  var m = pathMeta(pts);
  if (d <= 0) return { x: m.segs[0].a.x, y: m.segs[0].a.y, angle: m.segs[0].angle };
  if (d >= m.total) {
    var last = m.segs[m.segs.length - 1];
    return { x: last.b.x, y: last.b.y, angle: last.angle };
  }
  for (var i = 0; i < m.segs.length; i++) {
    var s = m.segs[i];
    if (d <= s.start + s.len) {
      var t = (d - s.start) / s.len;
      return { x: lerp(s.a.x, s.b.x, t), y: lerp(s.a.y, s.b.y, t), angle: s.angle };
    }
  }
  var l2 = m.segs[m.segs.length - 1];
  return { x: l2.b.x, y: l2.b.y, angle: l2.angle };
}

function distToSegment(px, py, ax, ay, bx, by) {
  var dx = bx - ax, dy = by - ay;
  var L = dx * dx + dy * dy;
  if (L === 0) return dist(px, py, ax, ay);
  var t = clamp(((px - ax) * dx + (py - ay) * dy) / L, 0, 1);
  return dist(px, py, ax + dx * t, ay + dy * t);
}

function distToPath(pts, px, py) {
  var best = Infinity;
  for (var i = 1; i < pts.length; i++) {
    var d = distToSegment(px, py, pts[i - 1].x, pts[i - 1].y, pts[i].x, pts[i].y);
    if (d < best) best = d;
  }
  return best;
}

function nearAnyPath(def, px, py, r) {
  for (var i = 0; i < def.paths.length; i++) {
    if (distToPath(def.paths[i], px, py) < r) return true;
  }
  return false;
}

/* distance along a path of the point closest to (px,py) - used by soldiers
   to work out which enemy is furthest along and therefore most urgent */
function projectOnPath(pts, px, py) {
  var m = pathMeta(pts);
  var best = Infinity, bestD = 0;
  for (var i = 0; i < m.segs.length; i++) {
    var s = m.segs[i];
    var dx = s.b.x - s.a.x, dy = s.b.y - s.a.y;
    var L = dx * dx + dy * dy;
    var t = L === 0 ? 0 : clamp(((px - s.a.x) * dx + (py - s.a.y) * dy) / L, 0, 1);
    var qx = s.a.x + dx * t, qy = s.a.y + dy * t;
    var d = distSq(px, py, qx, qy);
    if (d < best) { best = d; bestD = s.start + s.len * t; }
  }
  return bestD;
}

function towerStats(t) {
  var def = TOWERS[t.type];
  var base = def.tiers[clamp(t.tier, 1, 3) - 1];
  if (t.tier === 3 && t.spec && def.specs[t.spec]) {
    var merged = {};
    for (var k in base) merged[k] = base[k];
    var sp = def.specs[t.spec];
    for (var j in sp) merged[j] = sp[j];
    return merged;
  }
  return base;
}

function towerInvested(t) {
  var def = TOWERS[t.type];
  var sum = 0;
  for (var i = 0; i < t.tier; i++) sum += def.tiers[i].cost;
  if (t.tier === 3 && t.spec) sum += SPEC_COST;
  return sum;
}

var SPEC_COST = 240;
var SELL_RATE = 0.6;

function upgradeCost(t) {
  if (t.tier < 3) return TOWERS[t.type].tiers[t.tier].cost;
  if (!t.spec) return SPEC_COST;
  return 0;
}

var BOARD_SCALE = (VIEW_H - BOARD_TOP) / VIEW_H;
function fitY(y) { return Math.round(BOARD_TOP + y * BOARD_SCALE); }

for (var fitI = 0; fitI < LEVELS.length; fitI++) {
  var fitL = LEVELS[fitI];
  for (var fitP = 0; fitP < fitL.paths.length; fitP++) {
    var fitPts = fitL.paths[fitP];
    for (var fitK = 0; fitK < fitPts.length; fitK++) fitPts[fitK].y = fitY(fitPts[fitK].y);
  }
  for (var fitS = 0; fitS < fitL.spots.length; fitS++) fitL.spots[fitS].y = fitY(fitL.spots[fitS].y);
  if (fitL.theme.water) {
    for (var fitW = 0; fitW < fitL.theme.water.length; fitW++) {
      var wd = fitL.theme.water[fitW];
      wd.y = fitY(wd.y); wd.h = Math.round(wd.h * BOARD_SCALE);
    }
  }
  if (fitL.theme.ridges) {
    for (var fitR = 0; fitR < fitL.theme.ridges.length; fitR++) {
      var rg = fitL.theme.ridges[fitR];
      rg.y = fitY(rg.y); rg.h = Math.round(rg.h * BOARD_SCALE);
    }
  }
}

/* Flyers ignore the road but must still cross defended ground. Their route is
   the ground route with the corners cut: shorter, but through the same
   corridor the build spots look onto. */
function deriveAirPath(pts) {
  var out = [pts[0]];
  for (var i = 2; i < pts.length - 1; i += 2) out.push(pts[i]);
  out.push(pts[pts.length - 1]);
  return out;
}
for (var lvIdx = 0; lvIdx < LEVELS.length; lvIdx++) {
  var lvAir = [];
  for (var pIdx = 0; pIdx < LEVELS[lvIdx].paths.length; pIdx++) {
    lvAir.push(deriveAirPath(LEVELS[lvIdx].paths[pIdx]));
  }
  LEVELS[lvIdx].airPaths = lvAir;
}

/* world map node positions along the parchment trail */
var MAP_NODES = [
  { x: 118, y: 400 }, { x: 296, y: 320 }, { x: 470, y: 372 },
  { x: 660, y: 258 }, { x: 838, y: 168 }
];

/* ===== p40_sim.js ===== */
/* ============================================================
   Simulation: the actual game
   ============================================================ */

var RUN = null;
var PREP_TIME = 12;
var FIRST_PREP = 16;
var CALL_BONUS_PER_SEC = 2;

function makeRun(index) {
  var def = LEVELS[index];
  var spots = [];
  for (var i = 0; i < def.spots.length; i++) {
    spots.push({ x: def.spots[i].x, y: def.spots[i].y, index: i, tower: null });
  }
  return {
    index: index,
    def: def,
    gold: def.startGold,
    lives: def.lives,
    maxLives: def.lives,
    spots: spots,
    towers: [],
    enemies: [],
    soldiers: [],
    shots: [],
    fx: [],
    patches: [],
    waveIndex: 0,
    waveActive: false,
    spawns: [],
    spawnCursor: 0,
    waveTime: 0,
    prepTimer: FIRST_PREP,
    time: 0,
    speed: 1,
    paused: false,
    status: 'playing',
    stars: 0,
    kills: 0,
    leaked: 0,
    goldEarned: 0,
    abilities: { rain: 0, reinforce: 0 },
    aimMode: null,
    selectedSpot: null,
    selectedTower: null,
    radial: null,
    toast: null,
    toastTime: 0,
    signFlipped: false,
    hero: null,
    heroTimer: 0,
    heroX: 0,
    heroY: 0
  };
}

function startLevel(index) {
  rng = makeRng(LEVELS[index].seed ^ 0x9e3779b9);
  RUN = makeRun(index);
  buildLevelBackground(index);
  /* she starts three quarters of the way down the road, where the trouble is */
  var pts = RUN.def.paths[0];
  var p = pathPointAt(pts, pathLength(pts) * 0.72);
  RUN.heroX = p.x; RUN.heroY = p.y;
  spawnHero();
  return RUN;
}

function makeHero() {
  var h = makeSoldier({
    x: RUN.heroX, y: RUN.heroY,
    hp: HERO.hp, dmg: HERO.dmg, rate: HERO.rate,
    rallyX: RUN.heroX, rallyY: RUN.heroY, leash: HERO.leash,
    kind: 'hero'
  });
  h.hero = true;
  h.hitAt = -999;
  h.speed = HERO.speed;
  return h;
}

function spawnHero() {
  var h = makeHero();
  RUN.hero = h;
  RUN.soldiers.push(h);
  return h;
}

function moveHero(x, y) {
  if (!RUN || RUN.status !== 'playing') return false;
  RUN.heroX = clamp(x, 10, VIEW_W - 10);
  RUN.heroY = clamp(y, BOARD_TOP + 8, VIEW_H - 8);
  if (RUN.hero && !RUN.hero.dead) {
    RUN.hero.rallyX = RUN.heroX;
    RUN.hero.rallyY = RUN.heroY;
  }
  return true;
}

var BG_CACHE = {};
function buildLevelBackground(index) {
  if (!BG_CACHE[index]) BG_CACHE[index] = paintTerrain(LEVELS[index]);
  return BG_CACHE[index];
}

function toast(msg) {
  if (!RUN) return;
  RUN.toast = msg;
  RUN.toastTime = 2.2;
}

/* ---------------- waves ---------------- */

function buildSpawnList(wave) {
  var out = [];
  for (var g = 0; g < wave.groups.length; g++) {
    var grp = wave.groups[g];
    var delay = grp.delay || 0;
    for (var i = 0; i < grp.count; i++) {
      out.push({ t: delay + i * (grp.gap || 1), type: grp.type, pathId: grp.pathId || 0 });
    }
  }
  out.sort(function (a, b) { return a.t - b.t; });
  return out;
}

function startWave() {
  if (!RUN || RUN.waveActive) return false;
  if (RUN.waveIndex >= RUN.def.waves.length) return false;
  var wave = RUN.def.waves[RUN.waveIndex];
  RUN.spawns = buildSpawnList(wave);
  RUN.spawnCursor = 0;
  RUN.waveTime = 0;
  RUN.waveActive = true;
  if (wave.boss) toast('WARLORD KADRIX APPROACHES');
  return true;
}

function callWaveEarly() {
  if (!RUN || RUN.waveActive || RUN.status !== 'playing') return 0;
  if (RUN.waveIndex >= RUN.def.waves.length) return 0;
  var bonus = Math.max(0, Math.floor(RUN.prepTimer * CALL_BONUS_PER_SEC));
  RUN.gold += bonus;
  RUN.goldEarned += bonus;
  RUN.prepTimer = 0;
  startWave();
  if (bonus > 0) toast('EARLY CALL +' + bonus + ' GOLD');
  return bonus;
}

function waveCleared() {
  return RUN.waveActive && RUN.spawnCursor >= RUN.spawns.length && RUN.enemies.length === 0;
}

/* ---------------- enemies ---------------- */

function spawnEnemy(type, pathId, atDist) {
  var def = ENEMIES[type];
  if (!def) return null;
  var pathSet = def.air ? RUN.def.airPaths : RUN.def.paths;
  var pid = clamp(pathId || 0, 0, pathSet.length - 1);
  var pts = pathSet[pid];
  var d = atDist || 0;
  var p = pathPointAt(pts, d);
  var e = {
    def: def,
    type: type,
    hp: def.hp,
    maxHp: def.hp,
    pathId: pid,
    pts: pts,
    dist: d,
    x: p.x, y: p.y,
    facing: 1,
    slow: 0, slowTime: 0,
    stunTime: 0,
    dot: 0, dotTime: 0,
    blocker: null,
    atkTimer: 0.6,
    dead: false,
    wobble: rng() * 6.28,
    summonMark: 0
  };
  RUN.enemies.push(e);
  return e;
}

function killEnemy(e, reason) {
  if (e.dead) return;
  e.dead = true;
  if (e.blocker) { e.blocker.target = null; e.blocker = null; }
  if (reason !== 'leak') {
    RUN.gold += e.def.gold;
    RUN.goldEarned += e.def.gold;
    RUN.kills++;
    addFx('pop', e.x, e.y, { text: '+' + e.def.gold });
    addFx('burst', e.x, e.y, { color: PAL.blood, n: e.def.boss ? 26 : 10 });
    if (e.def.onDeath) {
      for (var i = 0; i < e.def.onDeath.count; i++) {
        var child = spawnEnemy(e.def.onDeath.type, e.pathId, Math.max(0, e.dist - 6 - i * 12));
        if (child) { child.x = e.x + (i ? 12 : -12); child.y = e.y; }
      }
    }
  }
}

function applyDamage(e, amount, dmgType, opts) {
  if (!e || e.dead) return 0;
  var mult = 1;
  if (dmgType === 'phys') mult = 1 - e.def.armor;
  else if (dmgType === 'magic') mult = 1 - e.def.resist;
  var dealt = Math.max(0, amount * mult);
  e.hp -= dealt;
  if (opts) {
    if (opts.slowAmount) {
      e.slow = Math.max(e.slow, opts.slowAmount);
      e.slowTime = Math.max(e.slowTime, opts.slowTime || 2);
    }
    if (opts.stun && !e.def.boss) e.stunTime = Math.max(e.stunTime, opts.stun);
    if (opts.dotDps) { e.dot = Math.max(e.dot, opts.dotDps); e.dotTime = Math.max(e.dotTime, opts.dotTime || 3); }
  }
  if (e.hp <= 0) killEnemy(e);
  return dealt;
}

function updateEnemy(e, dt) {
  if (e.dead) return;

  if (e.dotTime > 0) {
    e.dotTime -= dt;
    e.hp -= e.dot * dt;
    if (e.hp <= 0) { killEnemy(e); return; }
  }
  if (e.slowTime > 0) { e.slowTime -= dt; if (e.slowTime <= 0) e.slow = 0; }
  if (e.stunTime > 0) { e.stunTime -= dt; return; }

  /* boss reinforcements at health thresholds */
  if (e.def.summon) {
    var frac = e.hp / e.maxHp;
    var marks = e.def.summon.atFractions;
    while (e.summonMark < marks.length && frac <= marks[e.summonMark]) {
      for (var s = 0; s < e.def.summon.count; s++) {
        var g = spawnEnemy(e.def.summon.type, e.pathId, Math.max(0, e.dist - 20 - s * 18));
      }
      e.summonMark++;
      toast('THE WARLORD CALLS FOR AID');
    }
  }

  /* blocked: stand and fight instead of walking past */
  if (e.blocker) {
    var bd = dist(e.x, e.y, e.blocker.x, e.blocker.y);
    if (e.blocker.dead || bd > 70) {
      if (e.blocker.target === e) e.blocker.target = null;
      e.blocker = null;
    } else if (bd <= 24) {
      /* engaged: stand and fight instead of walking past */
      e.atkTimer -= dt;
      if (e.atkTimer <= 0) {
        e.atkTimer = 1.0;
        var foe = e.blocker;
        damageSoldier(foe, enemyMelee(e));
        addFx('spark', (e.x + foe.x) / 2, (e.y + foe.y) / 2, { color: PAL.blood });
      }
      return;
    }
    /* soldier is still closing the gap; keep advancing until contact */
  }

  var sp = e.def.speed * (1 - e.slow);
  e.dist += sp * dt;
  var p = pathPointAt(e.pts, e.dist);
  e.facing = p.x >= e.x ? 1 : -1;
  e.x = p.x; e.y = p.y;
  if (e.def.air) e.y += Math.sin(RUN.time * 3 + e.wobble) * 4;

  if (e.dist >= pathLength(e.pts)) {
    RUN.lives -= e.def.lives;
    RUN.leaked += e.def.lives;
    e.dead = true;
    addFx('leak', e.x, e.y, {});
    if (RUN.lives <= 0) { RUN.lives = 0; loseLevel(); }
  }
}

function enemyMelee(e) {
  if (e.def.boss) return 34;
  if (e.def.id === 'hulk') return 22;
  if (e.def.id === 'brute') return 15;
  if (e.def.id === 'hex') return 12;
  if (e.def.id === 'spore') return 10;
  if (e.def.id === 'raider') return 9;
  return 6;
}

/* ---------------- soldiers ---------------- */

function makeSoldier(cfg) {
  return {
    x: cfg.x, y: cfg.y,
    hp: cfg.hp, maxHp: cfg.hp,
    dmg: cfg.dmg, rate: cfg.rate,
    cd: 0,
    rallyX: cfg.rallyX, rallyY: cfg.rallyY,
    leash: cfg.leash,
    owner: cfg.owner || null,
    temp: !!cfg.temp,
    life: cfg.life || 0,
    kind: cfg.kind || 'soldier',
    effect: cfg.effect || null,
    stunChance: cfg.stunChance || 0,
    stunTime: cfg.stunTime || 0,
    auraRadius: cfg.auraRadius || 0,
    auraSlow: cfg.auraSlow || 0,
    target: null,
    dead: false
  };
}

function damageSoldier(s, amount) {
  if (s.dead) return;
  s.hitAt = RUN ? RUN.time : 0;
  s.hp -= amount;
  if (s.hp <= 0) {
    s.dead = true;
    if (s.target) { if (s.target.blocker === s) s.target.blocker = null; s.target = null; }
    addFx('burst', s.x, s.y, { color: s.hero ? '#c9a441' : '#8e97a8', n: s.hero ? 16 : 8 });
    if (s.hero && RUN) {
      RUN.heroTimer = HERO.respawn;
      toast(HERO.label + ' IS DOWN');
    }
  }
}

/* One soldier holds an enemy in place. Others are free to pile onto something
   already held, otherwise a single tough enemy would beat a whole squad by
   fighting them one at a time. */
function findBlockTarget(s) {
  var best = null, bestProg = -1;
  for (var i = 0; i < RUN.enemies.length; i++) {
    var e = RUN.enemies[i];
    if (e.dead || e.def.air) continue;
    if (e.blocker && e.blocker !== s) continue;
    if (dist(e.x, e.y, s.rallyX, s.rallyY) > s.leash) continue;
    if (e.dist > bestProg) { bestProg = e.dist; best = e; }
  }
  return best;
}

function findAttackTarget(s) {
  var best = null, bestD = Infinity;
  for (var i = 0; i < RUN.enemies.length; i++) {
    var e = RUN.enemies[i];
    if (e.dead || e.def.air) continue;
    if (dist(e.x, e.y, s.rallyX, s.rallyY) > s.leash) continue;
    var d = distSq(e.x, e.y, s.x, s.y);
    if (d < bestD) { bestD = d; best = e; }
  }
  return best;
}

function updateSoldier(s, dt) {
  if (s.dead) return;
  if (s.hero && s.hp < s.maxHp) {
    var since = RUN.time - (s.hitAt === undefined ? -999 : s.hitAt);
    if (since >= HERO.regenDelay) s.hp = Math.min(s.maxHp, s.hp + HERO.regen * dt);
  }
  if (s.temp) {
    s.life -= dt;
    if (s.life <= 0) { s.dead = true; addFx('burst', s.x, s.y, { color: PAL.brass, n: 6 }); return; }
  }

  if (s.target && (s.target.dead || dist(s.target.x, s.target.y, s.rallyX, s.rallyY) > s.leash + 40)) {
    if (s.target.blocker === s) s.target.blocker = null;
    s.target = null;
  }
  if (!s.target) {
    var t = findBlockTarget(s);
    if (t) { s.target = t; t.blocker = s; }
    else { s.target = findAttackTarget(s); }   /* gang up on someone else's hold */
  }

  var tx = s.rallyX, ty = s.rallyY;
  if (s.target) { tx = s.target.x; ty = s.target.y; }

  var d = dist(s.x, s.y, tx, ty);
  var contact = s.target ? 16 : 5;
  if (d > contact) {
    var sp = s.speed || 78;
    s.x += (tx - s.x) / d * sp * dt;
    s.y += (ty - s.y) / d * sp * dt;
    s.walking = true;
    s.walk = (s.walk || 0) + dt;
    if (Math.abs(tx - s.x) > 1) s.faceX = tx < s.x ? -1 : 1;
  } else if (s.target) {
    s.walking = false;
    s.cd -= dt;
    if (s.cd <= 0) {
      s.cd = s.rate;
      var foe = s.target;
      var opts = null;
      if (s.effect === 'stun' && rng() < s.stunChance) opts = { stun: s.stunTime };
      applyDamage(foe, s.dmg, 'phys', opts);
      addFx('spark', foe.x, foe.y, { color: '#e6d7b0' });
    }
  }

  if (d <= contact) s.walking = false;

  /* warden aura chills everything nearby */
  if (s.effect === 'slowAura') {
    for (var i = 0; i < RUN.enemies.length; i++) {
      var e = RUN.enemies[i];
      if (e.dead || e.def.air) continue;
      if (distSq(e.x, e.y, s.x, s.y) <= s.auraRadius * s.auraRadius) {
        e.slow = Math.max(e.slow, s.auraSlow);
        e.slowTime = Math.max(e.slowTime, 0.4);
      }
    }
  }
}

/* ---------------- towers ---------------- */

function buildTower(spotIndex, type) {
  if (!RUN || RUN.status !== 'playing') return null;
  var spot = RUN.spots[spotIndex];
  if (!spot || spot.tower) return null;
  var def = TOWERS[type];
  if (!def) return null;
  var cost = def.tiers[0].cost;
  if (RUN.gold < cost) { toast('NOT ENOUGH GOLD'); return null; }
  RUN.gold -= cost;
  var t = {
    type: type, tier: 1, spec: null,
    x: spot.x, y: spot.y,
    spotIndex: spotIndex,
    cd: 0,
    angle: 0,
    soldiers: [],
    respawnTimers: [],
    rallyX: spot.x, rallyY: spot.y + 40,
    shots: 0
  };
  if (def.isBarracks) {
    var rp = defaultRally(spot);
    t.rallyX = rp.x; t.rallyY = rp.y;
  }
  spot.tower = t;
  RUN.towers.push(t);
  return t;
}

/* drop the rally flag onto the nearest bit of road so soldiers block by default */
function defaultRally(spot) {
  var best = null, bestD = Infinity;
  for (var i = 0; i < RUN.def.paths.length; i++) {
    var pts = RUN.def.paths[i];
    var total = pathLength(pts);
    for (var d = 0; d <= total; d += 12) {
      var p = pathPointAt(pts, d);
      var dd = distSq(p.x, p.y, spot.x, spot.y);
      if (dd < bestD) { bestD = dd; best = p; }
    }
  }
  return best ? { x: best.x, y: best.y } : { x: spot.x, y: spot.y + 40 };
}

function upgradeTower(t) {
  if (!RUN || RUN.status !== 'playing') return false;
  if (t.tier >= 3) return false;
  var cost = TOWERS[t.type].tiers[t.tier].cost;
  if (RUN.gold < cost) { toast('NOT ENOUGH GOLD'); return false; }
  RUN.gold -= cost;
  t.tier++;
  addFx('ring', t.x, t.y, { color: PAL.brass });
  refreshBarracks(t);
  return true;
}

function specialiseTower(t, specId) {
  if (!RUN || RUN.status !== 'playing') return false;
  if (t.tier !== 3 || t.spec) return false;
  if (!TOWERS[t.type].specs[specId]) return false;
  if (RUN.gold < SPEC_COST) { toast('NOT ENOUGH GOLD'); return false; }
  RUN.gold -= SPEC_COST;
  t.spec = specId;
  addFx('ring', t.x, t.y, { color: PAL.white });
  refreshBarracks(t);
  return true;
}

function sellTower(t) {
  if (!RUN || RUN.status !== 'playing') return 0;
  var refund = Math.floor(towerInvested(t) * SELL_RATE);
  RUN.gold += refund;
  for (var i = 0; i < t.soldiers.length; i++) t.soldiers[i].dead = true;
  var spot = RUN.spots[t.spotIndex];
  if (spot) spot.tower = null;
  var ix = RUN.towers.indexOf(t);
  if (ix >= 0) RUN.towers.splice(ix, 1);
  addFx('ring', t.x, t.y, { color: PAL.brassDim });
  return refund;
}

function refreshBarracks(t) {
  if (!TOWERS[t.type].isBarracks) return;
  var st = towerStats(t);
  for (var i = 0; i < t.soldiers.length; i++) {
    var s = t.soldiers[i];
    if (s.dead) continue;
    s.maxHp = st.soldierHp;
    s.hp = st.soldierHp;
    s.dmg = st.soldierDmg;
    s.rate = st.soldierRate;
    s.leash = st.rallyRange;
    s.effect = st.effect || null;
    s.stunChance = st.stunChance || 0;
    s.stunTime = st.stunTime || 0;
    s.auraRadius = st.auraRadius || 0;
    s.auraSlow = st.auraSlow || 0;
    s.kind = t.spec || 'soldier';
  }
}

function setRally(t, x, y) {
  var st = towerStats(t);
  if (dist(x, y, t.x, t.y) > st.rallyRange) {
    var a = Math.atan2(y - t.y, x - t.x);
    x = t.x + Math.cos(a) * st.rallyRange;
    y = t.y + Math.sin(a) * st.rallyRange;
  }
  t.rallyX = clamp(x, 8, VIEW_W - 8);
  t.rallyY = clamp(y, 60, VIEW_H - 8);
  for (var i = 0; i < t.soldiers.length; i++) {
    t.soldiers[i].rallyX = t.rallyX;
    t.soldiers[i].rallyY = t.rallyY;
  }
}

function pickTarget(t, st) {
  var best = null, bestProg = -1;
  var groundOnly = !!TOWERS[t.type].groundOnly;
  var r2 = st.range * st.range;
  for (var i = 0; i < RUN.enemies.length; i++) {
    var e = RUN.enemies[i];
    if (e.dead) continue;
    if (groundOnly && e.def.air) continue;
    if (distSq(e.x, e.y, t.x, t.y) > r2) continue;
    if (e.dist > bestProg) { bestProg = e.dist; best = e; }
  }
  return best;
}

function spawnBarracksSoldier(t, st) {
  var ang = rng() * Math.PI * 2;
  var s = makeSoldier({
    x: t.rallyX + Math.cos(ang) * 14, y: t.rallyY + Math.sin(ang) * 14,
    hp: st.soldierHp, dmg: st.soldierDmg, rate: st.soldierRate,
    rallyX: t.rallyX, rallyY: t.rallyY, leash: st.rallyRange,
    owner: t, kind: t.spec || 'soldier',
    effect: st.effect || null, stunChance: st.stunChance || 0, stunTime: st.stunTime || 0,
    auraRadius: st.auraRadius || 0, auraSlow: st.auraSlow || 0
  });
  t.everSpawned = true;
  t.soldiers.push(s);
  RUN.soldiers.push(s);
  return s;
}

function updateTower(t, dt) {
  var st = towerStats(t);
  var def = TOWERS[t.type];

  if (def.isBarracks) {
    /* drop the dead, tick the queue, and refill empty slots */
    for (var i = t.soldiers.length - 1; i >= 0; i--) {
      if (t.soldiers[i].dead) t.soldiers.splice(i, 1);
    }
    for (var j = t.respawnTimers.length - 1; j >= 0; j--) {
      t.respawnTimers[j] -= dt;
      if (t.respawnTimers[j] <= 0) {
        t.respawnTimers.splice(j, 1);
        spawnBarracksSoldier(t, st);
      }
    }
    while (t.soldiers.length + t.respawnTimers.length < st.soldiers) {
      t.respawnTimers.push(t.everSpawned ? st.respawn : 0.3);
    }
    return;
  }

  t.cd -= dt;
  var target = pickTarget(t, st);
  if (target) t.angle = Math.atan2(target.y - t.y, target.x - t.x);
  if (t.cd <= 0 && target) {
    t.cd = st.rate;
    t.shots++;
    fireAt(t, st, target);
  }
}

function fireAt(t, st, target) {
  var speed = st.projectile === 'shell' ? 300 : (st.projectile === 'bolt' ? 400 : 470);
  RUN.shots.push({
    x: t.x, y: t.y - 14,
    target: target,
    tx: target.x, ty: target.y,
    speed: speed,
    kind: st.projectile,
    damage: st.damage,
    dmgType: st.dmgType || 'phys',
    splash: st.splash || 0,
    effect: st.effect || null,
    st: st,
    towerType: t.type,
    arc: st.projectile === 'shell' ? 1 : 0,
    travelled: 0,
    total: Math.max(1, dist(t.x, t.y - 14, target.x, target.y)),
    dead: false
  });
}

function updateShot(s, dt) {
  if (s.dead) return;
  if (s.target && !s.target.dead) { s.tx = s.target.x; s.ty = s.target.y; }
  var d = dist(s.x, s.y, s.tx, s.ty);
  var step = s.speed * dt;
  if (d <= step || d < 3) {
    s.x = s.tx; s.y = s.ty;
    s.dead = true;
    resolveHit(s);
    return;
  }
  s.x += (s.tx - s.x) / d * step;
  s.y += (s.ty - s.y) / d * step;
  s.travelled += step;
}

function resolveHit(s) {
  var st = s.st;
  if (s.splash > 0) {
    var r2 = s.splash * s.splash;
    for (var i = 0; i < RUN.enemies.length; i++) {
      var e = RUN.enemies[i];
      if (e.dead || e.def.air) continue;
      if (distSq(e.x, e.y, s.x, s.y) > r2) continue;
      var opts = null;
      if (s.effect === 'stun' && rng() < (st.stunChance || 0)) opts = { stun: st.stunTime };
      applyDamage(e, s.damage, s.dmgType, opts);
    }
    addFx('boom', s.x, s.y, { r: s.splash });
    if (s.effect === 'burn') {
      RUN.patches.push({ x: s.x, y: s.y, r: st.burnRadius, dps: st.burnDps, time: st.burnTime, max: st.burnTime });
    }
    return;
  }

  var t = s.target;
  if (!t || t.dead) { addFx('spark', s.x, s.y, { color: PAL.white }); return; }

  var opts = null;
  if (s.effect === 'slow') opts = { slowAmount: st.slowAmount, slowTime: st.slowTime };
  else if (s.effect === 'bleed') opts = { dotDps: st.dotDps, dotTime: st.dotTime };

  applyDamage(t, s.damage, s.dmgType, opts);

  if (s.effect === 'execute' && !t.dead && !t.def.boss && t.hp / t.maxHp <= st.executeAt) {
    addFx('ring', t.x, t.y, { color: PAL.blood });
    killEnemy(t);
  }

  if (s.effect === 'chain') {
    var hits = 0, from = t;
    var used = [t];
    while (hits < st.chainCount) {
      var next = null, bestD = Infinity;
      for (var i = 0; i < RUN.enemies.length; i++) {
        var e = RUN.enemies[i];
        if (e.dead || used.indexOf(e) >= 0) continue;
        var dd = distSq(e.x, e.y, from.x, from.y);
        if (dd < bestD && dd <= st.chainRange * st.chainRange) { bestD = dd; next = e; }
      }
      if (!next) break;
      applyDamage(next, s.damage * Math.pow(st.chainFalloff, hits + 1), s.dmgType, null);
      addFx('chain', from.x, from.y, { x2: next.x, y2: next.y });
      used.push(next);
      from = next;
      hits++;
    }
  }

  addFx('spark', s.x, s.y, { color: s.dmgType === 'magic' ? PAL.arcane : PAL.white });
}

/* ---------------- abilities ---------------- */

function castRain(x, y) {
  if (!RUN || RUN.status !== 'playing') return false;
  if (RUN.abilities.rain > 0) return false;
  var a = ABILITIES.rain;
  RUN.abilities.rain = a.cooldown;
  for (var i = 0; i < RUN.enemies.length; i++) {
    var e = RUN.enemies[i];
    if (e.dead) continue;
    if (distSq(e.x, e.y, x, y) <= a.radius * a.radius) applyDamage(e, a.damage, 'true', null);
  }
  addFx('rain', x, y, { r: a.radius });
  return true;
}

function castReinforce(x, y) {
  if (!RUN || RUN.status !== 'playing') return false;
  if (RUN.abilities.reinforce > 0) return false;
  var a = ABILITIES.reinforce;
  RUN.abilities.reinforce = a.cooldown;
  for (var i = 0; i < a.count; i++) {
    var s = makeSoldier({
      x: x + (i ? 14 : -14), y: y,
      hp: a.hp, dmg: a.dmg, rate: a.rate,
      rallyX: x, rallyY: y, leash: 110,
      temp: true, life: a.life, kind: 'temp'
    });
    RUN.soldiers.push(s);
  }
  addFx('ring', x, y, { color: PAL.brass });
  return true;
}

/* ---------------- effects ---------------- */

function addFx(kind, x, y, opts) {
  var f = { kind: kind, x: x, y: y, t: 0, life: 0.5 };
  for (var k in opts) f[k] = opts[k];
  if (kind === 'pop') f.life = 0.9;
  if (kind === 'boom') f.life = 0.35;
  if (kind === 'rain') f.life = 0.8;
  if (kind === 'ring') f.life = 0.5;
  if (kind === 'chain') f.life = 0.18;
  if (kind === 'leak') f.life = 0.7;
  if (kind === 'burst') {
    f.life = 0.55;
    f.parts = [];
    var n = f.n || 8;
    for (var i = 0; i < n; i++) {
      var a = rng() * Math.PI * 2, sp = 30 + rng() * 90;
      f.parts.push({ x: 0, y: 0, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp });
    }
  }
  RUN.fx.push(f);
  if (RUN.fx.length > 260) RUN.fx.splice(0, RUN.fx.length - 260);
}

/* ---------------- outcome ---------------- */

function starsFor(livesLeft, maxLives) {
  if (livesLeft >= maxLives) return 3;
  if (livesLeft > Math.floor(maxLives / 2)) return 2;
  return 1;
}

function winLevel() {
  if (RUN.status !== 'playing') return;
  RUN.status = 'won';
  RUN.stars = starsFor(RUN.lives, RUN.maxLives);
  recordResult(RUN.index, RUN.stars);
}

function loseLevel() {
  if (RUN.status !== 'playing') return;
  RUN.status = 'lost';
  RUN.stars = 0;
}

/* ---------------- main step ---------------- */

function stepLevel(dt) {
  if (!RUN) return;
  if (RUN.paused || RUN.status !== 'playing') return;

  RUN.time += dt;
  if (RUN.toastTime > 0) RUN.toastTime -= dt;

  if (RUN.abilities.rain > 0) RUN.abilities.rain = Math.max(0, RUN.abilities.rain - dt);
  if (RUN.abilities.reinforce > 0) RUN.abilities.reinforce = Math.max(0, RUN.abilities.reinforce - dt);

  /* the hero picks herself up rather than staying down */
  if (RUN.hero && RUN.hero.dead) {
    RUN.heroTimer -= dt;
    if (RUN.heroTimer <= 0) {
      spawnHero();
      addFx('ring', RUN.heroX, RUN.heroY, { color: PAL.brass });
      toast(HERO.label + ' IS BACK');
    }
  }

  if (!RUN.waveActive) {
    if (RUN.waveIndex < RUN.def.waves.length) {
      RUN.prepTimer -= dt;
      if (RUN.prepTimer <= 0) { RUN.prepTimer = 0; startWave(); }
    }
  } else {
    RUN.waveTime += dt;
    while (RUN.spawnCursor < RUN.spawns.length && RUN.spawns[RUN.spawnCursor].t <= RUN.waveTime) {
      var sp = RUN.spawns[RUN.spawnCursor];
      spawnEnemy(sp.type, sp.pathId, 0);
      RUN.spawnCursor++;
    }
  }

  var i;
  for (i = 0; i < RUN.towers.length; i++) updateTower(RUN.towers[i], dt);
  for (i = 0; i < RUN.soldiers.length; i++) updateSoldier(RUN.soldiers[i], dt);
  for (i = 0; i < RUN.enemies.length; i++) updateEnemy(RUN.enemies[i], dt);
  for (i = 0; i < RUN.shots.length; i++) updateShot(RUN.shots[i], dt);

  /* burning ground */
  for (i = RUN.patches.length - 1; i >= 0; i--) {
    var pt = RUN.patches[i];
    pt.time -= dt;
    for (var j = 0; j < RUN.enemies.length; j++) {
      var e = RUN.enemies[j];
      if (e.dead || e.def.air) continue;
      if (distSq(e.x, e.y, pt.x, pt.y) <= pt.r * pt.r) applyDamage(e, pt.dps * dt, 'true', null);
    }
    if (pt.time <= 0) RUN.patches.splice(i, 1);
  }

  /* effects */
  for (i = RUN.fx.length - 1; i >= 0; i--) {
    var f = RUN.fx[i];
    f.t += dt;
    if (f.parts) {
      for (var q = 0; q < f.parts.length; q++) {
        var pa = f.parts[q];
        pa.x += pa.vx * dt; pa.y += pa.vy * dt; pa.vy += 160 * dt;
      }
    }
    if (f.t >= f.life) RUN.fx.splice(i, 1);
  }

  /* reap */
  RUN.enemies = RUN.enemies.filter(function (e) { return !e.dead; });
  RUN.soldiers = RUN.soldiers.filter(function (s) { return !s.dead; });
  RUN.shots = RUN.shots.filter(function (s) { return !s.dead; });
  for (i = 0; i < RUN.towers.length; i++) {
    RUN.towers[i].soldiers = RUN.towers[i].soldiers.filter(function (s) { return !s.dead; });
  }

  if (RUN.gold < 0) RUN.gold = 0;

  if (RUN.status === 'playing' && waveCleared()) {
    RUN.waveActive = false;
    var wave = RUN.def.waves[RUN.waveIndex];
    if (wave) {
      RUN.gold += wave.reward;
      RUN.goldEarned += wave.reward;
    }
    RUN.waveIndex++;
    if (RUN.waveIndex >= RUN.def.waves.length) {
      winLevel();
    } else {
      RUN.prepTimer = PREP_TIME;
    }
  }
}

/* ===== p50_progress.js ===== */
/* ============================================================
   Progress: save, load, unlocks. Storage may be unavailable or
   throw on access; the game must not care.
   ============================================================ */

var SAVE_KEY = 'courjahan_defense_v1';

var PROGRESS = {
  stars: [0, 0, 0, 0, 0],
  unlocked: 1,
  beaten: false
};

var storageBroken = false;

function safeStorage() {
  try {
    var st = globalThis.localStorage;
    if (!st) return null;
    return st;
  } catch (e) {
    storageBroken = true;
    return null;
  }
}

function saveProgress() {
  try {
    var st = safeStorage();
    if (!st) return false;
    st.setItem(SAVE_KEY, JSON.stringify(PROGRESS));
    return true;
  } catch (e) {
    storageBroken = true;
    return false;
  }
}

function loadProgress() {
  try {
    var st = safeStorage();
    if (!st) return false;
    var raw = st.getItem(SAVE_KEY);
    if (!raw) return false;
    var data = JSON.parse(raw);
    if (!data || !data.stars || data.stars.length !== LEVEL_COUNT) return false;
    for (var i = 0; i < LEVEL_COUNT; i++) {
      PROGRESS.stars[i] = clamp(data.stars[i] | 0, 0, 3);
    }
    PROGRESS.unlocked = clamp(data.unlocked | 0, 1, LEVEL_COUNT);
    PROGRESS.beaten = !!data.beaten;
    return true;
  } catch (e) {
    storageBroken = true;
    return false;
  }
}

function hasSave() {
  try {
    var st = safeStorage();
    if (!st) return false;
    return !!st.getItem(SAVE_KEY);
  } catch (e) {
    return false;
  }
}

function clearProgress() {
  PROGRESS.stars = [0, 0, 0, 0, 0];
  PROGRESS.unlocked = 1;
  PROGRESS.beaten = false;
  try {
    var st = safeStorage();
    if (st) st.removeItem(SAVE_KEY);
  } catch (e) { storageBroken = true; }
}

/* returns true if this result unlocked a new level */
function recordResult(levelIndex, stars) {
  var unlockedSomething = false;
  if (stars > PROGRESS.stars[levelIndex]) PROGRESS.stars[levelIndex] = stars;
  if (stars > 0) {
    if (levelIndex + 2 > PROGRESS.unlocked && levelIndex + 2 <= LEVEL_COUNT) {
      PROGRESS.unlocked = levelIndex + 2;
      unlockedSomething = true;
    }
    if (levelIndex === LEVEL_COUNT - 1) PROGRESS.beaten = true;
  }
  saveProgress();
  return unlockedSomething;
}

function totalStars() {
  var n = 0;
  for (var i = 0; i < PROGRESS.stars.length; i++) n += PROGRESS.stars[i];
  return n;
}

/* ===== p60_render.js ===== */
/* ============================================================
   Render and UI.

   Every interactive region is produced by one of the *Buttons()
   functions below. Drawing and hit testing both read that same
   list, so a control can never be visible in one and absent in
   the other.
   ============================================================ */

var HUD_H = BOARD_TOP;

function panel(ctx, x, y, w, h, opts) {
  var o = opts || {};
  ctx.fillStyle = o.shadow === false ? 'rgba(0,0,0,0)' : 'rgba(10,7,16,0.45)';
  ctx.fillRect(x + 3, y + 4, w, h);
  ctx.fillStyle = o.fill || PAL.night;
  ctx.fillRect(x, y, w, h);
  ctx.fillStyle = o.top || PAL.slate;
  ctx.fillRect(x, y, w, 2);
  ctx.fillStyle = o.edge || PAL.brassDim;
  ctx.fillRect(x, y, 2, h);
  ctx.fillRect(x + w - 2, y, 2, h);
  ctx.fillRect(x, y + h - 2, w, 2);
}

function drawButton(ctx, b) {
  var enabled = b.enabled !== false;

  /* a plate replaces the procedural panel entirely (rectangular buttons only;
     circular ones draw their portrait inside the ring below) */
  if (b.img && b.shape !== 'circle') {
    var plate = menuArt(b.img);
    if (plate) {
      if (!enabled) ctx.globalAlpha = 0.45;
      ctx.drawImage(plate, b.x, b.y, b.w, b.h);
      ctx.globalAlpha = 1;
      return;
    }
  }

  var fill = b.active ? PAL.brassDim : (enabled ? PAL.slate : '#241f30');
  if (b.shape === 'circle') {
    ctx.fillStyle = 'rgba(10,7,16,0.5)';
    ctx.beginPath(); ctx.arc(b.cx, b.cy + 3, b.r, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = fill;
    ctx.beginPath(); ctx.arc(b.cx, b.cy, b.r, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = enabled ? (b.accent || PAL.brass) : '#463f55';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(b.cx, b.cy, b.r - 1, 0, Math.PI * 2); ctx.stroke();
    if (b.img) {
      var portrait = menuArt(b.img);
      if (portrait) {
        var ph = Math.round(b.r * 1.5);
        var pw = Math.round(ph * portrait.width / portrait.height);
        if (!enabled) ctx.globalAlpha = 0.4;
        ctx.drawImage(portrait, Math.round(b.cx - pw / 2), Math.round(b.cy - ph / 2), pw, ph);
        ctx.globalAlpha = 1;
      }
    }
    if (b.icon) drawIcon(ctx, b.icon, b.cx, b.cy - 4, enabled);
    if (b.label) drawText(ctx, b.label, b.cx, b.cy + 7, 1, enabled ? PAL.white : '#6b6280', 'center');
    if (b.sub) drawText(ctx, b.sub, b.cx, b.cy + b.r + 6, 1, enabled ? PAL.brass : '#6b6280', 'center');
    return;
  }
  panel(ctx, b.x, b.y, b.w, b.h, { fill: fill, edge: enabled ? (b.accent || PAL.brassDim) : '#3a3348' });
  var ty = b.y + Math.round((b.h - 7 * (b.scale || 1)) / 2);
  if (b.sub) ty = b.y + 6;
  drawText(ctx, b.label, b.x + b.w / 2, ty, b.scale || 1, enabled ? PAL.white : '#6b6280', 'center');
  if (b.sub) drawText(ctx, b.sub, b.x + b.w / 2, b.y + b.h - 12, 1, enabled ? PAL.brass : '#6b6280', 'center');
}

function drawIcon(ctx, kind, x, y, enabled) {
  var c = enabled ? PAL.white : '#6b6280';
  ctx.fillStyle = c;
  if (kind === 'pause') { ctx.fillRect(x - 5, y - 6, 4, 12); ctx.fillRect(x + 1, y - 6, 4, 12); }
  else if (kind === 'play') { ctx.beginPath(); ctx.moveTo(x - 4, y - 7); ctx.lineTo(x + 6, y); ctx.lineTo(x - 4, y + 7); ctx.closePath(); ctx.fill(); }
  else if (kind === 'fast') {
    ctx.beginPath(); ctx.moveTo(x - 7, y - 6); ctx.lineTo(x - 1, y); ctx.lineTo(x - 7, y + 6); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(x + 0, y - 6); ctx.lineTo(x + 6, y); ctx.lineTo(x + 0, y + 6); ctx.closePath(); ctx.fill();
  }
  else if (kind === 'hammer') {
    ctx.fillRect(x - 1, y - 2, 3, 9);
    ctx.fillStyle = PAL.brass; ctx.fillRect(x - 6, y - 7, 12, 5);
  }
  else if (kind === 'fire') {
    ctx.fillStyle = PAL.ember;
    ctx.beginPath(); ctx.moveTo(x, y - 8); ctx.lineTo(x + 6, y + 2); ctx.lineTo(x, y + 7); ctx.lineTo(x - 6, y + 2); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#f7e08a';
    ctx.beginPath(); ctx.moveTo(x, y - 2); ctx.lineTo(x + 3, y + 2); ctx.lineTo(x, y + 6); ctx.lineTo(x - 3, y + 2); ctx.closePath(); ctx.fill();
  }
  else if (kind === 'shield') {
    ctx.fillStyle = '#8e97a8';
    ctx.beginPath(); ctx.moveTo(x, y - 8); ctx.lineTo(x + 6, y - 4); ctx.lineTo(x + 4, y + 7); ctx.lineTo(x, y + 8);
    ctx.lineTo(x - 4, y + 7); ctx.lineTo(x - 6, y - 4); ctx.closePath(); ctx.fill();
    ctx.fillStyle = PAL.brass; ctx.fillRect(x - 1, y - 4, 2, 9);
  }
  else if (kind === 'x') {
    ctx.fillStyle = c;
    for (var i = -5; i <= 5; i++) { ctx.fillRect(x + i - 1, y + i - 1, 3, 3); ctx.fillRect(x + i - 1, y - i - 1, 3, 3); }
  }
}

function drawHeart(ctx, x, y, s) {
  ctx.fillStyle = PAL.blood;
  ctx.fillRect(x - 4 * s, y - 3 * s, 3 * s, 4 * s);
  ctx.fillRect(x + 1 * s, y - 3 * s, 3 * s, 4 * s);
  ctx.fillRect(x - 4 * s, y + 1 * s, 8 * s, 2 * s);
  ctx.fillRect(x - 3 * s, y + 3 * s, 6 * s, 2 * s);
  ctx.fillRect(x - 1 * s, y + 5 * s, 2 * s, 2 * s);
}

function drawCoin(ctx, x, y, s) {
  ctx.fillStyle = PAL.brassDim;
  ctx.beginPath(); ctx.arc(x, y, 6 * s, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = PAL.brass;
  ctx.beginPath(); ctx.arc(x, y - 1 * s, 5 * s, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = PAL.brassDim;
  ctx.fillRect(x - 1 * s, y - 4 * s, 2 * s, 6 * s);
}

function drawStar(ctx, x, y, r, filled) {
  ctx.fillStyle = filled ? PAL.brass : 'rgba(230,215,176,0.20)';
  ctx.beginPath();
  for (var i = 0; i < 10; i++) {
    var a = -Math.PI / 2 + i * Math.PI / 5;
    var rr = i % 2 ? r * 0.44 : r;
    var px = x + Math.cos(a) * rr, py = y + Math.sin(a) * rr;
    if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  }
  ctx.closePath(); ctx.fill();
  if (filled) {
    ctx.strokeStyle = '#8c6a26'; ctx.lineWidth = 1; ctx.stroke();
  }
}

/* ---------------- interactive regions ---------------- */

function levelButtons() {
  var out = [];
  if (!RUN) return out;
  var over = RUN.status !== 'playing';

  out.push({ id: 'quit', x: 710, y: 22, w: 83, h: 34, img: 'hudMap', label: 'MAP', enabled: true });
  out.push({ id: 'speed', x: 820, y: 17, w: 41, h: 44, img: 'hudFF', icon: 'fast', active: RUN.speed > 1, enabled: !over });
  out.push({ id: 'pause', x: 878, y: 17, w: 41, h: 44, img: 'hudMenu', icon: RUN.paused ? 'play' : 'pause', enabled: !over });

  if (!over) {
    var rainReady = RUN.abilities.rain <= 0;
    var reinReady = RUN.abilities.reinforce <= 0;
    out.push({
      id: 'rain', shape: 'circle', cx: 44, cy: VIEW_H - 46, r: 27, icon: 'fire',
      enabled: rainReady, active: RUN.aimMode === 'rain', sub: rainReady ? 'READY' : Math.ceil(RUN.abilities.rain) + 'S',
      accent: PAL.ember
    });
    out.push({
      id: 'reinforce', shape: 'circle', cx: 112, cy: VIEW_H - 46, r: 27, icon: 'shield',
      enabled: reinReady, active: RUN.aimMode === 'reinforce', sub: reinReady ? 'READY' : Math.ceil(RUN.abilities.reinforce) + 'S',
      accent: '#8e97a8'
    });

    var heroDown = !RUN.hero || RUN.hero.dead;
    out.push({
      id: 'hero', shape: 'circle', cx: 180, cy: VIEW_H - 46, r: 27,
      img: 'heroIcon', enabled: !heroDown, active: RUN.aimMode === 'hero',
      sub: heroDown ? Math.ceil(RUN.heroTimer) + 'S' : HERO.label,
      accent: PAL.brass
    });

    if (!RUN.waveActive && RUN.waveIndex < RUN.def.waves.length) {
      var bonus = Math.max(0, Math.floor(RUN.prepTimer * CALL_BONUS_PER_SEC));
      out.push({
        id: 'call', x: VIEW_W - 214, y: VIEW_H - 68, w: 196, h: 46,
        label: 'CALL WAVE ' + (RUN.waveIndex + 1), sub: bonus > 0 ? '+' + bonus + ' GOLD' : 'NO BONUS',
        accent: PAL.brass
      });
    }
  }

  /* radial build menu */
  if (RUN.radial) {
    var s = RUN.spots[RUN.radial.spotIndex];
    var n = TOWER_ORDER.length;
    for (var i = 0; i < n; i++) {
      var a = -Math.PI / 2 + i * (Math.PI * 2 / n);
      var type = TOWER_ORDER[i];
      var cost = TOWERS[type].tiers[0].cost;
      out.push({
        id: 'build:' + type, shape: 'circle',
        cx: clamp(s.x + Math.cos(a) * 56, 30, VIEW_W - 30),
        cy: clamp(s.y + Math.sin(a) * 56, HUD_H + 30, VIEW_H - 30),
        r: 24, label: TOWERS[type].short, sub: String(cost),
        enabled: RUN.gold >= cost, accent: TOWERS[type].color
      });
    }
    out.push({ id: 'radialClose', shape: 'circle', cx: s.x, cy: s.y, r: 17, icon: 'x', enabled: true });
  }

  /* selected tower panel */
  if (RUN.selectedTower) {
    var t = RUN.selectedTower;
    var pw = 250, ph = 96;
    var px = clamp(t.x - pw / 2, 8, VIEW_W - pw - 8);
    var py = t.y + 34;
    if (py + ph > VIEW_H - 76) py = t.y - ph - 40;
    if (py < HUD_H + 6) py = HUD_H + 6;
    RUN.panelRect = { x: px, y: py, w: pw, h: ph };

    if (t.tier < 3) {
      var uc = TOWERS[t.type].tiers[t.tier].cost;
      out.push({
        id: 'upgrade', x: px + 10, y: py + 40, w: 150, h: 30,
        label: 'UPGRADE TIER ' + (t.tier + 1), sub: String(uc), enabled: RUN.gold >= uc, accent: PAL.brass
      });
    } else if (!t.spec) {
      var keys = [];
      for (var k in TOWERS[t.type].specs) keys.push(k);
      for (var j = 0; j < keys.length; j++) {
        var sp = TOWERS[t.type].specs[keys[j]];
        out.push({
          id: 'spec:' + keys[j], x: px + 10 + j * 118, y: py + 38, w: 110, h: 34,
          label: sp.label.split(' ')[0].slice(0, 9), sub: String(SPEC_COST),
          enabled: RUN.gold >= SPEC_COST, accent: PAL.arcane
        });
      }
    }
    out.push({
      id: 'sell', x: px + pw - 78, y: py + ph - 30, w: 68, h: 22,
      label: 'SELL ' + Math.floor(towerInvested(t) * SELL_RATE), enabled: true, accent: PAL.blood
    });
    if (TOWERS[t.type].isBarracks) {
      out.push({
        id: 'rally', x: px + 10, y: py + ph - 30, w: 116, h: 22,
        label: RUN.rallyMode ? 'TAP THE SPOT' : 'MOVE RALLY', enabled: true,
        active: !!RUN.rallyMode, accent: '#8e97a8'
      });
    }
    out.push({ id: 'deselect', shape: 'circle', cx: px + pw - 16, cy: py + 14, r: 11, icon: 'x', enabled: true });
  }

  if (over) {
    var by = 356;
    if (RUN.status === 'won') {
      var isLast = RUN.index >= LEVEL_COUNT - 1;
      out.push({ id: 'next', x: VIEW_W / 2 - 210, y: by, w: 200, h: 46, label: isLast ? 'SEE CREDITS' : 'NEXT LEVEL', scale: 2, accent: PAL.brass });
      out.push({ id: 'toMap', x: VIEW_W / 2 + 10, y: by, w: 200, h: 46, label: 'WORLD MAP', scale: 2 });
    } else {
      out.push({ id: 'retry', x: VIEW_W / 2 - 210, y: by, w: 200, h: 46, label: 'TRY AGAIN', scale: 2, accent: PAL.brass });
      out.push({ id: 'toMap', x: VIEW_W / 2 + 10, y: by, w: 200, h: 46, label: 'WORLD MAP', scale: 2 });
    }
  }
  return out;
}

function hitButton(list, x, y) {
  /* later entries draw on top, so test them first */
  for (var i = list.length - 1; i >= 0; i--) {
    var b = list[i];
    if (b.enabled === false) continue;
    if (b.shape === 'circle') {
      if (pointInCircle(x, y, b.cx, b.cy, b.r + 4)) return b;
    } else if (pointInRect(x, y, b)) return b;
  }
  return null;
}

/* ---------------- level rendering ---------------- */

function drawLevel(ctx) {
  /* a painted plate wins; the procedural terrain is the fallback and is drawn
     along the same polyline, so the level plays the same either way */
  var plate = plateFor(RUN.index);
  if (plate) {
    ctx.drawImage(plate, 0, HUD_H, VIEW_W, VIEW_H - HUD_H);
  } else {
    var bg = BG_CACHE[RUN.index];
    if (bg) ctx.drawImage(bg, 0, 0);
    else { ctx.fillStyle = PAL.mossDk; ctx.fillRect(0, 0, VIEW_W, VIEW_H); }
  }

  var i;

  /* burning ground */
  for (i = 0; i < RUN.patches.length; i++) {
    var pt = RUN.patches[i];
    var a = clamp(pt.time / pt.max, 0, 1);
    ctx.fillStyle = 'rgba(224,122,43,' + (0.16 + 0.18 * a).toFixed(3) + ')';
    ctx.beginPath(); ctx.arc(pt.x, pt.y, pt.r, 0, Math.PI * 2); ctx.fill();
  }

  /* empty build pads pulse so they read as interactive */
  for (i = 0; i < RUN.spots.length; i++) {
    var sp = RUN.spots[i];
    if (sp.tower) continue;
    var pulse = 0.5 + 0.5 * Math.sin(RUN.time * 2.4 + i);
    ctx.strokeStyle = 'rgba(217,164,65,' + (0.35 + pulse * 0.4).toFixed(3) + ')';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(sp.x, sp.y, 15 + pulse * 2, 0, Math.PI * 2); ctx.stroke();
    drawIcon(ctx, 'hammer', sp.x, sp.y, true);
  }

  /* rally flags */
  for (i = 0; i < RUN.towers.length; i++) {
    var tw = RUN.towers[i];
    if (!TOWERS[tw.type].isBarracks) continue;
    var sel = RUN.selectedTower === tw;
    ctx.strokeStyle = sel ? 'rgba(230,215,176,0.55)' : 'rgba(230,215,176,0.22)';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(tw.x, tw.y); ctx.lineTo(tw.rallyX, tw.rallyY); ctx.stroke();
    ctx.fillStyle = '#6b6455';
    ctx.fillRect(tw.rallyX - 1, tw.rallyY - 14, 2, 14);
    ctx.fillStyle = sel ? PAL.white : '#8e97a8';
    ctx.beginPath();
    ctx.moveTo(tw.rallyX + 1, tw.rallyY - 14);
    ctx.lineTo(tw.rallyX + 13, tw.rallyY - 10);
    ctx.lineTo(tw.rallyX + 1, tw.rallyY - 6);
    ctx.closePath(); ctx.fill();
  }

  /* range circle for the selected tower or a hovering build choice */
  if (RUN.selectedTower) {
    var stt = towerStats(RUN.selectedTower);
    ctx.strokeStyle = 'rgba(230,215,176,0.42)';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(RUN.selectedTower.x, RUN.selectedTower.y, stt.range, 0, Math.PI * 2); ctx.stroke();
    ctx.fillStyle = 'rgba(230,215,176,0.06)';
    ctx.fill();
  }
  if (RUN.radial) {
    var rs = RUN.spots[RUN.radial.spotIndex];
    ctx.strokeStyle = 'rgba(217,164,65,0.5)';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(rs.x, rs.y, 142, 0, Math.PI * 2); ctx.stroke();
  }

  /* the bribed sign, and the hint that he can be bribed */
  if (RUN.index === 0 && plateFor(0)) {
    if (RUN.signFlipped) drawFlippedSign(ctx);
    else if (RUN.status === 'playing') drawSignGlint(ctx);
  }

  /* towers */
  for (i = 0; i < RUN.towers.length; i++) drawTower(ctx, RUN.towers[i]);

  /* soldiers */
  for (i = 0; i < RUN.soldiers.length; i++) drawSoldier(ctx, RUN.soldiers[i]);

  /* enemies */
  for (i = 0; i < RUN.enemies.length; i++) drawEnemy(ctx, RUN.enemies[i]);

  /* projectiles */
  for (i = 0; i < RUN.shots.length; i++) drawShot(ctx, RUN.shots[i]);

  /* effects */
  for (i = 0; i < RUN.fx.length; i++) drawFx(ctx, RUN.fx[i]);

  /* where she is headed while she is down */
  if (RUN.hero && RUN.hero.dead) {
    var hb = 0.4 + 0.3 * Math.sin(RUN.time * 3);
    ctx.strokeStyle = 'rgba(217,164,65,' + hb.toFixed(3) + ')';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.ellipse(RUN.heroX, RUN.heroY + 4, 14, 6, 0, 0, Math.PI * 2); ctx.stroke();
    drawText(ctx, Math.ceil(RUN.heroTimer) + 'S', RUN.heroX, RUN.heroY - 14, 1, PAL.brass, 'center');
  }

  /* aiming reticle for abilities */
  if (RUN.aimMode && RUN.pointer) {
    var rr = RUN.aimMode === 'rain' ? ABILITIES.rain.radius : (RUN.aimMode === 'hero' ? 24 : 44);
    ctx.strokeStyle = RUN.aimMode === 'rain' ? PAL.ember : (RUN.aimMode === 'hero' ? PAL.brass : '#8e97a8');
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(RUN.pointer.x, RUN.pointer.y, rr, 0, Math.PI * 2); ctx.stroke();
    ctx.fillStyle = RUN.aimMode === 'rain' ? 'rgba(224,122,43,0.16)'
      : (RUN.aimMode === 'hero' ? 'rgba(217,164,65,0.18)' : 'rgba(142,151,168,0.16)');
    ctx.fill();
  }

  drawHUD(ctx);

  var list = levelButtons();
  if (RUN.selectedTower) drawTowerPanel(ctx);
  for (i = 0; i < list.length; i++) drawButton(ctx, list[i]);

  if (RUN.toastTime > 0 && RUN.toast) {
    var alpha = clamp(RUN.toastTime / 0.6, 0, 1);
    ctx.globalAlpha = alpha;
    panel(ctx, VIEW_W / 2 - 190, 62, 380, 30, { fill: 'rgba(27,24,48,0.92)' });
    drawText(ctx, RUN.toast, VIEW_W / 2, 73, 1, PAL.brass, 'center');
    ctx.globalAlpha = 1;
  }

  if (RUN.paused && RUN.status === 'playing') {
    ctx.fillStyle = 'rgba(12,8,20,0.55)';
    ctx.fillRect(0, 0, VIEW_W, VIEW_H);
    drawTextShadow(ctx, 'PAUSED', VIEW_W / 2, 250, 5, PAL.white, 'center');
    drawText(ctx, 'TAP THE PAUSE BUTTON TO RESUME', VIEW_W / 2, 296, 1, PAL.parchDim, 'center');
    var pl = levelButtons();
    for (i = 0; i < pl.length; i++) if (pl[i].id === 'pause' || pl[i].id === 'quit') drawButton(ctx, pl[i]);
  }

  if (RUN.status !== 'playing') drawResult(ctx);
}

/* The sign-holder on the Grassy Gully plate. Bribe him and he turns the board
   around. Cosmetic, but he does take the peanuts. */
var SIGN_BRIBE = 50;

function signPlateRect() {
  /* the painted board, in plate coordinates, mapped into the board strip */
  var y0 = BOARD_TOP + 12 * BOARD_SCALE;
  var y1 = BOARD_TOP + 52 * BOARD_SCALE;
  return { x: 427, y: y0, w: 51, h: y1 - y0 };
}

function signTapRect() {
  var r = signPlateRect();
  /* generous: the board and the man holding it */
  return { x: r.x - 28, y: r.y - 6, w: r.w + 56, h: r.h + 44 };
}

function signIsAvailable() {
  return RUN && RUN.index === 0 && !RUN.signFlipped && RUN.status === 'playing';
}

function drawFlippedSign(ctx) {
  var r = signPlateRect();
  var cx = r.x + r.w / 2;
  var bw = 68, bh = 36;
  var bx = Math.round(cx - bw / 2), by = Math.round(r.y - 2);

  ctx.fillStyle = 'rgba(60,44,26,0.45)';
  ctx.fillRect(bx + 2, by + 3, bw, bh);
  ctx.fillStyle = '#6b4f30';
  ctx.fillRect(bx, by, bw, bh);
  ctx.fillStyle = '#e8dcb8';
  ctx.fillRect(bx + 3, by + 3, bw - 6, bh - 6);
  ctx.fillStyle = 'rgba(120,96,60,0.35)';
  ctx.fillRect(bx + 3, by + bh - 8, bw - 6, 2);

  drawText(ctx, 'COURJAHAN', cx, by + 8, 1, '#5a4028', 'center');
  drawText(ctx, 'IS BETTER', cx, by + 20, 1, '#5a4028', 'center');
}

function drawSignGlint(ctx) {
  var r = signPlateRect();
  var t = RUN.time * 2.2;
  var a = 0.30 + 0.30 * Math.sin(t);
  ctx.fillStyle = 'rgba(232,185,60,' + a.toFixed(3) + ')';
  var gx = r.x + r.w - 4, gy = r.y + 4;
  ctx.fillRect(gx - 1, gy - 4, 2, 9);
  ctx.fillRect(gx - 4, gy - 1, 9, 2);
  if (RUN.gold >= SIGN_BRIBE) {
    ctx.globalAlpha = 0.55 + 0.25 * Math.sin(t);
    drawText(ctx, String(SIGN_BRIBE), r.x + r.w / 2, r.y - 12, 1, '#e8b93c', 'center');
    ctx.globalAlpha = 1;
  }
}

function drawTower(ctx, t) {
  var img = towerSprite(t);
  var w = img.spriteW || img.width, h = img.spriteH || img.height;
  ctx.fillStyle = PAL.shadow;
  ctx.beginPath(); ctx.ellipse(t.x, t.y + 6, 17, 7, 0, 0, Math.PI * 2); ctx.fill();
  ctx.drawImage(img, Math.round(t.x - w / 2), Math.round(t.y - h + 12));

  /* tier pips */
  for (var i = 0; i < t.tier; i++) {
    ctx.fillStyle = PAL.brass;
    ctx.fillRect(t.x - 9 + i * 7, t.y + 12, 5, 3);
  }
  if (t.spec) {
    ctx.fillStyle = PAL.white;
    ctx.fillRect(t.x - 2, t.y + 17, 4, 3);
  }
}

function drawSoldier(ctx, s) {
  if (s.hero) { drawHero(ctx, s); return; }
  var img = s.kind === 'temp' ? ART.soldierTemp
    : (s.kind === 'templar' ? ART.soldierTemplar
      : (s.kind === 'warden' ? ART.soldierWarden : ART.soldier));
  var w = img.spriteW || img.width, h = img.spriteH || img.height;
  ctx.fillStyle = PAL.shadow;
  ctx.beginPath(); ctx.ellipse(s.x, s.y + 5, 8, 4, 0, 0, Math.PI * 2); ctx.fill();
  ctx.drawImage(img, Math.round(s.x - w / 2), Math.round(s.y - h + 6));
  if (s.hp < s.maxHp) drawBar(ctx, s.x, s.y - h + 1, 18, 3, s.hp / s.maxHp, '#5fbf5a');
  if (s.effect === 'slowAura') {
    ctx.strokeStyle = 'rgba(111,195,216,0.18)';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(s.x, s.y, s.auraRadius, 0, Math.PI * 2); ctx.stroke();
  }
}

function drawHero(ctx, s) {
  var img = menuArt('hero');
  ctx.fillStyle = PAL.shadow;
  ctx.beginPath(); ctx.ellipse(s.x, s.y + 4, 13, 5, 0, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = 'rgba(217,164,65,0.55)';
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.ellipse(s.x, s.y + 4, 14, 6, 0, 0, Math.PI * 2); ctx.stroke();

  if (img) {
    /* One frame of art, so the trot is faked: the legs slide under a body that
       bobs against them. Enough to read as walking at this size. */
    var phase = s.walking ? Math.floor((s.walk || 0) * 9) % 4 : 0;
    var legDx = [0, 1, 0, -1][phase];
    var bob = (phase === 1 || phase === 3) ? -1 : 0;

    var h = 38, w = Math.round(h * img.width / img.height);
    var dx = Math.round(s.x - w / 2), dy = Math.round(s.y - h + 6);
    var srcSplit = Math.max(1, Math.round(img.height * 0.56));
    var dstSplit = Math.max(1, Math.round(h * 0.56));

    ctx.save();
    if (s.faceX === -1) {
      ctx.translate(Math.round(s.x) * 2, 0);
      ctx.scale(-1, 1);
    }
    /* stretch the body by the bob amount so lifting it never opens a seam
       above the legs */
    ctx.drawImage(img, 0, 0, img.width, srcSplit,
      dx, dy + bob, w, dstSplit - bob);
    ctx.drawImage(img, 0, srcSplit, img.width, img.height - srcSplit,
      dx + legDx, dy + dstSplit, w, h - dstSplit);
    ctx.restore();
  } else {
    ctx.fillStyle = '#6b5140';
    ctx.fillRect(s.x - 8, s.y - 20, 16, 20);
  }

  drawBar(ctx, s.x, s.y - 40, 30, 4, s.hp / s.maxHp, '#c9a441');
  drawTextShadow(ctx, HERO.label, s.x, s.y + 10, 1, PAL.brass, 'center');
  if (s.hp < s.maxHp && RUN.time - (s.hitAt === undefined ? -999 : s.hitAt) >= HERO.regenDelay) {
    var pulse = 0.35 + 0.35 * Math.sin(RUN.time * 5);
    ctx.fillStyle = 'rgba(95,191,90,' + pulse.toFixed(3) + ')';
    ctx.fillRect(s.x + 17, s.y - 42, 2, 8);
    ctx.fillRect(s.x + 14, s.y - 39, 8, 2);
  }
}

function drawEnemy(ctx, e) {
  var img = ART.enemy[e.def.sprite];
  var w = img.spriteW || img.width, h = img.spriteH || img.height;
  var bob = e.def.air ? 0 : Math.sin(RUN.time * 9 + e.wobble) * 1.2;

  ctx.fillStyle = PAL.shadow;
  ctx.beginPath();
  ctx.ellipse(e.x, e.y + (e.def.air ? 16 : 7), e.def.radius * 0.9, e.def.radius * 0.36, 0, 0, Math.PI * 2);
  ctx.fill();

  ctx.save();
  if (e.facing < 0) {
    ctx.translate(Math.round(e.x), 0);
    ctx.scale(-1, 1);
    ctx.drawImage(img, Math.round(-w / 2), Math.round(e.y - h + 8 + bob));
  } else {
    ctx.drawImage(img, Math.round(e.x - w / 2), Math.round(e.y - h + 8 + bob));
  }
  ctx.restore();

  if (e.stunTime > 0) {
    ctx.fillStyle = PAL.brass;
    for (var i = 0; i < 3; i++) {
      var a = RUN.time * 6 + i * 2.1;
      ctx.fillRect(e.x + Math.cos(a) * 10 - 1, e.y - h + 2 + Math.sin(a) * 4, 3, 3);
    }
  }
  if (e.slow > 0) {
    ctx.fillStyle = 'rgba(111,195,216,0.28)';
    ctx.beginPath(); ctx.arc(e.x, e.y, e.def.radius + 2, 0, Math.PI * 2); ctx.fill();
  }
  if (e.dotTime > 0) {
    ctx.fillStyle = 'rgba(193,68,58,0.35)';
    ctx.beginPath(); ctx.arc(e.x, e.y - 4, e.def.radius, 0, Math.PI * 2); ctx.fill();
  }

  if (e.hp < e.maxHp) {
    var bw = e.def.boss ? 60 : 22;
    drawBar(ctx, e.x, e.y - h + 4, bw, e.def.boss ? 5 : 3, e.hp / e.maxHp, e.def.boss ? PAL.blood : '#c94e42');
  }
}

function drawBar(ctx, cx, y, w, h, frac, color) {
  ctx.fillStyle = 'rgba(12,8,20,0.75)';
  ctx.fillRect(cx - w / 2 - 1, y - 1, w + 2, h + 2);
  ctx.fillStyle = '#2b2742';
  ctx.fillRect(cx - w / 2, y, w, h);
  ctx.fillStyle = color;
  ctx.fillRect(cx - w / 2, y, w * clamp(frac, 0, 1), h);
}

function drawShot(ctx, s) {
  if (s.kind === 'arrow') {
    var a = Math.atan2(s.ty - s.y, s.tx - s.x);
    ctx.save();
    ctx.translate(s.x, s.y);
    ctx.rotate(a);
    ctx.fillStyle = '#e6d7b0';
    ctx.fillRect(-7, -1, 12, 2);
    ctx.fillStyle = '#8c6a26';
    ctx.fillRect(-9, -2, 4, 4);
    ctx.restore();
  } else if (s.kind === 'bolt') {
    ctx.fillStyle = PAL.arcane;
    ctx.beginPath(); ctx.arc(s.x, s.y, 5, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#d8c2ff';
    ctx.beginPath(); ctx.arc(s.x, s.y, 2.5, 0, Math.PI * 2); ctx.fill();
  } else {
    var prog = clamp(s.travelled / s.total, 0, 1);
    var lift = Math.sin(prog * Math.PI) * 26;
    ctx.fillStyle = '#2f2b34';
    ctx.beginPath(); ctx.arc(s.x, s.y - lift, 5, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#565062';
    ctx.beginPath(); ctx.arc(s.x - 1, s.y - lift - 1, 2, 0, Math.PI * 2); ctx.fill();
  }
}

function drawFx(ctx, f) {
  var k = clamp(f.t / f.life, 0, 1);
  if (f.kind === 'spark') {
    ctx.fillStyle = f.color || PAL.white;
    ctx.globalAlpha = 1 - k;
    var r = 3 + k * 5;
    ctx.fillRect(f.x - r / 2, f.y - r / 2, r, r);
    ctx.globalAlpha = 1;
  } else if (f.kind === 'burst') {
    ctx.globalAlpha = 1 - k;
    ctx.fillStyle = f.color || PAL.blood;
    for (var i = 0; i < f.parts.length; i++) {
      ctx.fillRect(f.x + f.parts[i].x - 1.5, f.y + f.parts[i].y - 1.5, 3, 3);
    }
    ctx.globalAlpha = 1;
  } else if (f.kind === 'pop') {
    ctx.globalAlpha = 1 - k;
    drawText(ctx, f.text, f.x, f.y - 16 - k * 18, 1, PAL.brass, 'center');
    ctx.globalAlpha = 1;
  } else if (f.kind === 'boom') {
    ctx.globalAlpha = (1 - k) * 0.8;
    ctx.fillStyle = PAL.ember;
    ctx.beginPath(); ctx.arc(f.x, f.y, (f.r || 30) * (0.4 + k * 0.8), 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;
  } else if (f.kind === 'ring') {
    ctx.globalAlpha = 1 - k;
    ctx.strokeStyle = f.color || PAL.brass;
    ctx.lineWidth = 3 * (1 - k) + 1;
    ctx.beginPath(); ctx.arc(f.x, f.y, 10 + k * 34, 0, Math.PI * 2); ctx.stroke();
    ctx.globalAlpha = 1;
  } else if (f.kind === 'rain') {
    ctx.globalAlpha = (1 - k) * 0.9;
    ctx.fillStyle = 'rgba(224,122,43,0.5)';
    ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#f7e08a';
    for (var j = 0; j < 14; j++) {
      var a = (j / 14) * Math.PI * 2 + k * 2;
      var rr = f.r * (0.2 + k * 0.9);
      ctx.fillRect(f.x + Math.cos(a) * rr - 2, f.y + Math.sin(a) * rr - 6, 3, 10);
    }
    ctx.globalAlpha = 1;
  } else if (f.kind === 'chain') {
    ctx.globalAlpha = 1 - k;
    ctx.strokeStyle = '#d8c2ff';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(f.x, f.y); ctx.lineTo(f.x2, f.y2); ctx.stroke();
    ctx.globalAlpha = 1;
  } else if (f.kind === 'leak') {
    ctx.globalAlpha = 1 - k;
    drawText(ctx, 'BREACH', f.x, f.y - 20 - k * 14, 2, PAL.blood, 'center');
    ctx.globalAlpha = 1;
  }
}

function drawHUD(ctx) {
  var bar = menuArt('hudbar');
  if (bar) ctx.drawImage(bar, 0, 0, VIEW_W, HUD_H);
  else panel(ctx, 0, 0, VIEW_W, HUD_H, { fill: 'rgba(20,16,32,0.94)', shadow: false });

  var mug = menuArt('hudMug');
  if (mug) ctx.drawImage(mug, 24, 16, 36, 46); else drawHeart(ctx, 40, 38, 1.6);
  drawTextShadow(ctx, String(RUN.lives), 70, 27, 3, RUN.lives <= 5 ? '#e8705f' : '#e8b93c');

  var nuts = menuArt('hudNuts');
  if (nuts) ctx.drawImage(nuts, 152, 20, 58, 40); else drawCoin(ctx, 176, 38, 1.6);
  drawTextShadow(ctx, String(Math.floor(RUN.gold)), 218, 27, 3, '#e8b93c');

  /* wave tracker */
  var cx = 500;
  drawText(ctx, RUN.def.name, cx, 19, 1, PAL.parchDim, 'center');

  var total = RUN.def.waves.length;
  var step = 24;
  var pipW = 21, pipH = 16;
  var startX = Math.round(cx - (total * step - (step - pipW)) / 2);
  var don = menuArt('hudDonut');
  for (var i = 0; i < total; i++) {
    var done = i < RUN.waveIndex;
    var current = i === RUN.waveIndex && RUN.waveActive;
    var px = startX + i * step, py = 30;
    if (don) {
      ctx.globalAlpha = done ? 1 : (current ? 0.9 : 0.32);
      ctx.drawImage(don, px, py, pipW, pipH);
      ctx.globalAlpha = 1;
    } else {
      ctx.fillStyle = done ? PAL.brass : (current ? PAL.white : '#3a3550');
      ctx.fillRect(px, py, pipW - 3, pipH - 4);
    }
    if (current) {
      ctx.strokeStyle = PAL.white; ctx.lineWidth = 1;
      ctx.strokeRect(px - 2, py - 2, pipW + 4, pipH + 4);
    }
    if (RUN.def.waves[i].boss) {
      ctx.fillStyle = PAL.blood;
      ctx.fillRect(px + pipW / 2 - 2, py + pipH + 2, 4, 3);
    }
  }

  drawText(ctx, 'WAVE ' + Math.min(RUN.waveIndex + 1, total) + '/' + total, cx - 10, 54, 1, PAL.parch, 'right');
  if (!RUN.waveActive && RUN.waveIndex < total && RUN.status === 'playing') {
    drawText(ctx, 'NEXT IN ' + Math.ceil(RUN.prepTimer) + 'S', cx + 10, 54, 1, '#e8b93c');
  }
  if (RUN.speed > 1) drawText(ctx, '2X', 840, 64, 1, '#e8b93c', 'center');
}

function drawTowerPanel(ctx) {
  var t = RUN.selectedTower;
  var r = RUN.panelRect;
  if (!r) return;
  panel(ctx, r.x, r.y, r.w, r.h, { fill: 'rgba(27,24,48,0.96)' });
  var st = towerStats(t);

function drawResult(ctx) {
  ctx.fillStyle = 'rgba(12,8,20,0.72)';

  if (won) {

      VIEW_W / 2, 282, 1, PAL.parchDim, 'center');

}
