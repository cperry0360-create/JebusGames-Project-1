    const drawn = all.filter((o) => o.getBounds && o.type !== 'Container' && o.visible !== false)

    // The design box is what must contain the layout: the camera is a CONTAIN
    // fit, so anything outside 0..1280 x 0..720 is off the fitted area even
    // though the backdrop deliberately overspills it.
    const over = []
    for (const o of drawn) {
      if (o.texture && o.texture.key === 'ui-loadout-bg') continue
      if (o.type === 'Rectangle' && o.width > 1200) continue
      const b = o.getBounds()
      if (b.height < 1 || b.width < 1) continue
      if (b.y < -1 || b.bottom > 721 || b.x < -1 || b.right > 1281) {
        over.push((o.text ? JSON.stringify(String(o.text).slice(0, 22)) : o.type) +
          ' ' + Math.round(b.x) + ',' + Math.round(b.y) +
          ' ' + Math.round(b.width) + 'x' + Math.round(b.height))
      }
    }
    note('outside the design box: ' + (over.length ? over.join(' | ') : 'nothing'))

    const texts = drawn.filter((o) => o.type === 'Text' && String(o.text ?? '').trim() !== '')

    // The safe band the illustration leaves clear.
    //
    // Measured from the CARDS, not from every object on the screen: a
    // zero-content Text reports a box while drawing nothing, and one of them
    // was pinning the measured extent to a number that did not move however
    // narrow the cards got.
    let minX = 9999, maxX = -9999, maxY = -9999
    for (const c of sc.cards) {
      for (const o of c.parts) {
        if (!o.getBounds || o.type === 'Container') continue
        const b = o.getBounds()
        if (b.width < 1 || b.height < 1) continue
        minX = Math.min(minX, b.x); maxX = Math.max(maxX, b.right)
        maxY = Math.max(maxY, b.bottom)
      }
    }
    note('card extent x ' + Math.round(minX) + '..' + Math.round(maxX) +
      ' (safe band ' + Math.round(sc.safeBand.left) + '..' + Math.round(sc.safeBand.right) + ')')
    note('  breaches the safe band: ' +
      ((minX < sc.safeBand.left - 1 || maxX > sc.safeBand.right + 1) ? 'YES' : 'no'))
    note('  lowest card edge y ' + Math.round(maxY) + ' of 720')

    // Wrapped text: how many lines, and did anything split a value from its unit.
    for (const t of texts) {
      const lines = t.getWrappedText ? t.getWrappedText() : [String(t.text)]
      if (lines.length > 1) {
        const bad = lines.some((l, i) => i > 0 && /^(s|px|\/s|peanuts|radius|damage|cooldown)\b/.test(l.trim()))
        note('  wrapped ' + lines.length + ' lines' + (bad ? '  *** SPLIT A UNIT ***' : '') +
          ': ' + lines.map((l) => l.trim()).join(' / ').slice(0, 90))
      }
    }
    // Text must stay inside the card it belongs to. Measuring against the
    // design box alone missed the actual complaint: the specials descriptions
    // ran past their own card borders and under their own icons, which is
    // well inside 1280x720.
    const spill = []
    for (const c of sc.cards) {
      const plate = c.parts.find((o) => o.type === 'Rectangle' && o.getBounds)
      if (!plate) continue
      const pb = plate.getBounds()
      // The icon's column, so an overlap with it can be reported as one.
      const kids = c.face.list || []
      const icons = kids.filter((o) => o.type === 'Image' || o.type === 'Sprite')
      for (const o of kids) {
        if (o.type !== 'Text' || String(o.text ?? '').trim() === '') continue
        const b = o.getBounds()
        if (b.x < pb.x - 1 || b.right > pb.right + 1 || b.bottom > pb.bottom + 1 || b.y < pb.y - 1) {
          spill.push(JSON.stringify(String(o.text).slice(0, 20)) + ' outside its card')
        }
        for (const ic of icons) {
          const ib = ic.getBounds()
          if (b.x < ib.right - 1 && b.right > ib.x + 1 && b.y < ib.bottom - 1 && b.bottom > ib.y + 1) {
            spill.push(JSON.stringify(String(o.text).slice(0, 20)) + ' overlaps its icon')
          }
        }
      }
    }
    note('text outside its card or over its icon: ' + (spill.length ? spill.join(' | ') : 'none'))

    // Equal heights within each row.
    const rows = {}
    for (const c of sc.cards) {
      const plate = c.parts.find((o) => o.type === 'Rectangle' && o.getBounds)
      if (!plate) continue
      const b = plate.getBounds()
      const key = Math.round(b.y / 10)
      ;(rows[key] = rows[key] || []).push(Math.round(b.height))
    }
    for (const c of sc.cards) {
      const plate = c.parts.find((o) => o.type === 'Rectangle' && o.getBounds)
      const pb = plate ? plate.getBounds() : null
      const kids = (c.face.list || []).filter((o) => o.type === 'Text')
      const ic = (c.face.list || []).filter((o) => o.type === 'Image')
      note('  icons: ' + ic.map((o) => {
        const b = o.getBounds()
        return (o.texture?.key ?? '?') + ' ' + Math.round(b.width) + 'x' + Math.round(b.height) +
          ' centre ' + Math.round(b.centerX - (pb ? pb.centerX : 0)) + ',' +
          Math.round(b.centerY - (pb ? pb.centerY : 0)) + ' rel card'
      }).join('  |  '))
      note('  card w' + (pb ? Math.round(pb.width) : '?') + ' h' + (pb ? Math.round(pb.height) : '?') +
        ': ' + kids.map((t) => JSON.stringify(String(t.text).slice(0, 16)) + ' w' +
          Math.round(t.width) + ' x' + Math.round(t.getBounds().width)).join(' '))
    }
    note('card heights by row: ' + Object.values(rows)
      .map((hs) => hs.join('/') + (new Set(hs).size > 1 ? ' *** UNEQUAL ***' : '')).join('  '))

    // The one overlap the design-box check cannot see: the button row sitting
    // on top of the last card because its y was clamped to the screen.
    const btnTexts = drawn.filter((o) => o.type === 'Text' && /BEGIN|REROLL/.test(String(o.text ?? '')))
    const btnTop = Math.min(...btnTexts.map((o) => o.getBounds().y)) - 16
    note('  button row top y ' + Math.round(btnTop) + ' vs lowest card edge ' + Math.round(maxY) +
      (btnTop < maxY ? '  *** BUTTONS OVER THE CARDS ***' : '  clear'))
    note('buttons: ' + drawn.filter((o) => o.type === 'Text' &&
      /BEGIN|REROLL/.test(String(o.text ?? ''))).map((o) => JSON.stringify(String(o.text))).join(' '))
    note('scenes running at capture: ' +
      game.scene.getScenes(true).map((x) => x.scene.key).join(','))
    await shot('loadout-' + VP.w + 'x' + VP.h)

    // The reroll: one whole-hand redeal, spent once, button stays but goes dead.
    const hand = () => {
      const t = sc.cards.map((c) => (c.face.list || [])
        .filter((o) => o.type === 'Text').map((o) => String(o.text)).join('|'))
      return t.join(' // ')
    }
    const before = hand()
    const btn = drawn.find((o) => o.type === 'Text' && /REROLL/.test(String(o.text ?? '')))
    const bb = btn.getBounds()
    // Design coordinates -> screen, so the click lands where the button is.
    // The UI camera is a CONTAIN fit: it has a zoom AND a viewport offset, so
    // scrollX alone is not the transform. worldView is the rectangle of design
    // space the camera shows, and cam.x/cam.y are where that lands on screen.
    const toScreen = (x, y) => {
      const c = sc.cameras.main
      return {
        x: c.x + (x - c.worldView.x) * c.zoom,
        y: c.y + (y - c.worldView.y) * c.zoom,
      }
    }
    const p1 = toScreen(bb.centerX, bb.centerY)
    await click(p1.x, p1.y)
    await sleep(900)
    const after = hand()
    note('  reroll changed the hand: ' + (before !== after ? 'YES' : 'NO *** SAME HAND ***'))
    note('  rerolls left after one press: ' + sc.rerollsLeft)
    const btn2 = sc.children.list.concat(...sc.children.list.map((o) => o.list || []))
      .find((o) => o.type === 'Text' && /REROLL/.test(String(o.text ?? '')))
    note('  button label now: ' + (btn2 ? JSON.stringify(String(btn2.text)) : 'GONE *** it should stay ***'))
    await shot('loadout-rerolled-' + VP.w + 'x' + VP.h)

    // And a second press must do nothing at all.
    const twice = hand()
    const bb2 = btn2.getBounds()
    const p2 = toScreen(bb2.centerX, bb2.centerY)
    await click(p2.x, p2.y)
    await sleep(700)
    note('  second press changed the hand: ' +
      (hand() !== twice ? 'YES *** it should be spent ***' : 'no') +
      ' (rerollsLeft=' + sc.rerollsLeft + ')')
    return
  }

  if (scenario === 'ticket') {
    // The painted ticket, at whatever viewport the run was given, plus a
    // re-check of the camera fix: scratching must never pan the board.
    g.status.peanuts = 99999
    await build(3, 0)
    g.startWave()
    await sleep(900)

    const payout = arg === 'lose' ? { label: 'NOT A WINNER', payout: 0, weight: 1 }
      : { label: '', payout: 140, weight: 1 }
    g.showTicket(payout, 600)
    await sleep(600)
    const card = g.ticket
    note('viewport ' + VP.w + 'x' + VP.h + ' card ' +
      Math.round(card.cardW) + 'x' + Math.round(card.cardH) +
      ' (viewport allows ' + VP.w + 'x' + VP.h + ')')
    note('  fits on screen: ' + (card.cardW <= VP.w && card.cardH <= VP.h))
    note('  modalOpen=' + g.modalOpen + ' HUD visible=' +
      game.scene.getScene('Hud').cameras.main.visible)
    await shot('ticket-01-covered-' + VP.w + 'x' + VP.h)

    // Scratch across the panel, and watch the camera.
    const cam = g.cameras.main
    const before = Math.round(cam.scrollX) + ',' + Math.round(cam.scrollY)
    const movesBefore = g.rig.moveCount
    const cx = VP.w / 2, cy = VP.h / 2
    // Enough passes to actually cross the reveal threshold: four strokes
    // erased a visible X and still left the card under 38%.
    // The camera is only meaningful WHILE the card is up. Once enough of the
    // coating is gone the card pays out and closes, and a stroke still in
    // flight after that is a drag on a board with no modal over it — which is
    // supposed to pan.
    const rows = [-0.28, -0.14, 0, 0.14, 0.28]
    let after = before
    outer: for (const r of rows) {
      const yy = cy + r * card.cardH
      mouse('mousedown', cx - card.cardW * 0.34, yy)
      for (let i = 1; i <= 14; i++) {
        if (!g.ticket?.active) { mouse('mouseup', cx, yy); break outer }
        await move(cx - card.cardW * 0.34 + (card.cardW * 0.68 * i) / 14, yy)
        after = Math.round(cam.scrollX) + ',' + Math.round(cam.scrollY)
      }
      mouse('mouseup', cx + card.cardW * 0.34, yy)
      await sleep(40)
    }
    note('  camera ' + before + ' -> ' + after + (before === after ? '  UNMOVED' : '  *** MOVED ***') +
      ' [rig accepted ' + (g.rig.moveCount - movesBefore) + ' moves while the card was up]')
    await shot('ticket-02-scratched-' + VP.w + 'x' + VP.h)
    await sleep(1400)
    await shot('ticket-03-revealed-' + VP.w + 'x' + VP.h)
    note('  peanuts after: ' + g.status.peanuts + ' message="' + g.status.message + '"')
    return
  }

  if (scenario === 'markers') {
    // Three states and nothing else.
    g.status.peanuts = 99999
    await build(3, 0)
    await sleep(500)

    // What the marker layer actually drew, by counting its command list. A
    // screenshot cannot tell an absent ring from a faint one.
    const drew = () => {
      const c = g.markerLayer.commandBuffer || []
      let strokes = 0, fills = 0
      for (let i = 0; i < c.length; i++) {
        if (c[i] === 5 /* Phaser STROKE_PATH */ || c[i] === 25) strokes++
        if (c[i] === 4 /* FILL_PATH */ || c[i] === 24) fills++
      }
      return 'commands=' + c.length
    }
    // The rig starts looking at the entrance; the markers are on the hero.
    const look = () => { g.cameras.main.centerOn(g.hero.x, g.hero.y) }
    const marks = () => ({
      foot: g.markers.footRing(),
      move: g.markers.moveRing(),
      selected: g.heroSelected,
      atRally: g.hero.atRally,
    })

    note('STATE 1 idle, not selected:')
    note('  ' + JSON.stringify(marks()) + '  markerLayer ' + drew())
    look(); await sleep(60); await shot('markers-01-idle-' + VP.w + 'x' + VP.h)

    // STATE 2: select him.
    g.selectHero()
    await sleep(200)
    let m = marks()
    note('STATE 2 selected:')
    note('  foot ring alpha ' + (m.foot ? m.foot.alpha : 'NONE *** should be a ring ***') +
      '  move ring: ' + (m.move ? 'PRESENT *** should be none ***' : 'none'))
    const ringW = g.hero.spriteWidth * 0.60
    note('  ring width ' + ringW.toFixed(1) + ' of sprite width ' + g.hero.spriteWidth.toFixed(1) +
      ' = ' + (ringW / g.hero.spriteWidth * 100).toFixed(0) + '%')
    look(); await sleep(60); await shot('markers-02-selected-' + VP.w + 'x' + VP.h)

    // STATE 3: order him somewhere far.
    const far = { x: g.hero.x + 260, y: g.hero.y + 40 }
    g.orderHero(far.x, far.y)
    await sleep(60)
    m = marks()
    note('STATE 3 move order, just given:')
    note('  move ring at ' + Math.round(m.move.x) + ',' + Math.round(m.move.y) +
      ' scale ' + m.move.scale.toFixed(2) + ' alpha ' + m.move.alpha.toFixed(3) +
      ' (scales in from 0.70 over 200ms)')
    await sleep(300)
    m = marks()
    note('  after 360ms: scale ' + m.move.scale.toFixed(2) + ' alpha ' + m.move.alpha.toFixed(3) +
      ' selected=' + m.selected + ' (he stays selected while walking)')
    const p1 = g.markers.moveRing().phase
    await sleep(750)
    const p2 = g.markers.moveRing().phase
    const turnsPerSec = ((p2 - p1) / (Math.PI * 2)) / 0.75
    note('  dash rotation ' + (1 / turnsPerSec).toFixed(2) + 's per turn (asked for 3s)')
    look(); await sleep(60); await shot('markers-03-walking-' + VP.w + 'x' + VP.h)

    // Re-order mid-walk: the old ring must be gone, not fading beside it.
    g.orderHero(g.hero.x - 120, g.hero.y - 30)
    await sleep(50)
    note('  re-ordered mid-walk: rings on the board = ' + (g.markers.moveRing() ? 1 : 0) +
      ' at ' + Math.round(g.markers.moveRing().x) + ',' + Math.round(g.markers.moveRing().y))

    // Arrival.
    await until(() => g.hero.atRally, 12000)
    await sleep(80)
    m = marks()
    note('on arrival: selected=' + m.selected +
      ' foot=' + (m.foot ? 'fading a' + m.foot.alpha.toFixed(2) : 'gone') +
      ' move=' + (m.move ? 'fading a' + m.move.alpha.toFixed(2) : 'gone'))
    await sleep(450)
    m = marks()
    note('  350ms later: foot=' + (m.foot ? '*** STILL THERE ***' : 'gone') +
      ' move=' + (m.move ? '*** STILL THERE ***' : 'gone') +
      '  markerLayer ' + drew())
    look(); await sleep(60); await shot('markers-04-arrived-' + VP.w + 'x' + VP.h)

    // Cancel: both go the same way.
    g.selectHero()
    g.orderHero(g.hero.x + 200, g.hero.y)
    await sleep(120)
    g.clearSelection()
    await sleep(80)
    m = marks()
    note('cancelled: foot=' + (m.foot ? 'fading a' + m.foot.alpha.toFixed(2) : 'gone') +
      ' move=' + (m.move ? 'fading a' + m.move.alpha.toFixed(2) : 'gone') + ' (both should fade)')
    await sleep(420)
    m = marks()
    note('  after the fade: ' + (m.foot || m.move ? '*** SOMETHING REMAINS ***' : 'nothing drawn'))
    return
  }

  if (scenario === 'restructure') {
    // Restructure is DAD MODE only, and its slot must not move when it goes.
    const hud = game.scene.getScene('Hud')
    g.status.peanuts = 99999
    await build(3, 0)
    g.startWave()
    await sleep(1200)

    const positions = () => hud.slots.map((sl) =>
      sl.region.id + '@' + Math.round(sl.region.cx) + ',' + Math.round(sl.region.cy))
    const shownOf = () => hud.slots.map((sl) =>
      sl.region.id + '=' + (sl.icon.visible ? 'shown' : 'SOCKET'))

    note('viewport ' + VP.w + 'x' + VP.h)
    note('out of DAD MODE:')
    note('  ' + positions().join('  '))
    note('  ' + shownOf().join('  '))
    const before = positions().join('|')

    // And does a tap on its reserved slot do anything? Nine points across the
    // whole reserved box, not just the middle: the report was that it responds,
    // and one probe at the centre proves only the centre.
    const slot = hud.slots.find((sl) => sl.region.id === 'restructure')
    let reached = 0
    const orig = g.armRestructure.bind(g)
    g.armRestructure = () => { reached++; return orig() }
    const bb = slot.hit.getBounds()
    note('  socket box ' + Math.round(bb.x) + ',' + Math.round(bb.y) + ' ' +
      Math.round(bb.width) + 'x' + Math.round(bb.height) +
      ' hitInInputList=' + !!slot.hit.input +
      ' hitVisible=' + slot.hit.visible +
      ' frameAlpha=' + slot.frame.alpha + ' iconVisible=' + slot.icon.visible)
    // The direct armRestructure() above raised a refusal, and its toast lives
    // for a couple of seconds. Waited out, or the first probes read it as
    // their own — which is exactly the false positive it produced first time.
    const was = { mode: g.status.mode, msg: g.status.message, alert: g.status.alert || '',
                  toast: '', sel: !!g.selected, rally: !!g.heroSelected }
    const bad = []
    for (const fx of [0.08, 0.5, 0.92]) {
      for (const fy of [0.08, 0.5, 0.92]) {
        const x = bb.x + bb.width * fx, y = bb.y + bb.height * fy
        await click(x, y)
        await sleep(80)
        const t = hud.activeToast
        const now = {
          mode: g.status.mode,
          alert: g.status.alert || '',
          toast: t && t.active && t.visible && t.list ? t.list.map((c) => c.text || '').join('') : '',
          msg: g.status.message,
          rally: !!g.heroSelected,
          sel: !!g.selected,
        }
        // `msg` is excluded: the status banner is a timed wave announcement
        // that reverts to the idle hint on its own, so it changes during the
        // probe whether or not anything is tapped. It is printed separately.
        const diff = Object.keys(now).filter((k) =>
          k !== 'msg' && String(now[k]) !== String(was[k] ?? ''))
        if (diff.length) {
          bad.push('(' + fx + ',' + fy + ') ' +
            diff.map((k) => k + ': "' + was[k] + '" -> "' + now[k] + '"').join(', '))
        }
        g.status.alert = ''
      }
    }
    note('  tapping the empty socket reached armRestructure ' + reached + ' times')
    note('  banner after the taps: "' + g.status.message + '"')
    note('  taps that changed anything: ' + (bad.length ? bad.join(' | ') : 'NONE'))
    g.armRestructure = orig
    // Does it refuse?
    let armed = g.status.mode
    g.armRestructure()
    await sleep(200)
    note('  armRestructure outside DAD MODE: mode=' + g.status.mode +
      ' (was ' + armed + ') alert="' + g.status.alert + '"' +
      (g.status.mode === 'restructure' ? '  *** ALLOWED ***' : '  refused'))

    await shot('restructure-01-hidden-' + VP.w + 'x' + VP.h)

    // Into DAD MODE.
    g.hero.health = g.hero.def.maxHealth * 0.3
    g.hero.hurt(g.hero.def.maxHealth * 4)
    await sleep(1400)
    note('in DAD MODE (lastStand=' + g.status.lastStand + '):')
    note('  ' + positions().join('  '))
    note('  ' + shownOf().join('  '))
    const after = positions().join('|')
    note('  slot positions identical: ' + (before === after ? 'YES' : 'NO *** THEY MOVED ***'))
    await shot('restructure-02-shown-' + VP.w + 'x' + VP.h)

    g.cooldowns.reset('restructure')
    g.armRestructure()
    await sleep(200)
    note('  armRestructure in DAD MODE: mode=' + g.status.mode)

    // Half-finished move, then DAD MODE ends.
    g.doRestructure(g.towers[0].x, g.towers[0].y)
    await sleep(150)
    note('  picked a tower up: restructuring=' + !!g.restructuring + ' mode=' + g.status.mode)
    g.hero.lastStandActive = false
    await sleep(400)
    note('  after DAD MODE ends: mode=' + g.status.mode +
      ' restructuring=' + !!g.restructuring +
      ' CANCEL visible=' + g.cancelVisible + ' msg="' + g.status.message + '"')
    note('  ' + shownOf().join('  '))
    await shot('restructure-03-ended-' + VP.w + 'x' + VP.h)

    /* --- THE COOLDOWN IS A STATUS, NOT AN ANNOUNCEMENT ------------------ */

    // It used to read "Grinder restructured. Back in 16s." and then sit there
    // for the whole sixteen seconds — the instruction row held by a number
    // that was wrong after the first one, with nothing else able to be said.
    g.hero.lastStandActive = true
    g.cooldowns.reset('restructure')
    await sleep(200)
    g.armRestructure()
    await sleep(150)
    const moving = g.towers[0]
    const fromSpot = moving.spot
    g.doRestructure(moving.x, moving.y)
    await sleep(150)
    const free = g.build.freeSpots()[0]
    g.doRestructure(free.x, free.y)
    await sleep(300)
    const msg = g.status.message
    const left = g.cooldowns.secondsLeft('restructure')
    note('after a completed move: spot ' + fromSpot + ' -> ' + moving.spot)
    note('  the instruction line says: "' + msg + '"')
    note('  the cooldown has ' + left.toFixed(1) + 's left')
    if (/\d+s/.test(msg)) note('   *** the instruction line is holding a countdown ***')
    if (msg.length > 40) note('   *** the confirmation is a paragraph, not a line ***')
    // AND IT TICKS SOMEWHERE. The Restructure slot stays on the glass while it
    // recharges, even once DAD MODE has ended, because that is the only live
    // readout there is.
    g.hero.lastStandActive = false
    await sleep(500)
    const rslot = hud.slots.find((sl) => sl.region.id === 'restructure')
    note('  with DAD MODE over and ' + g.cooldowns.secondsLeft('restructure').toFixed(1) +
      's left: slot icon visible = ' + rslot.icon.visible +
      '  timer reads "' + rslot.timer.text + '"')
    if (!rslot.icon.visible) note('   *** the only live readout vanished with DAD MODE ***')
    if (!rslot.timer.text) note('   *** the slot is shown but not counting ***')
    const t1 = rslot.timer.text
    await sleep(2200)
    note('  two seconds later the timer reads "' + rslot.timer.text + '"')
    if (rslot.timer.text === t1) note('   *** the countdown is frozen ***')
    await shot('restructure-04-cooldown-' + VP.w + 'x' + VP.h)
    return
  }

  if (scenario === 'leak') {
    // The reported crash: a stale ScaleManager listener belonging to a dead
    // Game scene, firing 30s after teardown when the app is backgrounded.
    //
    // Three runs to completion, back to Title each time, then a background and
    // foreground. Zero errors, and the listener count must not grow.
    const scaleListeners = () => {
      const ev = game.scale._events || game.scale._eventsCount !== undefined ? game.scale : null
      if (!ev) return -1
      const e = game.scale._events
      if (!e || !e.resize) return 0
      return Array.isArray(e.resize) ? e.resize.length : 1
    }
    const errors = []
    addEventListener('error', (e) => errors.push('ERROR ' + e.message))
    addEventListener('unhandledrejection', (e) => errors.push('REJECT ' + (e.reason?.message || e.reason)))

    note('resize listeners at title: ' + scaleListeners())
    const counts = []

    for (let run = 1; run <= 3; run++) {
      const gs = await startRun()
      gs.status.peanuts = 99999
      await sleep(400)
      const during = scaleListeners()
      // End the run the short way: the crash is about teardown, not about
      // playing thirteen waves three times.
      gs.endRun('lost')
      await sleep(600)
      // Back to Title, which stops Game and Hud.
      game.scene.stop('Game')
      game.scene.stop('Hud')
      game.scene.start('Title')
      await until(() => running('Title'), 10000)
      await sleep(400)
      const after = scaleListeners()
      counts.push({ run, during, after })
      note('run ' + run + ': listeners during=' + during + ' after teardown=' + after)
    }

    // The background/foreground that fires the crash. Phaser's refresh() emits
    // resize into every listener the ScaleManager still holds.
    note('backgrounding, then foregrounding, then forcing a refresh...')
    game.scale.refresh()
    await sleep(200)
    document.dispatchEvent(new Event('visibilitychange'))
    dispatchEvent(new Event('pagehide'))
    await sleep(400)
    dispatchEvent(new Event('pageshow'))
    await sleep(400)
    game.scale.refresh()
    await sleep(200)
    // And a real resize, which is what a rotation does.
    game.scale.resize(innerWidth, innerHeight)
    await sleep(400)
    game.scale.refresh()
    await sleep(600)

    note('after background/foreground: listeners=' + scaleListeners() +
      ' errors=' + errors.length)
    for (const e of errors.slice(0, 6)) note('  ' + e)
    const grew = counts.length > 1 && counts[counts.length - 1].after > counts[0].after
    note('listener count run over run: ' +
      counts.map((c) => c.after).join(' -> ') +
      (grew ? '  *** GROWING ***' : '  (stable)'))
    note('RESULT errors=' + errors.length + ' leaked=' + grew)
    await shot('leak-01-after')
    return
  }

  if (scenario === 'heroblock') {
    // How many enemies does one man actually hold, and what does that cost him?
    // Measured before anything is changed, because the data says 3 and the
    // tester says "all of them".
    g.status.peanuts = 0                       // no towers: the hero alone
    const hero = g.hero
    const def = hero.def
    note('data: maxHealth=' + def.maxHealth + ' blockCapacity=' + def.blockCapacity +
      ' blockRange=' + def.blockRange + ' lastStand at ' +
      Math.round(def.lastStand.healthThreshold * 100) + '% (' +
      Math.round(def.maxHealth * def.lastStand.healthThreshold) + 'hp)')

    // Park him on the lane so a whole wave walks into him.
    const spot = g.lane.pointAt(g.lane.totalLength * 0.55)
    hero.setRally(spot.x, spot.y)
    // Wave 1 is four Late Filers, which never reaches the cap and so proves
    // nothing about it. Wave 8 is 32 across three types and is what the tester
    // was describing.
    g.status.wave = Number(arg || 7)
    g.startWave()
    await until(() => g.enemies.length > 0, 30000)
    await until(() => Math.hypot(hero.x - spot.x, hero.y - spot.y) < 12, 20000)

    // Where he is standing, as a distance along the lane, so "walked past him"
    // is measured along the path rather than as straight-line distance.
    const heroDist = g.lane.totalLength * 0.55
    // The decisive question is not how many are flagged at once — the data
    // says 3 and the code slices to 3 — but whether the flag STAYS on the same
    // three. It is cleared and reassigned every frame, and the attack timer is
    // deliberately carried across a lost slot, so if the slot rotates then
    // every enemy in range keeps swinging at its own full rate and the
    // capacity limits nothing at all.
    const timeline = []
    const reachedHim = new Set()
    let attacks = 0
    const attackers = new Set()
    const heldEver = new Set()
    let churn = 0
    let prevHeld = ''
    const origHurt = hero.hurt.bind(hero)
    hero.hurt = (amt) => { attacks++; return origHurt(amt) }

    let samples = 0, heldSum = 0, inRangeSum = 0, maxHeld = 0
    let dmg = 0, lastHp = hero.health
    const t0 = performance.now()
    let lastStandAt = -1, deadAt = -1, passedBy = 0
    const seenPast = new Set()

    while (performance.now() - t0 < 26000) {
      await sleep(100)
      const inRange = g.enemies.filter((e) =>
        e.alive && Math.hypot(e.x - hero.x, e.y - hero.y) <= hero.blockRange)
      const held = g.enemies.filter((e) => e.blocker === hero)
      for (const e of held) heldEver.add(e)
      for (const e of inRange) attackers.add(e)
      const sig = held.map((e) => g.enemies.indexOf(e)).sort().join(',')
      if (sig !== prevHeld) churn++
      prevHeld = sig
      samples++; heldSum += held.length; inRangeSum += inRange.length
      if (held.length > maxHeld) maxHeld = held.length
      if (hero.health < lastHp) dmg += lastHp - hero.health
      lastHp = hero.health
      if (lastStandAt < 0 && hero.lastStandActive) lastStandAt = performance.now() - t0
      if (deadAt < 0 && !hero.alive) deadAt = performance.now() - t0
      // Anything that got past his block ring and kept walking.
      // Only while he is alive: once he is down everything walks past and the
      // number stops meaning anything.
      if (hero.alive) {
        for (const e of g.enemies) {
          if (e.alive && e.distance > heroDist + hero.blockRange && !seenPast.has(e)) {
            seenPast.add(e); passedBy++
          }
        }
        for (const e of g.enemies) {
          if (e.alive && e.distance > heroDist - hero.blockRange) reachedHim.add(e)
        }
      }
      if (samples % 10 === 0) {
        timeline.push(Math.round((performance.now() - t0) / 1000) + 's:' +
          ' in=' + inRange.length + ' held=' + held.length +
          ' past=' + passedBy + ' hp=' + Math.round(hero.health))
      }
      if (deadAt >= 0) break
    }
    const secs = (performance.now() - t0) / 1000
    note('over ' + secs.toFixed(1) + 's of real time (game runs at ' + GAME_SPEED + 'x):')
    note('  enemies inside his block ring, mean: ' + (inRangeSum / samples).toFixed(2))
    note('  enemies he actually held,     mean: ' + (heldSum / samples).toFixed(2) +
      '  peak: ' + maxHeld + '  (capacity ' + def.blockCapacity + ')')
    note('  damage taken: ' + Math.round(dmg) + ' over ' + secs.toFixed(1) + 's = ' +
      (dmg / secs).toFixed(1) + '/s real, ' + (dmg / (secs * GAME_SPEED)).toFixed(1) + '/s game')
    note('  health ' + Math.round(hero.health) + '/' + def.maxHealth)
    note('  Last Stand fired: ' + (lastStandAt >= 0 ? 'yes at ' + Math.round(lastStandAt) + 'ms' : 'NO'))
    note('  died: ' + (deadAt >= 0 ? 'yes at ' + Math.round(deadAt) + 'ms' : 'no'))
    if (lastStandAt >= 0 && deadAt >= 0) {
      note('  window between Last Stand and death: ' + Math.round(deadAt - lastStandAt) + 'ms');
    }
    note('  while he was alive: ' + reachedHim.size + ' enemies reached him, ' +
      passedBy + ' got past (' +
      (reachedHim.size ? Math.round(100 * passedBy / reachedHim.size) : 0) + '%)')
    timeline.forEach((l) => note('    ' + l))
    note('  distinct enemies that ever held a block slot: ' + heldEver.size +
      ' (capacity is ' + def.blockCapacity + ')')
    note('  the held set changed on ' + churn + ' of ' + samples + ' samples')
    note('  invulnerable window: ' + def.lastStand.invulnerableSeconds + 's')
    note('  attacks landed on him: ' + attacks + '; ceiling for ' + def.blockCapacity +
      ' concurrent Late Filers over ' + (secs * GAME_SPEED).toFixed(1) + ' game-seconds is ' +
      Math.round(def.blockCapacity * secs * GAME_SPEED / 1.0))
    await shot('heroblock-01');
    return
  }

  if (scenario === 'abilitybar') {
    // The reported freeze: once the Server Nuke drops, no ability can be
    // tapped, while tower panels go on opening normally.
    const hud = game.scene.getScene('Hud')
    const dump = (label) => {
      const rows = hud.slots.map((s) => {
        const r = s.region
        const b = s.hit.getBounds()
        const ib = s.icon.getBounds()
        return '    ' + r.id.padEnd(14) +
          ' region x' + Math.round(r.x) + '-' + Math.round(r.x + r.pitch) +
          ' centre ' + Math.round(r.cx) + ',' + Math.round(r.cy) +
          ' | hit ' + Math.round(b.x) + '-' + Math.round(b.right) +
          ' | icon centre ' + Math.round(ib.centerX) + ',' + Math.round(ib.centerY) +
          ' | dx=' + Math.round(Math.abs(ib.centerX - b.centerX))
      })
      note(label + ' (' + hud.slots.length + ' slots)')
      rows.forEach(note)
      // Gaps between adjacent hit rectangles: one seam is by design, two is
      // the bar split into groups.
      const xs = hud.slots.map((s) => s.hit.getBounds()).sort((a, b) => a.x - b.x)
      const gaps = []
      for (let i = 1; i < xs.length; i++) {
        const g2 = Math.round(xs[i].x - xs[i - 1].right)
        if (g2 > 2) gaps.push(g2)
      }
      note('    seams: ' + (gaps.length ? gaps.join('px, ') + 'px' : 'none'))
    }

    // Does a tap on a slot actually reach the game? Counted rather than
    // assumed: the freeze was a hit rectangle that did not survive a frame.
    const tapReaches = async (i) => {
      const slot = hud.slots[i]
      if (!slot) return 'no slot ' + i
      let fired = 0
      const orig = g.armAbility.bind(g)
      const origH = g.castHaymaker.bind(g)
      const origR = g.armRestructure.bind(g)
      g.armAbility = (id) => { fired++; return orig(id) }
      g.castHaymaker = () => { fired++; return origH() }
      g.armRestructure = () => { fired++; return origR() }
      const b = slot.hit.getBounds()
      await click(b.centerX, b.centerY)
      await sleep(160)
      // Disarm, so the next probe tap cannot be read as casting this one.
      g.status.pendingAbility = null
      g.status.mode = 'normal'
      g.armAbility = orig; g.castHaymaker = origH; g.armRestructure = origR
      return fired > 0 ? 'REACHED' : 'DEAD'
    }

    // Count rebuilds. Every frame is the failure mode.
    let builds = 0
    const origBuild = hud.buildSlots.bind(hud)
    hud.buildSlots = () => { builds++; return origBuild() }

    g.startWave()
    await sleep(1500)
    dump('four slots, before the drop')
    for (let i = 0; i < hud.slots.length; i++) {
      note('    tap ' + hud.slots[i].region.id + ': ' + (await tapReaches(i)))
    }
    builds = 0
    await sleep(1000)
    note('rebuilds over 1s with a stable hand: ' + builds)
    await shot('abilitybar-01-four')

    // Now the drop.
    g.status.rareAbility = 'serverNuke'
    g.cooldowns.reset('serverNuke')
    await sleep(600)
    dump('five slots, after the Server Nuke drops')
    await shot('abilitybar-02-five')
    for (let i = 0; i < hud.slots.length; i++) {
      note('    tap ' + hud.slots[i].region.id + ': ' + (await tapReaches(i)))
    }
    builds = 0
    await sleep(1000)
    note('rebuilds over 1s after the drop: ' + builds + ' (every frame is the bug)')
    dump('after the taps')
    g.status.mode = 'normal'
    g.status.pendingAbility = ''
    await sleep(400)
    await shot('abilitybar-03-idle')
    return
  }

  if (scenario === 'nuke') {
    // Force the drop, then watch the wind-up and the payload.
    for (const i of [3, 1]) await build(i, 0)
    await key('Space')
    await sleep(4000)
    note('before drop: enemies=' + g.enemies.length)
    g.status.rareAbility = 'serverNuke'
    g.cooldowns.reset('serverNuke')
    g.announceRareDrop('Server Nuke')
    await sleep(300); await shot('n-01-drop-banner')
    await sleep(1800); await shot('n-02-hud-slot')
    const before = g.enemies.filter((e) => e.alive).length
    await key('KeyF')
    // The HUD binds F to the rare slot; if the key is not wired, click it.
    if (!g.casting) {
      const hud = game.scene.getScene('Hud')
      const slot = hud.slots[hud.slots.length - 1]
      if (slot) await click(slot.hit.x, slot.hit.y)
    }
    await sleep(700); await shot('n-03-windup')
    await sleep(1300); await shot('n-04-windup-late')
    await sleep(1400); await shot('n-05-after')
    const after = g.enemies.filter((e) => e.alive).length
    note(`nuke: ${before} alive -> ${after} alive; casting=${g.casting} rare=${g.status.rareAbility}`)
    // And it must be gone for good.
    g.cooldowns.reset('serverNuke')
    await key('KeyF')
    await sleep(600)
    note('second use blocked: ' + (!g.casting))
    return
  }

  if (scenario === 'ticket') {
    g.status.peanuts = 100
    // Force the ticket into the drafted hand so Q casts it.
    g.status.abilities = ['scratchTicket', 'glacier']
    g.cooldowns.register('scratchTicket', 1)
    await key('KeyQ')
    await sleep(400); await shot('t-01-card')
    note('card up: ' + !!g.ticket + ' peanuts=' + g.status.peanuts)
    // Scratch it: drag across the middle.
    for (let i = 0; i < 22; i++) {
      const x = 500 + i * 13, y = 330 + (i % 5) * 14
      if (i === 0) mouse('mousedown', x, y)
      mouse('mousemove', x, y)
      await sleep(28)
    }
    await shot('t-02-scratched')
    mouse('mouseup', 500 + 21 * 13, 330)
    await sleep(700); await shot('t-03-paid')
    note('after scratch: peanuts=' + g.status.peanuts + ' msg=' + g.status.message)
    // And the hands-off path.
    g.cooldowns.register('scratchTicket', 1)
    await sleep(1200)
    await key('KeyQ')
    await sleep(400); await shot('t-04-untouched')
    const before = g.status.peanuts
    await sleep(4200)
    note('auto-reveal paid: ' + (g.status.peanuts > before) + ' (' + before + ' -> ' + g.status.peanuts + ')')
    await shot('t-05-auto')
    return
  }

  if (scenario === 'combat') {
    for (let i = 0; i < 4; i++) await build(i, i % 2)
    await shot('c-01-towers')
    await key('Space')
    await sleep(3000); await shot('c-02-wave-early')
    await sleep(4000); await shot('c-03-wave-mid')
    note('mid: enemies=' + g.enemies.length + ' peanuts=' + g.status.peanuts + ' lives=' + g.status.lives)
    await until(() => g.status.phase !== 'wave', 90000)
    await shot('c-04-wave-cleared')
    note('cleared: phase=' + g.status.phase + ' peanuts=' + g.status.peanuts + ' msg=' + g.status.message)
    return
  }

  if (scenario === 'poor') {
    // Insufficient gold: does the game say why nothing happened?
    g.status.gold = 5
    await click(...toScreen(SPOTS[1][0], SPOTS[1][1]))
    const hit = g.menu.hitAreas?.[0]
    if (hit) { const b = hit.getBounds(); await click(b.centerX, b.centerY) }
    note('poor: towers=' + g.towers.length + ' msg="' + g.status.message + '" menuOpen=' + g.menu.isOpen)
    await shot('poor')
    return
  }

  if (scenario === 'lost') {
    await key('Space')
    await until(() => g.status.phase === 'lost', 240000)
    await sleep(900); await shot('lost')
    note('lost: msg=' + g.status.message)
    note('run: waves=' + g.status.wave + ' kills=' + g.status.kills +
      ' earned=' + g.status.peanutsEarned + ' lives=' + g.status.lives)
    return
  }

  // The results panel on a win, without playing thirteen waves for it: the
  // run is driven to the end state directly and the panel it opens is real.
  if (scenario === 'results') {
    // A few kills and some income first, so the rows are not all zero.
    const cam = g.cameras.main
    // Only pads inside the camera's view can be tapped at gameplay zoom.
    const inView = SPOTS.map((p, i) => [i, p])
      .filter(([, p]) => cam.worldView.contains(p[0], p[1])).map(([i]) => i)
    note('pads in view: ' + JSON.stringify(inView) + ' at zoom ' + cam.zoom.toFixed(2))
    await shot('results-00-hud-normal')
    await build(inView[0], 0)
    note('towers ' + g.towers.length + ' peanuts ' + g.status.peanuts)
    await key('Space')
    await until(() => g.status.kills > 6, 120000)
    note('after play: kills=' + g.status.kills + ' wave=' + g.status.wave +
      ' lives=' + g.status.lives + ' earned=' + g.status.peanutsEarned)
    for (const [name, phase] of [['results-lost', 'lost'], ['results-won', 'won']]) {
      g.status.phase = 'ready'
      g.dialog?.close()
      if (phase === 'won') { g.status.wave = g.status.waveCount; g.status.lives = 17 }
      else { g.status.wave = 6; g.status.lives = 0 }
      g.endRun(phase)
      await sleep(700)
      await shot(name)
      note(name + ': kills=' + g.status.kills + ' earned=' + g.status.peanutsEarned +
        ' modalOpen=' + g.modalOpen +
        ' hudAlpha=' + scene('Hud').cameras.main.alpha +
        ' hudRunning=' + running('Hud'))
    }
    return
  }

  // Does a boss that walks off the end cost lives, and does the wave still
  // count as cleared? Driven directly rather than by playing thirteen waves.
  if (scenario === 'bossleak') {
    g.status.wave = g.status.waveCount - 1
    g.startWave()
    const has = (t) => g.enemies.find((e) => e.def.tier === t)
    await until(() => has('boss'), 60000)
    const boss = has('boss')
    note('boss spawned: ' + (boss ? boss.def.name : 'NONE'))
    if (!boss) return
    // Isolate him: nothing else on the field, nothing left to spawn.
    g.spawner.groups = []
    for (const e of g.enemies) if (e !== boss) e.die()
    await sleep(600)
    note('field: ' + g.enemies.length + ' enemies, spawner.done=' + g.spawner.done)
    const before = { lives: g.status.lives, wave: g.status.wave, phase: g.status.phase }
    note('before: ' + JSON.stringify(before) + ' bossLivesCost=' + boss.def.livesCost)
    // Walk him to the exit.
    boss.distance = g.lane.totalLength - 12
    await until(() => g.status.phase !== 'wave' || g.enemies.length === 0, 20000)
    await sleep(900)
    note('after:  ' + JSON.stringify({ lives: g.status.lives, wave: g.status.wave, phase: g.status.phase }))
    note('VERDICT lives lost=' + (before.lives - g.status.lives) +
      ' waveAdvanced=' + (g.status.wave > before.wave) + ' phase=' + g.status.phase)
    await shot('bossleak')
    return
  }

  // The three moments the layout has to survive, at whatever viewport the
  // window was opened at. Every visible object is dumped with its bounds so
  // overlap is measured rather than eyeballed.
  if (scenario === 'phone') {
    const cam = g.cameras.main
    const inView = SPOTS.map((p, i) => [i, p])
      .filter(([, p]) => cam.worldView.contains(p[0], p[1])).map(([i]) => i)

    // 1. Tower placement: the menu open over a pad.
    const [px, py] = toScreen(SPOTS[inView[0]][0], SPOTS[inView[0]][1])
    await click(px, py)
    await sleep(400)
    await shot('phone-1-placing')
    note('placing: menuOpen=' + !!g.menu?.isOpen)
    dumpOverlaps('placing')

    // Hold a finger on an option: the ghost belongs on the pad while the
    // player is deciding, which on a touch device is only ever during a press.
    const hit = g.menu.hitAreas?.[0]
    if (hit) {
      const b = hit.getBounds()
      await move(b.centerX, b.centerY)
      mouse('mousedown', b.centerX, b.centerY)
      await sleep(320)
      note('ghost while pressed: ' + (g.ghost ? 'yes alpha=' + g.ghost.alpha +
        ' at ' + Math.round(g.ghost.x) + ',' + Math.round(g.ghost.y) : 'NONE'))
      await shot('phone-1b-ghost')
      mouse('mouseup', b.centerX, b.centerY)
      await sleep(260)
      note('after release: towers=' + g.towers.length + ' ghost=' + (g.ghost ? 'still up' : 'cleared'))
    }
    await sleep(300)
    g.startWave()
    await until(() => g.enemies.length > 2, 40000)
    await sleep(400)
    await shot('phone-2-wave')
    // What the art is actually rendering at, on the glass.
    const camZ = g.cameras.main.zoom
    const sizes = []
    for (const t of g.towers) sizes.push('tower ' + Math.round(t.turret.displayHeight * camZ))
    sizes.push('hero ' + Math.round(g.hero.list[1].displayHeight * camZ))
    for (const e of g.enemies.slice(0, 1)) sizes.push('enemy ' + Math.round(e.art.displayHeight * camZ))
    note('zoom ' + camZ.toFixed(3) + ' on screen: ' + sizes.join(', '))
    note('view shows ' + Math.round(g.cameras.main.worldView.width) + 'x' +
      Math.round(g.cameras.main.worldView.height) + ' of 1280x720')
    note('wave: enemies=' + g.enemies.length)
    dumpOverlaps('wave')
    await edgeCheck('wave')

    // The interface must not zoom with the board. Same HUD rectangles at the
    // default zoom and at the ceiling; only the world changes size.
    const before = JSON.stringify(rectsFor('Hud').map((r) =>
      [r.name, Math.round(r.l), Math.round(r.t), Math.round(r.r), Math.round(r.b)]))
    const zBefore = g.cameras.main.zoom
    const towerBefore = g.towers[0] ? Math.round(g.towers[0].turret.displayHeight * zBefore) : 0
    for (let i = 0; i < 30; i++) {
      game.canvas.dispatchEvent(new WheelEvent('wheel', { deltaY: -120, clientX: 422, clientY: 195, bubbles: true }))
    }
    await sleep(1400)
    const zAfter = g.cameras.main.zoom
    const after = JSON.stringify(rectsFor('Hud').map((r) =>
      [r.name, Math.round(r.l), Math.round(r.t), Math.round(r.r), Math.round(r.b)]))
    const towerAfter = g.towers[0] ? Math.round(g.towers[0].turret.displayHeight * zAfter) : 0
    note('zoom ' + zBefore.toFixed(2) + ' -> ' + zAfter.toFixed(2) +
      ': tower ' + towerBefore + ' -> ' + towerAfter + 'px, HUD ' +
      (before === after ? 'UNCHANGED' : 'MOVED/RESIZED'))
    await shot('phone-2b-zoomed')
    // Back to the default for the boss shot.
    for (let i = 0; i < 30; i++) {
      game.canvas.dispatchEvent(new WheelEvent('wheel', { deltaY: 120, clientX: 422, clientY: 195, bubbles: true }))
    }
    await sleep(1200)

    // 3. The boss. Clear the field first — killing the last enemy while the
    // wave is live ends it and advances the index out from under us.
    g.spawner.groups = []
    for (const e of g.enemies) e.die()
    await until(() => g.status.phase !== 'wave', 20000)
    await sleep(300)
    g.status.wave = g.status.waveCount - 1
    g.status.phase = 'ready'
    g.startWave()
    await until(() => g.enemies.some((e) => e.def.tier === 'boss'), 60000)
    await sleep(1800)
    await shot('phone-3-boss')
    note('boss: name=' + g.status.bossName + ' enemies=' + g.enemies.length)
    dumpOverlaps('boss')
    return
  }

  // Pan and pinch with the world camera inset by the top band: its viewport no
  // longer starts at the top of the screen, so anything anchored on a raw
  // pointer coordinate is off by a band's height.
  if (scenario === 'gestures') {
    const cam = g.cameras.main
    note('viewport ' + cam.x + ',' + cam.y + ' ' + cam.width + 'x' + cam.height)

    // A tap in the middle of the board has to land where it looks.
    const [sx, sy] = toScreen(SPOTS[2][0], SPOTS[2][1])
    const w = cam.getWorldPoint(sx, sy)
    note('round trip: pad ' + SPOTS[2] + ' -> screen ' + [Math.round(sx), Math.round(sy)] +
      ' -> world ' + [Math.round(w.x), Math.round(w.y)])

    // Pan: drag and check the camera actually moved that far.
    const before = { x: Math.round(cam.scrollX), y: Math.round(cam.scrollY) }
    mouse('mousedown', 400, 200)
    for (let i = 1; i <= 8; i++) { mouse('mousemove', 400 - i * 14, 200 - i * 6); await sleep(24) }
    mouse('mouseup', 288, 152)
    await sleep(700)
    note('pan ' + JSON.stringify(before) + ' -> ' +
      JSON.stringify({ x: Math.round(cam.scrollX), y: Math.round(cam.scrollY) }))

    // Wheel zoom anchored on a point: the world under the cursor should stay
    // under the cursor. That is the calculation the band offset breaks.
    const at = { x: 500, y: 200 }
    const wBefore = cam.getWorldPoint(at.x, at.y)
    game.canvas.dispatchEvent(new WheelEvent('wheel', { deltaY: -120, clientX: at.x, clientY: at.y, bubbles: true }))
    await sleep(900)
    const wAfter = cam.getWorldPoint(at.x, at.y)
    const drift = Math.round(Math.hypot(wAfter.x - wBefore.x, wAfter.y - wBefore.y))
    note('zoom anchor drift ' + drift + 'px (zoom ' + cam.zoom.toFixed(3) + ')')

    // The floor and the ceiling, now that both are absolute rather than
    // multiples of the viewport.
    const D = (await import('./js/data/display.json', { with: { type: 'json' } })).default
    const cover = Math.max(844 / D.width, 390 / D.height)
    for (let i = 0; i < 24; i++) {
      game.canvas.dispatchEvent(new WheelEvent('wheel', { deltaY: 120, clientX: 422, clientY: 195, bubbles: true }))
    }
    await sleep(1200)
    note('zoom out floor ' + cam.zoom.toFixed(3) + ' (cover ' + cover.toFixed(3) + ')')
    for (let i = 0; i < 40; i++) {
      game.canvas.dispatchEvent(new WheelEvent('wheel', { deltaY: -120, clientX: 422, clientY: 195, bubbles: true }))
    }
    await sleep(1400)
    note('zoom in ceiling ' + cam.zoom.toFixed(3) + ' (max ' + D.camera.maxZoom + ')')

    // Edge clamp: shove the camera at a corner and check it stops inside the
    // map rather than overscrolling and springing back.
    for (let n = 0; n < 3; n++) {
      mouse('mousedown', 700, 330)
      for (let i = 1; i <= 10; i++) { mouse('mousemove', 700 - i * 40, 330 - i * 22); await sleep(16) }
      mouse('mouseup', 300, 110)
      await sleep(500)
    }
    await sleep(1400)
    const v = cam.worldView
    note('corner clamp: view ' + [Math.round(v.x), Math.round(v.y), Math.round(v.right), Math.round(v.bottom)].join(',') +
      ' world 0,0,' + D.width + ',' + D.height +
      ' inside=' + (v.right <= D.width + 1 && v.bottom <= D.height + 1))

    // Momentum: a flick keeps gliding and then stops on its own.
    game.canvas.dispatchEvent(new WheelEvent('wheel', { deltaY: 120, clientX: 422, clientY: 195, bubbles: true }))
    await sleep(600)
    mouse('mousedown', 300, 200)
    for (let i = 1; i <= 6; i++) { mouse('mousemove', 300 + i * 30, 200); await sleep(12) }
    mouse('mouseup', 480, 200)
    const glideFrom = Math.round(cam.scrollX)
    await sleep(140)
    const mid = Math.round(cam.scrollX)
    await sleep(1600)
    const rest = Math.round(cam.scrollX)
    note('momentum: ' + glideFrom + ' -> ' + mid + ' -> ' + rest +
      ' (glided=' + (Math.abs(rest - mid) > 2) + ' settled=' + (Math.abs(rest - mid) < 400) + ')')
    await shot('gestures')
    return
  }

  if (scenario === 'typegame') {
    // The pause dialog and the results panel, both of which are titles.
    scene('Hud').openPause()
    await sleep(700)
    await shot('type-5-pause')
    scene('Hud').panel?.close()
    scene('Hud').resumeGame()
    await until(() => !scene('Hud').panel, 5000)
    await sleep(500)
    g.status.wave = 6
    g.status.lives = 0
    g.endRun('lost')
    await sleep(800)
    await shot('type-6-results')
    return
  }

  if (scenario === 'skilled') {
    // A competent player: towers spread along the walk, the hero posted on the
    // lane, abilities spent whenever they are up.
    const order = [3, 1, 5, 0, 2, 4, 6]
    let guard = 0
    let last = -1
    const shots = new Set()
    while (g.status.phase !== 'won' && g.status.phase !== 'lost' && guard++ < 2500) {
      if (g.status.phase === 'ready') {
        for (const i of order) {
          if (!g.build.isFree(i)) continue
          const before = g.towers.length
          await build(i, 0)
          if (g.towers.length === before) { await click(20, 700); break }
        }
        if (g.status.wave !== last) {
          last = g.status.wave
          note(`wave ${g.status.wave + 1}: peanuts=${g.status.peanuts} lives=${g.status.lives} towers=${g.towers.length}`)
          if ([0, 5, 11].includes(g.status.wave) && !shots.has(g.status.wave)) {
            shots.add(g.status.wave)
            await shot('s-wave' + (g.status.wave + 1))
          }
        }
        // Post the hero on the lane, halfway along.
        const mid = g.lane.pointAt(g.lane.totalLength * 0.55)
        if (Math.hypot(g.hero.rally.x - mid.x, g.hero.rally.y - mid.y) > 30 && !g.hero.down) {
          await click(g.hero.x, g.hero.y)
          await click(mid.x, mid.y)
        }
        await key('Space')
      } else {
        // Spend abilities on whatever is furthest along.
        const live = g.enemies.filter((e) => e.alive)
        if (live.length >= 3) {
          const t = live.reduce((a, b) => (a.distance > b.distance ? a : b))
          for (const slot of ['KeyQ', 'KeyW']) {
            if (g.status.mode === 'targeting') break
            await key(slot)
            if (g.status.mode === 'targeting') { await click(t.x, t.y) }
          }
          await key('KeyE')
        }
      }
      await sleep(220)
    }
    note(`RESULT: ${g.status.phase} at wave ${g.status.wave}/12, lives ${g.status.lives}, peanuts ${g.status.peanuts}, towers ${g.towers.length}`)
    await sleep(700)
    await shot('s-end')
    return
  }

  if (scenario === 'playrun') {
    // A full run played by something that behaves like a competent player:
    // builds on every pad it can afford, upgrades what it has, spends its
    // abilities whenever they come up, and keeps the hero on the lane.
    //
    // The draft is the variable. `arg` names the ability under test, so the
    // same run can be played with Deferral, with the Scratch Ticket, or with
    // a plain damage draft, and the per-wave numbers compared.
    // Comma, not '+': a '+' in a query string decodes as a space.
    const want = (arg || 'molotov').split(',')
    const abilities = want.filter((w) => w !== 'deferral')
    const specWanted = want.includes('deferral') ? 'deferral' : null
    g.status.abilities = abilities.length ? abilities : ['molotov']
    for (const id of g.status.abilities) {
      g.cooldowns.register(id, g.abilityDef(id).cooldown)
      g.cooldowns.reset(id)
    }
    if (specWanted) {
      g.status.unlockedTowers = ['extension', 'withholding']
      g.refreshMenuOptions()
    }
    note('draft: abilities=' + g.status.abilities.join(',') +
      ' tier3=' + (specWanted || 'default') +
      ' towers=' + g.status.unlockedTowers.join(','))

    const perWave = []
    let lastLives = g.status.lives
    let lastEarned = g.status.peanutsEarned
    let guard = 0
    let everAtRisk = false

    const spend = async () => {
      // Build first, then upgrade. A board with more towers beats a board with
      // better ones at this scale, which is what the economy rules intend.
      for (let i = 0; i < SPOTS.length; i++) {
        if (!g.build.isFree(i)) continue
        const cheapest = Math.min(...g.status.unlockedTowers.map((id) => g.towerDefs[id].cost))
        if (g.status.peanuts < cheapest) break
        if (!(await build(i, 0))) break
      }
      for (const t of g.towers) {
        if (t.upgrading || t.isMaxed) continue
        const step = t.atSpecChoice
          ? (t.def.specializations.find((x) => x.id === specWanted) ?? t.def.specializations[0])
          : t.def.tiers[t.tier - 1]
        if (!step || g.status.peanuts < step.cost) continue
        g.status.peanuts -= step.cost
        t.beginUpgrade(t.atSpecChoice ? step.id : null)
      }
    }

    const useAbilities = () => {
      if (g.enemies.length === 0) return
      // Aim at whoever is furthest along, which is the one about to leak.
      const lead = g.enemies.reduce((a, b) => (a.distance > b.distance ? a : b))
      for (const id of g.status.abilities) {
        if (!g.cooldowns.ready(id)) continue
        const def = g.abilityDef(id)
        if (def.targeting === 'instant') g.fireAbility(id, lead.x, lead.y)
        else g.fireAbility(id, lead.x, lead.y)
      }
    }

    while (g.status.phase !== 'won' && g.status.phase !== 'lost' && guard++ < 4000) {
      if (g.status.phase === 'ready') {
        const w = g.status.wave
        if (w > 0) {
          const lost = lastLives - g.status.lives
          perWave.push({
            wave: w,
            lost,
            earned: g.status.peanutsEarned - lastEarned,
            purse: g.status.peanuts,
            towers: g.towers.length,
            lives: g.status.lives,
          })
          if (lost > 0) everAtRisk = true
          lastLives = g.status.lives
          lastEarned = g.status.peanutsEarned
        }
        await spend()
        await key('Space')
        await sleep(200)
        continue
      }
      useAbilities()
      // Keep him on the lane, ahead of the leader.
      if (g.enemies.length > 0 && !g.hero.down) {
        const lead = g.enemies.reduce((a, b) => (a.distance > b.distance ? a : b))
        const p = g.lane.pointAt(Math.min(lead.distance + 90, g.lane.totalLength - 40))
        if (Math.hypot(g.hero.rally.x - p.x, g.hero.rally.y - p.y) > 60) g.hero.setRally(p.x, p.y)
      }
      if (g.status.lives < 20) everAtRisk = true
      await sleep(300)
    }

    // The last wave never reaches a 'ready' phase, so it is recorded here.
    perWave.push({
      wave: g.status.wave, lost: lastLives - g.status.lives,
      earned: g.status.peanutsEarned - lastEarned, purse: g.status.peanuts,
      towers: g.towers.length, lives: g.status.lives,
    })

    note('=== ' + (arg || 'molotov') + ' ===')
    note('wave  lost  earned  purse  towers  lives')
    for (const r of perWave) {
      note(String(r.wave).padStart(4) + String(r.lost).padStart(6) +
        String(r.earned).padStart(8) + String(r.purse).padStart(7) +
        String(r.towers).padStart(8) + String(r.lives).padStart(7))
    }
    note('RESULT phase=' + g.status.phase + ' waves=' + g.status.wave +
      '/' + g.status.waveCount + ' lives=' + g.status.lives + '/20' +
      ' earned=' + g.status.peanutsEarned + ' kills=' + g.status.kills +
      ' everAtRisk=' + everAtRisk)
    await shot('playrun-' + (arg || 'molotov'))
    return
  }

  if (scenario === 'full') {
    let guard = 0
    let shotWave4 = false
    while (g.status.phase !== 'won' && g.status.phase !== 'lost' && guard++ < 1400) {
      if (g.status.phase === 'ready') {
        for (let i = 0; i < SPOTS.length && g.towers.length < 4; i++) {
          if (!g.build.isFree(i)) continue
          if (!(await build(i, 0))) break
        }
        if (g.status.wave === 3 && !shotWave4) { await shot('f-01-wave4'); shotWave4 = true }
        await key('Space')
      }
      await sleep(400)
    }
    note('final: phase=' + g.status.phase + ' wave=' + g.status.wave + ' lives=' + g.status.lives + ' towers=' + g.towers.length)
    await sleep(600)
    await shot('f-99-end')
    return
  }
}

try { await run() } catch (e) { note('DIRECTOR ERROR: ' + e.message + ' | ' + String(e.stack).slice(0, 400)) }

/**
 * THE DEVICE-RATIO FINGERPRINT, emitted after every scenario.
 *
 * The harness ran at devicePixelRatio 1 by default and that blind spot hid two
 * separate bugs — the modal scrim covering a quarter of the screen, and the
 * build ring landing 401px from its pad. Both were the same confusion: canvas
 * pixels compared against CSS pixels, identical numbers at dpr 1 and three
 * times apart at 3.
 *
 * Remembering to run a dpr-3 pass is not a fix, so this is not something to
 * remember. Every run ends by printing the mapping from world and layout
 * coordinates into screen space, in CSS pixels, and `both.sh` runs the
 * scenario at 1 and at 3 and FAILS if the two disagree. The property is
 * simply: screen space must not depend on the device ratio.
 *
 * Deliberately state-independent. The camera is parked on a fixed point at a
 * fixed zoom first, because the game itself is not deterministic across two
 * runs at different rasterising speeds — but this mapping is a function of the
 * viewport and the ratio alone, which is exactly what is being compared.
 */
function fingerprint() {
  const out = []
  const fp = (k, v) => out.push('FP ' + k + ' = ' + v)
  const r2 = (n) => (Math.round(n * 100) / 100).toFixed(2)
  // A LIVE Game scene, not merely a registered one.
  //
  // `scene('Game')` returns the scene object even after its cameras have been
  // torn down, and the fingerprint then threw on `cam.setZoom` — which both
  // ratios reported identically, but the `viewW/viewH` line BEFORE the throw
  // came from the raw window and differed. So `both.sh` reported that screen
  // space depended on the device ratio when what actually happened was that
  // the run ended without a game camera. `leak` is a scenario that ends on the
  // results dialog; the disagreement was the emitter, not the game.
  const raw = scene('Game')
  const gs = raw && raw.cameras && raw.cameras.main ? raw : null
  fp('viewport', VP.w + 'x' + VP.h)
  fp('game scene', gs ? 'live' : (raw ? 'torn down' : 'absent'))
  try {
    const R = RES
    // Only ask a live scene for its viewport. Off a torn-down one this
    // reported the window instead, which is where the false diff came from.
    fp('viewW/viewH', gs ? r2(R.viewW(gs)) + ',' + r2(R.viewH(gs)) : 'no live game scene')
    if (gs) {
      // Parked, so the two runs compare the same camera rather than whatever
      // each happened to be looking at when it finished.
      const cam = gs.cameras.main
      gs.rig && gs.rig.setEnabled(false)
      cam.setZoom(1.72 * R.deviceScale())
      cam.centerOn(640, 360)
      cam.preRender()
      for (const [wx, wy] of [[0, 0], [320, 180], [640, 360], [960, 540], [1280, 720]]) {
        const p = R.worldToScreen(gs, wx, wy)
        fp('world ' + wx + ',' + wy, r2(p.x) + ',' + r2(p.y))
      }
      const ui = gs.cameras.cameras.find((c) => c.name === 'ui')
      if (ui) {
        fp('uiCam view', [ui.worldView.x, ui.worldView.y, ui.worldView.width, ui.worldView.height]
          .map(r2).join(','))
      }
    }
    const hud = scene('Hud')
    if (hud && hud.layout) {
      for (const k of ['counters', 'startButton', 'messageRow', 'heroRow', 'abilities',
        'settings', 'cancel']) {
        const r = hud.layout[k]
        if (r) fp('hud ' + k, [r.x, r.y, r.width, r.height].map(r2).join(','))
      }
    }
  } catch (e) {
    fp('ERROR', e.message)
  }
  for (const line of out) note(line)
}
fingerprint()

const gs = scene('Game')
if (bootBroken) log.unshift('*** BOOT FAILED — see below ***')
await post('/done', JSON.stringify({
  scenario, bootFailed: bootBroken, log,
  status: gs?.status ?? null,
  towers: gs?.towers?.length, enemies: gs?.enemies?.length, spots: SPOTS.length,
  heroAt: gs?.hero ? [Math.round(gs.hero.x), Math.round(gs.hero.y)] : null,
  scenes: dumpScenes(),
}, null, 1))
</script></body></html>
