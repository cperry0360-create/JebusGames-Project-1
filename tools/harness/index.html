<!doctype html><html><head><meta charset="utf-8">
<style>
 html,body{margin:0;background:#111;}
 @font-face{font-family:KenneyFuture;src:url(assets/fonts/KenneyFuture.ttf);}
 @font-face{font-family:KenneyFutureNarrow;src:url(assets/fonts/KenneyFutureNarrow.ttf);}
 @font-face{font-family:KenneyMiniSquare;src:url(assets/fonts/KenneyMiniSquare.ttf);}
 html,body{width:100%;height:100%;overflow:hidden;}
 #game{width:100vw;height:100vh;}
 #game canvas{display:block;}
</style></head><body>
<div id="game"></div>
<script src="phaser.min.js"></script>
<script type="module">
// Test director. Drives the real game with real input events, in real time,
// and uploads what it sees. No game logic lives here.
const post = (path, body) => fetch(path, { method: 'POST', body }).catch(() => {})
const log = []
const note = (m) => { log.push(m); post('/log', m) }
addEventListener('error', (e) => note('PAGE ERROR ' + e.message + ' @' + e.lineno))
addEventListener('unhandledrejection', (e) => note('REJECT ' + (e.reason?.message || e.reason)))

import { gameConfig } from './js/config.js'
import { setRunState } from './js/systems/RunState.js'
const MAP = (await import('./js/data/map.json', { with: { type: 'json' } })).default
const SPOTS = MAP.buildSpots

const q = new URLSearchParams(location.search)
const GAME_SPEED = 1.4
const scenario = q.get('s') || 'game'
/** Optional scenario argument, e.g. ?s=heroblock&arg=7 */
const arg = q.get('arg')
// The window is sized by --window-size, and the canvas follows it through
// Phaser's RESIZE mode exactly as it does on a real phone. Reading it back
// here so the log says what was actually tested.
const vpArg = q.get('vp')
if (vpArg) {
  const [vw, vh] = vpArg.split('x').map(Number)
  const box = document.getElementById('game')
  box.style.width = vw + 'px'
  box.style.height = vh + 'px'
}
const VP = { w: document.getElementById('game').clientWidth, h: document.getElementById('game').clientHeight }
await document.fonts.ready.catch(() => {})

// A fixed run, so every scenario starts from the same hand.
setRunState({
  heroId: 'cory', abilities: ['molotov', 'glacier'],
  openingTowers: ['withholding', 'writeoff'],
  reserveTowers: ['escalation', 'rounding', 'extension', 'shelter'], seed: 7,
})

// The shipping scale config, not an override: on a phone the whole point is
// that the canvas *is* the viewport, and pinning it to 1280x720 hides every
// layout collision this harness exists to find.
// The boot wiring main.ts does, so the harness drives the shipping game and
// not a version of it with the lifecycle and audio guards missing.
const { guardAudioPromises } = await import('./js/systems/Audio.js')
guardAudioPromises()
const game = new Phaser.Game(gameConfig)
window.game = game
const { installLifecycle } = await import('./js/systems/Lifecycle.js')
window.lifecycle = installLifecycle(game)
note('visibilityState at boot: ' + document.visibilityState)
const sleep = (ms) => new Promise((r) => setTimeout(r, ms))
const scene = (k) => game.scene.getScene(k)
const running = (k) => game.scene.isActive(k)
async function until(fn, ms = 10000) {
  for (let w = 0; w < ms; w += 40) { if (fn()) return true; await sleep(40) }
  return fn()
}

// Real DOM input, so the scene's own hit-testing and precedence are exercised.
// Phaser 3 listens for mouse events, not pointer events.
function mouse(type, x, y, btn = 0) {
  const c = game.canvas, r = c.getBoundingClientRect()
  c.dispatchEvent(new MouseEvent(type, {
    clientX: r.left + x, clientY: r.top + y, button: btn,
    buttons: type === 'mouseup' ? 0 : (btn === 2 ? 2 : 1),
    view: window, bubbles: true, cancelable: true,
  }))
}
async function move(x, y) { mouse('mousemove', x, y); await sleep(100) }
async function click(x, y, btn = 0) {
  await move(x, y)
  mouse('mousedown', x, y, btn); await sleep(90)
  mouse('mouseup', x, y, btn); await sleep(160)
}
const KEYS = {
  Space: { key: ' ', code: 'Space', keyCode: 32 }, KeyR: { key: 'r', code: 'KeyR', keyCode: 82 },
  KeyE: { key: 'e', code: 'KeyE', keyCode: 69 }, KeyQ: { key: 'q', code: 'KeyQ', keyCode: 81 },
  KeyW: { key: 'w', code: 'KeyW', keyCode: 87 }, Escape: { key: 'Escape', code: 'Escape', keyCode: 27 },
  KeyF: { key: 'f', code: 'KeyF', keyCode: 70 },
}
async function key(name) {
  const k = KEYS[name]
  window.dispatchEvent(new KeyboardEvent('keydown', { ...k, bubbles: true, cancelable: true }))
  await sleep(60)
  window.dispatchEvent(new KeyboardEvent('keyup', { ...k, bubbles: true, cancelable: true }))
  await sleep(80)
}
async function shot(name) {
  await sleep(140)
  await post('/shot/' + name, game.canvas.toDataURL('image/png'))
}

// Everything visible, recursively, so a screenshot is never the only evidence.
function walk(o, out, px, py, lvl) {
  if (o.visible === false || (o.alpha ?? 1) <= 0.02) return
  const x = px + (o.x || 0), y = py + (o.y || 0)
  out.push({
    t: o.type, k: o.texture?.key ?? (o.text !== undefined ? 'TEXT:' + String(o.text).slice(0, 44) : ''),
    x: Math.round(x), y: Math.round(y),
    w: Math.round(o.displayWidth || 0), h: Math.round(o.displayHeight || 0),
    sc: +(o.scaleX ?? 1).toFixed(3), lvl,
  })
  if (o.list) for (const c of o.list) walk(c, out, x, y, lvl + 1)
}
function dumpScenes() {
  const r = {}
  for (const sc of game.scene.scenes) {
    if (!game.scene.isActive(sc.scene.key)) continue
    const out = []
    for (const o of sc.children.list) walk(o, out, 0, 0, 0)
    r[sc.scene.key] = out
  }
  return r
}

note('viewport ' + VP.w + 'x' + VP.h)
// Every visible object in a scene as a screen-space rectangle.
function rectsFor(key) {
  const sc = scene(key)
  if (!sc || !game.scene.isActive(key)) return []
  const out = []
  const walkR = (o, px, py) => {
    if (o.visible === false || (o.alpha ?? 1) <= 0.02) return
    const x = px + (o.x || 0), y = py + (o.y || 0)
    if (o.list) { for (const c of o.list) walkR(c, x, y); return }
    const w = o.displayWidth || 0, h = o.displayHeight || 0
    if (w <= 0 || h <= 0) return
    const ox = (o.originX ?? 0.5), oy = (o.originY ?? 0.5)
    out.push({
      name: o.text !== undefined ? 'TEXT:' + String(o.text).slice(0, 30) : (o.texture?.key || o.type),
      l: x - w * ox, t: y - h * oy, r: x - w * ox + w, b: y - h * oy + h,
    })
  }
  for (const o of sc.children.list) walkR(o, 0, 0)
  return out
}
const overlap = (a, b) =>
  a.l < b.r - 2 && b.l < a.r - 2 && a.t < b.b - 2 && b.t < a.b - 2

// Two things to prove now that there are no bands: the map reaches all four
// edges, and no two HUD elements sit on each other.
function dumpOverlaps(label) {
  const g2 = scene('Game')
  const cam = g2.cameras.main
  const H = game.scale.height, W = game.scale.width
  const full = cam.x === 0 && cam.y === 0 && cam.width === W && cam.height === H
  note(`${label}: world camera ${cam.x},${cam.y} ${cam.width}x${cam.height} ` +
    `of ${W}x${H} ${full ? 'FULL-BLEED' : 'INSET'}`)

  const hud = rectsFor('Hud').filter((r) => r.r > r.l && r.b > r.t)
  let clashes = 0
  for (let i = 0; i < hud.length; i++) {
    for (let j = i + 1; j < hud.length; j++) {
      const a = hud[i], c = hud[j]
      if (!overlap(a, c)) continue
      const nested = (p, q) => p.l <= q.l + 1 && p.t <= q.t + 1 && p.r >= q.r - 1 && p.b >= q.b - 1
      if (nested(a, c) || nested(c, a)) continue
      // A label drawn on its own button plate is composition, not collision:
      // the plate is three images, so the label is never inside any one of them.
      const pair = (x, y) => /^ui-btn-|^hud-/.test(x.name) && /^TEXT:/.test(y.name)
      if (pair(a, c) || pair(c, a)) continue
      if (clashes++ < 10) note(`  ${label} CLASH ${a.name} x ${c.name}`)
    }
  }
  note(`${label}: HUD overlaps = ${clashes}`)
}

/**
 * The open dialog, measured. Two things can go wrong on a panel of cards:
 * two pieces of text on top of each other, or the panel running off the glass.
 */
function dialogCheck(label) {
  const d = scene('Game').dialog
  if (!d) { note(label + ': no dialog open'); return }
  const b = d.layer.getBounds()
  const W = game.scale.width, H = game.scale.height
  const clipped = b.x < -1 || b.y < -1 || b.right > W + 1 || b.bottom > H + 1
  note(`${label}: panel ${Math.round(b.width)}x${Math.round(b.height)} at ` +
    `${Math.round(b.x)},${Math.round(b.y)} in ${W}x${H} — ${clipped ? 'CLIPPED' : 'fits'}`)

  // Only the text is compared. The card plates and button plates are painted
  // *under* their own labels by design; text over text is the bug.
  const texts = []
  const walkT = (o) => {
    if (o.visible === false) return
    if (o.list) { for (const c of o.list) walkT(c); return }
    if (o.text === undefined || !String(o.text).trim()) return
    const r = o.getBounds()
    texts.push({ name: String(o.text).slice(0, 26).replace(/\n/g, ' / '), l: r.x, t: r.y, r: r.right, b: r.bottom })
  }
  walkT(d.layer)
  let clashes = 0
  for (let i = 0; i < texts.length; i++) {
    for (let j = i + 1; j < texts.length; j++) {
      if (!overlap(texts[i], texts[j])) continue
      clashes++
      note(`  ${label} TEXT CLASH "${texts[i].name}" x "${texts[j].name}"`)
    }
  }
  note(`${label}: ${texts.length} text runs, ${clashes} overlapping`)
}

/** Samples the four edges of the canvas: map art everywhere means full-bleed. */
async function edgeCheck(label) {
  const c = game.canvas
  const probe = document.createElement('canvas')
  probe.width = c.width; probe.height = c.height
  const ctx = probe.getContext('2d')
  ctx.drawImage(c, 0, 0)
  const px = (x, y) => {
    const d = ctx.getImageData(Math.round(x), Math.round(y), 1, 1).data
    return [d[0], d[1], d[2]]
  }
  const W = c.width, H = c.height
  // Away from the corners, where the HUD legitimately is.
  const spots = {
    top: [W * 0.5, 2], bottom: [W * 0.5, H - 3],
    left: [2, H * 0.5], right: [W - 3, H * 0.5],
  }
  const out = {}
  let bars = 0
  for (const [k, [x, y]] of Object.entries(spots)) {
    const c3 = px(x, y)
    out[k] = c3
    // The old bands painted 0x10161d at 94%: near-black and desaturated.
    const dark = c3[0] < 40 && c3[1] < 45 && c3[2] < 50
    if (dark) bars++
  }
  note(`${label}: edges ${JSON.stringify(out)} — ${bars === 0 ? 'MAP TO ALL EDGES' : bars + ' edge(s) still a bar'}`)
}

async function toTitle() {
  await until(() => game.textures.exists('map-level1') && game.textures.exists('enemy-notice'), 30000)
  const ok = await until(() => running('Title'), 15000)
  note('splash -> title: ' + ok)
  return ok
}
async function startRun() {
  for (const k of ['Title', 'Draft', 'Splash', 'Credits', 'Boot']) game.scene.stop(k)
  game.scene.start('Game'); game.scene.start('Hud')
  await until(() => running('Game') && scene('Game').status.heroName !== '', 10000)
  await sleep(500)
  return scene('Game')
}
// The world camera zooms and pans, so a build spot's world coordinates are not
// the pixel a tap has to land on. Everything the director clicks on the board
// goes through here.
function toScreen(wx, wy) {
  const cam = scene('Game').cameras.main
  // The world camera's viewport is inset by the reserved HUD band, so its
  // origin is not the top-left of the screen any more.
  return [(wx - cam.worldView.x) * cam.zoom + cam.x, (wy - cam.worldView.y) * cam.zoom + cam.y]
}
/** Pans the board to a world point and waits for the camera to settle. */
async function lookAt(wx, wy) {
  const g = scene('Game')
  if (g.rig) {
    g.rig.targetCenterX = wx
    g.rig.targetCenterY = wy
  } else {
    g.cameras.main.centerOn(wx, wy)
  }
  for (let i = 0; i < 30; i++) {
    await sleep(60)
    const v = g.cameras.main.worldView
    if (Math.abs(v.centerX - wx) < 6 && Math.abs(v.centerY - wy) < 6) break
  }
}

/**
 * Places a tower the way a player does: tap the pad, then press and hold an
 * option and release.
 *
 * The hold is not decoration. The build menu previews on press and buys on
 * release, and a 90ms down-up does not survive the preview work in between on
 * a small viewport — a whole 13-wave run was scored with zero towers on the
 * board because this used `click`. Presses that mean to buy something hold.
 */
async function build(spotIndex, towerIndex = 0) {
  const g = scene('Game')
  const before = g.towers.length
  // Look at the pad first. At the default zoom the camera shows about 491x227
  // of a 1280x720 world, so most pads are off screen and a tap aimed at one
  // lands outside the canvas entirely — which is how a 13-wave run got scored
  // with zero towers built and no error anywhere.
  const [wx, wy] = SPOTS[spotIndex]
  if (!g.cameras.main.worldView.contains(wx, wy)) {
    // Drive the rig's target, not the camera. The rig eases the real camera
    // toward its own target every frame, so a direct centerOn is undone within
    // a frame or two and the tap lands off the pad again.
    await lookAt(wx, wy)
  }
  const [x, y] = toScreen(wx, wy)
  await click(x, y)
  if (!g.menu?.isOpen) { note(`build@${spotIndex}: menu did not open`); return false }
  const hit = g.menu.hitAreas?.[towerIndex]
  if (!hit) { note(`build@${spotIndex}: no option ${towerIndex}`); return false }
  const b = hit.getBounds()
  await move(b.centerX, b.centerY)
  mouse('mousedown', b.centerX, b.centerY)
  await sleep(300)
  mouse('mouseup', b.centerX, b.centerY)
  await sleep(260)
  return g.towers.length > before
}

let g = null
async function run() {
  const okTitle = await toTitle()
  if (scenario === 'title') { await shot('title'); return }
  if (scenario === 'diag') {
    // The diagnostics, which only matter if they work when everything else
    // does not. Three things to prove: the hidden screen opens, a thrown
    // error puts a readable panel on the glass, and a stalled loop is noticed.
    // Play first, so the screen has something real on it: a diagnostics dump
    // taken from a cold title tells nobody anything.
    const gd = await startRun()
    gd.startWave()
    await until(() => gd.enemies.length > 2, 30000)
    await sleep(2500)
    note('played: wave=' + gd.status.wave + ' enemies=' + gd.enemies.length)
    gd.scene.start('Title')
    await until(() => running('Title'), 10000)
    await sleep(600)

    const t = scene('Title')
    // The five-tap target: an all-but-invisible rectangle over the version
    // stamp, in the bottom-right corner.
    const taps = t.children.list.filter((o) => o.type === 'Rectangle' && o.input)
    note('title tap targets: ' + taps.length)
    const cam = t.cameras.main
    const toUI = (o) => {
      const b = o.getBounds()
      return [(b.centerX - cam.worldView.x) * cam.zoom + cam.x,
        (b.centerY - cam.worldView.y) * cam.zoom + cam.y]
    }
    for (const o of taps) note('  target ' + JSON.stringify(toUI(o).map(Math.round)) +
      ' ' + Math.round(o.width) + 'x' + Math.round(o.height))
    // The stamp's target: wide, and further into the bottom-right corner than
    // anything else on the screen. The mute button is square and nearer the
    // left, so size alone is enough to tell them apart.
    const stampHit = taps.filter((o) => o.width > 60)
      .sort((a, b) => (toUI(b)[0] + toUI(b)[1]) - (toUI(a)[0] + toUI(a)[1]))[0]
    const [tx, ty] = toUI(stampHit)
    note('tapping ' + Math.round(tx) + ',' + Math.round(ty))
    for (let i = 0; i < 5; i++) { await click(tx, ty); await sleep(60) }
    await sleep(700)
    note('after five taps: Diagnostics running = ' + running('Diagnostics'))
    await shot('diag-01-screen')

    // A real uncaught error, thrown the way a game bug would throw one.
    const D = await import('./js/systems/ErrorPanel.js')
    try { null.boom() } catch (e) { D.report('uncaught exception', e.message, e.stack) }
    await sleep(500)
    const panel = document.getElementById('crash')
    note('crash panel: ' + (panel ? 'shown, ' + panel.textContent.length + ' chars' : 'MISSING'))
    note('panel mentions the log: ' + /EVENTS \(/.test(panel?.textContent || ''))
    note('panel buttons: ' + [...(panel?.querySelectorAll('button') || [])].map((b) => b.textContent).join('/'))
    // The panel is DOM, so it is not on the canvas a screenshot captures.
    // Its text is the evidence.
    note('panel head: ' + (panel?.textContent || '').replace(/\s+/g, ' ').slice(0, 260))
    panel?.remove()

    // And the freeze, driven directly: a run in progress and a beat that is
    // four seconds old.
    const W = await import('./js/systems/Watchdog.js')
    let froze = 0
    W.installWatchdog((ms) => { froze = ms })
    W.setRunActive(true)
    W.setBeatForTest(Date.now() - 4000)
    W.check(Date.now(), false)
    W.setRunActive(false)
    note('watchdog fired at ' + froze + 'ms stalled')
    const Dg = await import('./js/systems/Diagnostics.js')
    note('events kept: ' + Dg.recentEvents().length +
      ' last=' + JSON.stringify(Dg.recentEvents().slice(-3).map((e) => e.kind + ' ' + e.detail)))
    return
  }

  if (scenario === 'draft') {
    if (okTitle) { scene('Title').scene.start('Draft'); await sleep(900); await shot('draft') }
    return
  }
  if (scenario === 'credits') {
    if (okTitle) { scene('Title').scene.start('Credits'); await sleep(900); await shot('credits') }
    return
  }
  // Every screen that carries a heading, a title or a verdict, so the face
  // rule can be read off real frames rather than off the source.
  if (scenario === 'type') {
    await shot('type-1-title')
    scene('Title').scene.start('Loadout')
    await until(() => running('Loadout'), 8000); await sleep(700)
    await shot('type-2-loadout')
    scene('Loadout').scene.start('Credits')
    await until(() => running('Credits') && scene('Credits').roll, 8000)
    await sleep(500)
    const cs = scene('Credits')
    cs.tween?.stop()
    const total = -cs.tween.data[0].end
    const at = (t) => {
      for (const o of cs.roll.list) if (o.text !== undefined && String(o.text) === t) return o.y
      return -1
    }
    cs.roll.y = -(at('LEGAL AND COMPLIANCE') - 140)
    await sleep(300)
    await shot('type-3-credits-tax')
    cs.roll.y = -(at('COURJAHAN') - 380)
    await sleep(300)
    await shot('type-4-credits-payoff')
    return
  }

  if (scenario === 'creditsroll') {
    // The roll is minutes long, so it is stepped by hand: the tween is stopped
    // and the container is parked at fractions of its own height. That also
    // makes the ordering measurable rather than eyeballed.
    if (!okTitle) return
    scene('Title').scene.start('Credits')
    await until(() => running('Credits') && scene('Credits').roll, 8000)
    await sleep(600)
    const cs = scene('Credits')
    cs.tween?.stop()
    const total = -cs.tween.data[0].end
    note('roll height ' + Math.round(total) + 'px over ' + cs.tweens.scene.sys.game.config.width)
    // Where each department header and each real credit landed.
    const items = []
    for (const o of cs.roll.list) {
      if (o.text !== undefined) items.push({ y: Math.round(o.y), text: String(o.text) })
    }
    const at = (t) => { const m = items.find((i) => i.text === t); return m ? m.y : -1 }
    const heads = items.filter((i) => /^[A-Z][A-Z ]{4,}$/.test(i.text) && i.text === i.text.toUpperCase())
    note('DIVISIONS ' + JSON.stringify(heads.slice(0, 20).map((h) => h.text + '@' + (h.y / total * 100).toFixed(0) + '%')))
    for (const t of ['CLAUDE', 'CHATGPT', 'GEMINI']) {
      note(t + ' at ' + (at(t) / total * 100).toFixed(1) + '% (' + at(t) + 'px)')
    }
    const CD = (await import('./js/data/credits.json', { with: { type: 'json' } })).default
    note('scroll ' + Math.round(total / CD.scrollSeconds) + ' px/s over ' + CD.scrollSeconds + 's')
    // The opening cards, then four samples through the roll.
    for (const [name, y] of [['00-cards', 0], ['01-opening', 0.06], ['02-cory', 0.22],
                             ['03-programming', (at('PROGRAMMING') - 300) / total],
                             ['04-art', (at('ART DEPARTMENT') - 300) / total],
                             ['05-qa', (at('QUALITY ASSURANCE') - 300) / total],
                             ['06-names', (at('COURJAHAN') - 420) / total]]) {
      cs.roll.y = name === '00-cards' ? 0 : -(y * total)
      await sleep(220)
      await shot('roll-' + name)
    }
    return
  }
  g = await startRun()

  if (scenario === 'game') {
    await shot('01-fresh')
    // Zoomed out to cover, so every build pad is in one frame: the sign is
    // wrong on all of them and that has to be visible at a glance.
    for (let i = 0; i < 30; i++) {
      game.canvas.dispatchEvent(new WheelEvent('wheel', { deltaY: 120, clientX: 422, clientY: 195, bubbles: true }))
    }
    await sleep(1400)
    const pads = g.pads.filter((p) => p.visible)
    note('pads visible: ' + pads.length + ' of ' + g.build.spots.length +
      ' textures ' + JSON.stringify([...new Set(pads.map((p) => p.texture.key))]) +
      ' depth ' + pads[0]?.depth)
    await shot('01b-all-pads')
    return
  }

  if (scenario === 'spec') {
    // The tier-3 fork, on the smallest screens the game claims to support.
    g.status.peanuts = 9999
    const cam0 = g.cameras.main
    const spot = SPOTS.findIndex((p) => cam0.worldView.contains(p[0], p[1]))
    const [px, py] = toScreen(SPOTS[spot][0], SPOTS[spot][1])
    await click(px, py)
    await sleep(350)
    const hit = g.menu.hitAreas?.[0]
    const b = hit.getBounds()
    await move(b.centerX, b.centerY)
    mouse('mousedown', b.centerX, b.centerY)
    await sleep(300)
    mouse('mouseup', b.centerX, b.centerY)
    await sleep(500)
    note('built: towers=' + g.towers.length + ' at spot ' + spot)
    const t = g.towers[0]
    // Straight to the choice: the panel is what is under test, not the ten
    // minutes of play that reach it.
    t.tier = 2
    t.buildLeft = 0
    note('tier=' + t.tier + ' atSpecChoice=' + t.atSpecChoice + ' tower=' + t.def.name)
    g.openSpecChoice(t)
    await sleep(700)
    await shot('spec-01-choice')
    dialogCheck('spec')

    // The worst case the data holds: Escalation's Compound runs to 47
    // characters and is the line most likely to wrap into its neighbour.
    const TOWERS = (await import('./js/data/towers.json', { with: { type: 'json' } })).default

  if (scenario === 'ultimate') {

    await sleep(200)
    note('at 25%: phase=' + JSON.stringify(boss.taxPhase))

  if (scenario === 'stuckcast') {

  if (scenario === 'meteor') {

      ' ticks=' + def.ticks + ' over ' + def.duration + 's')

    g.cooldowns.register('meteor', def.cooldown)

    const target = g.lane.pointAt(g.lane.totalLength * 0.45)
    g.startWave()
    await until(() => g.enemies.length > 2, 30000)
    await sleep(400)

    // Park the enemies on the tap and make them unkillable, so a hit is
    // recorded rather than a corpse.
    for (const e of g.enemies) {
      e.health = 999999
      e.distance = g.lane.totalLength * 0.45
      e.setPosition(target.x, target.y)
      // Held still for the length of the barrage, so what is measured is where
      // the meteors land and not where the enemies walked to.
      e.applyStun(60, 1)
    }
    await sleep(200)
    note('probes parked on the tap: ' + g.enemies.length + ' at ' +
      Math.round(target.x) + ',' + Math.round(target.y))

    const hits = []
    const realDamage = g.damageEnemy.bind(g)
    g.damageEnemy = (e, amt, pierce) => {
      hits.push({ t: Math.round(performance.now()), from: Math.round(Math.hypot(e.x - target.x, e.y - target.y)) })
      return realDamage(e, amt, pierce)
    }

    const graphicsBefore = g.children.list.filter((o) => o.type === 'Graphics').length
    g.cameras.main.centerOn(target.x, target.y)
    g.cooldowns.reset('meteor')
    g.fireAbility('meteor', target.x, target.y)
    let peak = 0
    for (let i = 0; i < 34; i++) {
      const now = g.children.list.filter((o) => o.type === 'Graphics').length - graphicsBefore
      if (now > peak) peak = now
      if (i === 1) await shot('meteor-01-telegraph')
      if (i === 5) await shot('meteor-02-first-impact')
      await sleep(150)
    }
    await sleep(1000)
    note('ground telegraphs live at once: peaked at ' + peak)
    note('impacts that damaged something on the tap: ' + hits.length + ' of ' + def.ticks +
      ' meteors (' + g.enemies.length + ' targets stacked there)')
    note('first impact landed ' + (hits.length ? 'on the tap' : 'NOWHERE NEAR IT'))
    await shot('meteor-03-after')
    return
  }

  if (scenario === 'stun') {

    const [px, py] = toScreen(SPOTS[spot][0], SPOTS[spot][1])
    await click(px, py); await sleep(350)

    await move(b.centerX, b.centerY)

    mouse('mouseup', b.centerX, b.centerY); await sleep(600)

    // Extension: the panel is not what is under test, the stun is.
    const t = g.towers[0]
    t.def = g.towerDefs.extension
    t.tier = 3
    t.buildLeft = 0
    t.spec = 'amendment'
    note('tower=' + t.def.name + ' tier=' + t.tier + ' spec=' + t.spec +
      ' stunSeconds=' + t.behaviour.stunSeconds +
      ' fireInterval=' + t.fireInterval.toFixed(2) +
      ' lockoutMultiple=' + RULES.combat.stunLockoutMultiple)

    g.startWave()
    await until(() => g.enemies.length > 0, 30000)
    await sleep(600)
    const e = g.enemies.reduce((a, b2) => (a.distance > b2.distance ? a : b2))
    e.health = 99999

    // Fire the tower at the enemy on its own cadence, which is exactly what
    // the bug needed: a 0.6s stop re-applied every 0.81s.
    const interval = (t.fireInterval / 1.4) * 1000
    const start = e.distance
    let stunnedTicks = 0
    let ticks = 0
    let firing = setInterval(() => g.hitWith(t, e, 1), interval)
    for (let i = 0; i < 24; i++) {
      if (e.stunned) stunnedTicks++
      ticks++
      await sleep(250)
    }
    clearInterval(firing)
    const moved = Math.round(e.distance - start)
    const free = Math.round(e.def.speed * 1.4 * 6)
    note('under a tier-3 Amendment for 6s: moved ' + moved + 'px of the ' + free +
      'px it would cover unhindered (' + Math.round((moved / free) * 100) + '%), stunned on ' +
      stunnedTicks + ' of ' + ticks + ' samples')

    const e2 = g.enemies.find((x) => x !== e && x.alive) ?? e
    e2.applyStun(0.6, RULES.combat.stunLockoutMultiple)
    const first = e2.stunned
    e2.applyStun(0.6, RULES.combat.stunLockoutMultiple)
    await sleep(900)
    const refreshedWhileStunned = e2.stunned
    e2.applyStun(0.6, RULES.combat.stunLockoutMultiple)
    const refreshedDuringLockout = e2.stunned
    await sleep(900)
    e2.applyStun(0.6, RULES.combat.stunLockoutMultiple)
    const afterLockout = e2.stunned
    note('stun landed=' + first + ', still stunned after 0.9s of re-applying=' +
      refreshedWhileStunned + ', re-applied during lockout=' + refreshedDuringLockout +
      ', lands again after the lockout=' + afterLockout)

    await shot('stun-01-under-fire')
    return
  }

  if (scenario === 'boot') {

    note('crash panel on a clean load: ' +
      (document.getElementById('crash') ? 'SHOWN — still broken' : 'none'))

      JSON.stringify(window.__earlyErrors || 'the queue is missing'))

    const E = await import('./js/systems/ErrorPanel.js')

    await sleep(300)
    note('panel after a real error: ' +
      (document.getElementById('crash') ? 'shown' : 'MISSING — the panel is broken'))

    note('pre-boot report: preBoot=' + pre.preBoot + ' build="' + pre.build + '"')
    note('  says the empty log is expected: ' + /BEFORE the game booted/.test(text))
    note('  events section: "' + (text.split('EVENTS')[1] || '').trim().slice(0, 60) + '"')

    const normal = D.buildReport('requested by player', '')
    note('ordinary report: preBoot=' + normal.preBoot +

    return

    await lookAt(t.x, t.y)

    const A = await import('./js/systems/Art.js')

    for (const [i, deg] of [0, 90, 180, 270].entries()) {

        }

      }

      await sleep(110)
      await shot('muzzle-03-' + tag + '-peak')
      await sleep(280)
      await shot('muzzle-04-' + tag + '-late')
      await sleep(700)
    }

    note('page errors: ' + log.filter((l) => l.startsWith('PAGE ERROR')).length)

    await build(0, 0)
    g.startWave()
    await until(() => g.enemies.length > 1, 30000)

        ' src ' + obj.texture.source[0].width + 'x' + obj.texture.source[0].height +
        '  world ' + obj.displayWidth.toFixed(1) + 'x' + obj.displayHeight.toFixed(1) +

    await shot('sprites-01-board')

    note('filter: hero-cory scaleMode=' + tex.scaleMode +

      ' game.config.antialias=' + game.config.antialias +
      ' pixelArt=' + game.config.pixelArt);

    game.scene.start('Loadout')
    await until(() => running('Loadout'), 10000)
    await sleep(700)
    const flatten = (list, out = []) => {

      .find((o) => o.texture && o.texture.key === 'hero-cory')
    row('loadout portrait', portrait)
    note('portrait fitted to a 96px box; anything far under that is a stale content box')
    await shot('sprites-02-loadout')
    return
  }

  if (scenario === 'buildall') {
    // Does the director actually place towers on every pad, at a phone's
    // zoom, where most of them start off screen?
    g.status.peanuts = 99999
    for (let i = 0; i < g.build.spots.length; i++) {
      const [wx, wy] = SPOTS[i]
      await lookAt(wx, wy)
      const v = g.cameras.main.worldView
      const [sx, sy] = toScreen(wx, wy)
      const inView = v.contains(wx, wy)
      await click(sx, sy)
      await sleep(250)
      const opened = !!g.menu?.isOpen
      let bought = false
      if (opened) {
        const hit = g.menu.hitAreas?.[0]
        const bb = hit && hit.getBounds()
        const before = g.towers.length
        if (bb) {
          await move(bb.centerX, bb.centerY)
          mouse('mousedown', bb.centerX, bb.centerY); await sleep(300)
          mouse('mouseup', bb.centerX, bb.centerY); await sleep(300)
        }
        bought = g.towers.length > before
        note('pad ' + i + ' world ' + Math.round(wx) + ',' + Math.round(wy) +
          ' inView=' + inView + ' screen ' + Math.round(sx) + ',' + Math.round(sy) +
          ' menu=' + opened + ' option@' + (bb ? Math.round(bb.centerX) + ',' + Math.round(bb.centerY) : 'none') +
          ' bought=' + bought + ' msg="' + g.status.message + '"')
      } else {
        note('pad ' + i + ' inView=' + inView + ' screen ' + Math.round(sx) + ',' +
          Math.round(sy) + ' MENU DID NOT OPEN msg="' + g.status.message + '"')
      }
    }
    note('total ' + g.towers.length + ' of ' + g.build.spots.length + ' pads built')
    return
  }

  if (scenario === 'rockets') {
    // The painted rockets, in flight, from the towers that fire them.
    const ART = (await import('./js/data/art.json', { with: { type: 'json' } })).default
    for (const k of ['projectile-rocket', 'projectile-rocket-big']) {
      const r = ART.render[k]
      note(k + ' -> ' + ART.files[k] + ' displayHeight=' + r.displayHeight +
        ' world px (' + Math.round(r.displayHeight * 1.72) + ' on screen at the default zoom)' +
        ' width=' + (r.displayHeight * r.contentWidth / r.contentHeight).toFixed(1))
    }

    g.status.peanuts = 99999
    const cam0 = g.cameras.main
    const spot = SPOTS.findIndex((p) => cam0.worldView.contains(p[0], p[1]))
    const [px, py] = toScreen(SPOTS[spot][0], SPOTS[spot][1])
    await click(px, py); await sleep(350)
    const b = g.menu.hitAreas[0].getBounds()
    await move(b.centerX, b.centerY)
    mouse('mousedown', b.centerX, b.centerY); await sleep(300)
    mouse('mouseup', b.centerX, b.centerY); await sleep(600)
    const t = g.towers[0]

    g.startWave()
    await until(() => g.enemies.length > 1, 30000)
    await sleep(400)
    const e = g.enemies.reduce((a, b2) => (a.distance > b2.distance ? a : b2))
    e.health = 999999
    g.cameras.main.centerOn(e.x, e.y)

    // Fire each one at a live target and catch it mid-flight.
    for (const [id, name] of [['rounding', 'small'], ['escalation', 'big']]) {
      t.def = g.towerDefs[id]
      t.cooldown = 0
      g.fire(t, e)
      await sleep(60)
      const shots = g.shots.filter((s2) => s2.active)
      const s2 = shots[shots.length - 1]
      if (!s2) { note(name + ': no projectile in flight'); continue }
      note(name + ' rocket: texture=' + s2.texture.key +
        ' ' + Math.round(s2.displayWidth) + 'x' + Math.round(s2.displayHeight) + ' world px' +
        ' origin ' + s2.originX + ',' + s2.originY +
        ' rotation ' + s2.rotation.toFixed(2) + ' rad')
      await shot('rockets-0' + (name === 'small' ? 1 : 2) + '-' + name)
      await sleep(500)
    }

    // Held still side by side so the pair can be compared.
    const P = await import('./js/systems/Art.js')
    // On open grass, away from the crowd, and turned the way a shot in flight
    // to the right would be turned.
    const open = { x: 980, y: 250 }
    g.cameras.main.centerOn(open.x, open.y)
    const pair = []
    for (const [i, k] of ['projectile-rocket', 'projectile-rocket-big'].entries()) {
      const sp = g.add.image(open.x - 45 + i * 90, open.y, k).setDepth(99999)
      P.applyRender(sp, k)
      sp.setRotation(Math.PI / 2)
      pair.push(sp)
    }
    g.syncCameras()
    await sleep(500)
    note('side by side: ' + pair.map((s2) => Math.round(s2.displayWidth) + 'x' +
      Math.round(s2.displayHeight)).join(' vs '))
    await shot('rockets-03-side-by-side')
    pair.forEach((s2) => s2.destroy())
    note('page errors: ' + log.filter((l) => l.startsWith('PAGE ERROR')).length)
    return
  }

  if (scenario === 'towerpanel') {
    // PROTOTYPE-GAP 11: the panel was covering the range ring it was asking
    // about. Non-modal, anchored, rings visible.
    g.status.peanuts = 99999
    const cam0 = g.cameras.main
    const spot = SPOTS.findIndex((p) => cam0.worldView.contains(p[0], p[1]))
    const [px, py] = toScreen(SPOTS[spot][0], SPOTS[spot][1])
    await click(px, py); await sleep(350)
    const b = g.menu.hitAreas[0].getBounds()
    await move(b.centerX, b.centerY)
    mouse('mousedown', b.centerX, b.centerY); await sleep(300)
    mouse('mouseup', b.centerX, b.centerY); await sleep(700)
    const t = g.towers[0]
    note('built ' + t.def.name + ' range=' + Math.round(t.range))

    await click(...toScreen(t.x, t.y))
    await sleep(500)
    note('panel open=' + !!g.panel + ' modalOpen=' + g.modalOpen +
      ' (must be false — the board stays live)')
    const pl = g.panel.layer
    const pb = pl.getBounds()
    const W = game.scale.width, H = game.scale.height
    const area = g.layout.panelArea
    note('panel ' + Math.round(pb.width) + 'x' + Math.round(pb.height) + ' at ' +
      Math.round(pb.x) + ',' + Math.round(pb.y) + ' in ' + W + 'x' + H)
    note('inside the free area (' + Math.round(area.x) + ',' + Math.round(area.y) + ' ' +
      Math.round(area.width) + 'x' + Math.round(area.height) + '): ' +
      (pb.x >= area.x - 1 && pb.y >= area.y - 1 &&
       pb.right <= area.x + area.width + 1 && pb.bottom <= area.y + area.height + 1))

    // The tower's own screen position, and whether the panel covers it.
    const cam = g.cameras.main
    const tsx = (t.x - cam.worldView.x) * cam.zoom + cam.x
    const tsy = (t.y - cam.worldView.y) * cam.zoom + cam.y
    note('tower on screen at ' + Math.round(tsx) + ',' + Math.round(tsy) +
      ' — panel covers its base: ' + pb.contains(tsx, tsy) + ' (must be false)')
    // The ring is the thing the panel must not hide.
    const ringR = t.range * cam.zoom
    let covered = 0
    for (let i = 0; i < 36; i++) {
      const a = (i / 36) * Math.PI * 2
      if (pb.contains(tsx + Math.cos(a) * ringR, tsy + Math.sin(a) * ringR)) covered++
    }
    note('range ring: ' + covered + ' of 36 points on it are behind the panel')

    // The rings. Solid = now, dashed = what the upgrade buys.
    note('range ring drawn: ' + (g.rangeRing.commandBuffer.length > 0) +
      ' | projected ring drawn: ' + (g.projectedRing.commandBuffer.length > 0) +
      ' | covered lane drawn: ' + (g.pathBand.commandBuffer.length > 0))
    await shot('panel-01-open')

    // Hovering the upgrade button brightens the projected ring.
    const up = g.panel.layer.list.find((o) => o.text && o.text.startsWith('UPGRADE'))
    if (up) {
      const ub = up.getBounds()
      await move(ub.centerX, ub.centerY)
      await sleep(300)
      note('previewing on hover: ' + g.previewingUpgrade)
      await shot('panel-02-preview')
      await move(W / 2, 10)
      await sleep(200)
    }

    // Panning must keep it stuck to its tower.
    const beforePan = g.panel.layer.x
    mouse('mousedown', W * 0.5, H * 0.5)
    for (let i = 0; i < 8; i++) { mouse('mousemove', W * 0.5 - i * 12, H * 0.5); await sleep(30) }
    mouse('mouseup', W * 0.5 - 96, H * 0.5)
    await sleep(700)
    note('panel followed the pan: ' + (Math.round(g.panel.layer.x) !== Math.round(beforePan)) +
      ' (' + Math.round(beforePan) + ' -> ' + Math.round(g.panel.layer.x) + ')')

    // Zoomed out, so both rings fit on the glass and can be told apart.
    for (let i = 0; i < 26; i++) {
      game.canvas.dispatchEvent(new WheelEvent('wheel', { deltaY: 120, clientX: 422, clientY: 195, bubbles: true }))
    }
    await sleep(1200)
    note('zoomed to ' + g.cameras.main.zoom.toFixed(2) + ' — both rings on screen')
    await shot('panel-02b-both-rings')

    // A tap off the panel closes it.
    await click(W * 0.86, H * 0.28)
    await sleep(400)
    note('tap off the panel closed it: ' + !g.panel + ' selected=' + !!g.selected)
    note('rings cleared: ' + (g.projectedRing.commandBuffer.length === 0))
    await shot('panel-03-closed')

    // And a tower near the bottom must flip the panel above itself.
    const low = g.build.spots.reduce((a, c) => (c.y > a.y ? c : a))
    g.cameras.main.centerOn(low.x, low.y - 60)
    await sleep(600)
    g.place('withholding', low)
    await sleep(600)
    const t2 = g.towers[g.towers.length - 1]
    g.selectTower(t2)
    await sleep(500)
    const c2 = g.cameras.main
    const t2y = (t2.y - c2.worldView.y) * c2.zoom + c2.y
    const p2 = g.panel.layer.getBounds()
    note('low tower at y=' + Math.round(t2y) + ', panel at y=' + Math.round(p2.y) +
      '..' + Math.round(p2.bottom) + ' — clear of the tower: ' +
      !g.panel.coversAnchor({ x: (t2.x - c2.worldView.x) * c2.zoom + c2.x, base: t2y, top: 0, halfWidth: 0 }))
    await shot('panel-04-flipped')
    return
  }

  if (scenario === 'retreat') {
    // "Once Cory is engaged, setting a new rally point does nothing."
    const H = (await import('./js/data/heroes.json', { with: { type: 'json' } })).default.cory
    note('retreat cost: ' + JSON.stringify(H.retreat))

    const mid = g.lane.pointAt(g.lane.totalLength * 0.5)
    g.hero.setRally(mid.x, mid.y)
    g.startWave()
    await until(() => g.hero.engaged, 40000)
    await sleep(600)
    note('engaged: ' + g.hero.engaged + ' enemies in attack range=' +
      g.enemies.filter((e) => Math.hypot(e.x - g.hero.x, e.y - g.hero.y) < g.hero.attackRange).length +
      ' blocked by him=' + g.enemies.filter((e) => e.blocker === g.hero).length)
    g.cameras.main.centerOn(g.hero.x, g.hero.y)
    await shot('retreat-01-engaged')

    // The order, mid-fight.
    const from = [Math.round(g.hero.x), Math.round(g.hero.y)]
    const held = g.enemies.filter((e) => e.blocker === g.hero)
    const heldDistances = held.map((e) => Math.round(e.distance))
    const away = g.lane.pointAt(g.lane.totalLength * 0.5)
    const dest = [away.x - 170, away.y - 150]
    const t0 = performance.now()
    g.orderHero(dest[0], dest[1])

    // Feedback has to be immediate, not after the fight ends.
    await sleep(120)
    const moved120 = Math.hypot(g.hero.x - from[0], g.hero.y - from[1])
    note('120ms after the order: moved ' + Math.round(moved120) + 'px, facing set, ' +
      'vulnerable=' + g.hero.retreatVulnerableFor.toFixed(1) + 's, msg="' + g.status.message + '"')
    await shot('retreat-02-breaking-off')

    await until(() => g.hero.atRally, 15000)
    const arrived = performance.now()
    note('arrived at ' + Math.round(g.hero.x) + ',' + Math.round(g.hero.y) +
      ' (asked for ' + Math.round(dest[0]) + ',' + Math.round(dest[1]) + ') after ' +
      ((arrived - t0) / 1000).toFixed(1) + 's')
    note('enemies he was holding resumed walking: ' +
      held.map((e, i) => Math.round(e.distance) - heldDistances[i]).join(',') + 'px advanced' +
      ' | any of THOSE still blocked by him: ' + held.filter((e) => e.blocker === g.hero).length)
    await shot('retreat-03-arrived')

    // He must pick a fight again on his own once something walks into him.
    const before = g.enemies.map((e) => Math.round(e.health))
    await until(() => g.hero.engaged, 30000)
    note('re-engaged without another tap: ' + g.hero.engaged)
    await sleep(2500)
    const after = g.enemies.map((e) => Math.round(e.health))
    note('he is swinging again: ' + (JSON.stringify(before) !== JSON.stringify(after)))

    // And the same thing in the vehicle.
    g.hero.setRally(g.hero.x, g.hero.y)
    // Just over the threshold, then a nudge: a single huge hit takes him down
    // instead of transforming him.
    g.hero.health = g.hero.def.maxHealth * 0.3
    g.damageHero(20)
    await sleep(1400)
    note('last stand: ' + g.hero.lastStandActive + ' sprite=' + g.hero.list[1].texture.key)
    await until(() => g.hero.engaged, 30000)
    const vFrom = [Math.round(g.hero.x), Math.round(g.hero.y)]
    g.orderHero(vFrom[0] - 200, vFrom[1] - 120)
    await sleep(400)
    const vMoved = Math.hypot(g.hero.x - vFrom[0], g.hero.y - vFrom[1])
    note('in the SUV, 400ms after the order: moved ' + Math.round(vMoved) + 'px')
    await shot('retreat-04-vehicle')
    return
  }

  if (scenario === 'fx') {
    // The new effect sheets, on the board.
    const ART = (await import('./js/data/art.json', { with: { type: 'json' } })).default
    for (const k of ['fx-explosion', 'fx-hit-spark', 'fx-death-puff']) {
      const tex = game.textures.get(k)
      note(k + ': ' + tex.frameTotal + ' frames (incl __BASE), anim registered=' +
        game.anims.exists(k) + ', frame size ' +
        JSON.stringify(ART.render[k].sheet))
    }

    g.status.peanuts = 99999
    const cam0 = g.cameras.main
    const spot = SPOTS.findIndex((p) => cam0.worldView.contains(p[0], p[1]))
    const [px, py] = toScreen(SPOTS[spot][0], SPOTS[spot][1])
    await click(px, py); await sleep(350)
    const b = g.menu.hitAreas[0].getBounds()
    await move(b.centerX, b.centerY)
    mouse('mousedown', b.centerX, b.centerY); await sleep(300)
    mouse('mouseup', b.centerX, b.centerY); await sleep(600)
    // A splash tower, so blast() runs.
    const t = g.towers[0]
    t.def = g.towerDefs.escalation
    note('tower: ' + t.def.name + ' splash=' + t.splashRadius)

    g.startWave()
    await until(() => g.enemies.length > 1, 30000)
    await sleep(400)
    const e = g.enemies.reduce((a, b2) => (a.distance > b2.distance ? a : b2))
    g.cameras.main.centerOn(e.x, e.y)

    // Every call site, one at a time, with a frame captured mid-animation.
    g.blast(e.x, e.y, t.splashRadius)
    await sleep(90); await shot('fx-01-tower-splash')
    await sleep(400)

    g.impactSpark(e.x, e.y)
    await sleep(80); await shot('fx-02-hit-spark')
    await sleep(300)

    const P = await import('./js/systems/Presentation.js')
    P.deathPuff(g, e.x, e.y)
    await sleep(120); await shot('fx-03-death-puff')
    await sleep(300)

    // And an ability blast, which is the big one.
    g.status.abilities = ['molotov', 'glacier']
    g.cooldowns.register('molotov', 1)
    g.cooldowns.reset('molotov')
    g.fireAbility('molotov', e.x, e.y)
    await sleep(120); await shot('fx-04-molotov')
    await sleep(400)

    // Hold each effect on its peak frame so the art can actually be seen: a
    // screenshot round trip is slower than a 280ms animation.
    const FX = await import('./js/systems/Effects.js')
    const holds = [
      ['fx-05-explosion-peak', 'fx-explosion', FX.sizeForRadius(88), 2],
      ['fx-06-hit-spark-peak', 'fx-hit-spark', 46, 1],
      ['fx-07-death-puff-peak', 'fx-death-puff', 62, 1],
    ]
    for (const [name, key, size, frame] of holds) {
      const sp = FX.playEffect(g, key, e.x, e.y, { size, depth: 99999, durationMs: 4000 })
      g.syncCameras()
      await sleep(120)
      sp.anims.pause(sp.anims.currentAnim.frames[frame])
      await sleep(120)
      note(name + ': frame ' + frame + ' at ' + Math.round(sp.displayWidth) + 'x' +
        Math.round(sp.displayHeight) + ' world px')
      await shot(name)
      sp.destroy()
      await sleep(120)
    }

    // Nothing left behind: an effect that does not clean itself up leaks.
    const before = g.children.list.length
    for (let i = 0; i < 12; i++) { g.impactSpark(e.x + i * 4, e.y); await sleep(30) }
    await sleep(900)
    note('sprites left after 12 sparks: ' + (g.children.list.length - before) + ' (must be 0)')
    note('page errors: ' + log.filter((l) => l.startsWith('PAGE ERROR')).length)
    return
  }

  if (scenario === 'herohp') {
    // "Cory dies almost immediately." Measured: what actually lands on him,
    // against what the data says should.
    const E = (await import('./js/data/enemies.json', { with: { type: 'json' } })).default
    const H = (await import('./js/data/heroes.json', { with: { type: 'json' } })).default.cory
    note('hero maxHealth=' + H.maxHealth + ' blockCapacity=' + H.blockCapacity +
      ' blockRange=' + H.blockRange)

    // Post him on the lane, where the tester has him.
    const post = g.lane.pointAt(g.lane.totalLength * 0.5)
    g.hero.setRally(post.x, post.y)
    await sleep(2500)

    // Count every blow that lands on him, and what it cost.
    const hits = []
    const realHurt = g.hero.hurt.bind(g.hero)
    g.hero.hurt = (amt) => { hits.push({ t: performance.now(), amt }); return realHurt(amt) }

    const waveToTest = Number(q.get('wave') || 4) - 1
    g.status.wave = waveToTest
    g.status.peanuts = 99999
    g.startWave()
    const t0 = performance.now()
    await until(() => g.enemies.some((e) => Math.hypot(e.x - g.hero.x, e.y - g.hero.y) < H.blockRange), 40000)
    const engaged = performance.now()
    note('wave ' + (waveToTest + 1) + ' (' + g.status.waveName + ') — first contact at ' +
      ((engaged - t0) / 1000).toFixed(1) + 's')

    let peakBlocked = 0
    let peakNear = 0
    while (g.hero.health > 0 && !g.hero.down && performance.now() - engaged < 30000) {
      const near = g.enemies.filter((e) => e.alive &&
        Math.hypot(e.x - g.hero.x, e.y - g.hero.y) < H.blockRange).length
      const blocked = g.enemies.filter((e) => e.blocker === g.hero).length
      if (near > peakNear) peakNear = near
      if (blocked > peakBlocked) peakBlocked = blocked
      await sleep(100)
    }
    const died = performance.now()
    const secs = (died - engaged) / 1000
    const total = hits.reduce((a, b) => a + b.amt, 0)
    note('Cory took ' + hits.length + ' hits for ' + Math.round(total) + ' damage in ' +
      secs.toFixed(1) + 's real (' + (secs * 1.4).toFixed(1) + ' game-seconds)')
    note('  = ' + (total / (secs * 1.4)).toFixed(1) + ' damage per game-second, ' +
      'from at most ' + peakBlocked + ' blocked and ' + peakNear + ' within block range')
    note('  down=' + g.hero.down + ' health=' + Math.round(g.hero.health))
    // What the data says it should have been.
    const worst = Math.max(...Object.values(E).map((x) => x.damage / (x.attackInterval || 99)))
    note('  data says: at most ' + H.blockCapacity + ' attackers x ' + worst.toFixed(1) +
      ' dps = ' + (worst * H.blockCapacity).toFixed(1) + ' damage per game-second, ' +
      'so ' + (H.maxHealth / (worst * H.blockCapacity)).toFixed(0) + ' game-seconds to kill him')
    // The gap between those two numbers is the bug.
    const gaps = []
    for (let i = 1; i < hits.length; i++) gaps.push(Math.round(hits[i].t - hits[i - 1].t))
    note('  gaps between hits (ms): ' + JSON.stringify(gaps.slice(0, 30)))
    return
  }

  if (scenario === 'revive') {
    // He goes down, a marker counts him down where he comes back, and he
    // walks back on at full health.
    g.startWave()
    await until(() => g.enemies.length > 1, 30000)
    await sleep(400)
    const home = g.hero.returnPoint
    note('hero start ' + Math.round(g.hero.x) + ',' + Math.round(g.hero.y) +
      ' returns to ' + Math.round(home.x) + ',' + Math.round(home.y) +
      ' reviveSeconds=' + g.hero.def.reviveSeconds)

    // Order him away first, so the return point is provably not where he fell.
    g.hero.setRally(300, 620)
    await sleep(2200)
    // Take him to Last Stand on this life, so the revive can be checked
    // against re-arming it.
    g.damageHero(g.hero.def.maxHealth * 0.8)
    await sleep(900)
    note('last stand on this life: ' + g.hero.lastStandActive +
      ' sprite=' + g.hero.list[1].texture.key)
    const fell = [Math.round(g.hero.x), Math.round(g.hero.y)]
    g.damageHero(9999)
    await sleep(600)
    note('down=' + g.hero.down + ' at ' + JSON.stringify(fell) +
      ' visible=' + g.hero.visible + ' reviveIn=' + g.hero.reviveIn.toFixed(1) +
      ' msg="' + g.status.message + '"')
    note('HUD says: "' + scene('Hud').heroLabel.text + '"')
    note('marker label: "' + g.reviveLabel.text + '" visible=' + g.reviveLabel.visible +
      ' at ' + Math.round(g.reviveLabel.x) + ',' + Math.round(g.reviveLabel.y))
    g.cameras.main.centerOn(home.x, home.y)
    await sleep(400)
    await shot('revive-01-down-marker')

    // Abilities and hero orders must be refused while he is away.
    g.selectHero()
    note('select while down: heroSelected=' + g.heroSelected + ' msg="' + g.status.message + '"')

    // Short-circuit the wait rather than sit here for 25 seconds.
    g.hero.reviveIn = 2
    await until(() => !g.hero.down, 12000)
    await sleep(500)
    note('revived: hp=' + Math.round(g.hero.health) + '/' + g.hero.def.maxHealth +
      ' at ' + Math.round(g.hero.x) + ',' + Math.round(g.hero.y) +
      ' visible=' + g.hero.visible + ' alpha=' + g.hero.alpha +
      ' sprite=' + g.hero.list[1].texture.key + ' msg="' + g.status.message + '"')
    note('marker cleared: ' + !g.reviveLabel.visible)
    await shot('revive-02-back')

    // And he has to work: orders, and Last Stand must not re-arm.
    g.hero.setRally(500, 500)
    await sleep(1500)
    note('takes orders again: moved=' + (Math.round(g.hero.x) !== Math.round(home.x)))
    g.damageHero(g.hero.def.maxHealth * 0.8)
    await sleep(900)
    note('after dropping him to ' + Math.round(g.hero.health) + ': lastStand=' +
      g.hero.lastStandActive + ' sprite=' + g.hero.list[1].texture.key +
      ' (must be false and on foot — one transformation per encounter)')
    return
  }

  if (scenario === 'background') {
    // The reported crash: leave the tab, come back, it breaks. Driven here by
    // faking what iOS does — a suspended AudioContext whose resume rejects,
    // plus the visibility events Safari fires around it.
    const rejections = []
    addEventListener('unhandledrejection', (e) => rejections.push(String(e.reason?.message || e.reason)))
    const A = await import('./js/systems/Audio.js')
    const ctx = game.sound.context
    note('audio: ' + (ctx ? 'WebAudio, state=' + ctx.state : 'no context') +
      ' pauseOnBlur=' + game.sound.pauseOnBlur)

    g.startWave()
    await until(() => g.enemies.length > 1, 30000)
    await sleep(500)
    note('before: wave=' + (g.status.wave + 1) + ' enemies=' + g.enemies.length +
      ' GameRunning=' + running('Game') + ' HudRunning=' + running('Hud'))
    await shot('bg-01-before')

    // Away.
    Object.defineProperty(document, 'visibilityState', { value: 'hidden', configurable: true })
    document.dispatchEvent(new Event('visibilitychange'))
    dispatchEvent(new Event('pagehide'))
    await sleep(700)
    const frozenEnemies = g.enemies.map((e) => Math.round(e.distance))
    note('backgrounded: GameRunning=' + running('Game') + ' HudRunning=' + running('Hud') +
      ' ctx=' + (ctx ? ctx.state : '-'))
    await sleep(900)
    note('board frozen while away: ' +
      (JSON.stringify(g.enemies.map((e) => Math.round(e.distance))) === JSON.stringify(frozenEnemies)))

    // The iOS failure itself: the next resume rejects.
    let forced = false
    if (ctx) {
      const realResume = ctx.resume.bind(ctx)
      ctx.resume = () => {
        if (forced) return realResume()
        forced = true
        return Promise.reject(new Error('Failed to start the audio device'))
      }
    }

    // Back.
    Object.defineProperty(document, 'visibilityState', { value: 'visible', configurable: true })
    document.dispatchEvent(new Event('visibilitychange'))
    dispatchEvent(new Event('pageshow'))
    await sleep(1200)
    note('foregrounded: GameRunning=' + running('Game') + ' HudRunning=' + running('Hud') +
      ' audioUnavailable=' + A.audioUnavailable())
    note('unhandled rejections: ' + rejections.length + ' ' + JSON.stringify(rejections))
    note('crash panel: ' + (document.getElementById('crash') ? 'SHOWN' : 'none'))
    note('notice: "' + (document.getElementById('toast')?.textContent ?? 'NONE') + '"')
    await sleep(900)
    note('board moving again: ' +
      (JSON.stringify(g.enemies.map((e) => Math.round(e.distance))) !== JSON.stringify(frozenEnemies)))
    await shot('bg-02-after')

    // Sound must be silently off, not fatal.
    g.status.message = 'still playing'
    A.play(g, 'click')
    note('play() after the failure did not throw')

    // And the pause button has to still work on the far side of all that.
    const hud = scene('Hud')
    hud.openPause()
    await sleep(600)
    note('pause after backgrounding: GamePaused=' + game.scene.isPaused('Game') +
      ' panel=' + !!hud.panel)
    await shot('bg-03-paused')
    const before = g.enemies.map((e) => Math.round(e.distance))
    hud.resumeGame()
    await sleep(900)
    note('resume after backgrounding: GamePaused=' + game.scene.isPaused('Game') +
      ' board moving=' + (JSON.stringify(g.enemies.map((e) => Math.round(e.distance))) !== JSON.stringify(before)))

    // A run the player paused must still be paused after a trip away.
    hud.openPause()
    await sleep(400)
    Object.defineProperty(document, 'visibilityState', { value: 'hidden', configurable: true })
    document.dispatchEvent(new Event('visibilitychange'))
    await sleep(500)
    Object.defineProperty(document, 'visibilityState', { value: 'visible', configurable: true })
    document.dispatchEvent(new Event('visibilitychange'))
    await sleep(800)
    note('deliberate pause survived a background cycle: GamePaused=' +
      game.scene.isPaused('Game') + ' HudRunning=' + running('Hud'))
    return
  }

  if (scenario === 'gnomes') {

    await until(() => g.enemies.length > 1, 30000)
    await sleep(600)

    note('off-path distance to lane: ' + Math.round(g.lane.distanceTo(off[0], off[1])) +
      ' (limit ' + g.abilityDef('gnomes').pathOnlyWithin + ')')
    g.fireAbility('gnomes', off[0], off[1])
    await sleep(300)
    note('off-path cast: fighters=' + g.fighters.length + ' msg="' + g.status.message + '"' +
      ' cooldownReady=' + g.cooldowns.ready('gnomes'))

    // Then on the lane, just ahead of the lead enemy, so the pair actually
    // meets something and the size comparison is a frame, not arithmetic.
    const lead = g.enemies.reduce((a, b) => (a.distance > b.distance ? a : b))
    const on = g.lane.pointAt(lead.distance + 70)
    g.cooldowns.reset('gnomes')
    g.fireAbility('gnomes', on.x, on.y)
    note('on-path cast: fighters=' + g.fighters.length + ' msg="' + g.status.message + '"')

    // Held up for the pictures. A director-side cheat: they are dead in under
    // a second otherwise, which is measured separately below.
    for (const f of g.fighters) f.health = 99999
    await sleep(500)
    for (const f of g.fighters) {
      const a = f.art
      note('  gnome ' + a.texture.key + ' ' + Math.round(a.displayWidth) + 'x' +
        Math.round(a.displayHeight) + ' origin ' + a.originX + ',' + a.originY +
        ' rot=' + a.rotation.toFixed(2) + ' depth=' + Math.round(f.depth) +
        ' shadow=' + (f.list[0]?.texture?.key ?? 'NONE'))
    }
    const keys = g.fighters.map((f) => f.art.texture.key)
    note('distinct sprites: ' + new Set(keys).size + ' of ' + keys.length)

    // Sizes on the glass, against what they stand beside.
    const z = g.cameras.main.zoom
    const soldier = g.enemies.find((e) => e.def.tier === 'basic')
    note('on screen at zoom ' + z.toFixed(2) + ': gnome ' +
      Math.round(g.fighters[0].art.displayHeight * z) + 'px, ' + soldier.def.name + ' ' +
      Math.round(soldier.art.displayHeight * z) + 'px, hero ' +
      Math.round(g.hero.list[1].displayHeight * z) + 'px')

    // Facing: right by default, mirrored for a target on the left.
    const f0 = g.fighters[0]
    f0.face(0)
    note('facing a target to the right: flipX=' + f0.art.flipX + ' artX=' + f0.art.x.toFixed(1))
    f0.face(Math.PI)
    note('facing a target to the left:  flipX=' + f0.art.flipX + ' artX=' + f0.art.x.toFixed(1))

    g.cameras.main.centerOn(on.x, on.y)
    await sleep(300)
    await shot('gnomes-01-on-path')
    await until(() => g.enemies.some((e) => Math.hypot(e.x - on.x, e.y - on.y) < 34), 20000)
    await sleep(500)
    note('under fire: flipX=' + g.fighters.map((f) => f.art.flipX).join(',') +
      ' depths=' + g.fighters.map((f) => Math.round(f.depth)).join(','))
    await shot('gnomes-02-fighting')

    // And now the honest one: real health, and how long two gnomes last.
    for (const f of g.fighters) f.health = 0
    await sleep(300)
    g.cooldowns.reset('gnomes')
    const lead2 = g.enemies.reduce((a, b) => (a.distance > b.distance ? a : b))
    const on2 = g.lane.pointAt(lead2.distance + 50)
    g.fireAbility('gnomes', on2.x, on2.y)
    const hits = []
    for (const f of g.fighters) {
      const orig = f.hurt.bind(f)
      f.hurt = (amt) => { hits.push(amt); return orig(amt) }
    }
    const t0 = performance.now()
    await until(() => g.fighters.length === 0, 20000)
    note('survivability: 2 gnomes (90hp each) gone in ' +
      Math.round(performance.now() - t0) + 'ms after ' + hits.length + ' hits for ' +
      hits.reduce((a, b) => a + b, 0) + ' damage; a Late Filer does 7 every 1.0s')
    return
  }

  if (scenario === 'herofx') {
    // The four things a player is supposed to be able to see.
    const hero = g.hero
    g.status.peanuts = 99999
    await build(3, 0)
    // Wave 6 is five Final Notices and ten Shredders. It has to be a wave with
    // armour in it: Depreciation strips armour, and two of the three enemy
    // types have none, so against waves 1-3 the passive genuinely does nothing
    // and no amount of effects would make it read.
    g.status.wave = Number(arg || 5)
    g.startWave()
    await until(() => g.enemies.length > 2, 30000)

    const spot = g.lane.pointAt(g.lane.totalLength * 0.5)
    hero.setRally(spot.x, spot.y)
    await until(() => Math.hypot(hero.x - spot.x, hero.y - spot.y) < 12, 20000)
    await lookAt(hero.x, hero.y)
