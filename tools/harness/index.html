      g.hero.lastStandActive + ' sprite=' + g.hero.list[1].texture.key +
      ' (must be false and on foot — one transformation per encounter)')
    return
  }

  if (scenario === 'background') {
    // The reported crash: leave the tab, come back, it breaks. Driven here by
    // faking what iOS does — a suspended AudioContext whose resume rejects,
    // plus the visibility events Safari fires around it.
    const rejections = []
    addEventListener('unhandledrejection', (e) => rejections.push(String(e.reason?.message || e.reason)))
    const A = await import('./js/systems/Audio.js')
    const ctx = game.sound.context
    note('audio: ' + (ctx ? 'WebAudio, state=' + ctx.state : 'no context') +
      ' pauseOnBlur=' + game.sound.pauseOnBlur)

    g.startWave()
    await until(() => g.enemies.length > 1, 30000)
    await sleep(500)
    note('before: wave=' + (g.status.wave + 1) + ' enemies=' + g.enemies.length +
      ' GameRunning=' + running('Game') + ' HudRunning=' + running('Hud'))
    await shot('bg-01-before')

    // Away.
    Object.defineProperty(document, 'visibilityState', { value: 'hidden', configurable: true })
    document.dispatchEvent(new Event('visibilitychange'))
    dispatchEvent(new Event('pagehide'))
    await sleep(700)
    const frozenEnemies = g.enemies.map((e) => Math.round(e.distance))
    note('backgrounded: GameRunning=' + running('Game') + ' HudRunning=' + running('Hud') +
      ' ctx=' + (ctx ? ctx.state : '-'))
    await sleep(900)
    note('board frozen while away: ' +
      (JSON.stringify(g.enemies.map((e) => Math.round(e.distance))) === JSON.stringify(frozenEnemies)))

    // The iOS failure itself: the next resume rejects.
    let forced = false
    if (ctx) {
      const realResume = ctx.resume.bind(ctx)
      ctx.resume = () => {
        if (forced) return realResume()
        forced = true
        return Promise.reject(new Error('Failed to start the audio device'))
      }
    }

    // Back.
    Object.defineProperty(document, 'visibilityState', { value: 'visible', configurable: true })
    document.dispatchEvent(new Event('visibilitychange'))
    dispatchEvent(new Event('pageshow'))
    await sleep(1200)
    note('foregrounded: GameRunning=' + running('Game') + ' HudRunning=' + running('Hud') +
      ' audioUnavailable=' + A.audioUnavailable())
    note('unhandled rejections: ' + rejections.length + ' ' + JSON.stringify(rejections))
    note('crash panel: ' + (document.getElementById('crash') ? 'SHOWN' : 'none'))
    note('notice: "' + (document.getElementById('toast')?.textContent ?? 'NONE') + '"')
    await sleep(900)
    note('board moving again: ' +
      (JSON.stringify(g.enemies.map((e) => Math.round(e.distance))) !== JSON.stringify(frozenEnemies)))
    await shot('bg-02-after')

    // Sound must be silently off, not fatal.
    g.status.message = 'still playing'
    A.play(g, 'click')
    note('play() after the failure did not throw')

    // And the pause button has to still work on the far side of all that.
    const hud = scene('Hud')
    hud.openPause()
    await sleep(600)
    note('pause after backgrounding: GamePaused=' + game.scene.isPaused('Game') +
      ' panel=' + !!hud.panel)
    await shot('bg-03-paused')
    const before = g.enemies.map((e) => Math.round(e.distance))
    hud.resumeGame()
    await sleep(900)
    note('resume after backgrounding: GamePaused=' + game.scene.isPaused('Game') +
      ' board moving=' + (JSON.stringify(g.enemies.map((e) => Math.round(e.distance))) !== JSON.stringify(before)))

    // A run the player paused must still be paused after a trip away.
    hud.openPause()
    await sleep(400)
    Object.defineProperty(document, 'visibilityState', { value: 'hidden', configurable: true })
    document.dispatchEvent(new Event('visibilitychange'))
    await sleep(500)
    Object.defineProperty(document, 'visibilityState', { value: 'visible', configurable: true })
    document.dispatchEvent(new Event('visibilitychange'))
    await sleep(800)
    note('deliberate pause survived a background cycle: GamePaused=' +
      game.scene.isPaused('Game') + ' HudRunning=' + running('Hud'))
    return
  }

  if (scenario === 'gnomes') {
    // Two gnomes, two sprites, on the lane only.
    g.status.abilities = ['gnomes', 'glacier']
    g.cooldowns.register('gnomes', 1)
    g.cooldowns.reset('gnomes')
    g.startWave()
    await until(() => g.enemies.length > 1, 30000)
    await sleep(600)

    // THE PLACEMENT CURSOR. There is no overlay on the map at all now — the
    // blue outline down both edges of the lane is gone — so what is checked is
    // that the CURSOR answers the question, on the lane and off it.
    g.armAbility('gnomes')
    await sleep(300)
    note('armed: mode=' + g.status.mode + ' msg="' + g.status.message + '"')
    note('cursor art: valid=' + (g.castCursor.stubbed.valid ? 'STUB' : 'real') +
      '  invalid=' + (g.castCursor.stubbed.invalid ? 'STUB' : 'real'))
    note('cursor before the pointer moves: ' + g.castCursor.state)

    // Hover ON the lane. The pointer is moved through the canvas, in CSS
    // pixels, and the cursor has to land at the world point under it.
    const hover = async (wx, wy) => {
      const cam = g.cameras.main
      const dpr = window.devicePixelRatio || 1
      const sx = ((wx - cam.worldView.x) * cam.zoom + cam.x) / dpr
      const sy = ((wy - cam.worldView.y) * cam.zoom + cam.y) / dpr
      move(sx, sy)
      await sleep(140)
      return { sx, sy }
    }
    const onLane = g.lane.pointAt(g.lane.totalLength * 0.45)
    await hover(onLane.x, onLane.y)
    const validState = g.castCursor.state
    note('on the road (lane distance ' +
      Math.round(g.lane.distanceTo(onLane.x, onLane.y)) + '): cursor=' + validState)
    await shot('gnomes-00-cursor-valid-' + VP.w + 'x' + VP.h)

    // And well off it. A build pad is the natural off-lane point: it is where
    // a player's finger already goes.
    const farPad = g.build.spots.reduce((a, b) =>
      (g.lane.distanceTo(a.x, a.y) > g.lane.distanceTo(b.x, b.y) ? a : b))
    await hover(farPad.x, farPad.y)
    const invalidState = g.castCursor.state
    note('off the road (lane distance ' +
      Math.round(g.lane.distanceTo(farPad.x, farPad.y)) + '): cursor=' + invalidState)
    await shot('gnomes-00b-cursor-invalid-' + VP.w + 'x' + VP.h)

    note('CURSOR ' + (validState === 'valid' && invalidState === 'invalid'
      ? 'follows the pointer and reports both states'
      : '*** wrong: on-lane=' + validState + ' off-lane=' + invalidState + ' ***'))

    // CANCEL is in the HUD corner, not over the board. Asserted by POSITION:
    // a handler that fires on a button drawn across the play area is still a
    // button drawn across the play area.
    const cbx = g.cancelBtn.hit.x, cby = g.cancelBtn.hit.y
    note('CANCEL at ' + Math.round(cbx) + ',' + Math.round(cby) +
      ' of ' + VP.w + 'x' + VP.h +
      '  (layout says ' + Math.round(g.layout.cancel.x + g.layout.cancel.width / 2) +
      ',' + Math.round(g.layout.cancel.y + g.layout.cancel.height / 2) + ')')
    note('CANCEL ' + (cbx > VP.w * 0.6 && cby > VP.h * 0.7
      ? 'is in the bottom-right HUD corner'
      : '*** is still over the board ***'))
    note('CANCEL visible while armed: ' + g.cancelVisible)

    // PRESS THE BUTTON, rather than poking status.mode. Setting the mode by
    // hand is not the path a player takes and does not exercise the teardown:
    // the first version of this probe did exactly that, read the cursor still
    // showing, and reported a bug that was its own.
    click(cbx, cby)
    await sleep(300)
    note('after pressing CANCEL: mode=' + g.status.mode +
      ' cursor=' + g.castCursor.state + ' cancelVisible=' + g.cancelVisible)
    note('CANCEL ' + (g.status.mode === 'normal' && g.castCursor.state === 'hidden'
      ? 'disarms the ability and takes the cursor with it'
      : '*** did not disarm: mode=' + g.status.mode + ' cursor=' + g.castCursor.state + ' ***'))

    // Off the path first: a gnome in a field blocks nothing, so the cast has
    // to be refused rather than wasted.
    const off = [g.build.spots[0].x, g.build.spots[0].y]
    note('off-path distance to lane: ' + Math.round(g.lane.distanceTo(off[0], off[1])) +
      ' (limit ' + g.abilityDef('gnomes').pathOnlyWithin + ')')
    g.fireAbility('gnomes', off[0], off[1])
    await sleep(300)
    note('off-path cast: fighters=' + g.fighters.length + ' msg="' + g.status.message + '"' +
      ' cooldownReady=' + g.cooldowns.ready('gnomes'))

    // Then on the lane, just ahead of the lead enemy, so the pair actually
    // meets something and the size comparison is a frame, not arithmetic.
    const lead = g.enemies.reduce((a, b) => (a.distance > b.distance ? a : b))
    const on = g.lane.pointAt(lead.distance + 70)
    g.cooldowns.reset('gnomes')
    g.fireAbility('gnomes', on.x, on.y)
    note('on-path cast: fighters=' + g.fighters.length + ' msg="' + g.status.message + '"')

    // Held up for the pictures. A director-side cheat: they are dead in under
    // a second otherwise, which is measured separately below.
    for (const f of g.fighters) f.health = 99999
    await sleep(500)
    for (const f of g.fighters) {
      const a = f.art
      note('  gnome ' + a.texture.key + ' ' + Math.round(a.displayWidth) + 'x' +
        Math.round(a.displayHeight) + ' origin ' + a.originX + ',' + a.originY +
        ' rot=' + a.rotation.toFixed(2) + ' depth=' + Math.round(f.depth) +
        ' shadow=' + (f.list[0]?.texture?.key ?? 'NONE'))
    }
    const keys = g.fighters.map((f) => f.art.texture.key)
    note('distinct sprites: ' + new Set(keys).size + ' of ' + keys.length)

    // Sizes on the glass, against what they stand beside.
    const z = g.cameras.main.zoom
    const soldier = g.enemies.find((e) => e.def.tier === 'basic')
    note('on screen at zoom ' + z.toFixed(2) + ': gnome ' +
      Math.round(g.fighters[0].art.displayHeight * z) + 'px, ' + soldier.def.name + ' ' +
      Math.round(soldier.art.displayHeight * z) + 'px, hero ' +
      Math.round(g.hero.list[1].displayHeight * z) + 'px')

    // Facing: right by default, mirrored for a target on the left.
    const f0 = g.fighters[0]
    f0.face(0)
    note('facing a target to the right: flipX=' + f0.art.flipX + ' artX=' + f0.art.x.toFixed(1))
    f0.face(Math.PI)
    note('facing a target to the left:  flipX=' + f0.art.flipX + ' artX=' + f0.art.x.toFixed(1))

    g.cameras.main.centerOn(on.x, on.y)
    await sleep(300)
    await shot('gnomes-01-on-path')
    await until(() => g.enemies.some((e) => Math.hypot(e.x - on.x, e.y - on.y) < 34), 20000)
    await sleep(500)
    note('under fire: flipX=' + g.fighters.map((f) => f.art.flipX).join(',') +
      ' depths=' + g.fighters.map((f) => Math.round(f.depth)).join(','))
    await shot('gnomes-02-fighting')

    // And now the honest one: real health, and how long two gnomes last.
    for (const f of g.fighters) f.health = 0
    await sleep(300)
    g.cooldowns.reset('gnomes')
    const lead2 = g.enemies.reduce((a, b) => (a.distance > b.distance ? a : b))
    const on2 = g.lane.pointAt(lead2.distance + 50)
    g.fireAbility('gnomes', on2.x, on2.y)
    const hits = []
    for (const f of g.fighters) {
      const orig = f.hurt.bind(f)
      f.hurt = (amt) => { hits.push(amt); return orig(amt) }
    }
    const t0 = performance.now()
    await until(() => g.fighters.length === 0, 20000)
    note('survivability: 2 gnomes (90hp each) gone in ' +
      Math.round(performance.now() - t0) + 'ms after ' + hits.length + ' hits for ' +
      hits.reduce((a, b) => a + b, 0) + ' damage; a Late Filer does 7 every 1.0s')
    return
  }

  if (scenario === 'herofx') {
    // The four things a player is supposed to be able to see.
    const hero = g.hero
    g.status.peanuts = 99999
    await build(3, 0)
    // Wave 6 is five Final Notices and ten Shredders. It has to be a wave with
    // armour in it: Depreciation strips armour, and two of the three enemy
    // types have none, so against waves 1-3 the passive genuinely does nothing
    // and no amount of effects would make it read.
    g.status.wave = Number(arg || 5)
    g.startWave()
    await until(() => g.enemies.length > 2, 30000)

    const spot = g.lane.pointAt(g.lane.totalLength * 0.5)
    hero.setRally(spot.x, spot.y)
    await until(() => Math.hypot(hero.x - spot.x, hero.y - spot.y) < 12, 20000)
    await lookAt(hero.x, hero.y)

    // 1. Depreciation. A ring at the shred radius, and a mark on what is in it.
    // Specifically an ARMOURED one. The Final Notice walks at 40 and the
    // Shredder at 122, so waiting for "any enemy in the ring" reliably catches
    // the one type the passive cannot do anything to.
    await until(() => g.enemies.some((e) => e.def.armor > 0 &&
      Math.hypot(e.x - hero.x, e.y - hero.y) < hero.def.passive.armorShredRadius), 45000)
    await sleep(1400)
    const inRing = g.enemies.filter((e) =>
      Math.hypot(e.x - hero.x, e.y - hero.y) < hero.def.passive.armorShredRadius)
    note('passive: ' + inRing.length + ' enemies in the ' +
      hero.def.passive.armorShredRadius + 'px ring; shred marks on ' +
      inRing.filter((e) => e.shreddingFor > 0).length +
      '; armour now ' + inRing.map((e) => e.def.armor + '->' + e.effectiveArmor.toFixed(1)).join(' '))
    note('blocking ' + hero.blocking + ' of ' + hero.def.blockCapacity)
    await shot('herofx-01-passive')

    // 2. Haymaker.
    g.cooldowns.reset('haymaker')
    const before = g.enemies.map((e) => ({ e, x: e.x, y: e.y, hp: e.health }))
    g.castHaymaker()
    await sleep(60)
    note('haymaker: hitPaused=' + g.hitPaused)
    await shot('herofx-02-haymaker')
    await sleep(500)
    const moved = before
      .filter((b) => b.e.active)
      .map((b) => Math.round(Math.hypot(b.e.x - b.x, b.e.y - b.y)))
      .filter((d) => d > 4)
    note('haymaker: knocked back ' + moved.join(',') + 'px (data says ' +
      hero.def.haymaker.knockbackPixels + '); hitPaused now ' + g.hitPaused)

    // 3. Restructure, which should travel rather than teleport.
    const tower = g.towers[0]
    const freeSpot = g.build.spots.findIndex((sp, i) => g.build.isFree(i))
    if (tower && freeSpot >= 0) {
      const from = { x: tower.x, y: tower.y }
      g.cooldowns.reset('restructure')
      g.armRestructure()
      g.doRestructure(tower.x, tower.y)
      g.doRestructure(g.build.spots[freeSpot].x, g.build.spots[freeSpot].y)
      await sleep(180)
      const mid = { x: tower.x, y: tower.y }
      note('restructure: from ' + Math.round(from.x) + ',' + Math.round(from.y) +
        ' -> at 180ms ' + Math.round(mid.x) + ',' + Math.round(mid.y) +
        ' (lifted ' + Math.round(from.y - mid.y) + 'px)')
      await lookAt(tower.x, tower.y)
      await shot('herofx-03-restructure')
      await sleep(700)
      note('restructure: landed ' + Math.round(tower.x) + ',' + Math.round(tower.y) +
        ' target ' + Math.round(g.build.spots[freeSpot].x) + ',' +
        Math.round(g.build.spots[freeSpot].y) +
        '; cooldown ' + g.cooldowns.secondsLeft('restructure').toFixed(1) + 's of ' +
        hero.def.restructure.cooldown + 's, ready=' + g.cooldowns.ready('restructure') +
        '; mode=' + g.status.mode + ' CANCEL visible=' + g.cancelVisible)
    }

    // 4. Last Stand, forced, and the invulnerability that makes it happen.
    await lookAt(hero.x, hero.y)
    hero.health = hero.def.maxHealth * 0.3
    const killed = hero.hurt(hero.def.maxHealth * 4)
    note('a hit four times his total health at 30%: result=' + killed +
      ' health=' + Math.round(hero.health) + '/' + hero.def.maxHealth +
      ' (threshold ' + Math.round(hero.def.maxHealth * hero.def.lastStand.healthThreshold) + ')' +
      ' lastStandActive=' + hero.lastStandActive + ' down=' + hero.down)
    note('invulnerable for ' + hero.invulnerableFor.toFixed(2) + 's; a further huge hit: ' +
      hero.hurt(9999) + ' health=' + Math.round(hero.health))
    await sleep(200)
    await shot('herofx-04-laststand-flash')
    await sleep(900)
    await shot('herofx-05-dadmode')
    note('after the transform: sprite=' + hero.list[1].texture.key +
      ' active=' + hero.lastStandActive + ' down=' + hero.down)
    return
  }

  if (scenario === 'towertiers') {
    // The Withholding Tower changing shape as it upgrades.
    g.status.peanuts = 99999
    await build(3, 0)
    const t = g.towers[0]
    await lookAt(t.x, t.y)
    const dump = (label) => {
      note(label + ': tier=' + t.tier + ' texture=' + t.turret.texture.key +
        ' source ' + t.turret.texture.source[0].width + 'x' + t.turret.texture.source[0].height +
        ' world ' + t.turret.displayWidth.toFixed(1) + 'x' + t.turret.displayHeight.toFixed(1) +
        ' on screen ' + Math.round(t.turret.displayHeight * g.cameras.main.zoom) + 'px' +
        ' base at y=' + Math.round(t.y) + ' origin ' + t.turret.originX + ',' + t.turret.originY)
    }
    dump('tier 1')
    await shot('towertiers-01')

    for (const spec of [null, 'garnishment']) {
      const baseY = t.y
      t.beginUpgrade(spec)
      await until(() => !t.upgrading, 30000)
      await sleep(400)
      dump('after upgrade' + (spec ? ' to ' + spec : ''))
      note('   base stayed put: y ' + Math.round(baseY) + ' -> ' + Math.round(t.y) +
        ' (drift ' + Math.round(Math.abs(t.y - baseY)) + 'px)')
      await shot('towertiers-0' + (t.tier))
    }

    // And the five without tier art must be untouched by any of this.
    g.status.peanuts = 99999
    await build(1, 1)
    const other = g.towers[1]
    if (other) {
      const before = other.turret.texture.key
      other.beginUpgrade(null)
      await until(() => !other.upgrading, 30000)
      await sleep(200)
      note('a tower with no tier art: ' + other.def.name + ' tier=' + other.tier +
        ' texture ' + before + ' -> ' + other.turret.texture.key +
        ' (unchanged=' + (before === other.turret.texture.key) + ')')
    }
    return
  }

  if (scenario === 'modal') {
    // Three overlays, one rule: while a modal is up the board must not move,
    // the HUD must not be drawn or touchable, and nothing behind it may act.
    const hud = game.scene.getScene('Hud')
    const cam = () => g.cameras.main
    const camState = () => Math.round(cam().scrollX) + ',' + Math.round(cam().scrollY) +
      ' zoom ' + cam().zoom.toFixed(3)

    // Drags the pointer across the middle of the screen, the way scratching does.
    const dragAcross = async (label) => {
      const before = camState()
      const movesBefore = g.rig.moveCount
      // Read at the START. Scratching a card uncovers it, and an uncovered
      // card pays out and closes — so a reading taken after the drag can
      // describe a modal that is no longer there.
      const modalAtStart = g.modalOpen
      const cx = innerWidth / 2, cy = innerHeight / 2
      for (const [dx, dy] of [[-120, 0], [120, 0], [0, -90], [0, 90], [-90, -70], [90, 70]]) {
        mouse('mousedown', cx, cy)
        for (let i = 1; i <= 8; i++) {
          await move(cx + (dx * i) / 8, cy + (dy * i) / 8)
        }
        mouse('mouseup', cx + dx, cy + dy)
        await sleep(40)
      }
      await sleep(200)
      const after = camState()
      note('  ' + label + ': modalOpen=' + modalAtStart + ' camera ' + before + ' -> ' + after +
        (before === after ? '  UNMOVED' : '  *** MOVED ***') +
        '  [rig enabled=' + g.rig.isEnabled + ' moves accepted=' +
        (g.rig.moveCount - movesBefore) + ']')
      return before === after
    }

    // The decisive check is not a flag but a tap. Scene-level input being off
    // means the per-object `hit.input.enabled` flags stay true and are simply
    // never consulted, so reading them would report the HUD as live when it is
    // not. Press the thing and see whether anything happens.
    const hudState = async (label) => {
      let fired = 0
      const orig = g.armAbility.bind(g)
      const origH = g.castHaymaker.bind(g)
      const origW = g.startWave.bind(g)
      g.armAbility = (id) => { fired++; return orig(id) }
      g.castHaymaker = () => { fired++; return origH() }
      g.startWave = () => { fired++; return origW() }
      for (const sl of hud.slots) {
        const b = sl.hit.getBounds()
        await click(b.centerX, b.centerY)
        await sleep(50)
      }
      g.armAbility = orig; g.castHaymaker = origH; g.startWave = origW
      note('  ' + label + ': HUD camera visible=' + hud.cameras.main.visible +
        ' scene input=' + (hud.input ? hud.input.enabled : 'n/a') +
        ' | tapped all ' + hud.slots.length + ' ability slots -> ' + fired +
        ' reached the game' + (fired === 0 ? '  (dead, as required)' : ''))
      return fired
    }

    g.status.peanuts = 99999
    await build(3, 0)
    g.startWave()
    await sleep(1200)
    note('no modal:')
    await hudState('idle')
    const movedFreely = !(await dragAcross('drag with nothing open'))
    note('  (a drag with nothing open SHOULD move the camera: ' + movedFreely + ')')

    // 1. The scratch card.
    // Held open for the whole probe. The card reveals itself after 3.5s and
    // destroys itself, and a drag that outlives it measures the wrong thing —
    // which is exactly what the first run of this scenario did.
    g.showTicket({ label: '', payout: 70, weight: 1 }, 600)
    await sleep(500)
    note('scratch card open (modalOpen=' + g.modalOpen + '):')
    await hudState('with the card up')
    await dragAcross('scratching in six directions')
    await shot('modal-01-scratch')
    g.ticket && g.ticket.destroy()
    await sleep(300)

    // 2. The results dialog, which is where the ability bar was drawing over
    //    both buttons.
    g.endRun('lost')
    await sleep(700)
    note('results dialog open (modalOpen=' + g.modalOpen + '):')
    await hudState('with the results up')
    await dragAcross('drag behind the results panel')
    await shot('modal-02-results')
    return
  }

  if (scenario === 'scrim') {
    // Does the modal dim actually cover the SCREEN, at this device ratio?
    //
    // The bug it exists for: a blocker centred on (0, 0) and made oversize
    // reaches the far corner only when the UI camera's zoom is 1. At
    // devicePixelRatio 3 the zoom is 3, the rect's right edge lands at half
    // the canvas, and the dim covers the top-left quadrant. Reading the
    // rectangle's own bounds cannot see this — they are correct — so the only
    // honest probe is the pixels at the four corners.
    //
    // Ratio, not raw value. after/before is the same number at every corner
    // for a scrim that covers the screen, whatever the map paints underneath,
    // whereas raw luminances only agreed in the earlier measurement because
    // this map's four corners happen to be similar.
    const g = scene('Game'), hud = scene('Hud')
    const dpr = window.devicePixelRatio || 1
    note('viewport ' + VP.w + 'x' + VP.h + '  devicePixelRatio ' + dpr)

    const probe = document.createElement('canvas')
    const corners = () => {
      const c = game.canvas
      probe.width = c.width; probe.height = c.height
      const ctx = probe.getContext('2d')
      ctx.drawImage(c, 0, 0)
      const W = c.width, H = c.height
      const at = (x, y) => {
        const d = ctx.getImageData(x, y, 1, 1).data
        // Rec. 601 luma, which is what the earlier corner measurement used.
        return 0.299 * d[0] + 0.587 * d[1] + 0.114 * d[2]
      }
      return [at(2, 2), at(W - 3, 2), at(2, H - 3), at(W - 3, H - 3)]
    }
    const fmt = (a) => a.map((v) => v.toFixed(0)).join(' / ')

    // No wave is started: a moving enemy near a corner would change the pixel
    // between the two samples. The HUD is hidden throughout because every
    // modal hides it, and a counter in the corner would otherwise be read as
    // scrim.
    const hudWasVisible = hud.cameras.main.visible
    hud.cameras.main.visible = false
    await sleep(220)
    note('bare map corners (TL/TR/BL/BR): ' + fmt(corners()))

    let failures = 0
    const measure = async (label, open, close, expectedDim, probeObj, litDelay) => {
      // The baseline is taken immediately before and immediately after, and
      // averaged. The map is not static — the tavern lights flicker — and one
      // baseline taken at the top of the scenario put a 6% error on whichever
      // corner a flicker happened to be near, which is the same size as the
      // fault being looked for.
      hud.cameras.main.visible = false
      await sleep(120)
      const before = corners()
      open()
      // The earned overlay flashes the camera white at 420ms and shakes it, so
      // it is sampled before that: the question is whether the DIM reaches the
      // corners, and a white flash is not an answer to it.
      await sleep(litDelay || 420)
      hud.cameras.main.visible = false
      const lit = corners()
      // The rectangle's own geometry beside the pixels, because "the bounds
      // are right and the screen is still bright" is the whole shape of this
      // bug and a pass/fail line alone would not say which half moved.
      const b = probeObj && probeObj()
      if (b) {
        const r = b.getBounds()
        const uc = g.uiCam || g.cameras.cameras.find((c) => c !== g.cameras.main)
        note('      blocker bounds ' + [r.x, r.y, r.width, r.height].map(Math.round).join(',') +
          ' scrollFactor ' + b.scrollFactorX +
          ' | uiCam ' + (uc ? 'zoom ' + uc.zoom.toFixed(2) + ' view ' +
            [uc.worldView.x, uc.worldView.y, uc.worldView.width, uc.worldView.height]
              .map(Math.round).join(',') : 'none') +
          ' | filter ' + b.cameraFilter)
      }
      await shot('scrim-' + label)
      close()
      await sleep(300)
      hud.cameras.main.visible = false
      await sleep(120)
      const after = corners()
      const base = before.map((v, i) => (v + after[i]) / 2)
      const drift = before.map((v, i) => Math.abs(v - after[i]))
      const ratio = lit.map((v, i) => v / Math.max(base[i], 1))
      const spread = Math.max(...ratio) - Math.min(...ratio)
      const mean = ratio.reduce((a, b) => a + b, 0) / 4
      // The map is not still: the tavern lights flicker, and a corner near one
      // can move 12% between the two baselines. Averaging halves that, so the
      // residual uncertainty on a corner's ratio is half its drift over its
      // value. Carried explicitly rather than absorbed into a fat tolerance —
      // the fault this looks for measured 0.364, an order of magnitude above
      // any slack the flicker can buy.
      const slack = Math.max(...drift.map((d, i) => (d / 2) / Math.max(base[i], 1)))
      // Covered means two things, and a scrim can fail either: every corner
      // dimmed by the SAME fraction, and that fraction actually being a dim.
      const even = spread <= 0.06 + slack
      const dark = mean <= 1 - expectedDim * 0.6
      if (!even || !dark) failures++
      note('  ' + label + ': corners ' + fmt(lit) +
        '  raw spread ' + (Math.max(...lit) - Math.min(...lit)).toFixed(0) +
        '\n      kept ' + ratio.map((r) => r.toFixed(3)).join(' / ') +
        '  spread ' + spread.toFixed(3) +
        (even ? '  EVEN' : '  *** UNEVEN — the scrim does not reach every corner ***') +
        (dark ? '' : '  *** NOT DIMMED (expected alpha ' + expectedDim + ') ***') +
        '\n      baseline drift ' + fmt(drift) + '  slack ' + slack.toFixed(3))
    }

    const NUKE = await import('./js/ui/NukeOverlays.js')

    await measure('scratchcard', () => g.showTicket({ label: '', payout: 70, weight: 1 }, 9000),
      () => g.ticket && g.ticket.destroy(), 0.35, () => g.ticket && g.ticket.blocker)

    await measure('dialog', () => g.openDialog({
      title: 'SCRIM PROBE', rows: [{ label: 'corner', value: 'luminance' }], cancelLabel: 'CLOSE',
    }), () => g.dialog && g.dialog.close(), 0.45, () => g.dialog && g.dialog.blocker)

    let earned = null
    await measure('nuke-earned', () => {
      earned = new NUKE.NukeEarnedOverlay(g, 'ability-servernuke',
        { x: VP.w / 2, y: VP.h - 40, height: 40 }, () => {})
      earned.onEffect = (o) => g.asScreenSpace([o])
      g.asScreenSpace(earned.objects)
    }, () => { if (earned && earned.active) earned.close() }, 0.78,
      () => earned && earned.blocker, 240)

    await measure('nuke-launch', () => g.openNukeLaunch(),
      () => { if (g.nukeLaunch) { g.nukeLaunch.close(); g.nukeLaunch = null } }, 0.72,
      () => g.nukeLaunch && g.nukeLaunch.blocker)

    hud.cameras.main.visible = hudWasVisible
    note('RESULT ' + (failures === 0
      ? 'every scrim covered all four corners evenly at dpr ' + dpr
      : failures + ' scrim(s) FAILED at dpr ' + dpr))
    return
  }

  if (scenario === 'stunlock') {
    // What Filing Extension's two tier-3 specializations actually do to an
    // enemy, measured rather than reasoned about. The report says "Deferral
    // stops enemies for 0.6s"; the data says Deferral is a 2.0s SLOW and
    // Amendment is the 0.6s stun, so both are measured.
    const spec = arg || 'deferral'
    g.status.peanuts = 99999
    // The menu only offers UNLOCKED towers, in draft order, so the index in
    // the tower table is not the index in the menu. Force the unlock and take
    // the first slot.
    // The menu is rebuilt when a tower is UNLOCKED, not when it is opened, so
    // setting the list is not enough on its own.
    g.status.unlockedTowers = ['extension']
    g.refreshMenuOptions()
    // Optionally two of them, because "two of these stacking should not lock
    // down the whole lane" is a different question from what one does.
    const howMany = /2$/.test(spec) ? 2 : 1
    const want = spec.replace(/2$/, '')
    const free = g.build.spots.map((sp, i) => i).filter((i) => g.build.isFree(i))
    for (let n = 0; n < howMany; n++) await build(free[n], 0)
    const t = g.towers[0]
    if (!t) { note('no tower built'); return }
    note('towers built: ' + g.towers.length)
    note('tower ' + t.def.name + ' fireInterval base ' + t.def.fireInterval)
    // Wait on the TIER, not on `upgrading`: the flag is false for the frame
    // between asking and the build starting, so `!upgrading` returns true
    // immediately and the next upgrade is refused for being at the wrong tier.
    for (const tw of g.towers) tw.beginUpgrade(null)
    await until(() => g.towers.every((tw) => tw.tier === 2), 30000)
    note('after first upgrade: tier=' + t.tier + ' upgrading=' + t.upgrading +
      ' atSpecChoice=' + t.atSpecChoice +
      ' specs=' + t.def.specializations.map((x) => x.id).join(','))
    for (const tw of g.towers) tw.beginUpgrade(want)
    await until(() => g.towers.every((tw) => tw.tier === 3), 30000)
    note('spec=' + t.spec + ' tier=' + t.tier +
      ' fireInterval ' + t.fireInterval.toFixed(3) + 's range ' + Math.round(t.range) +
      ' slowSeconds ' + t.slowSeconds +
      ' stunSeconds ' + (t.behaviour.stunSeconds ?? 0) +
      ' chainTargets ' + (t.behaviour.chainTargets ?? 0))

    g.status.wave = 5
    g.startWave()
    await until(() => g.enemies.length > 3, 30000)

    // Follow individual enemies through the tower's range and record what
    // fraction of the time they are stopped, slowed, or moving freely.
    const track = new Map()
    const t0 = performance.now()
    while (performance.now() - t0 < 22000) {
      await sleep(50)
      for (const e of g.enemies) {
        if (!e.alive) continue
        const inAny = g.towers.some((tw) => Math.hypot(e.x - tw.x, e.y - tw.y) <= tw.range)
        if (!inAny) continue
        let r = track.get(e)
        if (!r) { r = { n: 0, stunned: 0, slowed: 0, startDist: e.distance }; track.set(e, r) }
        r.n++
        if (e.stunned) r.stunned++
        else if (e.slowed) r.slowed++
        r.endDist = e.distance
      }
    }
    const rows = [...track.values()].filter((r) => r.n >= 20)
    if (rows.length === 0) { note('nothing stayed in range long enough'); return }
    const mean = (f) => rows.reduce((a, r) => a + f(r), 0) / rows.length
    note('tracked ' + rows.length + ' enemies inside range of ' + g.towers.length + ' tower(s):')
    note('  stunned  ' + (100 * mean((r) => r.stunned / r.n)).toFixed(1) + '% of the time')
    note('  slowed   ' + (100 * mean((r) => r.slowed / r.n)).toFixed(1) + '%')
    note('  free     ' + (100 * mean((r) => 1 - (r.stunned + r.slowed) / r.n)).toFixed(1) + '%')
    // The number that matters: how far did they actually get?
    const secs = 22
    note('  advanced ' + mean((r) => (r.endDist - r.startDist)).toFixed(0) +
      'px while tracked; unimpeded that would be about ' +
      Math.round(58 * secs * GAME_SPEED * mean((r) => r.n * 0.05 / secs)) + 'px')
    await shot('stunlock-' + spec)
    void t
    return
  }

  if (scenario === 'nukeseq') {
    // Both Server Nuke moments, at whatever viewport the run was given.
    const hud = game.scene.getScene('Hud')
    const vp = VP.w + 'x' + VP.h
    note('viewport ' + vp)
    g.status.peanuts = 99999
    await build(3, 0)
    g.startWave()
    await sleep(900)

    // --- 1. Earned -------------------------------------------------------
    g.status.rareAbility = 'serverNuke'
    g.cooldowns.reset('serverNuke')
    g.announceRareDrop('Server Nuke')
    await sleep(260)
    const ov = g.nukeEarned
    note('earned: overlay=' + !!ov + ' modalOpen=' + g.modalOpen +
      ' HUD visible=' + hud.cameras.main.visible)
    await shot('nukeseq-01-earned-' + vp)
    await sleep(420)
    await shot('nukeseq-02-slam-' + vp)

    // Everything on screen must be inside the viewport.
    const clipped = []
    const check = (label, obj) => {
      if (!obj) return
      const b = obj.getBounds()
      if (b.x < -1 || b.y < -1 || b.right > VP.w + 1 || b.bottom > VP.h + 1) {

    await until(() => !g.nukeEarned, 6000)
    note('earned overlay closed; rareAbility=' + g.status.rareAbility +
      ' modalOpen=' + g.modalOpen + ' HUD visible=' + hud.cameras.main.visible)

    // --- 2. Launch confirmation -----------------------------------------
    await sleep(400)
    g.armAbility('serverNuke')
    await sleep(500)
    const lp = g.nukeLaunch
    note('launch: panel=' + !!lp + ' modalOpen=' + g.modalOpen +
      ' HUD visible=' + hud.cameras.main.visible + ' casting=' + g.casting)
    await shot('nukeseq-03-launch-' + vp)
    const clip2 = []
    if (lp) {
      const bb = lp.button.getBounds()
      note('  button ' + Math.round(bb.width) + 'x' + Math.round(bb.height) +
        ' at ' + Math.round(bb.centerX) + ',' + Math.round(bb.centerY))
      const cb = lp.closeHit.getBounds()
      note('  X hit ' + Math.round(cb.width) + 'x' + Math.round(cb.height) +
        ' at ' + Math.round(cb.centerX) + ',' + Math.round(cb.centerY) +
        '; distance from the dome centre ' +
        Math.round(Math.hypot(cb.centerX - bb.centerX, cb.centerY - bb.centerY)) + 'px')
      for (const [n, o] of [['button', lp.button], ['X', lp.closeHit]]) {

    await click(VP.w * 0.82, VP.h * 0.5)
    await sleep(250)
    note('  tap on empty space: panel still open=' + !!g.nukeLaunch +
      ' rare=' + g.status.rareAbility + ' casting=' + g.casting +
      (!!g.nukeLaunch === before.open && g.casting === before.casting ? '  (nothing happened)' : '  *** SOMETHING HAPPENED ***'))

    // The X cancels and the ability survives.
    const cb2 = g.nukeLaunch.closeHit.getBounds()
    await click(cb2.centerX, cb2.centerY)
    await sleep(300)
    note('  tap the X: panel=' + !!g.nukeLaunch + ' rare=' + g.status.rareAbility +
      ' casting=' + g.casting + ' modalOpen=' + g.modalOpen)

    // And the dome fires it.
    g.armAbility('serverNuke')
    await sleep(450)
    const hb = g.nukeLaunch.hit.getBounds()
    await click(hb.centerX, hb.centerY)
    await sleep(200)
    await shot('nukeseq-04-pressed-' + vp)
    await sleep(700)
    note('  press the dome: panel=' + !!g.nukeLaunch + ' casting=' + g.casting +
      ' rare=' + g.status.rareAbility)
    await sleep(2500)
    note('  after the cast: rare=' + g.status.rareAbility + ' casting=' + g.casting)
    return
  }

  if (scenario === 'rollspeed') {
    for (const k of ['Title', 'Splash', 'Boot', 'Game', 'Hud', 'Loadout']) game.scene.stop(k)
    game.scene.start('Credits')
    await until(() => running('Credits'), 8000)
    await sleep(300)
    const sc = scene('Credits')
    const C = (await import('./js/data/credits.json', { with: { type: 'json' } })).default
    let bottom = 0
    for (const o of sc.roll.list) {
      if (!o.getBounds) continue
      const b = o.getBounds()
      bottom = Math.max(bottom, b.bottom - sc.roll.y)
    }
    const H = 720
    const travel = bottom + H
    note('roll height ' + Math.round(bottom) + 'px, travel ' + Math.round(travel) + 'px')
    for (const secs of [50, 60, 70, 80, 90, 100]) {
      note('   ' + String(secs).padStart(3) + 's -> ' + (travel / secs).toFixed(0) + ' px/sec' +
        (secs === C.scrollSeconds ? '   <- configured' : ''))
    }
    // A 26px credit line occupies LINE_H = 46px, so this is how long one line
    // is on screen at each speed.
    note('one credit line is on screen for:')
    for (const secs of [60, 75, 90]) {
      note('   ' + secs + 's -> ' + ((H) / (travel / secs)).toFixed(1) + 's per screenful, ' +
        (46 / (travel / secs)).toFixed(2) + 's per line')
    }
    return
  }

  if (scenario === 'fps') {
    // Framerate with the scatter, the tavern ambience and a full wave.
    g.status.peanuts = 99999
    await build(3, 0)
    await build(1, 1)
    g.startWave()
    await sleep(9000)
    const sample = async (label) => {
      const frames = []
      let last = performance.now()
      const t0 = performance.now()
      while (performance.now() - t0 < 4000) {
        await new Promise((r) => requestAnimationFrame(r))
        const now = performance.now()
        frames.push(now - last)
        last = now
      }
      frames.sort((a, b) => a - b)
      const mean = frames.reduce((a, b) => a + b, 0) / frames.length
      const p95 = frames[Math.floor(frames.length * 0.95)]
      note('  ' + label + ': ' + (1000 / mean).toFixed(1) + ' fps mean, worst 5% of frames ' +
        p95.toFixed(1) + 'ms, ' + frames.length + ' frames')
    }
    note('viewport ' + VP.w + 'x' + VP.h)
    note('scatter props on the board: ' + g.scatterCount)
    note('enemies alive: ' + g.enemies.length + '  towers: ' + g.towers.length)
    await sample('with scatter + ambience')

    // The same board with the decoration hidden, so the cost is measured
    // rather than asserted.
    const deco = g.children.list.filter((o) => o.depth <= -900 + 3 && o.visible)
    for (const o of deco) o.setVisible(false)
    await sample('decoration hidden (' + deco.length + ' objects)')
    for (const o of deco) o.setVisible(true)
    return
  }

  if (scenario === 'music') {
    // Requirement 8: title, loadout, a full level, back to title, three times.
    // Only one track audible at a time, and nothing accumulating.
    const M = await import('./js/systems/Music.js')
    // The harness never produces a real user gesture the browser trusts, so
    // the unlock is asked for directly. Everything after this is the real
    // code path.
    const A = await import('./js/systems/Audio.js')
    note('audio unavailable: ' + A.audioUnavailable() + '  muted: ' + A.isMuted() + '  volume: ' + A.getVolume())
    M.unlockMusic()
    M.playTrack('battle')
    await sleep(400)
    note('after a direct playTrack: track=' + M.currentTrack() + ' elements=' + document.querySelectorAll('audio').length)

    const state = (label) => {
      // Counted through the module, not the DOM: `new Audio()` is never
      // attached to the document, so querySelectorAll finds nothing and would
      // have reported a clean bill of health whatever the code did.
      const rep = M.deckReport()
      const playing = rep.filter((d) => !d.paused && d.volume > 0.001)
      note('  ' + label.padEnd(22) +
        ' routed=' + JSON.stringify(M.routedDecks()) +
        ' track=' + String(M.currentTrack()) +
        '  decks=' + JSON.stringify(M.audibleTracks()) +
        '  elements=' + M.liveElementCount() +
        '  audible=' + playing.length +
        '  ' + JSON.stringify(rep.map((d) => (d.id ?? '-') + '@' + d.volume.toFixed(2))))
      return { els: M.liveElementCount(), decks: M.audibleTracks().length, audible: playing.length }
    }

    const worst = { els: 0, decks: 0, audible: 0 }
    const record = (s) => {
      worst.els = Math.max(worst.els, s.els)
      worst.decks = Math.max(worst.decks, s.decks)
      worst.audible = Math.max(worst.audible, s.audible)
    }

    note('viewport ' + VP.w + 'x' + VP.h)
    for (let run = 1; run <= 3; run++) {
      note('run ' + run + ':')
      for (const k of ['Game', 'Loadout', 'Credits']) game.scene.stop(k)
      game.scene.start('Title')
      await until(() => running('Title'), 8000)
      await sleep(1400)
      record(state('title'))
      const afterTitle = M.currentTrack()

      game.scene.stop('Title')
      game.scene.start('Loadout')
      await until(() => running('Loadout'), 8000)
      await sleep(300)
      const afterLoadout = M.currentTrack()
      record(state('loadout'))
      note('    title -> loadout kept the same track: ' +
        (afterTitle === afterLoadout ? 'YES (' + afterTitle + ')' : 'NO *** it changed ***'))
      // And it must not have restarted: the element is the same object and
      // its clock has kept running.
      const t1 = M.currentPosition()
      await sleep(700)
      const t2 = M.currentPosition()
      note('    and it kept playing rather than restarting: ' +
        (t2 > t1 ? 'YES (' + t1.toFixed(1) + 's -> ' + t2.toFixed(1) + 's)' : 'position did not advance (no audio device?)'))

      game.scene.stop('Loadout')
      game.scene.start('Game')
      game.scene.start('Hud')
      await until(() => running('Game'), 10000)
      await sleep(1600)
      record(state('level'))

      game.scene.stop('Game'); game.scene.stop('Hud')
      game.scene.start('Title')
      await until(() => running('Title'), 8000)
      await sleep(1600)
      record(state('back to title'))
    }
    note('WORST OVER 3 RUNS: <audio> elements=' + worst.els +
      '  decks loaded=' + worst.decks + '  audible at once=' + worst.audible)
    note('RESULT ' + (worst.els <= 2 && worst.decks <= 2 && worst.audible <= 1
      ? 'no accumulation, never more than one audible'
      : '*** LEAK ***'))
    return
  }

  if (scenario === 'levels') {
    // Level-matching, measured rather than guessed.
    //
    // "By ear" is not available to me, so the next most honest thing is to
    // measure what the ear is responding to: not peak, which both files hit,
    // but the RMS of the loud parts — roughly how loud a track SEEMS.
    const MJ = (await import('./js/data/music.json', { with: { type: 'json' } })).default
    const ctx = new (window.AudioContext || window.webkitAudioContext)()
    const out = []
    for (const [id, t] of Object.entries(MJ.tracks)) {
      const res = await fetch('/' + MJ.root + t.file + '.' + t.format)
      const buf = await ctx.decodeAudioData(await res.arrayBuffer())
      const ch = buf.getChannelData(0)
      // Window into 300ms blocks, take the RMS of each, then average the
      // loudest half. Averaging everything lets a quiet intro drag an
      // orchestral track's number down and mis-match it against a
      // wall-of-sound electro one.
      const win = Math.floor(buf.sampleRate * 0.3)
      const blocks = []
      let peak = 0
      for (let i = 0; i + win < ch.length; i += win) {
        let sum = 0
        for (let j = i; j < i + win; j++) {
          const v = ch[j]
          sum += v * v
          const a = v < 0 ? -v : v
          if (a > peak) peak = a
        }
        blocks.push(Math.sqrt(sum / win))
      }
      blocks.sort((a, b) => b - a)
      const loud = blocks.slice(0, Math.max(1, Math.floor(blocks.length / 2)))
      const rms = loud.reduce((a, b) => a + b, 0) / loud.length
      const db = (x) => (20 * Math.log10(Math.max(1e-6, x))).toFixed(1)
      out.push({ id, gain: t.gain, rms, peak, secs: buf.duration })
      note(id.padEnd(14) + ' ' + Math.round(buf.duration) + 's  peak ' + db(peak) + ' dBFS' +
        '  loud-half RMS ' + db(rms) + ' dBFS  (configured gain ' + t.gain + ')')
    }
    // What the two would sound like at their configured gains, and what gain
    // would actually match them.
    const [a, b] = out
    const db = (x) => (20 * Math.log10(Math.max(1e-6, x))).toFixed(1)
    note('at the configured gains: ' +
      out.map((t) => t.id + ' ' + db(t.rms * t.gain) + ' dBFS').join('  vs  '))
    note('difference at those gains: ' +
      (20 * Math.log10((a.rms * a.gain) / (b.rms * b.gain))).toFixed(1) + ' dB' +
      '  (0 dB would be matched)')
    // The mastered track is the reference; the MIDI render is levelled to it.
    const ref = out.find((t) => t.id === 'battle')
    for (const t of out) {
      if (t.id === ref.id) continue
      note('to match ' + ref.id + ' at ' + ref.gain + ', ' + t.id + ' wants gain ' +
        ((ref.rms * ref.gain) / t.rms).toFixed(3) + '  (currently ' + t.gain + ')')
    }
    note('headroom check: loudest output would be ' +
      db(Math.max(...out.map((t) => t.peak * t.gain))) + ' dBFS peak')
    return
  }

  if (scenario === 'goblin') {
    // "Only the very first enemy to emerge from the entrance archway in a run."
    //
    // Four ways to get that wrong, so all four are watched here rather than
    // sampled: per enemy, per wave, at the spawn instead of at the arch, and
    // once ever instead of once per run.
    const MAPD = (await import('./js/data/map.json', { with: { type: 'json' } })).default
    const AJ = (await import('./js/data/audio.json', { with: { type: 'json' } })).default
    const mouthX = MAPD.entrance.emergeFromX
    note('viewport ' + VP.w + 'x' + VP.h)
    note('lane starts at x=' + MAPD.waypoints[0][0] + ', off the plate behind the stone;' +
      ' the arch mouth is x=' + mouthX + '. A cue fired at the spawn would be ' +
      Math.round(mouthX - MAPD.waypoints[0][0]) + ' world px early, with the enemy invisible.')
    note('arch mouth x=' + mouthX + '  cue gain ' + AJ.cues['goblin-spawn'].gain +
      ' on bus "' + AJ.cues['goblin-spawn'].bus + '" at ' + AJ.buses[AJ.cues['goblin-spawn'].bus])

    // Every cue the game plays, with the argument it was played at. Patched on
    // the manager rather than on the module, so what is recorded is what the
    // real code path actually asked the engine for.
    const heard = []
    const realPlay = game.sound.play.bind(game.sound)
    game.sound.play = (key, cfg) => {
      heard.push({ key, vol: cfg && cfg.volume, t: performance.now() })
      return realPlay(key, cfg)
    }
    note('cue file loaded: ' + game.cache.audio.exists('goblin-spawn'))

    const goblins = () => heard.filter((h) => h.key === 'goblin-spawn')
    const t0 = performance.now()
    // Where the first enemy was, and how visible it was, at the moment the
    // line fired. This is the whole "timed with the fade-in, not before" claim.
    let atCue = null
    let firstSeen = null
    const watch = () => {
      for (const e of g.enemies) {
        if (!e.alive) continue
        const a = e.art ? e.art.alpha : 1
        if (firstSeen === null && a > 0) firstSeen = { x: e.x, t: performance.now() }
      }
      if (atCue === null && goblins().length > 0) {
        const e = g.enemies.find((x) => x.alive)
        atCue = e
          ? { x: Math.round(e.x), alpha: e.art ? +e.art.alpha.toFixed(3) : 1,
              t: goblins()[0].t }
          : { x: null, alpha: null, t: goblins()[0].t }
      }
    }

    g.startWave()
    while (performance.now() - t0 < 22000) { watch(); await sleep(30) }
    await shot('goblin-arch-' + VP.w + 'x' + VP.h)

    const first = goblins()[0]
    note('wave 1: the line played ' + goblins().length + ' time(s)' +
      (goblins().length === 1 ? '  correct' : '  *** SHOULD BE EXACTLY 1 ***'))
    if (first) {
      note('  volume asked for: ' + first.vol.toFixed(3) +
        '   (gain x bus x master volume)')
      note('  leading enemy at the moment it fired: x=' + atCue.x +
        '  alpha=' + atCue.alpha +
        (atCue.x !== null && atCue.x >= mouthX - 2
          ? '   at or past the arch mouth' : '   *** BEFORE THE ARCH MOUTH ***'))
      note('  fired ' + (firstSeen ? Math.round(first.t - firstSeen.t) + 'ms after' : 'on the same tick as') +
        ' the first enemy became visible at all (0 would be exactly on the fade-in)')
    }
    note('  other cues heard this wave: ' +
      JSON.stringify([...new Set(heard.map((h) => h.key))].filter((k) => k !== 'goblin-spawn')))

    // Not per wave. Let wave one finish and wave two start.
    const before = goblins().length
    const t1 = performance.now()
    while (performance.now() - t1 < 30000) {
      if (g.status.phase === 'ready') g.startWave()
      await sleep(120)
    }
    note('after reaching wave ' + g.status.wave + ': total plays ' + goblins().length +
      (goblins().length === before ? '  still once — not per wave' : '  *** PLAYED AGAIN ***'))

    // But once per RUN, not once ever. A fresh run greets the player again.
    heard.length = 0
    game.scene.stop('Game'); game.scene.stop('Hud')
    await sleep(300)
    await startRun()
    const t2 = performance.now()
    while (performance.now() - t2 < 20000 && goblins().length === 0) {
      if (scene('Game').status.phase === 'ready') scene('Game').startWave()
      await sleep(80)
    }
    note('RESULT second run: the line played ' + goblins().length + ' time(s)' +
      (goblins().length === 1 ? '  correct — once per run' : '  *** the second run is silent ***'))
    return
  }

  if (scenario === 'voices') {
    // The two new lines, on the moments they belong to — and the thing that
    // cannot be checked from the source, which is what actually comes out at
    // the mixer when a wave is firing over the top of one.
    const AJ = (await import('./js/data/audio.json', { with: { type: 'json' } })).default
    const A = await import('./js/systems/Audio.js')
    const BUS = AJ.buses.voice, DUCK = AJ.voiceDuck, VOL = A.getVolume()
    note('viewport ' + VP.w + 'x' + VP.h)
    note('voice bus ' + BUS + ', everything else ducks to ' + DUCK +
      ' while a line is sounding, master volume ' + VOL)
    for (const k of ['goblin-spawn', 'haymaker-voice', 'dadmode-voice', 'politician']) {
      note('  ' + k.padEnd(15) + ' loaded=' + game.cache.audio.exists(k) +
        '  gain ' + AJ.cues[k].gain + '  ' + AJ.cues[k].durationMs + 'ms' +
        '  expect volume ' + (AJ.cues[k].gain * BUS * VOL).toFixed(3))
    }

    const heard = []
    const realPlay = game.sound.play.bind(game.sound)
    game.sound.play = (key, cfg) => {
      heard.push({ key, vol: cfg && cfg.volume, t: performance.now() })
      return realPlay(key, cfg)
    }
    const since = (t) => heard.filter((h) => h.t >= t)
    const got = (k) => heard.filter((h) => h.key === k)

    // --- HAYMAKER, refused. A press that lands no punch says nothing.
    const before = got('haymaker-voice').length
    g.castHaymaker()   // no wave yet, so nothing is in reach
    note('refused press (nothing in reach): line played ' +
      (got('haymaker-voice').length - before) + ' time(s)' +
      (got('haymaker-voice').length === before ? '  correct — silent' : '  *** IT TALKED ***'))

    // --- HAYMAKER, landed.
    // Onto the lane: the hero starts well off it, and a wave that never comes
    // within haymaker range proves nothing about a cue fired on the punch.
    const wp = (await import('./js/data/map.json', { with: { type: 'json' } })).default.waypoints
    const mid = wp[Math.floor(wp.length / 2)]
    g.orderHero(mid[0], mid[1])
    g.startWave()
    const reached = await until(() => g.enemies.some((e) =>
      e.alive && Math.hypot(e.x - g.hero.x, e.y - g.hero.y) <= g.hero.def.haymaker.range), 60000)
    note('an enemy came into haymaker range: ' + reached +
      '  (hero at ' + Math.round(g.hero.x) + ',' + Math.round(g.hero.y) + ')')
    const tPunch = performance.now()
    g.castHaymaker()
    const hv = got('haymaker-voice')[0]
    note('haymaker: line played ' + got('haymaker-voice').length + ' time(s)' +
      (hv ? '  at volume ' + hv.vol.toFixed(3) : '  *** SILENT ***'))
    if (hv) {
      const want = AJ.cues['haymaker-voice'].gain * BUS * VOL
      note('   expected ' + want.toFixed(3) + ' — ' +
        (Math.abs(hv.vol - want) < 0.001 ? 'matches' : '*** MIXED WRONG ***'))
      // The punch's own impact cue goes off in the same call. It must have
      // stepped back for the line rather than sitting on top of it.
      const punch = since(tPunch).find((h) => h.key === 'haymaker')
      const full = AJ.cues.haymaker.gain * VOL
      note('   the punch effect alongside it: ' +
        (punch ? punch.vol.toFixed(3) + ' against ' + full.toFixed(3) + ' unducked — ' +
          (punch.vol < full * 0.75 ? 'stepped back' : '*** DID NOT DUCK ***')
          : 'not heard'))
    }

    // --- DAD MODE. Through the game's own damage path, which is the only
    // route into announceLastStand.
    const tDad = performance.now()
    g.damageHero(99999)
    await sleep(120)
    const dv = got('dadmode-voice')[0]
    const sting = since(tDad).find((h) => h.key === 'last-stand')
    note('DAD MODE: lastStandActive=' + g.hero.lastStandActive +
      '  line ' + (dv ? 'played at ' + dv.vol.toFixed(3) : '*** SILENT ***') +
      '  sting ' + (sting ? 'played at ' + sting.vol.toFixed(3) : 'MISSING'))
    if (dv && sting) {
      note('   the line is ' + (20 * Math.log10(dv.vol / sting.vol)).toFixed(1) +
        ' dB over the sting it plays across' +
        (dv.vol > sting.vol ? '  — audible over its own transformation' : '  *** BURIED ***'))
    }

    // --- And it is not cut off. Watch the whole 2.2s with a wave firing.
    const dur = AJ.cues['dadmode-voice'].durationMs
    const t0 = performance.now()
    while (performance.now() - t0 < dur + 300) await sleep(50)
    // Measured from the LINE, not from the damage. hero-hit and the sting are
    // played in the same synchronous call, and a cue that started before the
    // line cannot step back for it — counting those as failures said the duck
    // was broken when it was doing exactly what it can.
    const tLine = dv ? dv.t : tDad
    const during = heard.filter((h) => h.t >= tLine && h.t <= tLine + dur && h.key !== 'dadmode-voice')
    const kinds = [...new Set(during.map((h) => h.key))]
    let ducked = 0, plain = 0
    for (const h of during) {
      const def = AJ.cues[h.key]
      if (!def || def.bus === 'voice') continue
      const full = def.gain * VOL
      if (h.vol < full * 0.75) ducked++; else plain++
    }
    note('while the line was talking, ' + during.length + ' other cue(s) started: ' +
      JSON.stringify(kinds))
    note('   ducked ' + ducked + ', at full level ' + plain)
    note('   the line was never stopped: ' +
      (got('dadmode-voice').length === 1 ? 'played once and left alone' : '*** RETRIGGERED ***'))
    note('RESULT ' + (hv && dv && plain === 0 && got('dadmode-voice').length === 1
      ? 'both lines fire on their moment, mixed as measured, and everything else steps back'
      : '*** see above ***'))
    return
  }

  if (scenario === 'politician') {
    // THE POLITICIAN'S LINE, on its own run: the `voices` scenario ends in a
    // wave of its own and cannot then be steered to wave 13.
    //
    // Three separate questions, and the first is the one the requirement is
    // actually about — WHEN. The boss spawns off the plate behind the arch,
    // invisible, several seconds before there is anything on screen to be
    // talking about, so the line has to wait for him to emerge.
    const AJ = (await import('./js/data/audio.json', { with: { type: 'json' } })).default
    const A = await import('./js/systems/Audio.js')
    const BUS = AJ.buses.voice, VOL = A.getVolume()
    note('viewport ' + VP.w + 'x' + VP.h)
    note('politician: loaded=' + game.cache.audio.exists('politician') +
      '  gain ' + AJ.cues.politician.gain + '  ' + AJ.cues.politician.durationMs + 'ms' +
      '  expect volume ' + (AJ.cues.politician.gain * BUS * VOL).toFixed(3))

    const heard = []
    const realPlay = game.sound.play.bind(game.sound)
    game.sound.play = (key, cfg) => {
      heard.push({ key, vol: cfg && cfg.volume, t: performance.now() })
      return realPlay(key, cfg)
    }
    const got = (k) => heard.filter((h) => h.key === k)

    g.status.wave = 12
    const tWave = performance.now()
    g.startWave()
    await until(() => g.enemies.some((e) => e.def.tier === 'boss'), 60000)
    const boss = g.enemies.find((e) => e.def.tier === 'boss')
    const tSpawn = performance.now()
    if (!boss) { note('*** THE BOSS NEVER SPAWNED ***'); return }
    note('boss spawned at x=' + Math.round(boss.x) + ' alpha ' + boss.art.alpha.toFixed(2) +
      ', ' + Math.round(tSpawn - tWave) + 'ms after the wave started')
    // Invisible at the spawn. If the line has already gone, it went on the
    // wave rather than on him.
    const spokeAtSpawn = got('politician').length
    note('  line played by the spawn: ' + spokeAtSpawn +
      (spokeAtSpawn === 0 ? '  correct — he is not visible yet' : '  *** TOO EARLY ***'))

    await until(() => got('politician').length > 0, 60000)
    const pv = got('politician')[0]
    note('  line played ' + got('politician').length + ' time(s)' +
      (pv ? ' at volume ' + pv.vol.toFixed(3) + ', ' +
        Math.round(pv.t - tSpawn) + 'ms after the spawn' : '  *** SILENT ***') +
      '  boss now at x=' + Math.round(boss.x) + ' alpha ' + boss.art.alpha.toFixed(2))
    let ok = false
    if (pv) {
      const want = AJ.cues.politician.gain * BUS * VOL
      ok = Math.abs(pv.vol - want) < 0.001 && spokeAtSpawn === 0
      note('   expected ' + want.toFixed(3) + ' — ' +
        (Math.abs(pv.vol - want) < 0.001 ? 'matches' : '*** MIXED WRONG ***'))
    }
    await shot('politician-' + VP.w + 'x' + VP.h)

    // And it survives him. A 7.3s line and a boss that can die in two is the
    // case the requirement is actually about.
    const playing = () => game.sound.sounds.filter((sn) => sn.key === 'politician' && sn.isPlaying)
    const before = playing().length
    g.damageEnemy(boss, 999999, true)
    await sleep(1200)
    const after = playing().length
    note('  boss killed mid-line: ' + after + ' of ' + before + ' still playing' +
      (before > 0 && after === before ? '  correct — it plays out' : '  *** CUT OFF ***'))
    if (!(before > 0 && after === before)) ok = false

    // Never twice, however long the run goes on.
    await sleep(2500)
    note('  played exactly once: ' + (got('politician').length === 1))
    if (got('politician').length !== 1) ok = false
    note('RESULT ' + (ok
      ? 'the line fires when he becomes visible, at the measured level, once, and plays out'
      : '*** see above ***'))
    return
  }

  if (scenario === 'locked') {
    // What an option the player cannot afford looks like. It used to be a
    // padlock INSTEAD of the tower's picture, which is fine for one locked
    // option and useless for two: both buttons become the same padlock and
    // nothing says what you are saving up for.
    g.status.peanuts = 0
    await lookAt(SPOTS[3][0], SPOTS[3][1])
    const [sx, sy] = toScreen(SPOTS[3][0], SPOTS[3][1])
    await click(sx, sy)
    await sleep(500)
    const r = g.ring
    if (!r) { note('*** the ring did not open ***'); return }
    note('peanuts ' + g.status.peanuts + ', options ' +
      r.buttons.map((b) => b.option.id + (b.option.affordable ? '' : ' LOCKED')).join(', '))
    for (const b of r.buttons) {
      note('  ' + b.option.id.padEnd(14) +
        ' glyph texture ' + b.glyph.texture.key +
        '  alpha ' + b.glyph.alpha.toFixed(2) +
        '  tinted ' + (b.glyph.isTinted === true) +
        '  padlock badge ' + (b.lock ? b.lock.texture.key + ' at +' +
          Math.round(b.lock.x - b.glyph.x) + ',' + Math.round(b.lock.y - b.glyph.y) : 'none'))
    }
    const distinct = new Set(r.buttons.map((b) => b.glyph.texture.key)).size
    note('distinct pictures across ' + r.buttons.length + ' locked options: ' + distinct +
      (distinct === r.buttons.length ? '  each option still says which one it is'
        : '  *** TWO OPTIONS LOOK THE SAME ***'))
    await shot('locked-' + VP.w + 'x' + VP.h)
    return
  }

  if (scenario === 'plate') {
    // Hands the painted map plate back as a 1280x720 PNG — the map's own
    // coordinate space — so it can be measured offline. The plate is a WebP
    // now and nothing outside a browser here can decode one.
    const tex = game.textures.get('map-level1').getSourceImage()
    const c = document.createElement('canvas')
    c.width = 1280; c.height = 720
    const ctx = c.getContext('2d')
    ctx.drawImage(tex, 0, 0, 1280, 720)
    note('plate source ' + tex.width + 'x' + tex.height + ' -> 1280x720')
    await post('/shot/plate1280', c.toDataURL('image/png'))
    return
  }

  if (scenario === 'spot5') {
    // Why the ring will not stay open on one pad at maximum zoom, on the
    // smallest screen. Reported by the `ring` scenario as "0 pressable".
    const D = (await import('./js/data/display.json', { with: { type: 'json' } })).default
    const P = (await import('./js/data/presentation.json', { with: { type: 'json' } })).default
    const RL = await import('./js/systems/RingLayout.js')
    const dpr = window.devicePixelRatio || 1
    g.status.peanuts = 99999
    const z = D.camera.maxZoom * dpr
    g.rig.setTargetZoom(z)
    await until(() => Math.abs(g.cameras.main.zoom - z) < 0.01, 6000)
    const area = () => RL.usableArea(VP.w, VP.h, {top:0,right:0,bottom:0,left:0}, {
      countersBottom: g.layout.counters.y + g.layout.counters.height,
      abilitiesTop: g.layout.abilities.y,
    }, P.ring.areaMargin)
    note('viewport ' + VP.w + 'x' + VP.h + ' dpr ' + dpr +
      '  zoom ' + (g.cameras.main.zoom / dpr).toFixed(2) + '  area ' + JSON.stringify(area()))
    // NO settle: the ring is opened while the rig is still easing, which is
    // what the `ring` scenario does and what a player does when they tap a pad
    // that is not yet centred.
    const SETTLE = arg === 'settled'
    for (const sp of g.build.freeSpots()) {
      await lookAt(sp.x, sp.y)
      if (SETTLE) await sleep(300)
      g.openPadRing(sp)
      const anchors = []
      for (let i = 0; i < 30; i++) {
        const a = g.padAnchor(sp)
        anchors.push({ open: !!g.ring, a })
        await new Promise((r) => requestAnimationFrame(r))
      }
      const first = anchors[0], last = anchors[anchors.length - 1]
      const A = area()
      const outside = (p) => !p || p.x < A.x - 1 || p.x > A.x + A.width + 1
        || p.y < A.y - 1 || p.y > A.y + A.height + 1
      note('spot ' + sp.index + ' world ' + Math.round(sp.x) + ',' + Math.round(sp.y) +
        '  ring open ' + first.open + ' -> ' + last.open +
        '  anchor ' + (first.a ? Math.round(first.a.x) + ',' + Math.round(first.a.y) : 'null') +
        ' -> ' + (last.a ? Math.round(last.a.x) + ',' + Math.round(last.a.y) : 'null') +
        (outside(last.a) ? '   *** ANCHOR OUTSIDE THE USABLE AREA ***' : '') +
        '   msg "' + g.status.message + '"')
      g.ring?.close()
      await sleep(80)
    }
    return
  }

  if (scenario === 'facing') {
    // WHICH WAY CORY IS POINTING, watched rather than reasoned about.
    //
    // The rule asked for: face the direction of travel while moving, face the
    // target while attacking, target beats movement, and keep the last facing
    // when idle. The art is drawn facing LEFT — checked by eye against
    // hero_cory_walk_1.png — so `flipX` true means he is facing RIGHT.
    const hero = g.hero
    const wrong = []
    const sample = (label, expectRight, extra) => {
      const right = hero.body_.flipX === true
      const ok = expectRight === null || right === expectRight
      if (!ok) wrong.push(label)
      note('  ' + label.padEnd(34) + 'facing ' + (right ? 'RIGHT' : 'LEFT ') +
        (expectRight === null ? '' : (ok ? '  correct' : '  *** WRONG ***')) +
        (extra ? '   ' + extra : ''))
      return right
    }

    // --- WALKING. Ordered left, then right, sampled all the way there.
    const hx = hero.x, hy = hero.y
    for (const [dir, dx] of [['left', -260], ['right', 260]]) {
      g.orderHero(hx + dx, hy)
      await sleep(120)
      let flips = 0
      let last = hero.body_.flipX
      let backwards = 0
      const t0 = performance.now()
      while (performance.now() - t0 < 2600 && Math.abs(hero.x - (hx + dx)) > 4) {
        const moving = hero.body_.flipX
        if (moving !== last) { flips++; last = moving }
        // Walking backwards: facing right while travelling left, or the
        // reverse. Sampled every frame, not at the ends.
        const travellingRight = (hx + dx) > hero.x
        if (moving !== travellingRight) backwards++
        await new Promise((r) => requestAnimationFrame(r))
      }
      note('walking ' + dir + ': ' + flips + ' flip(s) on the way, ' +
        backwards + ' frame(s) facing the wrong way')
      sample('  arrived, walking ' + dir, dx > 0)
      if (backwards > 2) wrong.push('walked ' + dir + ' backwards for ' + backwards + ' frames')
      await sleep(200)
    }

    // --- IDLE. He keeps the last facing rather than snapping to a default.
    g.orderHero(hero.x, hero.y)
    await sleep(600)
    sample('idle after walking right', true, 'last facing kept')

    // --- ATTACKING. An enemy on each side while he stands still.
    g.startWave()
    await until(() => g.enemies.some((e) => e.alive), 40000)
    // Put him on the lane so enemies actually reach him.
    const wp = (await import('./js/data/map.json', { with: { type: 'json' } })).default.waypoints
    const mid = wp[Math.floor(wp.length / 2)]
    g.orderHero(mid[0], mid[1])
    await until(() => Math.hypot(hero.x - mid[0], hero.y - mid[1]) < 6, 20000)
    const engaged = await until(() => hero.engaged, 60000)
    note('engaged an enemy: ' + engaged)
    if (engaged) {
      let mismatched = 0
      let swings = 0
      let lastPose = ''
      const t1 = performance.now()
      while (performance.now() - t1 < 6000) {
        const t = hero.lastTarget
        if (t && t.alive) {
          const targetRight = t.x > hero.x
          const facingRight = hero.body_.flipX === true
          // Only judged where the target is clearly to one side: within the
          // dead zone either answer is right and snapping would be the bug.
          const dx2 = Math.abs(t.x - hero.x)
          if (dx2 > 12 && facingRight !== targetRight) mismatched++
        }
        const pose = hero.frames && hero.frames.attacking ? 'attack' : 'other'
        if (pose === 'attack' && lastPose !== 'attack') swings++
        lastPose = pose
        await new Promise((r) => requestAnimationFrame(r))
      }
      note('  ' + swings + ' swing(s) watched, ' + mismatched +
        ' frame(s) facing away from the target' +
        (mismatched === 0 ? '  correct' : '  *** SWINGING BACKWARDS ***'))
      if (mismatched > 0) wrong.push(mismatched + ' frames swinging away from the target')
    }
    await shot('facing-' + VP.w + 'x' + VP.h)
    note('RESULT ' + (wrong.length === 0
      ? 'he faces where he is going and what he is hitting, and keeps it when idle'
      : '*** ' + wrong.join('; ') + ' ***'))
    return
  }

  if (scenario === 'dadsync') {
    // WHEN the DAD MODE line lands, against WHEN the SUV appears.
    //
    // The visual transformation is not the flash: he fades out on the frame he
    // drops to 25%, and the vehicle appears transformPauseMs later. The line
    // has 260ms of silence at its head, so it is started that much before the
    // vehicle in order for the WORD to land on it.
    const AJ = (await import('./js/data/audio.json', { with: { type: 'json' } })).default
    const HJ = (await import('./js/data/heroes.json', { with: { type: 'json' } })).default
    const ls = HJ.cory.lastStand
    const cue = AJ.cues['dadmode-voice']
    note('transformPauseMs ' + ls.transformPauseMs + '   line lead-in ' + cue.leadInMs +
      'ms   so the cue should start at ' + (ls.transformPauseMs - cue.leadInMs) + 'ms')

    const heard = []
    const realPlay = game.sound.play.bind(game.sound)
    game.sound.play = (key, cfg) => {
      heard.push({ key, vol: cfg && cfg.volume, t: performance.now() })
      return realPlay(key, cfg)
    }

    const hero = g.hero
    let swapped = -1
    hero.on('transformed', () => { swapped = performance.now() })
    const before = hero.body_.texture.key
    const t0 = performance.now()
    // Through the scene's own path, which is what plays the sound: calling
    // hero.hurt directly transforms him in silence.
    g.damageHero(hero.def.maxHealth * 0.8)
    await sleep(2000)
    const voice = heard.find((h) => h.key === 'dadmode-voice')
    const sting = heard.find((h) => h.key === 'last-stand')
    const ms = (h) => h ? Math.round(h.t - t0) : null
    note('sprite ' + before + ' -> ' + hero.body_.texture.key)
    note('  SUV appeared at        ' + (swapped < 0 ? 'NEVER' : Math.round(swapped - t0) + 'ms'))
    note('  voice cue started at   ' + ms(voice) + 'ms   at volume ' +
      (voice ? voice.vol.toFixed(3) : '-'))
    note('  its first word at      ' + (voice ? ms(voice) + cue.leadInMs : '-') + 'ms')
    note('  sting started at       ' + ms(sting) + 'ms   at volume ' +
      (sting ? sting.vol.toFixed(3) : '-'))
    const wordAt = voice ? (voice.t - t0) + cue.leadInMs : NaN
    const drift = Math.abs(wordAt - (swapped - t0))
    const stingDucked = voice && sting && sting.t > voice.t
    note('  word against the SUV: ' + (Number.isFinite(drift) ? drift.toFixed(0) + 'ms apart' : 'n/a'))
    note('RESULT ' + (drift < 90 && stingDucked
      ? 'the line lands on the transformation, and the sting still follows it'
      : '*** ' + (drift >= 90 ? 'out by ' + drift.toFixed(0) + 'ms ' : '') +
        (stingDucked ? '' : 'the sting precedes the line') + '***'))
    await shot('dadsync-' + VP.w + 'x' + VP.h)
    return
  }

  if (scenario === 'mix') {
    // THE MIX, decoded rather than judged. Music against the voice lines
    // against the effects, at the levels the game actually plays them.
    const AJ = (await import('./js/data/audio.json', { with: { type: 'json' } })).default
    const MJ = (await import('./js/data/music.json', { with: { type: 'json' } })).default
    const A = await import('./js/systems/Audio.js')
    const ctx = new (window.AudioContext || window.webkitAudioContext)()
    const db = (x) => (20 * Math.log10(Math.max(1e-6, x))).toFixed(1)

    const loudHalf = async (url) => {
      const res = await fetch(url)
      const buf = await ctx.decodeAudioData(await res.arrayBuffer())
      const ch = buf.getChannelData(0)
      const win = Math.floor(buf.sampleRate * 0.3)
      const blocks = []
      for (let i = 0; i + win < ch.length; i += win) {
        let sum = 0
        for (let j = i; j < i + win; j++) sum += ch[j] * ch[j]
        blocks.push(Math.sqrt(sum / win))
      }
      if (blocks.length === 0) {
        let sum = 0
        for (let j = 0; j < ch.length; j++) sum += ch[j] * ch[j]
        return Math.sqrt(sum / Math.max(1, ch.length))
      }
      blocks.sort((a, b) => b - a)
      const loud = blocks.slice(0, Math.max(1, Math.floor(blocks.length / 2)))
      return loud.reduce((a, b) => a + b, 0) / loud.length
    }

    note('sfx slider ' + A.getVolume('sfx') + '   music slider ' + A.getVolume('music') +
      '   voice slider ' + A.getVolume('voice') + '   music bus ' + MJ.busGain)
    const rows = []
    for (const [id, t] of Object.entries(MJ.tracks)) {
      const rms = await loudHalf('/' + MJ.root + t.file + '.' + t.format)
      const out = rms * t.gain * MJ.busGain * A.getVolume('music')
      rows.push({ kind: 'music', id, out })
      note('  music ' + id.padEnd(14) + ' file ' + db(rms) + ' dBFS  x gain ' + t.gain +
        ' x bus ' + MJ.busGain + '  -> ' + db(out) + ' dBFS')
    }
    for (const [id, c] of Object.entries(AJ.cues)) {
      const isVoice = c.bus === 'voice'
      if (!isVoice && !['tower-a', 'hit-a', 'peanuts', 'build'].includes(id)) continue
      const rms = await loudHalf('/' + AJ.root + c.file + '.' + c.format)
      const bus = c.bus ? (AJ.buses[c.bus] ?? 1) : 1
      const out = rms * c.gain * bus * A.getVolume(isVoice ? 'voice' : 'sfx')
      rows.push({ kind: isVoice ? 'voice' : 'sfx', id, out })
      note('  ' + (isVoice ? 'voice ' : 'sfx   ') + id.padEnd(14) + ' file ' + db(rms) +
        ' dBFS  x gain ' + c.gain + ' x bus ' + bus + '  -> ' + db(out) + ' dBFS')
    }
    const mean = (k) => {
      const v = rows.filter((r) => r.kind === k).map((r) => r.out)
      return v.reduce((a, b) => a + b, 0) / Math.max(1, v.length)
    }
    const musicDb = 20 * Math.log10(mean('music'))
    const voiceDb = 20 * Math.log10(mean('voice'))
    const sfxDb = 20 * Math.log10(mean('sfx'))
    note('MEANS  music ' + musicDb.toFixed(1) + '   voice ' + voiceDb.toFixed(1) +
      '   sfx ' + sfxDb.toFixed(1) + ' dBFS')
    const under = voiceDb - musicDb
    note('music sits ' + under.toFixed(1) + ' dB under the voice lines')
    note('RESULT ' + (under >= 9.5 && under <= 12.5
      ? 'music is 10 to 12 dB under the voice, as asked'
      : '*** ' + under.toFixed(1) + ' dB, outside the 10-12 target ***'))
    return
  }

  if (scenario === 'settings') {
    // THE SETTINGS DIALOG, by position. A synthetic press on a control 200px
    // below the display "works" exactly as happily as one a thumb could reach,
    // so what is checked here is where things ARE.
    const D = (await import('./js/data/display.json', { with: { type: 'json' } })).default
    const A = await import('./js/systems/Audio.js')
    const hud = scene('Hud')
    const dpr = window.devicePixelRatio || 1
    note('viewport ' + VP.w + 'x' + VP.h + '  dpr ' + dpr)

    const inView = (r) => r.x >= -0.5 && r.y >= -0.5
      && r.x + r.width <= VP.w + 0.5 && r.y + r.height <= VP.h + 0.5
    let bad = 0

    // THE GEAR: one corner control where there were four.
    const gear = hud.children.list.find((o) => o.name === 'hud:settings')
    const oldControls = hud.children.list.filter((o) =>
      o.name === 'hud:mute' || o.name === 'hud:pause').length
    note('gear present: ' + !!gear + '   old corner controls left: ' + oldControls)
    if (!gear) { note('*** NO GEAR ***'); return }

    for (const zName of ['min', 'max']) {
      const z = (zName === 'min' ? D.camera.minZoom : D.camera.maxZoom) * dpr
      g.rig.setTargetZoom(z)
      await until(() => Math.abs(g.cameras.main.zoom - z) < 0.01, 6000)
      const gb = gear.getBounds()
      note('at ' + zName + ' zoom: gear at ' + Math.round(gb.x) + ',' + Math.round(gb.y) +
        ' ' + Math.round(gb.width) + 'x' + Math.round(gb.height) +
        (inView(gb) ? '  on screen' : '  *** OFF SCREEN ***'))
      if (!inView(gb)) bad++

      // Open it by PRESSING the gear, not by calling the method.
      await click(gb.centerX, gb.centerY)
      await sleep(320)
      const paused = !game.scene.isActive('Game') || game.scene.isPaused('Game')
      const panel = hud.settings
      note('  opened by tapping the gear: ' + !!panel + '   Game paused: ' + paused)
      if (!panel) { bad++; continue }
      if (!paused) { note('  *** THE GAME IS STILL RUNNING ***'); bad++ }

      // Every control, by position.
      const named = []
      for (const o of panel.hits) {
        const r = o.getBounds()
        named.push({ id: o.name || '?', r })
        if (!inView(r)) { bad++; note('      *** ' + (o.name || '?') + ' IS OFF SCREEN ***') }
      }
      note('  ' + named.length + ' controls: ' + named.map((n) =>
        n.id + ' ' + Math.round(n.r.x) + ',' + Math.round(n.r.y) + ' ' +
        Math.round(n.r.width) + 'x' + Math.round(n.r.height)).join('  |  '))
      const offscreen = named.filter((n) => !inView(n.r)).length
      note('  ' + (named.length - offscreen) + ' of ' + named.length + ' reachable' +
        (offscreen === 0 ? '  all on screen' : '  *** ' + offscreen + ' OFF SCREEN ***'))
      // No two controls may share a pixel, or one of them can never be pressed.
      let clashes = 0
      for (let i = 0; i < named.length; i++) {
        for (let j = i + 1; j < named.length; j++) {
          const a = named[i].r, b = named[j].r
          if (a.x < b.right && b.x < a.right && a.y < b.bottom && b.y < a.bottom) {
            clashes++
            note('      *** ' + named[i].id + ' overlaps ' + named[j].id + ' ***')
          }
        }
      }
      if (clashes) bad += clashes

      // THE MAP MUST NOT RESPOND. A tap in the middle of the board while the
      // panel is up must not build, select or rally.
      const heroBefore = [g.hero.x, g.hero.y]
      const towersBefore = g.towers.length
      await click(VP.w * 0.18, VP.h * 0.62)
      await sleep(220)
      const moved = Math.hypot(g.hero.x - heroBefore[0], g.hero.y - heroBefore[1]) > 1
      note('  tapped the board behind the panel: hero moved ' + moved +
        ', towers ' + towersBefore + ' -> ' + g.towers.length +
        (moved || g.towers.length !== towersBefore ? '  *** THE MAP IS LIVE ***' : '  inert'))
      if (moved || g.towers.length !== towersBefore) bad++

      // THE DRAWER FLAG. Pressing the row must flip the save AND switch the
      // control scheme on the spot — that is the whole reason it is a runtime
      // flag and not a build-time one.
      const flagRow = named.find((n) => n.id === 'settings:drawer')
      if (!flagRow) { note('  *** no drawer row in the settings panel ***'); bad++ } else {
        const SAVE2 = await import('./js/systems/Save.js')
        const was = SAVE2.controlDrawerOn()
        await click(flagRow.r.centerX, flagRow.r.centerY)
        await sleep(220)
        const now = SAVE2.controlDrawerOn()
        note('  pressed the drawer row: flag ' + was + ' -> ' + now +
          '   drawer live = ' + g.drawer.enabled +
          (now !== was && g.drawer.enabled === now ? '  applied at runtime'
            : '  *** THE FLAG DID NOT APPLY ***'))
        if (now === was || g.drawer.enabled !== now) bad++
        // And back, so the rest of the probe runs with the ring as default.
        await click(flagRow.r.centerX, flagRow.r.centerY)
        await sleep(220)
        note('  pressed it again: flag ' + SAVE2.controlDrawerOn() +
          '   drawer live = ' + g.drawer.enabled)
        if (SAVE2.controlDrawerOn() !== was || g.drawer.enabled !== was) bad++
      }

      // DRAG A SLIDER, and check the value follows the pointer rather than
      // only that a handler fired.
      const music = named.find((n) => n.id === 'settings:music')
      if (music) {
        const y = music.r.centerY
        // THE VALUE MUST FOLLOW THE POINTER, and be MONOTONIC across the row.
        // Comparing against "did it change" is not enough: the value can
        // already be where the press would put it, which is exactly how the
        // second pass of this probe reported a working slider as broken.
        const tapTo = async (f) => {
          await click(music.r.x + music.r.width * f, y)
          await sleep(120)
          return A.getVolume('music')
        }
        const lo = await tapTo(0.45)
        const hi = await tapTo(0.85)
        note('  tapped MUSIC at 45% then 85% of the row: ' +
          lo.toFixed(2) + ' -> ' + hi.toFixed(2) +
          (hi > lo ? '  follows the pointer' : '  *** DOES NOT FOLLOW THE POINTER ***'))
        if (!(hi > lo)) bad++
        // And a drag, which is a different Phaser path from a press.
        const beforeDrag = A.getVolume('music')
        mouse('mousedown', music.r.x + music.r.width * 0.85, y)
        await move(music.r.x + music.r.width * 0.60, y)
