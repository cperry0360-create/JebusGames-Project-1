<!doctype html><html><head><meta charset="utf-8">
<style>
 html,body{margin:0;background:#111;}
 @font-face{font-family:KenneyFuture;src:url(assets/fonts/KenneyFuture.ttf);}
 @font-face{font-family:KenneyFutureNarrow;src:url(assets/fonts/KenneyFutureNarrow.ttf);}
 @font-face{font-family:KenneyMiniSquare;src:url(assets/fonts/KenneyMiniSquare.ttf);}
 html,body{width:100%;height:100%;overflow:hidden;}
 #game{width:100vw;height:100vh;}
 #game canvas{display:block;}
</style></head><body>
<div id="game"></div>
<script src="phaser.min.js"></script>
<script type="module">
// Test director. Drives the real game with real input events, in real time,
// and uploads what it sees. No game logic lives here.
const post = (path, body) => fetch(path, { method: 'POST', body }).catch(() => {})
const log = []
const note = (m) => { log.push(m); post('/log', m) }
addEventListener('error', (e) => note('PAGE ERROR ' + e.message + ' @' + e.lineno))
addEventListener('unhandledrejection', (e) => note('REJECT ' + (e.reason?.message || e.reason)))

import { gameConfig } from './js/config.js'
import { setRunState } from './js/systems/RunState.js'
const MAP = (await import('./js/data/map.json', { with: { type: 'json' } })).default
const SPOTS = MAP.buildSpots

const q = new URLSearchParams(location.search)
const scenario = q.get('s') || 'game'
// The window is sized by --window-size, and the canvas follows it through
// Phaser's RESIZE mode exactly as it does on a real phone. Reading it back
// here so the log says what was actually tested.
const vpArg = q.get('vp')
if (vpArg) {
  const [vw, vh] = vpArg.split('x').map(Number)
  const box = document.getElementById('game')
  box.style.width = vw + 'px'
  box.style.height = vh + 'px'
}
const VP = { w: document.getElementById('game').clientWidth, h: document.getElementById('game').clientHeight }
await document.fonts.ready.catch(() => {})

// A fixed run, so every scenario starts from the same hand.
setRunState({
  heroId: 'cory', abilities: ['molotov', 'glacier'],
  openingTowers: ['withholding', 'writeoff'],
  reserveTowers: ['escalation', 'rounding', 'extension', 'shelter'], seed: 7,
})

// The shipping scale config, not an override: on a phone the whole point is
// that the canvas *is* the viewport, and pinning it to 1280x720 hides every
// layout collision this harness exists to find.
const game = new Phaser.Game(gameConfig)
window.game = game
const sleep = (ms) => new Promise((r) => setTimeout(r, ms))
const scene = (k) => game.scene.getScene(k)
const running = (k) => game.scene.isActive(k)
async function until(fn, ms = 10000) {
  for (let w = 0; w < ms; w += 40) { if (fn()) return true; await sleep(40) }
  return fn()
}

// Real DOM input, so the scene's own hit-testing and precedence are exercised.
// Phaser 3 listens for mouse events, not pointer events.
function mouse(type, x, y, btn = 0) {
  const c = game.canvas, r = c.getBoundingClientRect()
  c.dispatchEvent(new MouseEvent(type, {
    clientX: r.left + x, clientY: r.top + y, button: btn,
    buttons: type === 'mouseup' ? 0 : (btn === 2 ? 2 : 1),
    view: window, bubbles: true, cancelable: true,
  }))
}
async function move(x, y) { mouse('mousemove', x, y); await sleep(100) }
async function click(x, y, btn = 0) {
  await move(x, y)
  mouse('mousedown', x, y, btn); await sleep(90)
  mouse('mouseup', x, y, btn); await sleep(160)
}
const KEYS = {
  Space: { key: ' ', code: 'Space', keyCode: 32 }, KeyR: { key: 'r', code: 'KeyR', keyCode: 82 },
  KeyE: { key: 'e', code: 'KeyE', keyCode: 69 }, KeyQ: { key: 'q', code: 'KeyQ', keyCode: 81 },
  KeyW: { key: 'w', code: 'KeyW', keyCode: 87 }, Escape: { key: 'Escape', code: 'Escape', keyCode: 27 },
  KeyF: { key: 'f', code: 'KeyF', keyCode: 70 },
}
async function key(name) {
  const k = KEYS[name]
  window.dispatchEvent(new KeyboardEvent('keydown', { ...k, bubbles: true, cancelable: true }))
  await sleep(60)
  window.dispatchEvent(new KeyboardEvent('keyup', { ...k, bubbles: true, cancelable: true }))
  await sleep(80)
}
async function shot(name) {
  await sleep(140)
  await post('/shot/' + name, game.canvas.toDataURL('image/png'))
}

// Everything visible, recursively, so a screenshot is never the only evidence.
function walk(o, out, px, py, lvl) {
  if (o.visible === false || (o.alpha ?? 1) <= 0.02) return
  const x = px + (o.x || 0), y = py + (o.y || 0)
  out.push({
    t: o.type, k: o.texture?.key ?? (o.text !== undefined ? 'TEXT:' + String(o.text).slice(0, 44) : ''),
    x: Math.round(x), y: Math.round(y),
    w: Math.round(o.displayWidth || 0), h: Math.round(o.displayHeight || 0),
    sc: +(o.scaleX ?? 1).toFixed(3), lvl,
  })
  if (o.list) for (const c of o.list) walk(c, out, x, y, lvl + 1)
}
function dumpScenes() {
  const r = {}
  for (const sc of game.scene.scenes) {
    if (!game.scene.isActive(sc.scene.key)) continue
    const out = []
    for (const o of sc.children.list) walk(o, out, 0, 0, 0)
    r[sc.scene.key] = out
  }
  return r
}

note('viewport ' + VP.w + 'x' + VP.h)
// Every visible object in a scene as a screen-space rectangle.
function rectsFor(key) {
  const sc = scene(key)
  if (!sc || !game.scene.isActive(key)) return []
  const out = []
  const walkR = (o, px, py) => {
    if (o.visible === false || (o.alpha ?? 1) <= 0.02) return
    const x = px + (o.x || 0), y = py + (o.y || 0)
    if (o.list) { for (const c of o.list) walkR(c, x, y); return }
    const w = o.displayWidth || 0, h = o.displayHeight || 0
    if (w <= 0 || h <= 0) return
    const ox = (o.originX ?? 0.5), oy = (o.originY ?? 0.5)
    out.push({
      name: o.text !== undefined ? 'TEXT:' + String(o.text).slice(0, 30) : (o.texture?.key || o.type),
      l: x - w * ox, t: y - h * oy, r: x - w * ox + w, b: y - h * oy + h,
    })
  }
  for (const o of sc.children.list) walkR(o, 0, 0)
  return out
}
const overlap = (a, b) =>
  a.l < b.r - 2 && b.l < a.r - 2 && a.t < b.b - 2 && b.t < a.b - 2

// The bands are enforced by the world camera's viewport, so the checks that
// matter are: the viewport really is the band-free strip, and no HUD element
// leaves the band it was laid out in or lands on top of another one.
function dumpOverlaps(label) {
  const g2 = scene('Game')
  const cam = g2.cameras.main
  const b = g2.bands
  const H = game.scale.height, W = game.scale.width
  const viewportOk = cam.y === b.worldTop && cam.height === b.worldHeight &&
    cam.x === 0 && cam.width === W
  note(`${label}: bands top=${b.top} bottom=${b.bottom} world=${b.worldTop}..${b.worldTop + b.worldHeight}` +
    ` viewport=${cam.x},${cam.y} ${cam.width}x${cam.height} ${viewportOk ? 'OK' : 'MISMATCH'}`)

  const hud = rectsFor('Hud').filter((r) => r.r > r.l && r.b > r.t)
  // Which band each element belongs to, and whether it stayed there.
  let strays = 0
  for (const r of hud) {
    const inTop = r.b <= b.top + 1
    const inBottom = r.t >= H - b.bottom - 1
    if (!inTop && !inBottom) {
      if (strays++ < 10) note(`  ${label} STRAY ${r.name} y=${Math.round(r.t)}..${Math.round(r.b)}`)
    }
  }
  note(`${label}: HUD elements outside a band = ${strays} (of ${hud.length})`)

  // And nothing in the HUD may sit on top of anything else in it. Plates and
  // the numbers printed into them are meant to overlap, so a text drawn inside
  // a plate is not a collision; two plates or two texts are.
  let clashes = 0
  for (let i = 0; i < hud.length; i++) {
    for (let j = i + 1; j < hud.length; j++) {
      const a = hud[i], c = hud[j]
      if (!overlap(a, c)) continue
      const nested = (p, q) => p.l <= q.l + 1 && p.t <= q.t + 1 && p.r >= q.r - 1 && p.b >= q.b - 1
      if (nested(a, c) || nested(c, a)) continue
      // A label drawn on its own button plate is composition, not collision:
      // the plate is three images, so the label is never inside any one of them.
      const pair = (x, y) => /^ui-btn-/.test(x.name) && /^TEXT:/.test(y.name)
      if (pair(a, c) || pair(c, a)) continue
      if (clashes++ < 10) note(`  ${label} CLASH ${a.name} x ${c.name}`)
    }
  }
  note(`${label}: HUD overlaps = ${clashes}`)
}

async function toTitle() {
  await until(() => game.textures.exists('map-level1') && game.textures.exists('enemy-notice'), 30000)
  const ok = await until(() => running('Title'), 15000)
  note('splash -> title: ' + ok)
  return ok
}
async function startRun() {
  for (const k of ['Title', 'Draft', 'Splash', 'Credits', 'Boot']) game.scene.stop(k)
  game.scene.start('Game'); game.scene.start('Hud')
  await until(() => running('Game') && scene('Game').status.heroName !== '', 10000)
  await sleep(500)
  return scene('Game')
}
// The world camera zooms and pans, so a build spot's world coordinates are not
// the pixel a tap has to land on. Everything the director clicks on the board
// goes through here.
function toScreen(wx, wy) {
  const cam = scene('Game').cameras.main
  // The world camera's viewport is inset by the reserved HUD band, so its
  // origin is not the top-left of the screen any more.
  return [(wx - cam.worldView.x) * cam.zoom + cam.x, (wy - cam.worldView.y) * cam.zoom + cam.y]
}
async function build(spotIndex, towerIndex = 0) {
  const g = scene('Game')
  const [x, y] = toScreen(SPOTS[spotIndex][0], SPOTS[spotIndex][1])
  await click(x, y)
  if (!g.menu?.isOpen) { note(`build@${spotIndex}: menu did not open`); return false }
  const hit = g.menu.hitAreas?.[towerIndex]
  if (!hit) { note(`build@${spotIndex}: no option ${towerIndex}`); return false }
  const b = hit.getBounds()
  await click(b.centerX, b.centerY)
  return true
}

let g = null
async function run() {
  const okTitle = await toTitle()
  if (scenario === 'title') { await shot('title'); return }
  if (scenario === 'draft') {
    if (okTitle) { scene('Title').scene.start('Draft'); await sleep(900); await shot('draft') }
    return
  }
  if (scenario === 'credits') {
    if (okTitle) { scene('Title').scene.start('Credits'); await sleep(900); await shot('credits') }
    return
  }
  if (scenario === 'creditsroll') {
    // The roll is minutes long, so it is stepped by hand: the tween is stopped
    // and the container is parked at fractions of its own height. That also
    // makes the ordering measurable rather than eyeballed.
    if (!okTitle) return
    scene('Title').scene.start('Credits')
    await until(() => running('Credits') && scene('Credits').roll, 8000)
    await sleep(600)
    const cs = scene('Credits')
    cs.tween?.stop()
    const total = -cs.tween.data[0].end
    note('roll height ' + Math.round(total) + 'px over ' + cs.tweens.scene.sys.game.config.width)
    // Where each department header and each real credit landed.
    const items = []
    for (const o of cs.roll.list) {
      if (o.text !== undefined) items.push({ y: Math.round(o.y), text: String(o.text) })
    }
    const at = (t) => { const m = items.find((i) => i.text === t); return m ? m.y : -1 }
    const heads = items.filter((i) => /^[A-Z][A-Z ]{4,}$/.test(i.text) && i.text === i.text.toUpperCase())
    note('DIVISIONS ' + JSON.stringify(heads.slice(0, 20).map((h) => h.text + '@' + (h.y / total * 100).toFixed(0) + '%')))
    for (const t of ['CLAUDE', 'CHATGPT', 'GEMINI']) {
      note(t + ' at ' + (at(t) / total * 100).toFixed(1) + '% (' + at(t) + 'px)')
    }
    const CD = (await import('./js/data/credits.json', { with: { type: 'json' } })).default
    note('scroll ' + Math.round(total / CD.scrollSeconds) + ' px/s over ' + CD.scrollSeconds + 's')
    // The opening cards, then four samples through the roll.
    for (const [name, y] of [['00-cards', 0], ['01-opening', 0.06], ['02-cory', 0.22],
                             ['03-programming', (at('PROGRAMMING') - 300) / total],
                             ['04-art', (at('ART DEPARTMENT') - 300) / total],
                             ['05-qa', (at('QUALITY ASSURANCE') - 300) / total],
                             ['06-names', (at('COURJAHAN') - 420) / total]]) {
      cs.roll.y = name === '00-cards' ? 0 : -(y * total)
      await sleep(220)
      await shot('roll-' + name)
    }
    return
  }
  g = await startRun()

  if (scenario === 'game') { await shot('01-fresh'); return }

  if (scenario === 'ui') {
    await shot('ui-01-fresh')
    await move(...toScreen(SPOTS[4][0], SPOTS[4][1])); await shot('ui-02-hover-spot')
    await click(...toScreen(SPOTS[4][0], SPOTS[4][1])); await shot('ui-03-menu')
    let hit = g.menu.hitAreas?.[0]
    if (hit) { const b = hit.getBounds(); await move(b.centerX, b.centerY); await shot('ui-04-menu-hover-range') }
    if (hit) { const b = hit.getBounds(); await click(b.centerX, b.centerY) }
    await shot('ui-05-built')
    note('after build: towers=' + g.towers.length + ' peanuts=' + g.status.peanuts)
    await click(...toScreen(SPOTS[4][0], SPOTS[4][1])); await shot('ui-06-select-tower')

    // Hero control: a ground tap alone must do nothing.
    const before = [Math.round(g.hero.x), Math.round(g.hero.y)]
    await click(...toScreen(400, 620))
    const afterGround = [Math.round(g.hero.x), Math.round(g.hero.y)]
    await sleep(900)
    note(`ground tap with hero UNSELECTED: ${before} -> ${afterGround} -> ${[Math.round(g.hero.x), Math.round(g.hero.y)]} (must not move)`)
    await shot('ui-07-ground-tap-unselected')

    await click(...toScreen(g.hero.x, g.hero.y))
    note('hero selected: ' + g.heroSelected + ' msg="' + g.status.message + '"')
    await shot('ui-08-hero-selected')
    await click(...toScreen(400, 620))
    note('after order: selected=' + g.heroSelected + ' rally=' + JSON.stringify(g.hero.rally))
    await shot('ui-09-rally-ordered')
    await sleep(2500)
    note(`hero walked to ${[Math.round(g.hero.x), Math.round(g.hero.y)]} atRally=${g.hero.atRally}`)
    await shot('ui-10-hero-arrived')

    // A tap on a pad must beat a rally order aimed at the same pixel.
    await click(...toScreen(g.hero.x, g.hero.y))
    await click(SPOTS[2][0], SPOTS[2][1])
    note('pad vs ground precedence: menuOpen=' + g.menu.isOpen + ' heroRally=' + JSON.stringify(g.hero.rally))
    await shot('ui-11-pad-beats-ground')
    await click(20, 700)

    await key('KeyR'); await shot('ui-12-restructure')
    await key('Escape')
    await key('KeyQ'); await move(700, 430); await shot('ui-13-ability-target')
    await key('Escape')
    return
  }

  if (scenario === 'ultimate') {
    // Build a couple of towers, post Cory on the lane, then hurt him to 26%
    // and let the wave push him through the threshold for real.
    for (const i of [3, 1]) await build(i, 0)
    const mid = g.lane.pointAt(g.lane.totalLength * 0.5)
    await click(...toScreen(g.hero.x, g.hero.y))
    await click(mid.x, mid.y)
    await until(() => g.hero.atRally, 12000)
    await shot('u-01-on-foot')
    note('on foot: h=' + Math.round(g.hero.body_?.displayHeight || 0) + ' w=' + Math.round(g.hero.body_?.displayWidth || 0)
      + ' facingRight=' + g.hero.facingRight)
    await key('Space')
    // Take him to just above the threshold, then let the enemies finish it.
    g.hero.health = Math.ceil(g.hero.def.maxHealth * 0.26)
    await until(() => g.hero.lastStandActive, 90000)
    await sleep(120); await shot('u-02-flash')
    await sleep(520); await shot('u-03-transformed')
    note('in SUV: h=' + Math.round(g.hero.body_.displayHeight) + ' w=' + Math.round(g.hero.body_.displayWidth)
      + ' halfFootprint=' + Math.round(g.hero.halfFootprint) + ' attackRange=' + Math.round(g.hero.attackRange))
    await sleep(2000); await shot('u-04-driving')
    // Drive him along the road and see him plough through.
    const p2 = g.lane.pointAt(g.lane.totalLength * 0.22)
    await click(...toScreen(g.hero.x, g.hero.y))
    await click(p2.x, p2.y)
    await sleep(2200); await shot('u-05-ramming')
    await sleep(2200); await shot('u-06-ramming2')
    note('after ramming: lives=' + g.status.lives + ' enemies=' + g.enemies.length + ' heroHp=' + Math.round(g.hero.health))
    return
  }

  if (scenario === 'boss') {
    // Jump to the boss wave and watch him tax.
    for (const i of [3, 1, 5]) await build(i, 0)
    g.status.wave = 12
    g.status.peanuts = 900
    await key('Space')
    await until(() => g.enemies.some((e) => e.def.tier === 'boss'), 40000)
    await sleep(200); await shot('b-01-name-card')
    await sleep(2600); await shot('b-02-bar')
    const boss = g.enemies.find((e) => e.def.tier === 'boss')
    note('boss on field: hp=' + boss.maxHealth + ' blockable=' + boss.blockable
      + ' phase=' + JSON.stringify(boss.taxPhase))
    let p0 = g.status.peanuts
    await sleep(4600)
    note(`tax tick: ${p0} -> ${g.status.peanuts} peanuts`)
    await shot('b-03-taxed')
    // Wear him down past both thresholds and check the phases move.
    boss.health = boss.maxHealth * 0.55
    await sleep(200)
    note('at 55%: phase=' + JSON.stringify(boss.taxPhase))
    boss.health = boss.maxHealth * 0.25
    await sleep(200)
    note('at 25%: phase=' + JSON.stringify(boss.taxPhase))
    await sleep(2600); await shot('b-04-late-phase')
    // He must not be holdable.
    note('blocker after hero contact: ' + boss.blocker)
    p0 = g.status.peanuts
    g.damageEnemy(boss, 999999, true)
    await sleep(400)
    note(`kill payout: ${p0} -> ${g.status.peanuts} peanuts; bossName="${g.status.bossName}"`)
    await shot('b-05-killed')
    return
  }

  if (scenario === 'nuke') {
    // Force the drop, then watch the wind-up and the payload.
    for (const i of [3, 1]) await build(i, 0)
    await key('Space')
    await sleep(4000)
    note('before drop: enemies=' + g.enemies.length)
    g.status.rareAbility = 'serverNuke'
    g.cooldowns.reset('serverNuke')
    g.announceRareDrop('Server Nuke')
    await sleep(300); await shot('n-01-drop-banner')
    await sleep(1800); await shot('n-02-hud-slot')
    const before = g.enemies.filter((e) => e.alive).length
    await key('KeyF')
    // The HUD binds F to the rare slot; if the key is not wired, click it.
    if (!g.casting) {
      const hud = game.scene.getScene('Hud')
      const slot = hud.slots[hud.slots.length - 1]
      if (slot) await click(slot.hit.x, slot.hit.y)
    }
    await sleep(700); await shot('n-03-windup')
    await sleep(1300); await shot('n-04-windup-late')
    await sleep(1400); await shot('n-05-after')
    const after = g.enemies.filter((e) => e.alive).length
    note(`nuke: ${before} alive -> ${after} alive; casting=${g.casting} rare=${g.status.rareAbility}`)
    // And it must be gone for good.
    g.cooldowns.reset('serverNuke')
    await key('KeyF')
    await sleep(600)
    note('second use blocked: ' + (!g.casting))
    return
  }

  if (scenario === 'ticket') {
    g.status.peanuts = 100
    // Force the ticket into the drafted hand so Q casts it.
    g.status.abilities = ['scratchTicket', 'glacier']
    g.cooldowns.register('scratchTicket', 1)
    await key('KeyQ')
    await sleep(400); await shot('t-01-card')
    note('card up: ' + !!g.ticket + ' peanuts=' + g.status.peanuts)
    // Scratch it: drag across the middle.
    for (let i = 0; i < 22; i++) {
      const x = 500 + i * 13, y = 330 + (i % 5) * 14
      if (i === 0) mouse('mousedown', x, y)
      mouse('mousemove', x, y)
      await sleep(28)
    }
    await shot('t-02-scratched')
    mouse('mouseup', 500 + 21 * 13, 330)
    await sleep(700); await shot('t-03-paid')
    note('after scratch: peanuts=' + g.status.peanuts + ' msg=' + g.status.message)
    // And the hands-off path.
    g.cooldowns.register('scratchTicket', 1)
    await sleep(1200)
    await key('KeyQ')
    await sleep(400); await shot('t-04-untouched')
    const before = g.status.peanuts
    await sleep(4200)
    note('auto-reveal paid: ' + (g.status.peanuts > before) + ' (' + before + ' -> ' + g.status.peanuts + ')')
    await shot('t-05-auto')
    return
  }

  if (scenario === 'combat') {
    for (let i = 0; i < 4; i++) await build(i, i % 2)
    await shot('c-01-towers')
    await key('Space')
    await sleep(3000); await shot('c-02-wave-early')
    await sleep(4000); await shot('c-03-wave-mid')
    note('mid: enemies=' + g.enemies.length + ' peanuts=' + g.status.peanuts + ' lives=' + g.status.lives)
    await until(() => g.status.phase !== 'wave', 90000)
    await shot('c-04-wave-cleared')
    note('cleared: phase=' + g.status.phase + ' peanuts=' + g.status.peanuts + ' msg=' + g.status.message)
    return
  }

  if (scenario === 'poor') {
    // Insufficient gold: does the game say why nothing happened?
    g.status.gold = 5
    await click(SPOTS[1][0], SPOTS[1][1])
    const hit = g.menu.hitAreas?.[0]
    if (hit) { const b = hit.getBounds(); await click(b.centerX, b.centerY) }
    note('poor: towers=' + g.towers.length + ' msg="' + g.status.message + '" menuOpen=' + g.menu.isOpen)
    await shot('poor')
    return
  }

  if (scenario === 'lost') {
    await key('Space')
    await until(() => g.status.phase === 'lost', 240000)
    await sleep(900); await shot('lost')
    note('lost: msg=' + g.status.message)
    note('run: waves=' + g.status.wave + ' kills=' + g.status.kills +
      ' earned=' + g.status.peanutsEarned + ' lives=' + g.status.lives)
    return
  }

  // The results panel on a win, without playing thirteen waves for it: the
  // run is driven to the end state directly and the panel it opens is real.
  if (scenario === 'results') {
    // A few kills and some income first, so the rows are not all zero.
    const cam = g.cameras.main
    // Only pads inside the camera's view can be tapped at gameplay zoom.
    const inView = SPOTS.map((p, i) => [i, p])
      .filter(([, p]) => cam.worldView.contains(p[0], p[1])).map(([i]) => i)
    note('pads in view: ' + JSON.stringify(inView) + ' at zoom ' + cam.zoom.toFixed(2))
    await shot('results-00-hud-normal')
    await build(inView[0], 0)
    note('towers ' + g.towers.length + ' peanuts ' + g.status.peanuts)
    await key('Space')
    await until(() => g.status.kills > 6, 120000)
    note('after play: kills=' + g.status.kills + ' wave=' + g.status.wave +
      ' lives=' + g.status.lives + ' earned=' + g.status.peanutsEarned)
    for (const [name, phase] of [['results-lost', 'lost'], ['results-won', 'won']]) {
      g.status.phase = 'ready'
      g.dialog?.close()
      if (phase === 'won') { g.status.wave = g.status.waveCount; g.status.lives = 17 }
      else { g.status.wave = 6; g.status.lives = 0 }
      g.endRun(phase)
      await sleep(700)
      await shot(name)
      note(name + ': kills=' + g.status.kills + ' earned=' + g.status.peanutsEarned +
        ' modalOpen=' + g.modalOpen +
        ' hudAlpha=' + scene('Hud').cameras.main.alpha +
        ' hudRunning=' + running('Hud'))
    }
    return
  }

  // Does a boss that walks off the end cost lives, and does the wave still
  // count as cleared? Driven directly rather than by playing thirteen waves.
  if (scenario === 'bossleak') {
    g.status.wave = g.status.waveCount - 1
    g.startWave()
    const has = (t) => g.enemies.find((e) => e.def.tier === t)
    await until(() => has('boss'), 60000)
    const boss = has('boss')
    note('boss spawned: ' + (boss ? boss.def.name : 'NONE'))
    if (!boss) return
    // Isolate him: nothing else on the field, nothing left to spawn.
    g.spawner.groups = []
    for (const e of g.enemies) if (e !== boss) e.die()
    await sleep(600)
    note('field: ' + g.enemies.length + ' enemies, spawner.done=' + g.spawner.done)
    const before = { lives: g.status.lives, wave: g.status.wave, phase: g.status.phase }
    note('before: ' + JSON.stringify(before) + ' bossLivesCost=' + boss.def.livesCost)
    // Walk him to the exit.
    boss.distance = g.lane.totalLength - 12
    await until(() => g.status.phase !== 'wave' || g.enemies.length === 0, 20000)
    await sleep(900)
    note('after:  ' + JSON.stringify({ lives: g.status.lives, wave: g.status.wave, phase: g.status.phase }))
    note('VERDICT lives lost=' + (before.lives - g.status.lives) +
      ' waveAdvanced=' + (g.status.wave > before.wave) + ' phase=' + g.status.phase)
    await shot('bossleak')
    return
  }

  // The three moments the layout has to survive, at whatever viewport the
  // window was opened at. Every visible object is dumped with its bounds so
  // overlap is measured rather than eyeballed.
  if (scenario === 'phone') {
    const cam = g.cameras.main
    const inView = SPOTS.map((p, i) => [i, p])
      .filter(([, p]) => cam.worldView.contains(p[0], p[1])).map(([i]) => i)

    // 1. Tower placement: the menu open over a pad.
    const [px, py] = toScreen(SPOTS[inView[0]][0], SPOTS[inView[0]][1])
    await click(px, py)
    await sleep(400)
    await shot('phone-1-placing')
    note('placing: menuOpen=' + !!g.menu?.isOpen)
    dumpOverlaps('placing')

    // Hold a finger on an option: the ghost belongs on the pad while the
    // player is deciding, which on a touch device is only ever during a press.
    const hit = g.menu.hitAreas?.[0]
    if (hit) {
      const b = hit.getBounds()
      await move(b.centerX, b.centerY)
      mouse('mousedown', b.centerX, b.centerY)
      await sleep(320)
      note('ghost while pressed: ' + (g.ghost ? 'yes alpha=' + g.ghost.alpha +
        ' at ' + Math.round(g.ghost.x) + ',' + Math.round(g.ghost.y) : 'NONE'))
      await shot('phone-1b-ghost')
      mouse('mouseup', b.centerX, b.centerY)
      await sleep(260)
      note('after release: towers=' + g.towers.length + ' ghost=' + (g.ghost ? 'still up' : 'cleared'))
    }
    await sleep(300)
    g.startWave()
    await until(() => g.enemies.length > 2, 40000)
    await sleep(400)
    await shot('phone-2-wave')
    note('wave: enemies=' + g.enemies.length)
    dumpOverlaps('wave')

    // 3. The boss. Clear the field first — killing the last enemy while the
    // wave is live ends it and advances the index out from under us.
    g.spawner.groups = []
    for (const e of g.enemies) e.die()
    await until(() => g.status.phase !== 'wave', 20000)
    await sleep(300)
    g.status.wave = g.status.waveCount - 1
    g.status.phase = 'ready'
    g.startWave()
    await until(() => g.enemies.some((e) => e.def.tier === 'boss'), 60000)
    await sleep(1800)
    await shot('phone-3-boss')
    note('boss: name=' + g.status.bossName + ' enemies=' + g.enemies.length)
    dumpOverlaps('boss')
    return
  }

  // Pan and pinch with the world camera inset by the top band: its viewport no
  // longer starts at the top of the screen, so anything anchored on a raw
  // pointer coordinate is off by a band's height.
  if (scenario === 'gestures') {
    const cam = g.cameras.main
    note('viewport ' + cam.x + ',' + cam.y + ' ' + cam.width + 'x' + cam.height)

    // A tap in the middle of the board has to land where it looks.
    const [sx, sy] = toScreen(SPOTS[2][0], SPOTS[2][1])
    const w = cam.getWorldPoint(sx, sy)
    note('round trip: pad ' + SPOTS[2] + ' -> screen ' + [Math.round(sx), Math.round(sy)] +
      ' -> world ' + [Math.round(w.x), Math.round(w.y)])

    // Pan: drag and check the camera actually moved that far.
    const before = { x: Math.round(cam.scrollX), y: Math.round(cam.scrollY) }
    mouse('mousedown', 400, 200)
    for (let i = 1; i <= 8; i++) { mouse('mousemove', 400 - i * 14, 200 - i * 6); await sleep(24) }
    mouse('mouseup', 288, 152)
    await sleep(700)
    note('pan ' + JSON.stringify(before) + ' -> ' +
      JSON.stringify({ x: Math.round(cam.scrollX), y: Math.round(cam.scrollY) }))

    // Wheel zoom anchored on a point: the world under the cursor should stay
    // under the cursor. That is the calculation the band offset breaks.
    const at = { x: 500, y: 200 }
    const wBefore = cam.getWorldPoint(at.x, at.y)
    game.canvas.dispatchEvent(new WheelEvent('wheel', { deltaY: -120, clientX: at.x, clientY: at.y, bubbles: true }))
    await sleep(900)
    const wAfter = cam.getWorldPoint(at.x, at.y)
    const drift = Math.round(Math.hypot(wAfter.x - wBefore.x, wAfter.y - wBefore.y))
    note('zoom anchor drift ' + drift + 'px (zoom ' + cam.zoom.toFixed(3) + ')')
    await shot('gestures')
    return
  }

  if (scenario === 'skilled') {
    // A competent player: towers spread along the walk, the hero posted on the
    // lane, abilities spent whenever they are up.
    const order = [3, 1, 5, 0, 2, 4, 6]
    let guard = 0
    let last = -1
    const shots = new Set()
    while (g.status.phase !== 'won' && g.status.phase !== 'lost' && guard++ < 2500) {
      if (g.status.phase === 'ready') {
        for (const i of order) {
          if (!g.build.isFree(i)) continue
          const before = g.towers.length
          await build(i, 0)
          if (g.towers.length === before) { await click(20, 700); break }
        }
        if (g.status.wave !== last) {
          last = g.status.wave
          note(`wave ${g.status.wave + 1}: peanuts=${g.status.peanuts} lives=${g.status.lives} towers=${g.towers.length}`)
          if ([0, 5, 11].includes(g.status.wave) && !shots.has(g.status.wave)) {
            shots.add(g.status.wave)
            await shot('s-wave' + (g.status.wave + 1))
          }
        }
        // Post the hero on the lane, halfway along.
        const mid = g.lane.pointAt(g.lane.totalLength * 0.55)
        if (Math.hypot(g.hero.rally.x - mid.x, g.hero.rally.y - mid.y) > 30 && !g.hero.down) {
          await click(g.hero.x, g.hero.y)
          await click(mid.x, mid.y)
        }
        await key('Space')
      } else {
        // Spend abilities on whatever is furthest along.
        const live = g.enemies.filter((e) => e.alive)
        if (live.length >= 3) {
          const t = live.reduce((a, b) => (a.distance > b.distance ? a : b))
          for (const slot of ['KeyQ', 'KeyW']) {
            if (g.status.mode === 'targeting') break
            await key(slot)
            if (g.status.mode === 'targeting') { await click(t.x, t.y) }
          }
          await key('KeyE')
        }
      }
      await sleep(220)
    }
    note(`RESULT: ${g.status.phase} at wave ${g.status.wave}/12, lives ${g.status.lives}, peanuts ${g.status.peanuts}, towers ${g.towers.length}`)
    await sleep(700)
    await shot('s-end')
    return
  }

  if (scenario === 'full') {
    let guard = 0
    let shotWave4 = false
    while (g.status.phase !== 'won' && g.status.phase !== 'lost' && guard++ < 1400) {
      if (g.status.phase === 'ready') {
        for (let i = 0; i < SPOTS.length && g.towers.length < 4; i++) {
          if (!g.build.isFree(i)) continue
          if (!(await build(i, 0))) break
        }
        if (g.status.wave === 3 && !shotWave4) { await shot('f-01-wave4'); shotWave4 = true }
        await key('Space')
      }
      await sleep(400)
    }
    note('final: phase=' + g.status.phase + ' wave=' + g.status.wave + ' lives=' + g.status.lives + ' towers=' + g.towers.length)
    await sleep(600)
    await shot('f-99-end')
    return
  }
}

try { await run() } catch (e) { note('DIRECTOR ERROR: ' + e.message + ' | ' + String(e.stack).slice(0, 400)) }

const gs = scene('Game')
await post('/done', JSON.stringify({
  scenario, log,
  status: gs?.status ?? null,
  towers: gs?.towers?.length, enemies: gs?.enemies?.length, spots: SPOTS.length,
  heroAt: gs?.hero ? [Math.round(gs.hero.x), Math.round(gs.hero.y)] : null,
  scenes: dumpScenes(),
}, null, 1))
</script></body></html>
