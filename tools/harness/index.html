    note('camera frozen at scroll ' + Math.round(cam.scrollX) + ',' + Math.round(cam.scrollY) +
      '  zoom ' + cam.zoom.toFixed(3))

    const toCanvas = (wx, wy) => {
      const at = RES.worldToScreen(g, wx, wy)
      return { x: at.x * dpr, y: at.y * dpr }
    }
    const boxOf = (pts) => {
      const xs = pts.map((q) => q[0]), ys = pts.map((q) => q[1])
      const a = toCanvas(Math.min(...xs), Math.min(...ys))
      const b = toCanvas(Math.max(...xs), Math.max(...ys))
      return {
        x: Math.floor(a.x), y: Math.floor(a.y),
        w: Math.max(1, Math.ceil(b.x - a.x)), h: Math.max(1, Math.ceil(b.y - a.y)),
      }
    }
    // Inside the traced silhouette, in canvas pixels: the only pixels whose
    // colour is a claim about depth.
    const maskFor = (pts, b) => {
      const poly = pts.map(([wx, wy]) => {
        const c = toCanvas(wx, wy)
        return [c.x - b.x, c.y - b.y]
      })
      const m = new Uint8Array(b.w * b.h)
      for (let y = 0; y < b.h; y++) {
        for (let x = 0; x < b.w; x++) {
          let inside = false
          for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
            const [xi, yi] = poly[i], [xj, yj] = poly[j]
            if ((yi > y + 0.5) !== (yj > y + 0.5)
              && x + 0.5 < ((xj - xi) * (y + 0.5 - yi)) / (yj - yi) + xi) inside = !inside
          }
          if (inside) m[y * b.w + x] = 1
        }
      }
      return m
    }

    const nearPts = MAPD.entrance.arch.near.outline
    // The far pier, as the control. Read off the same plate dump the outline
    // came from. RE-MEASURED for the second plate: the far column is x 95-138,
    // y 235-375 on this painting, where it was x 88-118, y 300-390 on the first.
    const farPts = [[98, 240], [136, 240], [136, 372], [98, 372]]
    const targets = [
      { name: 'near pier', pts: nearPts, mustNotChange: true },
      { name: 'far pier (control)', pts: farPts, mustNotChange: false },
    ]
    for (const t of targets) {
      t.box = boxOf(t.pts)
      t.mask = maskFor(t.pts, t.box)
      t.pixels = t.mask.reduce((a, b) => a + b, 0)
      note(t.name + ': world outline of ' + t.pts.length + ' points  canvas ' +
        t.box.x + ',' + t.box.y + ' ' + t.box.w + 'x' + t.box.h +
        '  ' + t.pixels + ' pixels inside')
      if (t.pixels < 200) push(t.name + ' has only ' + t.pixels + ' pixels to test')
    }
    for (const [i, p] of g.archOccluders.entries()) {
      note('  lifted piece ' + i + ' depth ' + p.depth + '  ' +
        Math.round(p.displayWidth) + 'x' + Math.round(p.displayHeight) +
        ' at ' + Math.round(p.x) + ',' + Math.round(p.y))
    }
    if (g.archOccluders.length !== 1) {
      push('expected exactly one lifted piece, found ' + g.archOccluders.length)
    }

    const grab = (b) => new Promise((resolve) => {
      game.renderer.snapshotArea(b.x, b.y, b.w, b.h, (img) => {
        const c = document.createElement('canvas')
        c.width = b.w; c.height = b.h
        const cx = c.getContext('2d')
        cx.drawImage(img, 0, 0)
        resolve(cx.getImageData(0, 0, b.w, b.h).data)
      })
    })

    await sleep(200)
    for (const t of targets) t.before = await grab(t.box)

    // Walk them through. No towers, so nothing dies on the way.
    g.startWave()
    let best = null
    for (let i = 0; i < 300; i++) {
      await sleep(60)
      const inArch = g.enemies.filter((e) => e.alive && e.art && e.art.alpha > 0.5
        && e.x > MAPD.entrance.emergeFromX - 4 && e.x < MAPD.entrance.clearOfArchX)
      if (!inArch.length) continue
      const e = inArch.sort((a, b2) => b2.x - a.x)[0]
      const now = []
      for (const t of targets) {
        const after = await grab(t.box)
        let n = 0
        for (let px = 0; px < t.mask.length; px++) {
          if (!t.mask[px]) continue
          const o = px * 4
          if (Math.abs(t.before[o] - after[o]) > 12
            || Math.abs(t.before[o + 1] - after[o + 1]) > 12
            || Math.abs(t.before[o + 2] - after[o + 2]) > 12) n++
        }
        now.push(n)
      }
      const overNear = now[0]
      if (!best || overNear > best.near || (overNear === best.near && now[1] > best.far)) {
        best = { near: overNear, far: now[1], x: e.x, y: e.y, depth: e.depth }
      }
      if (i > 120 && best.far > 0) break
    }
    if (!best) { push('no enemy ever reached the arch'); return }
    note('worst frame: enemy at ' + Math.round(best.x) + ',' + Math.round(best.y) +
      '  depth ' + Math.round(best.depth))
    const nearPct = 100 * best.near / targets[0].pixels
    const farPct = 100 * best.far / targets[1].pixels
    note('  near pier: ' + best.near + ' of ' + targets[0].pixels +
      ' stone pixels changed (' + nearPct.toFixed(2) + '%)')
    note('  far pier:  ' + best.far + ' of ' + targets[1].pixels +
      ' stone pixels changed (' + farPct.toFixed(2) + '%)')
    // A whole tolerance percent, not zero: the snapshot is a GPU read-back and
    // an antialiased silhouette edge inside the mask moves by a shade.
    if (nearPct > 1) push('something drew over the near pier: ' + nearPct.toFixed(2) + '% of it')
    if (best.far === 0) {
      push('the far pier never changed either, so the run proves nothing —'
        + ' no enemy was actually behind it')
    }
    // AND A FRAME WITH SOMEONE ACTUALLY BEHIND THE NEAR PIER, which is the
    // one the eye has to accept. The diff above proves no stone changed; this
    // proves the stone is still all there.
    for (let i = 0; i < 300; i++) {
      await sleep(50)
      const behind = g.enemies.filter((e) => e.alive && e.art && e.art.alpha > 0.4
        && e.x > 40 && e.x < 72)
      if (behind.length) {
        note('shot with ' + behind.length + ' emerging at x ' +
          behind.map((e) => Math.round(e.x)).join(','))
        break
      }
    }
    await shot('arch-' + VP.w + 'x' + VP.h + '-dpr' + dpr)
    g.rig.setEnabled(true)
    note('RESULT ' + (problems.length === 0
      ? 'the near pier is untouched and the far pier is walked over, at '
        + VP.w + 'x' + VP.h + ' dpr ' + dpr
      : '*** ' + problems.length + ' problem(s) ***'))
    return
  }

  if (scenario === 'notch') {
    // THE SAFE-AREA INSET, PER EDGE, against the actual viewport.
    //
    // WHY THIS EXISTS. The drawer's flush-to-the-edge assertion passed while
    // the handle was visibly floating 64px in, and the reason is that it
    // handed drawerLayout a dockRight of its own choosing — the viewport width
    // — and asserted the panel reached it. The layout function was never
    // wrong. What the scene passes it is `viewW - safeAreaInsets().right`, and
    // nothing tested THAT, because this harness page carried no #safe-area
    // probe at all, so safeAreaInsets() returned zeros in every run ever made
    // here. A notch cannot be found by a rig that has no notch.
    //
    // So: inject a one-sided notch and measure every edge-anchored thing
    // against the SCREEN, not against the inset box.
    const SA = await import('./js/systems/SafeArea.js')
    const SAVE = await import('./js/systems/Save.js')
    const raw = SA.rawSafeAreaInsets()
    const ins = SA.safeAreaInsets()
    const dpr = window.devicePixelRatio || 1
    const problems = []
    const push = (m) => { problems.push(m); note('   *** ' + m) }

    note('viewport ' + VP.w + 'x' + VP.h + '  dpr ' + dpr)
    note('screen.orientation.angle = ' + (screen.orientation ? screen.orientation.angle : 'unavailable'))
    note('probe RAW:      top ' + raw.top + ' right ' + raw.right +
      ' bottom ' + raw.bottom + ' left ' + raw.left)
    note('RESOLVED:       top ' + ins.top + ' right ' + ins.right +
      ' bottom ' + ins.bottom + ' left ' + ins.left)
    const asked = (q.get('insets') || '0,0,0,0').split(',').map(Number)
    note('injected:              top ' + asked[0] + ' right ' + asked[1] +
      ' bottom ' + asked[2] + ' left ' + asked[3])
    for (const [i, name] of [[0, 'top'], [1, 'right'], [2, 'bottom'], [3, 'left']]) {
      if (raw[name] !== asked[i]) push('the probe read ' + name + ' as ' + raw[name] +
        ' but ' + asked[i] + ' was injected')
    }
    // Which edge SHOULD carry the housing, given what was injected.
    const expectSide = q.get('housing') || null
    if (expectSide) {
      const want = expectSide === 'left' ? { l: asked[3], r: 0 } : { l: 0, r: asked[1] }
      if (ins.left !== want.l || ins.right !== want.r) {
        push('resolved to left ' + ins.left + '/right ' + ins.right +
          ' but the housing is on the ' + expectSide + ', so it should be left ' +
          want.l + '/right ' + want.r)
      } else {
        note('resolved onto the ' + expectSide + ' edge only  OK')
      }
    }

    SAVE.setControlDrawer(true)
    g.applyControlScheme()
    await sleep(250)
    g.status.peanuts = 400
    g.drawer.refresh()
    await sleep(200)

    const report = (label, r) => {
      if (!r) { note(label + ': MISSING'); return }
      const gapR = VP.w - (r.x + r.width)
      const gapL = r.x
      note(label.padEnd(14) + ' x ' + r.x.toFixed(1) + '..' + (r.x + r.width).toFixed(1) +
        '   gap left ' + gapL.toFixed(1) + '  gap right ' + gapR.toFixed(1))
      return { gapL, gapR }
    }

    // Closed: the handle. Open: the panel. Both claim the right edge.
    for (const open of [false, true]) {
      if (open) { g.drawer.setOpen(true); await sleep(300) }
      const L = g.drawer.layout
      const r = open ? L.panel : L.tab
      const m = report(open ? 'panel (open)' : 'tab (closed)', r)
      // THE ASSERTION THAT MATTERS: against VP.w, the SCREEN, not the inset
      // box. The old one handed drawerLayout a dockRight of the viewport width
      // and asserted the panel reached it, which proved the layout function
      // and nothing about what the scene passes it.
      const allowed = ins.right
      if (m && Math.abs(m.gapR - allowed) > 0.001) {
        push((open ? 'the open drawer' : 'the handle') + ' stops ' + m.gapR.toFixed(1) +
          'px short of the screen edge, and the right inset is ' + allowed)
      }
    }
    g.drawer.setOpen(false)
    await sleep(200)

    const hud = g.layout
    for (const [name, r] of Object.entries({
      counters: hud.counters, startButton: hud.startButton, settings: hud.settings,
      abilities: hud.abilities, messageRow: hud.messageRow,
    })) report('hud.' + name, r)

    // The right-hand chrome must respect the RIGHT inset, which on a
    // left-notched phone is zero. Settings is the rightmost HUD chip.
    const set = hud.settings
    if (set) {
      const gapR = VP.w - (set.x + set.width)
      note('right-hand HUD gap ' + gapR.toFixed(1) + ' vs right inset ' + ins.right +
        (Math.abs(gapR - ins.right) < 12 ? '  tracks the RIGHT inset  OK'
          : (Math.abs(gapR - ins.left) < 12 ? '  tracks the LEFT inset  *** WRONG EDGE ***'
            : '  tracks neither inset')))
      if (ins.right !== ins.left && Math.abs(gapR - ins.left) < 12 &&
          Math.abs(gapR - ins.right) >= 12) {
        push('right-hand chrome is inset by the LEFT notch')
      }
    }
    await shot('notch-' + (q.get('insets') || 'none').replace(/,/g, '_') +
      '-a' + (angleArg === null ? 'none' : angleArg))
    note(problems.length ? 'PROBLEMS: ' + problems.length : 'no problems found')
    for (const m of problems) note('  - ' + m)
    return
  }

  if (scenario === 'drawer') {
    // THE CONTROL DRAWER, DRIVEN END TO END AND MEASURED BY POSITION.
    //
    // Every claim here is a rectangle or a peanut count, never "the handler
    // fired". A synthetic press dispatched on the canvas hit-tests a point
    // below the display exactly as happily as one in the middle of it — which
    // is how the old build menu passed a reachability check while being
    // unusable — so a tile is reachable when its RECTANGLE is on screen and
    // pressing its CENTRE changes the selection.
    const P = (await import('./js/data/presentation.json', { with: { type: 'json' } })).default
    const T = (await import('./js/data/towers.json', { with: { type: 'json' } })).default
    const SAVE = await import('./js/systems/Save.js')
    const D = P.drawer
    const dpr = window.devicePixelRatio || 1
    const problems = []
    const push = (m) => { problems.push(m); note('   *** ' + m) }

    note('viewport ' + VP.w + 'x' + VP.h + '  dpr ' + dpr)

    // THE FLAG. Off by default, and turning it on must take effect without a
    // restart — that is the whole reason it is a runtime flag.
    note('flag default: ' + SAVE.controlDrawerOn() + ' (false is correct)')
    if (SAVE.controlDrawerOn()) push('the drawer flag defaults ON')
    if (g.drawer.enabled) push('the drawer is live with the flag off')
    SAVE.setControlDrawer(true)
    g.applyControlScheme()
    await sleep(200)
    note('after the toggle: drawer enabled = ' + g.drawer.enabled)
    if (!g.drawer.enabled) { push('the flag did not apply at runtime'); return }

    g.status.peanuts = 400
    g.drawer.refresh()
    await sleep(150)

    const L = () => g.drawer.layout || null
    const hud = g.layout
    const rects = { counters: hud.counters, startButton: hud.startButton,
      settings: hud.settings, abilities: hud.abilities, cancel: hud.cancel,
      heroRow: hud.heroRow, messageRow: hud.messageRow }
    const hits = (a, b) => a.x < b.x + b.width && b.x < a.x + a.width
      && a.y < b.y + b.height && b.y < a.y + a.height
    const onScreen = (r) => r.x >= -0.5 && r.y >= -0.5
      && r.x + r.width <= VP.w + 0.5 && r.y + r.height <= VP.h + 0.5
    const tileFully = (r) => {
      const gr = g.drawer.layout.grid
      return r.y >= gr.y - 0.5 && r.y + r.height <= gr.y + gr.height + 0.5
    }

    /* --- the tab ------------------------------------------------------- */

    const tab = g.drawer.layout.tab
    note('tab ' + Math.round(tab.x) + ',' + Math.round(tab.y) + ' ' +
      Math.round(tab.width) + 'x' + Math.round(tab.height))
    if (!onScreen(tab)) push('the tab is not fully on screen')
    for (const [k, r] of Object.entries(rects)) {
      if (hits(tab, r)) push('the tab overlaps ' + k)
    }

    // WHY, if it does not open. Three separate things can swallow this and
    // guessing between them costs a run each.
    {
      const cx = tab.x + tab.width / 2, cy = tab.y + tab.height / 2
      const dprN = window.devicePixelRatio || 1
      const fake = { x: cx * dprN, y: cy * dprN, worldX: 0, worldY: 0 }
      note('   diag: owns(' + Math.round(cx) + ',' + Math.round(cy) + ') = ' +
        g.drawer.owns(cx, cy) +
        '   hit at ' + Math.round(g.drawer.hitBox.x) + ',' + Math.round(g.drawer.hitBox.y) +
        ' ' + Math.round(g.drawer.hitBox.width) + 'x' + Math.round(g.drawer.hitBox.height) +
        '   visible=' + g.drawer.layer.visible)
      const over = g.input.hitTestPointer(
        Object.assign(Object.create(g.input.activePointer), fake))
      note('   diag: hitTest names = ' + JSON.stringify(over.map((o) => o.name || o.type)))
    }
    // Reachable means a press on its centre opens the panel.
    await click(tab.x + tab.width / 2, tab.y + tab.height / 2)
    await sleep(220)
    note('tab pressed: panel open = ' + g.drawer.open)
    if (!g.drawer.open) push('pressing the tab did not open the panel')

    /* --- the panel ----------------------------------------------------- */

    const panel = g.drawer.layout.panel
    note('panel ' + Math.round(panel.x) + ',' + Math.round(panel.y) + ' ' +
      Math.round(panel.width) + 'x' + Math.round(panel.height) +
      '   grid ' + Math.round(g.drawer.layout.grid.width) + 'x' +
      Math.round(g.drawer.layout.grid.height) +
      '   maxScroll ' + Math.round(g.drawer.layout.maxScroll))
    if (!onScreen(panel)) push('the panel is not fully on screen')
    for (const [k, r] of Object.entries(rects)) {
      if (hits(panel, r)) push('the expanded panel overlaps ' + k)
    }

    /* --- every tile, including after scrolling -------------------------- */

    // THE TAB MUST NOT SIT OVER THE GRID. It is tested before the tiles, so an
    // overlap is not a cosmetic fault: it is a tile that closes the drawer.
    for (const [i, r] of g.drawer.tileRects.entries()) {
      if (hits(g.drawer.layout.tab, r)) {
        push('the tab overlaps tile ' + i + ' — that tile cannot be picked')
      }
    }

    const n = g.drawer.tileRects.length
    note('tiles: ' + n + '   tile size ' +
      Math.round(g.drawer.tileRects[0].width * 10) / 10 + 'x' +
      Math.round(g.drawer.tileRects[0].height))
    if (n !== Object.keys(T).length) push('the drawer shows ' + n + ' of ' + Object.keys(T).length + ' towers')

    // WHAT THE HANDLER ACTUALLY SEES, with `arg=diag`.
    //
    // Off by default because it fires on every press, and kept because it is
    // what found the bug the first four runs could not: the tab opened and
    // every tile missed, which looked like a sixth pointer-space fault and was
    // not. The trace showed `select(withholding)`, `collapse()`, and THEN the
    // scene's own pointerdown deciding the tap was bare ground — because the
    // drawer had already closed the panel it asked about. An object's
    // pointerdown runs before the scene's, and this is the only way to see it.
    if (arg === 'diag') {
      const RES0 = await import('./js/systems/Resolution.js')
      const t0 = g.drawer.toggle.bind(g.drawer)
      g.drawer.toggle = () => { note('   diag: toggle() open ' + g.drawer.open + ' -> ' + !g.drawer.open); t0() }
      const c0 = g.drawer.collapse.bind(g.drawer)
      g.drawer.collapse = () => { note('   diag: collapse() open=' + g.drawer.open); c0() }
      const s0 = g.drawer.select.bind(g.drawer)
      g.drawer.select = (id) => { note('   diag: select(' + id + ') from ' + g.drawer.selected); s0(id) }
      g.input.on('pointerdown', (p) => {
        const ui = RES0.pointerToScreen(g, p, g.uiCam)
        note('   diag: pointer ' + Math.round(p.x) + ',' + Math.round(p.y) +
          ' -> ui ' + Math.round(ui.x) + ',' + Math.round(ui.y) +
          '   open=' + g.drawer.open + ' enabled=' + g.drawer.enabled)
      })
    }

    let reached = 0
    for (let i = 0; i < n; i++) {
      g.drawer.scrollToTile(i)
      await sleep(90)
      const r = g.drawer.tileRects[i]
      const grid = g.drawer.layout.grid
      const fully = r.y >= grid.y - 0.5 && r.y + r.height <= grid.y + grid.height + 0.5
      if (!fully) { push('tile ' + i + ' cannot be scrolled into view'); continue }
      if (!onScreen(r)) { push('tile ' + i + ' is off screen at scroll ' + Math.round(g.drawer.scroll)); continue }
      // PRESS IT. Reachable is a press that lands, not a rectangle that fits.
      const before = g.drawer.selected
      const tcx = r.x + r.width / 2, tcy = r.y + r.height / 2
      await click(tcx, tcy)
      await sleep(140)
      const picked = g.drawer.selected
      if (picked === before) {
        // WHY. A press that changes nothing is either routed elsewhere or
        // resolved against the wrong rectangle, and guessing costs a run.
        const dprN = window.devicePixelRatio || 1
        const over = g.input.hitTestPointer(Object.assign(
          Object.create(g.input.activePointer),
          { x: tcx * dprN, y: tcy * dprN, worldX: 0, worldY: 0 }))
        note('   diag: tile ' + i + ' centre ' + Math.round(tcx) + ',' + Math.round(tcy) +
          '   rect ' + Math.round(r.x) + ',' + Math.round(r.y) + ' ' +
          Math.round(r.width) + 'x' + Math.round(r.height) +
          '   owns=' + g.drawer.owns(tcx, tcy) +
          '   hitTest = ' + JSON.stringify(over.map((o) => o.name || o.type)))
      }
      const tile = g.drawerTiles()[i]
      if (tile.locked) {
        if (picked !== before) push('tile ' + i + ' is locked and still selected')
        reached++
        continue
      }
      if (picked !== tile.id) {
        push('pressing tile ' + i + ' (' + tile.id + ') selected ' + picked)
        continue
      }
      reached++
      // A PICK NO LONGER COLLAPSES THE PANEL. It used to, so the board would be
      // clear for the tap that follows — but a collapse is a close, and a close
      // that keeps the selection leaves nodes pulsing behind a shut drawer with
      // no visible handle on the mode. The panel stays out.
      if (!g.drawer.open) push('picking a tile closed the drawer')
      g.drawer.select(null)
      await sleep(90)
    }
    note('tiles reached and pressed: ' + reached + ' of ' + n)

    /* --- the grid scrolls BY DRAGGING, which is the only way a player has -- */

    // `scrollToTile` is the harness's lever, not the player's. Reaching every
    // tile with it and calling the grid reachable is exactly the mistake the
    // old build menu made. At 568x320 the content is 202 tall in a 132 grid,
    // so two of the six towers are only reachable by dragging.
    g.drawer.select(null)
    g.drawer.open = true
    g.drawer.scroll = 0
    g.drawer.refresh()
    await sleep(120)
    if (g.drawer.layout.maxScroll > 0) {
      const gr = g.drawer.layout.grid
      const cx = gr.x + gr.width / 2
      const from = gr.y + gr.height - 12
      const to = gr.y + 12
      mouse('mousemove', cx, from); await sleep(40)
      mouse('mousedown', cx, from); await sleep(40)
      for (let k = 1; k <= 8; k++) {
        mouse('mousemove', cx, from + (to - from) * (k / 8)); await sleep(30)
      }
      mouse('mouseup', cx, to); await sleep(160)
      note('dragged the grid: scroll 0 -> ' + Math.round(g.drawer.scroll) +
        ' of ' + Math.round(g.drawer.layout.maxScroll))
      if (g.drawer.scroll <= 0) push('dragging the grid did not scroll it')
      // A DRAG MUST NOT ALSO BUY. It starts on a tile every time.
      if (g.drawer.selected) push('the drag also picked ' + g.drawer.selected)
      if (!g.drawer.open) push('the drag closed the drawer')
      // And the last tile is now reachable by a press, having been dragged to.
      const last = g.drawer.tileRects[n - 1]
      if (!tileFully(last)) push('the last tile is still not in view after dragging')
      else {
        await click(last.x + last.width / 2, last.y + last.height / 2)
        await sleep(160)
        const want = g.drawerTiles()[n - 1]
        const got = g.drawer.selected
        note('after dragging, tile ' + (n - 1) + ' (' + want.id + ') pressed: ' +
          (want.locked ? 'locked, selection ' + got : 'selected ' + got))
        if (!want.locked && got !== want.id) push('the dragged-to tile did not select')
      }
      g.drawer.select(null)
      g.drawer.open = true
      g.drawer.scroll = 0
      g.drawer.refresh()
      await sleep(120)
    } else {
      note('the grid does not scroll at this viewport (maxScroll 0)')
    }

    /* --- the inverted placement flow ------------------------------------ */

    g.drawer.open = true
    g.drawer.scroll = 0
    g.drawer.refresh()
    await sleep(120)
    const affordable = g.drawerTiles().findIndex((t) => !t.locked && t.affordable)
    if (affordable < 0) { push('nothing is affordable at 400 peanuts'); return }
    g.drawer.scrollToTile(affordable)
    await sleep(90)
    const tileR = g.drawer.tileRects[affordable]
    const pickId = g.drawerTiles()[affordable].id
    await click(tileR.x + tileR.width / 2, tileR.y + tileR.height / 2)
    await sleep(200)
    note('picked ' + pickId + '   drawer still open = ' + g.drawer.open +
      '   scene pick = ' + g.drawerPick + '   CANCEL on glass = ' + g.cancelVisible)
    if (!g.drawer.open) push('picking a tile closed the drawer')
    if (g.drawerPick !== pickId) push('the scene did not learn the pick')
    // A pick is a cancellable state, so it lights the same button an armed
    // ability does.
    if (!g.cancelVisible) push('a pick did not put CANCEL on the glass')

    /* --- NOTHING PULSES BEHIND A SHUT DRAWER ---------------------------- */

    // The failure this replaces: closing the drawer left the tile selected, so
    // the node rings kept pulsing and CANCEL stayed up with nothing on screen
    // that could clear them. Asserted BY POSITION, on the real objects.
    //
    // Computed here rather than through an accessor added to the scene: a
    // method that exists only so a probe can call it is a method whose
    // behaviour nobody checks. `eligibleLayer` is a real field — TypeScript's
    // `private` is compile-time only — and the pulse rule is four lines.
    const ringsUp = () => {
      const gm = g.eligibleLayer
      return gm && gm.commandBuffer ? gm.commandBuffer.length > 0 : null
    }
    const pulsing = () => {
      if (!g.drawerPick) return 0
      const cost = T[g.drawerPick].cost
      return g.build.spots.filter(
        (sp) => g.build.isFree(sp.index) && g.status.peanuts >= cost).length
    }
    note('with the drawer open and ' + pickId + ' picked: ' + pulsing() + ' nodes pulsing' +
      (ringsUp() === null ? '' : ', ring layer drawn = ' + ringsUp()))
    // The highlight rings, on the board, for the eye. They used to be flat
    // yellow ellipses drawn OVER the pad art; they are warm, low-contrast and
    // under it now, so this is the picture that says whether that landed.
    {
      const anyNode = g.build.freeSpots()[0]
      if (anyNode) { await lookAt(anyNode.x, anyNode.y); await sleep(300) }
      await shot('drawer-nodes-' + VP.w + 'x' + VP.h + '-dpr' + dpr)
    }
    if (pulsing() === 0) push('a pick lit no nodes at all, so the check below proves nothing')
    // CLOSE IT BY THE TAB, the way a player does.
    const tabNow = g.drawer.layout.tab
    await click(tabNow.x + tabNow.width / 2, tabNow.y + tabNow.height / 2)
    await sleep(220)
    note('after closing the drawer: open = ' + g.drawer.open +
      '   selected = ' + g.drawer.selected + '   scene pick = ' + g.drawerPick +
      '   nodes pulsing = ' + pulsing() + '   CANCEL on glass = ' + g.cancelVisible)
    if (g.drawer.open) push('the tab did not close the panel')
    if (g.drawer.selected !== null) push('the drawer kept its selection after closing')
    if (g.drawerPick !== null) push('the scene kept the pick after the drawer closed')
    if (pulsing() !== 0) push(pulsing() + ' nodes are still pulsing behind a shut drawer')
    if (g.cancelVisible) push('CANCEL is still on the glass with the drawer shut')
    if (ringsUp() === true) push('the highlight layer still has geometry in it')

    // And put it back for the rest of the run.
    g.drawer.open = true
    g.drawer.refresh()
    await sleep(120)
    await click(tileR.x + tileR.width / 2, tileR.y + tileR.height / 2)
    await sleep(200)
    if (g.drawerPick !== pickId) push('the pick could not be made again after a close')

    // Which nodes pulse. Eligible = free and affordable.
    const cost = T[pickId].cost
    const free = g.build.freeSpots()
    const eligible = free.filter(() => g.status.peanuts >= cost)
    note('nodes: ' + free.length + ' free, ' + eligible.length + ' eligible at ' +
      g.status.peanuts + ' peanuts (cost ' + cost + ')')

    // TAP A PULSING NODE, through the canvas, at the node's own screen point.
    const RES = await import('./js/systems/Resolution.js')
    // AN ELIGIBLE NODE THAT IS ON SCREEN. `eligible[0]` was node 0, which the
    // camera has off the left edge at -110 — tapping it is tapping nothing,
    // and a probe that reports "placed nothing" for that reason is reporting
    // its own aim.
    //
    // At 844x390 the camera shows a fraction of a 1280x720 board and NONE of
    // the seven free nodes falls inside the viewport at the default framing.
    // That is the player's situation too: you pan to the node you want. So the
    // probe pans, exactly as `build()` does for the ring, and then measures.
    const inView = (at) => at.x > 20 && at.y > 20 && at.x < VP.w - 20 && at.y < VP.h - 20
    const seen = () => eligible
      .map((sp) => ({ sp, at: RES.worldToScreen(g, sp.x, sp.y) })).filter(({ at }) => inView(at))
    let visible = seen()
    note('eligible nodes on screen before panning: ' + visible.length + ' of ' + eligible.length)
    if (!visible.length && eligible.length) {
      await lookAt(eligible[0].x, eligible[0].y)
      await sleep(150)
      visible = seen()
      note('after panning to node ' + eligible[0].index + ': ' + visible.length +
        ' of ' + eligible.length + ' on screen')
    }
    // THE PICK MUST SURVIVE THE PAN. A camera move that quietly clears the
    // selection would make the whole flow untappable on a phone.
    if (g.drawerPick !== pickId) push('panning the board lost the pick')
    if (!visible.length) { push('no eligible node is on screen to tap'); return }
    const target = visible[0].sp
    const at = visible[0].at
    const peanutsBefore = g.status.peanuts
    const towersBefore = g.towers.length
    await click(at.x, at.y)
    await sleep(300)
    const placed = g.towers[g.towers.length - 1]
    note('tapped node ' + target.index + ' at ' + Math.round(at.x) + ',' + Math.round(at.y))
    note('  towers ' + towersBefore + ' -> ' + g.towers.length +
      '   peanuts ' + peanutsBefore + ' -> ' + g.status.peanuts +
      ' (expected ' + (peanutsBefore - cost) + ')')
    if (g.towers.length !== towersBefore + 1) push('the tap on a pulsing node placed nothing')
    else {
      if (placed.spot !== target.index) {
        push('placed on node ' + placed.spot + ', tapped node ' + target.index)
      }
      if (placed.id !== pickId) push('placed ' + placed.id + ', picked ' + pickId)
      if (g.status.peanuts !== peanutsBefore - cost) {
        push('deducted ' + (peanutsBefore - g.status.peanuts) + ', cost is ' + cost)
      }
    }
    if (g.drawerPick !== null) push('the pick survived placement')

    /* --- an empty node with nothing picked does nothing ------------------ */

    const freeSeen = () => g.build.freeSpots()
      .map((sp) => ({ sp, at: RES.worldToScreen(g, sp.x, sp.y) })).filter(({ at }) => inView(at))
    let idleOnScreen = freeSeen()
    if (!idleOnScreen.length) {
      // 568x320 shows one node at a time. Pan, exactly as a player would.
      const any = g.build.freeSpots()[0]
      if (any) { await lookAt(any.x, any.y); await sleep(150); idleOnScreen = freeSeen() }
    }
    if (!idleOnScreen.length) { push('no free node on screen for the idle-tap check'); return }
    const idleAt = idleOnScreen[0].at
    const before2 = g.towers.length
    await click(idleAt.x, idleAt.y)
    await sleep(200)
    note('empty node with no pick: ring active = ' + (g.ring ? g.ring.active : false) +
      '   towers ' + before2 + ' -> ' + g.towers.length)
    if (g.ring && g.ring.active) push('an empty node opened the build ring with the drawer on')
    if (g.towers.length !== before2) push('an empty node placed something with nothing picked')

    /* --- cancel, both ways ---------------------------------------------- */

    g.drawer.open = true
    g.drawer.refresh()
    await sleep(120)
    const t2 = g.drawer.tileRects[affordable]
    await click(t2.x + t2.width / 2, t2.y + t2.height / 2)
    await sleep(160)
    const pickedAgain = g.drawerPick
    g.drawer.open = true
    g.drawer.refresh()
    await sleep(120)
    const t3 = g.drawer.tileRects[affordable]
    await click(t3.x + t3.width / 2, t3.y + t3.height / 2)
    await sleep(160)
    note('cancel by re-tapping the tile: ' + pickedAgain + ' -> ' + g.drawerPick)
    if (g.drawerPick !== null) push('re-tapping the selected tile did not cancel')

    g.drawer.open = true
    g.drawer.refresh()
    await sleep(100)
    const t4 = g.drawer.tileRects[affordable]
    await click(t4.x + t4.width / 2, t4.y + t4.height / 2)
    await sleep(160)
    // BARE GROUND THAT IS ACTUALLY ON SCREEN. A fixed world point put the tap
    // at ui 514,-372 — above the canvas entirely — and the check passed for
    // the wrong reason. Take a screen point, prove nothing is under it, tap
    // that.
    const bare = { x: Math.round(VP.w * 0.3), y: Math.round(VP.h * 0.55) }
    const bw = g.cameras.main.getWorldPoint(bare.x * dpr, bare.y * dpr)
    if (g.build.spotAt(bw.x, bw.y) || g.hero.hits(bw.x, bw.y) || g.towerAt(bw.x, bw.y)) {
      push('the bare-ground point is not bare')
    }
    const before3 = g.towers.length
    await click(bare.x, bare.y)
    await sleep(200)
    note('cancel by tapping bare ground: pick = ' + g.drawerPick +
      '   towers ' + before3 + ' -> ' + g.towers.length)
    if (g.drawerPick !== null) push('tapping bare ground did not cancel')
    if (g.towers.length !== before3) push('bare ground placed a tower')

    // MEASURED WHILE THE DRAWER IS STILL LIVE. Read after the flag goes off,
    // `tileRects` is empty and the measurement throws — which is what the
    // first run of this probe did.
    g.drawer.open = true
    g.drawer.refresh()
    await sleep(120)
    await shot('drawer-' + VP.w + 'x' + VP.h + '-dpr' + dpr)
    note('MEASURED tab ' + Math.round(tab.width) + 'x' + Math.round(tab.height) +
      ' at ' + Math.round(tab.x) + ',' + Math.round(tab.y) + ' closed, ' +
      Math.round(g.drawer.layout.tab.x) + ',' + Math.round(g.drawer.layout.tab.y) + ' open' +
      '  panel ' + Math.round(panel.width) + 'x' + Math.round(panel.height) +
      '  tile ' + Math.round(g.drawer.tileRects[0].width * 10) / 10 + 'x' +
      Math.round(g.drawer.tileRects[0].height) +
      '  grid ' + Math.round(g.drawer.layout.grid.width) + 'x' +
      Math.round(g.drawer.layout.grid.height) +
      '  maxScroll ' + Math.round(g.drawer.layout.maxScroll))

    /* --- and the flag back off ------------------------------------------ */

    SAVE.setControlDrawer(false)
    g.applyControlScheme()
    await sleep(200)
    note('flag off again: drawer enabled = ' + g.drawer.enabled)
    if (g.drawer.enabled) push('the drawer stayed live with the flag off')
    const backAt = idleOnScreen[0].at
    await click(backAt.x, backAt.y)
    await sleep(250)
    note('with the flag off, an empty node opens the ring: ' + (g.ring ? g.ring.active : false))
    if (!g.ring || !g.ring.active) push('the build ring did not come back with the flag off')
    g.ring && g.ring.close()

    note('RESULT ' + (problems.length === 0
      ? 'the whole flow works at ' + VP.w + 'x' + VP.h + ' dpr ' + dpr
      : '*** ' + problems.length + ' problem(s) ***'))
    return
  }

  if (scenario === 'ledger') {
    // THE LEDGER CARD, MEASURED: every tower, both tiers, both branches, and
    // every string checked against the card it is drawn on.
    //
    // "Nothing wraps" is the contract the whole card rests on — its height is
    // arithmetic precisely because no string can add a line — so this asserts
    // it by MEASUREMENT. A schema check alone would pass an 18-character
    // phrase that is nineteen pixels too wide for its column.
    //
    // Batched on purpose. The first version placed a tower, upgraded it, read
    // both branches and sold it before starting the next, and never got past
    // the fifth tower in ten minutes. Every tower is placed first and every
    // upgrade runs at once, so there is ONE build wait in the whole run
    // instead of six in series.
    const P = (await import('./js/data/presentation.json', { with: { type: 'json' } })).default
    const T = (await import('./js/data/towers.json', { with: { type: 'json' } })).default
    const L = P.ring.ledger
    const dpr = window.devicePixelRatio || 1
    g.status.peanuts = 9999999
    await sleep(400)
    note('viewport ' + VP.w + 'x' + VP.h + '  dpr ' + dpr)
    note('card height (arithmetic): ' + (L.pad + L.headerHeight + L.gap + L.statHeight +
      L.gap + L.traitHeight + L.gap + L.buttonHeight + L.pad) + 'px')

    const problems = []
    const heights = new Set()
    let cards = 0

    // Every text on the card, against the card's own rectangle. A Text object
    // reports its DRAWN size, so this catches both a string too wide for its
    // column and one that wrapped to a second line.
    const measure = (label) => {
      const pl = g.ring && g.ring.panelLayer
      if (!pl) { problems.push(label + ': no card'); return null }
      const w = g.ring.panelSize.w, h = g.ring.panelSize.h
      heights.add(h)
      cards++
      let lines = 0
      for (const o of pl.list) {
        if (o.type !== 'Text' || !o.text) continue
        lines++
        const px = Number(String(o.style.fontSize).replace('px', ''))
        if (o.height > px * 1.6) {
          problems.push(label + ': "' + o.text + '" WRAPPED (' + Math.round(o.height) + 'px)')
        }
        const b = o.getBounds()
        const left = b.x - pl.x, right = b.x + b.width - pl.x
        if (left < -0.5 || right > w + 0.5) {
          problems.push(label + ': "' + o.text + '" SPILLS ' + Math.round(left) + '..' +
            Math.round(right) + ' of ' + Math.round(w))
        }
        const top = b.y - pl.y, bot = b.y + b.height - pl.y
        if (top < -0.5 || bot > h + 0.5) {
          problems.push(label + ': "' + o.text + '" SPILLS VERTICALLY ' + Math.round(top) +
            '..' + Math.round(bot) + ' of ' + Math.round(h))
        }
      }
      if (lines === 0) problems.push(label + ': no text on the card')
      return { w, h, lines }
    }
    const texts = () => (g.ring ? g.ring.panelLayer.list.filter((o) => o.type === 'Text')
      .map((o) => o.text) : [])
    const pad = (t, n) => (t + '                            ').slice(0, n)

    const openAndMeasure = async (label, pick) => {
      const i = g.ring.opts.options.findIndex((o) => o.id === pick)
      if (i < 0) { problems.push(label + ': no option "' + pick + '"'); return }
      g.ring.select(i)
      await sleep(200)
      const m = measure(label)
      if (m) note(pad(label, 24) + ' w=' + Math.round(m.w) + ' h=' + Math.round(m.h) +
        '  ' + JSON.stringify(texts()))
    }

    const ids = Object.keys(T)

    /* --- the BUILD card, and place every tower ---------------------------- */

    const towers = []
    for (const id of ids) {
      const spot = g.build.freeSpots()[0]
      if (!spot) { problems.push(id + ': no free pad'); break }
      g.status.unlockedTowers = [id]
      g.openPadRing(spot)
      await until(() => g.ring && g.ring.opts.options.length > 0, 4000)
      if (!g.ring) { problems.push('build ' + T[id].name + ': the pad ring did not open') }
      else await openAndMeasure('build ' + T[id].name, id)
      g.ring && g.ring.close()
      await sleep(80)
      g.place(id, spot)
      await sleep(120)
      towers.push(g.towers[g.towers.length - 1])
    }

    /* --- tier 1: the upgrade card and the sell card ----------------------- */

    for (const t of towers) {
      g.openTowerRing(t)
      await until(() => g.ring && g.ring.opts.options.length > 0, 4000)
      await openAndMeasure('t1 upgrade ' + t.def.name, 'upgrade')
      await openAndMeasure('t1 sell ' + t.def.name, 'sell')
      await openAndMeasure('t1 move ' + t.def.name, 'move')
      g.ring.close()
      await sleep(80)
    }

    /* --- ONE build wait for all six -------------------------------------- */

    for (const t of towers) g.upgradeTower(t)
    await until(() => towers.every((t) => !t.upgrading), 40000)
    note('all ' + towers.length + ' towers at tier ' + (towers[0] ? towers[0].tier : '?'))

    /* --- tier 2: both branches and the sell card -------------------------- */

    for (const t of towers) {
      g.openTowerRing(t)
      await until(() => g.ring && g.ring.opts.options.length > 0, 4000)
      for (const spec of t.def.specializations) {
        await openAndMeasure('t2 ' + spec.name, 'spec:' + spec.id)
      }
      await openAndMeasure('t2 sell ' + t.def.name, 'sell')
      g.ring.close()
      await sleep(80)
    }

    /* --- THE FLOOR, FORCED ------------------------------------------------ */

    // The walk above never reaches it: `panelWidthFor` takes the room beside
    // the ring's ACTUAL position, and on this map even a 568x320 screen leaves
    // 223px on one side, so every card measured comes out 223-226 wide. The
    // narrow branch is real code on a path this board does not produce, and
    // "we never saw it break" is not the same as "it works". So the card is
    // composed directly at `panelMinWidth` and every string measured there.
    const floorW = P.ring.panelMinWidth
    let floorOk = false
    if (towers.length) {
      g.openTowerRing(towers[0])
      await until(() => g.ring && g.ring.opts.options.length > 0, 4000)
      for (const opt of g.ring.opts.options) {
        const built = g.ring.composeCard(opt, floorW)
        let spill = 0, wrapped = 0
        for (const o of built.parts) {
          if (o.type !== 'Text') continue
          const b = o.getBounds()
          if (b.x < -0.5 || b.x + b.width > floorW + 0.5) {
            spill++
            note('   FLOOR SPILL "' + o.text + '" ' + Math.round(b.x) + '..' +
              Math.round(b.x + b.width) + ' of ' + floorW)
          }
          if (o.height > Number(String(o.style.fontSize).replace('px', '')) * 1.6) {
            wrapped++
            note('   FLOOR WRAP "' + o.text + '"')
          }
        }
        const labels = built.parts.filter((o) => o.type === 'Text').map((o) => o.text)
        const nums = labels.filter((t) => ['dps', 'range', 'rate', 'boost'].includes(t))
        const support = towers[0].isSupport
        const wanted = support ? ['boost'] : ['dps', 'range']
        const ok = spill === 0 && wrapped === 0 && !nums.includes('rate')
          && wanted.every((n) => nums.includes(n))
        note('   floor ' + pad(opt.id, 14) + ' h=' + built.height +
          ' numbers=' + JSON.stringify(nums) + ' ' + JSON.stringify(labels))
        if (!ok) problems.push('the ' + floorW + 'px card for "' + opt.id + '" is wrong')
        floorOk = ok
        built.parts.forEach((o) => o.destroy())
      }
      note('at the ' + floorW + 'px floor: ' + (floorOk
        ? 'rate is dropped, dps and range survive, nothing wraps or spills'
        : '*** wrong — see above ***'))
      g.ring.close()
    } else {
      problems.push('no tower to compose a floor card from')
    }

    note('cards measured: ' + cards)
    note('card heights seen: ' + JSON.stringify([...heights]) +
      (heights.size === 1 ? '  — one height, as designed' : '  *** the height varies ***'))
    note('RESULT ' + (problems.length === 0 && heights.size === 1 && floorOk
      ? 'every string fits its card at ' + VP.w + 'x' + VP.h + ' dpr ' + dpr +
        ', every card is ' + [...heights][0] + 'px, and the floor drops rate'
      : '*** ' + problems.length + ' problem(s) ***'))
    for (const p of problems.slice(0, 30)) note('   ' + p)
    return
  }

  if (scenario === 'towerring') {
    // THE TOWER'S OWN RING: what it offers, WHERE, and what the second press
    // says — driven through every tier and both branches of every tower.
    //
    // The complaint was that SELL and UPGRADE were confusable. "SELL goes
    // last" was the first answer and it was not enough: the ring's geometry is
    // a function of how many buttons are on it, so the arc of two at tier 1
    // sits at a different radius from the arc of three at the branch, and the
    // position a thumb learned as UPGRADE is a position SELL can arrive at.
    //
    // So the assertion is RECTANGLES, gathered across every state a tower can
    // be in, and the claim is that no SELL rectangle from any state overlaps
    // an UPGRADE rectangle from any other. Not "sell is last" — where it is.
    const TOWERSD = (await import('./js/data/towers.json', { with: { type: 'json' } })).default
    const dpr = window.devicePixelRatio || 1
    note('viewport ' + VP.w + 'x' + VP.h + '  dpr ' + dpr)
    const problems = []
    const push = (m) => { problems.push(m); note('   *** ' + m) }
    g.status.peanuts = 999999
    // NO WAVES. Forty-eight ring states take a couple of minutes, and waves
    // start on their own — the run reached wave 4, leaked, and ended halfway
    // through the sweep with "the ring did not open" as the only symptom.
    // The board under test is a tower on a pad; the fight is not part of it.
    g.startWave = () => {}
    g.status.lives = 9999
    await sleep(400)

    const rectOf = (state, id) => {
      const b = (g.ring ? g.ring.hitBoxes : []).find((h) => h.id === id)
        || (g.ring ? g.ring.hitBoxes : []).find((h) => h.id === 'ring:' + id)
      return b ? { state, id, ...b.rect } : null
    }
    const overlap = (a, b) => a.x < b.x + b.width && b.x < a.x + a.width
      && a.y < b.y + b.height && b.y < a.y + a.height

    const sells = []
    const upgrades = []
    let states = 0
    let sawBranch = 0

    const read = async (tower, label) => {
      // LOOK AT THE TOWER FIRST. Opened with its pad off camera the ring is
      // clamped into a corner of the usable area, and every state then reports
      // the SAME rectangles — which looks like a perfect result and is the
      // probe measuring its own aim. The scene says so out loud ("The tower
      // menu opened away from its pad"), which is how this was caught.
      await lookAt(tower.x, tower.y)
      g.openTowerRing(tower)
      await sleep(320)
      if (g.ring && g.ring.bounds) {
        const b = g.ring.bounds
        const a = { x: 0, y: 0, width: VP.w, height: VP.h }
        if (b.x < a.x || b.y < a.y || b.x + b.width > a.width || b.y + b.height > a.height) {
          push(label + ': the ring is off screen at ' + Math.round(b.x) + ',' + Math.round(b.y))
        }
      }
      if (!g.ring || !g.ring.active) { push(label + ': the ring did not open'); return null }
      const list = g.ring.opts.options
      const ids = list.map((o) => o.id)
      const slots = list.map((o) => o.slot)
      const sell = rectOf(label, 'sell')
      const up = rectOf(label, 'upgrade')
      if (!sell) push(label + ': no SELL option')
      if (sell) sells.push(sell)
      if (up) upgrades.push(up)
      // The branch's two options take slots 0 and 1; SELL takes 2 always.
      for (const o of list) {
        if (o.id === 'sell' && o.slot !== 2) push(label + ': SELL is in slot ' + o.slot)
        if (o.id === 'upgrade' && o.slot !== 0) push(label + ': UPGRADE is in slot ' + o.slot)
      }
      if (ids.includes('move')) push(label + ': MOVE is back on the tower panel')
      states++
      // Two pictures: the two-option state with slot 1 reserved and empty, and
      // the branch that fills it. If the gap reads as a missing button rather
      // than as a held place, it is visible in these.
      if (label === 'withholding t1' || label === 'withholding branch') {
        await shot('ring-' + label.replace(/ /g, '-') + '-' + VP.w + 'x' + VP.h)
      }
      note('  ' + label + ': [' + ids.join(', ') + ']  slots [' + slots.join(', ') + ']'
        + (sell ? '  SELL at ' + Math.round(sell.x) + ',' + Math.round(sell.y) : '')
        + (up ? '  UPGRADE at ' + Math.round(up.x) + ',' + Math.round(up.y) : ''))
      return { ids, list }
    }

    // EVERY TOWER, EVERY TIER, BOTH BRANCHES. Placed one at a time on the same
    // pad so the ring's anchor is identical throughout — which is what makes
    // the rectangles comparable at all.
    const spot = g.build.freeSpots()[0]
    for (const id of Object.keys(TOWERSD)) {
      for (const branch of [0, 1]) {
        g.ring && g.ring.close()
        await sleep(80)
        if (g.towers.length) { g.sellTowerForProbe ? 0 : 0 }
        // Clear the pad by hand rather than through the sell dialog.
        for (const t of [...g.towers]) {
          g.build.release(t.spot)
          g.towers = g.towers.filter((x) => x !== t)
          t.destroy()
        }
        g.status.peanuts = 999999
        g.place(id, spot)
        await sleep(220)
        const tower = g.towers[g.towers.length - 1]
        if (!tower) { push(id + ': did not place'); continue }
        await read(tower, id + ' t1' + (branch ? ' (b)' : ''))
        g.ring && g.ring.close(); await sleep(80)
        g.upgradeTower(tower)
        await until(() => !tower.upgrading, 30000)
        await read(tower, id + ' t2' + (branch ? ' (b)' : ''))
        g.ring && g.ring.close(); await sleep(80)
        if (tower.atSpecChoice) {
          sawBranch++
          await read(tower, id + ' branch' + (branch ? ' (b)' : ''))
          g.ring && g.ring.close(); await sleep(80)
          const spec = tower.def.specializations[branch]
          if (spec) {
            g.specialize(tower, spec.id)
            await until(() => !tower.upgrading, 30000)
            await read(tower, id + ' ' + spec.id)
            g.ring && g.ring.close(); await sleep(80)
          }
        }
      }
    }
    g.ring && g.ring.close()

    note('states read: ' + states + '   SELL rects ' + sells.length +
      '   UPGRADE rects ' + upgrades.length + '   branches reached ' + sawBranch)
    if (states < 12) push('only ' + states + ' states were read; that is not every tier')
    if (!sawBranch) push('the specialisation branch was never reached')

    // THE ASSERTION: no SELL rectangle anywhere overlaps an UPGRADE rectangle
    // anywhere. Muscle memory is built across states, so the comparison is too.
    let clashes = 0
    for (const sell of sells) {
      for (const up of upgrades) {
        if (!overlap(sell, up)) continue
        clashes++
        if (clashes <= 4) {
          push('SELL in "' + sell.state + '" overlaps UPGRADE in "' + up.state + '" at '
            + Math.round(sell.x) + ',' + Math.round(sell.y))
        }
      }
    }
    note('SELL/UPGRADE rectangle clashes across all states: ' + clashes)
    // And how far apart they actually are, at the closest.
    let nearest = Infinity
    for (const sell of sells) {
      for (const up of upgrades) {
        const dx = Math.max(0, Math.max(up.x - (sell.x + sell.width), sell.x - (up.x + up.width)))
        const dy = Math.max(0, Math.max(up.y - (sell.y + sell.height), sell.y - (up.y + up.height)))
        nearest = Math.min(nearest, Math.hypot(dx, dy))
      }
    }
    note('closest a SELL ever gets to an UPGRADE: ' + nearest.toFixed(1) + 'px')

    // THE SELL CONFIRMATION, in words.
    for (const t of [...g.towers]) { g.build.release(t.spot); t.destroy() }
    g.towers = []
    g.status.peanuts = 999999
    g.place(Object.keys(TOWERSD)[0], spot)
    await sleep(250)
    const tower = g.towers[0]
    g.openTowerRing(tower)
    await sleep(320)
    const sellBtn = g.ring.hitBoxes.find((h) => h.id === 'sell')
    await click(sellBtn.rect.x + sellBtn.rect.width / 2, sellBtn.rect.y + sellBtn.rect.height / 2)
    await sleep(300)
    const confirmBtn = g.ring.hitBoxes.find((h) => h.id === 'ring:confirm')
    if (!confirmBtn) { push('the ledger card has no confirm button'); }
    else {
      const towersBefore = g.towers.length
      await click(confirmBtn.rect.x + confirmBtn.rect.width / 2,
        confirmBtn.rect.y + confirmBtn.rect.height / 2)
      await sleep(350)
      const dlg = g.dialog
      note('after the ring confirm: dialog up = ' + !!dlg + '   towers ' + towersBefore +
        ' -> ' + g.towers.length)
      if (!dlg) push('SELL went through with no confirmation')
      if (g.towers.length !== towersBefore) push('the tower was sold before anything was confirmed')
      if (dlg) {
        const words = []
        for (const o of dlg.layer.list) if (o.text) words.push(String(o.text))
        note('  the dialog says: ' + JSON.stringify(words))
        const all = words.join(' ')
        if (!/Sell/.test(all)) push('the confirmation does not say Sell')
        if (!/peanuts/.test(all)) push('the confirmation does not name the currency in words')
        if (!new RegExp(tower.def.name).test(all)) push('the confirmation does not name the tower')
        if (!/Cancel/i.test(all)) push('the confirmation has no worded way out')
      }
    }

    // AND UPGRADE DOES NOT GET ONE.
    g.dialog && g.dialog.close()
    await sleep(200)
    for (const t of [...g.towers]) { g.build.release(t.spot); t.destroy() }
    g.towers = []
    g.status.peanuts = 999999
    g.place(Object.keys(TOWERSD)[0], spot)
    await sleep(250)
    const t2 = g.towers[0]
    g.openTowerRing(t2)
    await sleep(320)
    const upBtn = g.ring.hitBoxes.find((h) => h.id === 'upgrade')
    await click(upBtn.rect.x + upBtn.rect.width / 2, upBtn.rect.y + upBtn.rect.height / 2)
    await sleep(300)
    const upConfirm = g.ring.hitBoxes.find((h) => h.id === 'ring:confirm')
    if (upConfirm) {
      await click(upConfirm.rect.x + upConfirm.rect.width / 2,
        upConfirm.rect.y + upConfirm.rect.height / 2)
      await sleep(350)
      note('after the upgrade confirm: dialog up = ' + !!g.dialog +
        '  tower upgrading = ' + t2.upgrading)
      if (g.dialog) push('UPGRADE got a confirmation dialog too')
      if (!t2.upgrading) push('the upgrade did not go through')
    }

    // AND THE SELL BUTTON WEARS THE CURRENCY THE GAME USES.
    // THE SELL BUTTON WEARS THE CURRENCY THE GAME ACTUALLY USES.
    //
    // Not the counter's key: `hud-peanuts` is the whole 233x96 counter PLATE
    // with a peanut painted into its left end, and pointing the button at it
    // drew that plate squashed into a 40px square. The peanut is cut out of it
    // at boot instead, so this checks the cut-out exists and is peanut-shaped
    // rather than a black rectangle.
    const ARTD = (await import('./js/data/art.json', { with: { type: 'json' } })).default
    const iconKey = ARTD.ui.icons.sell
    note('the sell icon is ' + iconKey + ' (the counter plate is ' +
      ARTD.ui.counters.peanuts + ')')
    if (!g.textures.exists(iconKey)) push('the sell icon texture does not exist')
    else {
      const src = g.textures.get(iconKey).getSourceImage()
      const cc = document.createElement('canvas')
      cc.width = src.width; cc.height = src.height
      const cx2 = cc.getContext('2d')
      cx2.drawImage(src, 0, 0)
      const px = cx2.getImageData(0, 0, src.width, src.height).data
      let opaque = 0
      for (let i = 3; i < px.length; i += 4) if (px[i] > 200) opaque++
      const total = src.width * src.height
      const pct = 100 * opaque / total
      note('  cut-out ' + src.width + 'x' + src.height + ', ' + pct.toFixed(1) +
        '% opaque (a plate would be ~100%, a peanut is a shape in a box)')
      if (pct > 80) push('the sell icon is still the whole plate: ' + pct.toFixed(1) + '% opaque')
      if (pct < 8) push('the sell icon is nearly empty: ' + pct.toFixed(1) + '% opaque')
    }

    await shot('towerring-' + VP.w + 'x' + VP.h)
    note('RESULT ' + (problems.length === 0
      ? 'SELL never lands where UPGRADE has been, and only SELL asks twice'
      : '*** ' + problems.length + ' problem(s) ***'))
    return
  }

  if (scenario === 'ring') {
    // THE RING, RENDERED. The placement is proved exhaustively in
    // tests/ringlayout.test.ts — every pad, every option count, both zoom
    // ends, both viewports, notched and not. What a browser adds is the part
    // arithmetic cannot see: that the buttons are really where the geometry
    // says, that the icons drew, and that a real press buys a real tower.
    //
    // Reach is decided by POSITION, never by whether a handler fired. A
    // synthetic press dispatched on the canvas hit-tests a point 194px below
    // the display exactly as happily as one in the middle of it, which is how
    // the old build menu passed a reachability check while being unusable.
    const P = (await import('./js/data/presentation.json', { with: { type: 'json' } })).default
    const D = (await import('./js/data/display.json', { with: { type: 'json' } })).default
    const RL = await import('./js/systems/RingLayout.js')
    const dpr = window.devicePixelRatio || 1
    g.status.peanuts = 99999
    await sleep(400)
    note('viewport ' + VP.w + 'x' + VP.h + '  dpr ' + dpr)
    note('button ' + P.ring.buttonSize + 'px carrying a ' + P.ring.iconSize + 'px icon, panel '
      + P.ring.panelWidth + 'px wide')

    const area = () => RL.usableArea(VP.w, VP.h, {top: 0, right: 0, bottom: 0, left: 0}, {
      countersBottom: g.layout.counters.y + g.layout.counters.height,
      abilitiesTop: g.layout.abilities.y,
    }, P.ring.areaMargin)
    const inside = (r, a) => r.x >= a.x - 0.5 && r.y >= a.y - 0.5
      && r.x + r.width <= a.x + a.width + 0.5 && r.y + r.height <= a.y + a.height + 0.5

    const check = (label) => {
      const a = area()
      const boxes = g.ring ? g.ring.hitBoxes : []
      const off = boxes.filter((b) => !inside(b.rect, a))
      const rb = g.ring ? g.ring.bounds : null
      // The panel's RECORDED height against what it actually drew. A component
      // that reports one height and draws another places itself correctly and
      // still hangs off the screen — which is exactly the bug that got here.
      const pb = g.ring ? g.ring.panelBounds : null
      if (pb) {
        let lo = 1e9, hi = -1e9
        for (const o of g.ring.panelLayer.list) {
          if (!o.getBounds) continue
          const b = o.getBounds()
          if (b.height <= 0) continue
          lo = Math.min(lo, b.y); hi = Math.max(hi, b.bottom)
        }
        const drawn = Math.round(hi - lo)
        note('      panel box ' + Math.round(pb.x) + ',' + Math.round(pb.y) + ' ' +
          Math.round(pb.width) + 'x' + Math.round(pb.height) + '  drew ' + drawn +
          'px from y ' + Math.round(lo) + ' to ' + Math.round(hi))
      }
      if (boxes.length === 0) {
        note('      NO PRESSABLE REGIONS: ring=' + (g.ring ? 'open' : 'GONE') +
          '  buttons=' + (g.ring ? g.ring.buttons?.length : '-') +
          '  placement=' + (g.ring && g.ring.bounds ? 'set' : 'null') +
          '  unlocked=' + JSON.stringify(g.status.unlockedTowers) +
          '  mode=' + g.status.mode + '  modalOpen=' + g.modalOpen +
          '  msg="' + g.status.message + '"')
      }
      note('  ' + label.padEnd(26) + boxes.length + ' pressable, ' +
        (off.length === 0 ? 'all on screen' : '*** ' + off.length + ' OFF SCREEN ***') +
        (rb ? '  ring ' + Math.round(rb.width) + 'x' + Math.round(rb.height)
          + ' at ' + Math.round(rb.x) + ',' + Math.round(rb.y) : ''))
      for (const b of off) {
        note('      ' + b.id + ' at ' + Math.round(b.rect.x) + ',' + Math.round(b.rect.y) +
          ' ' + Math.round(b.rect.width) + 'x' + Math.round(b.rect.height) +
          ' against ' + Math.round(a.x) + ',' + Math.round(a.y) + ' ' +
          Math.round(a.width) + 'x' + Math.round(a.height))
      }
      // No two pressable regions may overlap: one of them could never be hit.
      let clashes = 0
      for (let i = 0; i < boxes.length; i++) {
        for (let j = i + 1; j < boxes.length; j++) {
          const A = boxes[i].rect, B = boxes[j].rect
          if (A.x < B.x + B.width && B.x < A.x + A.width
            && A.y < B.y + B.height && B.y < A.y + A.height) clashes++
        }
      }
      if (clashes > 0) note('      *** ' + clashes + ' PAIRS OF HIT AREAS OVERLAP ***')
      return { off: off.length, clashes, n: boxes.length }
    }

    let worst = { off: 0, clashes: 0 }
    const record = (r) => { worst.off += r.off; worst.clashes += r.clashes }

    /**
     * Waits for the ring to STOP MOVING before its buttons are aimed at.
     *
     * The rig eases the camera, the ring is repositioned over its pad every
     * frame, and at maximum zoom a frame of easing moves it tens of pixels. A
     * press aimed at a rectangle read one frame earlier then lands beside the
     * button, on the map, and closes the menu — which is what "0 pressable"
     * meant on spot 5 at max zoom, twice in a row. That is the probe aiming at
     * a moving target, not the ring being unreachable, and a real thumb has
     * the same problem only if it is faster than the camera.
     */
    const settle = async () => {
      let last = ''
      for (let i = 0; i < 40; i++) {
        const b = g.ring?.bounds
        const now = b ? `${Math.round(b.x)},${Math.round(b.y)}` : 'none'
        if (now === last) return
        last = now
        await new Promise((r) => requestAnimationFrame(r))
      }
    }

    // EVERY PAD, at min and max zoom, with and without a description open.
    for (const zName of ['min', 'max']) {
      const z = (zName === 'min' ? D.camera.minZoom : D.camera.maxZoom) * dpr
      g.rig.setTargetZoom(z)
      await until(() => Math.abs(g.cameras.main.zoom - z) < 0.01, 5000)
      note('at ' + zName + ' zoom ' + (g.cameras.main.zoom / dpr).toFixed(2) + ':')
      for (const sp of g.build.freeSpots()) {
        await lookAt(sp.x, sp.y)
        g.openPadRing(sp)
        await sleep(160)
        await settle()
        record(check('spot ' + sp.index + ' ring'))
        // Open each option's description in turn: the panel is a different
        // size for every tower, so one of them is not a sample.
        const opts = g.ring ? g.ring.hitBoxes.filter((b) => b.id !== 'ring:confirm' && b.id !== 'ring:cancel') : []
        for (const o of opts) {
          await settle()
          // Re-read the rectangle after settling: the one captured in `opts`
          // is from before the wait.
          const live = g.ring?.hitBoxes.find((x) => x.id === o.id)
          const b = (live ?? o).rect
          await click(b.x + b.width / 2, b.y + b.height / 2)
          await sleep(120)
          record(check('  panel for ' + o.id))
        }
        if (sp.index === 0 && zName === 'min') await shot('ring-pad-' + VP.w + 'x' + VP.h)
        g.ring?.close()
        await sleep(80)
      }
    }

    // A REAL PURCHASE, through the two presses the design requires.
    g.rig.setTargetZoom(D.camera.defaultZoom * dpr)
    await until(() => Math.abs(g.cameras.main.zoom - D.camera.defaultZoom * dpr) < 0.02, 5000)
    const sp = g.build.freeSpots()[0]
    await lookAt(sp.x, sp.y)
    g.openPadRing(sp)
    await sleep(200)
    const before = g.towers.length
    const first = g.ring.hitBoxes[0]
    await click(first.rect.x + first.rect.width / 2, first.rect.y + first.rect.height / 2)
    await sleep(200)
    note('after one press on a ring button: towers ' + before + ' -> ' + g.towers.length +
      (g.towers.length === before ? '  correct — it opened a description, it did not buy'
        : '  *** IT BOUGHT SOMETHING ON THE FIRST TAP ***'))
    const confirm = g.ring.hitBoxes.find((b) => b.id === 'ring:confirm')
    note('  the confirm button is ' + (confirm ? 'there' : '*** MISSING ***'))
    if (confirm) {
      await click(confirm.rect.x + confirm.rect.width / 2, confirm.rect.y + confirm.rect.height / 2)
      await sleep(300)
      note('  after confirming: towers ' + before + ' -> ' + g.towers.length +
        (g.towers.length > before ? '  BUILT' : '  *** NOTHING HAPPENED ***'))
      await shot('ring-built-' + VP.w + 'x' + VP.h)
    }

    // AND THE OTHER HALF: the same component on a built tower.
    if (g.towers.length > 0) {
      const t = g.towers[0]
      await lookAt(t.x, t.y)
      g.openTowerRing(t)
      await sleep(200)
      record(check('built tower ring'))
      const opts = g.ring ? g.ring.hitBoxes.filter((b) => !b.id.startsWith('ring:')) : []
      note('  options offered: ' + JSON.stringify(opts.map((o) => o.id)))
      for (const o of opts) {
        await click(o.rect.x + o.rect.width / 2, o.rect.y + o.rect.height / 2)
        await sleep(140)
        record(check('  panel for ' + o.id))
      }
      await shot('ring-tower-' + VP.w + 'x' + VP.h)
    }

    note('RESULT ' + (worst.off === 0 && worst.clashes === 0
      ? 'every button of every ring was on screen, and none overlapped another'
      : '*** ' + worst.off + ' off-screen buttons, ' + worst.clashes + ' overlapping pairs ***'))
    return
  }

  if (scenario === 'heroanim') {
    // REGISTRATION. The two clips do not share a canvas, so the question is
    // whether the hero MOVES ON SCREEN when the pose changes. Measured on the
    // painted figure, not on the container: the container never moves, which
    // is exactly why measuring it would prove nothing.
    const h = g.hero
    note('viewport ' + VP.w + 'x' + VP.h)
    const AR = (await import('./js/data/art.json', { with: { type: 'json' } })).default
    const sample = (label) => {
      const b = h.body_ ? h.body_.getBounds() : null
      if (!b) return null
      // getBounds returns the TEXTURE rectangle, transparent padding included.
      // The walk canvas has 27 source px of empty space below the feet and the
      // attack canvas 16, so comparing bounds.bottom compares padding, not
      // registration — the first run of this reported a 1.2px "shift" that was
      // entirely the walk canvas's own margin. The anchored foot line is
      // bounds.bottom minus that padding, and THAT is what must not move.
      const r = AR.render[h.body_.texture.key] || {}
      const pad = (1 - (r.anchorY ?? 1)) * b.height
      const footLine = b.bottom - pad - h.y
      // Feet and the horizontal centre of the figure, relative to the hero's
      // own position. Those are what must hold still.
      const v = { label, key: h.body_.texture.key,
        footY: footLine, cx: b.centerX - h.x, w: b.width, hh: b.height,
        figure: b.height - pad }
      note('  ' + label.padEnd(10) + String(v.key).padEnd(22) +
        ' anchored foot ' + v.footY.toFixed(2) +
        '  figure height ' + v.figure.toFixed(1) +
        '  bbox ' + v.w.toFixed(0) + 'x' + v.hh.toFixed(0))
      return v
    }
    h.rallyX = h.x; h.rallyY = h.y
    await sleep(500)
    const idle = sample('idle')

    // Walk: give him somewhere to go.
    h.rallyX = h.x + 220
    await until(() => h.body_.texture.key.indexOf('walk') >= 0, 4000)
    await sleep(80)
    const walk = sample('walk')

    // Attack: put him ON the lane so the wave walks into him, rather than
    // waiting at the centre of the map for enemies that never come. The first
    // run of this waited 30s and reported "a swing was observed: false".
    const p0 = g.lane.pointAt(360)
    h.setPosition(p0.x, p0.y)
    h.rallyX = p0.x; h.rallyY = p0.y
    await sleep(400)
    g.startWave()
    const swung = await until(() => h.body_.texture.key.indexOf('attack') >= 0, 30000)
    const atk = swung ? sample('attack') : null
    note('  a swing was observed: ' + swung)

    if (idle && walk && atk) {
      const dFootW = Math.abs(walk.footY - idle.footY)
      const dFootA = Math.abs(atk.footY - idle.footY)
      const dCxW = Math.abs(walk.cx - idle.cx)
      const dCxA = Math.abs(atk.cx - idle.cx)
      const dCxWA = Math.abs(atk.cx - walk.cx)
      note('  feet shift   idle->walk ' + dFootW.toFixed(1) + 'px   idle->attack ' + dFootA.toFixed(1) + 'px')
      // The bounding-box centre is a WEAK check and is reported for context
      // only: a raised weapon or an extended shield legitimately moves it
      // without the character having moved at all. The feet are the contract.
      note('  bbox centre (weapon moves this legitimately) idle->walk ' + dCxW.toFixed(1) +
        'px  idle->attack ' + dCxA.toFixed(1) + 'px  walk->attack ' + dCxWA.toFixed(1) + 'px')
      // Canvas ABOVE the anchor, not the figure: it still carries each
      // canvas's own top padding, so the three differ by that padding rather
      // than by the character's size. The real figure heights are
      // 677*(78.8/704) and 690*(79.1/720), both 75.8, matching the idle —
      // measured off the files, since the padding is not in the manifest.
      note('  canvas above anchor  idle ' + idle.figure.toFixed(1) + '  walk ' + walk.figure.toFixed(1) +
        '  attack ' + atk.figure.toFixed(1) + '  (padding differs; figures are all 75.8)')
      const worstFoot = Math.max(dFootW, dFootA)
      note('RESULT worst foot shift ' + worstFoot.toFixed(1) + 'px ' + (worstFoot < 3
        ? '- the hero holds his ground across the clips'
        : '*** THE HERO JUMPS WHEN THE POSE CHANGES ***'))
    }
    await shot('heroanim-' + VP.w + 'x' + VP.h)
    return
  }

  if (scenario === 'startrun') {
    // Actually press BEGIN THE RUN, on the longest loadout there is, at the
    // smallest viewport. Not "the button is on screen" — the button works and
    // a run starts.
    for (const k of ['Title', 'Splash', 'Credits', 'Boot', 'Game', 'Hud']) game.scene.stop(k)
    const RS = await import('./js/systems/RunState.js')
    // The worst case by measurement: Filing Extension has the longest tower
    // body, the Scratch Ticket the longest special body.
    RS.setRunState({ heroId: 'cory', openingTowers: ['extension', 'shelter'],
      abilities: ['scratchTicket', 'glacier'] })
    game.scene.start('Loadout')
    await until(() => running('Loadout'), 10000)
    await sleep(500)
    const sc = scene('Loadout')

    const all = []
    const walkAll = (list) => { for (const o of list) { all.push(o); if (o.list) walkAll(o.list) } }
    walkAll(sc.children.list)
    const label = all.find((o) => o.type === 'Text' && /BEGIN/.test(String(o.text ?? '')))
    const bb = label.getBounds()
    note('viewport ' + VP.w + 'x' + VP.h)
    note('loadout: extension + shelter / scratchTicket + glacier (the longest copy in the game)')
    note('BEGIN THE RUN at y ' + Math.round(bb.y) + '..' + Math.round(bb.bottom) + ' of 720  ' +
      (bb.bottom < 720 ? 'ON SCREEN' : '*** OFF SCREEN ***'))
    await shot('startrun-01-loadout-' + VP.w + 'x' + VP.h)

    // Press it for real, through the input system, at its screen position.
    const cam = sc.cameras.main
    const dscale = window.devicePixelRatio || 1
    const sx = (cam.x + (bb.centerX - cam.worldView.x) * cam.zoom) / dscale
    const sy = (cam.y + (bb.centerY - cam.worldView.y) * cam.zoom) / dscale
    note('pressing at screen ' + Math.round(sx) + ',' + Math.round(sy) +
      ' (viewport is ' + VP.w + 'x' + VP.h + ')')
    await click(sx, sy)
    const started = await until(() => running('Game'), 12000)
    note('the run started: ' + (started ? 'YES' : 'NO *** THE BUTTON DID NOT WORK ***'))
    await sleep(900)
    const g2 = scene('Game')
    note('  towers available: ' + (g2 ? Object.keys(g2.towerDefs).length : '?') +
      '  hero: ' + (g2 && g2.status ? g2.status.heroName : '?') +
      '  drew ' + (g2 ? g2.children.list.length : 0) + ' objects')
    await shot('startrun-02-playing-' + VP.w + 'x' + VP.h)
    note('RESULT ' + (started && bb.bottom < 720 ? 'a run can be started at the worst case'
      : '*** COULD NOT START A RUN ***'))
    return
  }

  if (scenario === 'everyloadout') {
    // EVERY hero, EVERY tower and EVERY special, each one forced into both
    // slots of its row so it is measured in the narrowest card it can get.
    for (const k of ['Title', 'Splash', 'Credits', 'Boot', 'Game', 'Hud']) game.scene.stop(k)
    const RS = await import('./js/systems/RunState.js')
    const towers = Object.keys((await import('./js/data/towers.json', { with: { type: 'json' } })).default)
    const abil = (await import('./js/data/abilities.json', { with: { type: 'json' } })).default
    const heroes = Object.keys((await import('./js/data/heroes.json', { with: { type: 'json' } })).default)
    const specials = Object.keys(abil)

    let combos = 0
    let worstButtonBottom = 0
    const bad = []
    const table = []

    const render = async (hero, tp, sp) => {
      RS.setRunState({ heroId: hero, openingTowers: tp, abilities: sp, reserveTowers: [] })
      game.scene.stop('Loadout')
      game.scene.start('Loadout')
      await until(() => running('Loadout'), 6000)
      await sleep(50)
      combos++
      const sc = scene('Loadout')
      // THE ASSERTION THAT WOULD HAVE CAUGHT THE OUTAGE. A card that grows
      // pushes the buttons down, and a button off the bottom of the screen is
      // a player who cannot start a run. Checked for every combination, not
      // for whichever one the seed happened to deal.
      // Walked recursively: the buttons live on the scene's layer container,
      // so a scan of children.list alone finds nothing and reports a clean
      // bill of health — which is exactly the shape of check that missed this.
      const all = []
      const walkAll = (list) => { for (const o of list) { all.push(o); if (o.list) walkAll(o.list) } }
      walkAll(sc.children.list)
      for (const o of all) {
        if (o.type !== 'Text' || !/BEGIN|REROLL/.test(String(o.text ?? ''))) continue
        const bb = o.getBounds()
        worstButtonBottom = Math.max(worstButtonBottom, bb.bottom + 16)
        if (bb.bottom + 16 > 720 || bb.y < 0) {
          bad.push([hero, tp[0], sp[0]].join('/') + '  ' + JSON.stringify(String(o.text)) +
            '  BUTTON OFF SCREEN at y ' + Math.round(bb.y) + '..' + Math.round(bb.bottom))
        }
      }
      for (const c of sc.cards) {
        // Measured against the PAINTED FRAME's inner edge, not the backing
        // rectangle: the backing sits 5px inside the box, the nine-slice's
        // corners reach much further, and text can clear one and sit on the
        // other. That gap is why three passes of this "verified clean".
        const plate = c.parts.find((o) => o.type === 'Rectangle' && o.getBounds)
        if (!plate) continue
        const pb = plate.getBounds()
        const inset = sc.frameInsetFor(pb.width + 10, pb.height + 10)
        const safe = {
          x: pb.x - 5 + inset.left, right: pb.right + 5 - inset.right,
          y: pb.y - 5 + inset.top, bottom: pb.bottom + 5 - inset.bottom,
        }
        const kids = c.face.list || []
        const icons = kids.filter((o) => o.type === 'Image' || o.type === 'Sprite')
        for (const o of kids) {
          if (o.type !== 'Text' || String(o.text ?? '').trim() === '') continue
          const bb = o.getBounds()
          const label = JSON.stringify(String(o.text).slice(0, 30))
          const over = []
          if (bb.x < safe.x - 1) over.push('LEFT by ' + Math.round(safe.x - bb.x))
          if (bb.right > safe.right + 1) over.push('RIGHT by ' + Math.round(bb.right - safe.right))
          if (bb.bottom > safe.bottom + 1) over.push('BOTTOM by ' + Math.round(bb.bottom - safe.bottom))
          if (bb.y < safe.y - 1) over.push('TOP by ' + Math.round(safe.y - bb.y))
          for (const ic of icons) {
            const ib = ic.getBounds()
            if (bb.x < ib.right - 1 && bb.right > ib.x + 1 && bb.y < ib.bottom - 1 && bb.bottom > ib.y + 1) {
              over.push('OVER THE ICON')
            }
          }
          if (over.length) bad.push([hero, tp[0], sp[0]].join('/') + '  ' + label + '  ' + over.join(', '))
          const lines = o.getWrappedText ? o.getWrappedText().length : 1
          const size = parseInt(o.style.fontSize, 10) || 0
          table.push({ what: [hero, tp[0], sp[0]].join('/'), text: String(o.text), lines,
            h: Math.round(bb.height), w: Math.round(bb.width), size })
        }
      }
    }

    for (const h of heroes) await render(h, [towers[0], towers[1]], [specials[0], specials[1]])
    for (const t of towers) await render(heroes[0], [t, t], [specials[0], specials[1]])
    for (const sp of specials) await render(heroes[0], [towers[0], towers[1]], [sp, sp])

    {
      const sc = scene('Loadout')
      const plate = sc.cards[1].parts.find((o) => o.type === 'Rectangle' && o.getBounds)
      const pb = plate.getBounds()
      const inset = sc.frameInsetFor(pb.width + 10, pb.height + 10)
      note('card box w ' + Math.round(pb.width + 10) +
        '  painted frame reaches in L' + inset.left.toFixed(1) + ' R' + inset.right.toFixed(1) +
        ' T' + inset.top.toFixed(1) + ' B' + inset.bottom.toFixed(1) +
        '  (the old pad was 9)')
    }
    note('viewport ' + VP.w + 'x' + VP.h)
    note('worst button row bottom over every combination: ' + Math.round(worstButtonBottom) +
      ' of 720' + (worstButtonBottom > 720 ? '  *** OFF THE SCREEN ***' : '  on screen'))
    note('combinations rendered: ' + combos +
      '  (' + heroes.length + ' heroes + ' + towers.length + ' towers + ' + specials.length + ' specials)')
    const worst = table.slice().sort((x, y) => y.lines - x.lines || y.w - x.w).slice(0, 6)
    note('longest rendered bodies:')
    for (const w of worst) note('   ' + w.lines + ' lines, ' + w.h + 'px tall, ' + w.w + 'px wide  ' + w.what + '  ' + JSON.stringify(w.text.slice(0, 46)))
    // Which copy had to shrink below the 22px floor to fit, and how far.
    const shrunk = {}
    for (const t of table) {
      if (t.size && t.size < 22) {
        const key = t.text.slice(0, 44)
        shrunk[key] = Math.min(shrunk[key] ?? 99, t.size)
      }
    }
    const keys = Object.keys(shrunk)
    note('copy that had to drop below 22px: ' + (keys.length ? keys.length + ' strings' : 'none'))
    for (const k of keys.sort((a, b) => shrunk[a] - shrunk[b]).slice(0, 8)) {
      note('   ' + shrunk[k] + 'px  ' + JSON.stringify(k))
    }
    note('OVERFLOWS: ' + (bad.length ? bad.length : 'none'))
    for (const b of bad.slice(0, 16)) note('   ' + b)
    return
  }

  if (scenario === 'loadout') {
    // The loadout screen, measured rather than eyeballed.
    // Game and Hud too: they render AFTER Loadout in the scene order, so if
    // either is alive it draws straight over the screen under test.
    for (const k of ['Title', 'Splash', 'Credits', 'Boot', 'Game', 'Hud']) game.scene.stop(k)
    game.scene.start('Loadout')
    await until(() => running('Loadout'), 10000)
    await sleep(900)
    const sc = scene('Loadout')
    const cam = sc.cameras.main
    note('viewport ' + VP.w + 'x' + VP.h + ' zoom ' + cam.zoom.toFixed(3) +
      ' content width ' + Math.round(sc.contentWidth))

    /* --- THE BUTTON ROW AGAINST THE CARD COLUMN ------------------------- */
    //
    // Reported off centre. Measured here in BOTH spaces on purpose: this is
    // the fifth layout-arithmetic fault, and the way to tell an arithmetic
    // error from a space error is that a space error changes with the device
    // ratio and an arithmetic one does not.
    {
      const dpr = window.devicePixelRatio || 1
      const bounds = (parts) => {
        let lo = 1e9, hi = -1e9
        for (const o of parts) {
          if (!o.getBounds) continue
          const b = o.getBounds()
          if (b.width <= 0) continue
          lo = Math.min(lo, b.x); hi = Math.max(hi, b.x + b.width)
        }
        return { lo, hi, w: hi - lo, mid: (lo + hi) / 2 }
      }
      const btns = sc.buttonsForProbe || []
      if (!btns.length) note('   *** the scene exposes no buttons to measure ***')
      else {
        const each = btns.map((b) => ({ label: b.text.text, ...bounds(b.parts) }))
        for (const e of each) {
          note('  button "' + e.label + '"  design x ' + e.lo.toFixed(1) + '..' +
            e.hi.toFixed(1) + '  width ' + e.w.toFixed(1))
        }
        const row = { lo: Math.min(...each.map((e) => e.lo)),
                      hi: Math.max(...each.map((e) => e.hi)) }
        row.mid = (row.lo + row.hi) / 2
        const colMid = sc.contentCentre !== undefined ? sc.contentCentre : 1280 / 2
        const dDesign = row.mid - colMid
        // The same difference on the glass, which is what a person sees.
        const toCss = (v) => v * cam.zoom / dpr
        note('  row ' + row.lo.toFixed(1) + '..' + row.hi.toFixed(1) +
          '  centre ' + row.mid.toFixed(1) + '   card column centre ' + colMid.toFixed(1))
        note('  OFFSET ' + dDesign.toFixed(2) + ' design px = ' +
          toCss(dDesign).toFixed(2) + ' CSS px = ' +
          (toCss(dDesign) * dpr).toFixed(2) + ' device px   (dpr ' + dpr + ')')
        if (Math.abs(dDesign) > 1) {
          note('   *** the button row is not centred on the card column ***')
        }
        // And the two buttons should be the same width.
        const widths = each.map((e) => Math.round(e.w))
        if (new Set(widths).size !== 1) {
          note('   *** the buttons are ' + widths.join(' and ') +
            ' wide; the row is asymmetric ***')
        }
      }
    }

    // Everything with a size, flattened.
    const all = []
    const walk = (list) => { for (const o of list) { all.push(o); if (o.list) walk(o.list) } }
    walk(sc.children.list)
