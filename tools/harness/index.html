    while (performance.now() - t0 < 22000) {
      await sleep(50)
      for (const e of g.enemies) {
        if (!e.alive) continue
        const inAny = g.towers.some((tw) => Math.hypot(e.x - tw.x, e.y - tw.y) <= tw.range)
        if (!inAny) continue
        let r = track.get(e)
        if (!r) { r = { n: 0, stunned: 0, slowed: 0, startDist: e.distance }; track.set(e, r) }
        r.n++
        if (e.stunned) r.stunned++
        else if (e.slowed) r.slowed++
        r.endDist = e.distance
      }
    }
    const rows = [...track.values()].filter((r) => r.n >= 20)
    if (rows.length === 0) { note('nothing stayed in range long enough'); return }
    const mean = (f) => rows.reduce((a, r) => a + f(r), 0) / rows.length
    note('tracked ' + rows.length + ' enemies inside range of ' + g.towers.length + ' tower(s):')
    note('  stunned  ' + (100 * mean((r) => r.stunned / r.n)).toFixed(1) + '% of the time')
    note('  slowed   ' + (100 * mean((r) => r.slowed / r.n)).toFixed(1) + '%')
    note('  free     ' + (100 * mean((r) => 1 - (r.stunned + r.slowed) / r.n)).toFixed(1) + '%')
    // The number that matters: how far did they actually get?
    const secs = 22
    note('  advanced ' + mean((r) => (r.endDist - r.startDist)).toFixed(0) +
      'px while tracked; unimpeded that would be about ' +
      Math.round(58 * secs * GAME_SPEED * mean((r) => r.n * 0.05 / secs)) + 'px')
    await shot('stunlock-' + spec)
    void t
    return
  }

  if (scenario === 'nukeseq') {
    // Both Server Nuke moments, at whatever viewport the run was given.
    const hud = game.scene.getScene('Hud')
    const vp = VP.w + 'x' + VP.h
    note('viewport ' + vp)
    g.status.peanuts = 99999
    await build(3, 0)
    g.startWave()
    await sleep(900)

    // --- 1. Earned -------------------------------------------------------
    g.status.rareAbility = 'serverNuke'
    g.cooldowns.reset('serverNuke')
    g.announceRareDrop('Server Nuke')
    await sleep(260)
    const ov = g.nukeEarned
    note('earned: overlay=' + !!ov + ' modalOpen=' + g.modalOpen +
      ' HUD visible=' + hud.cameras.main.visible)
    await shot('nukeseq-01-earned-' + vp)
    await sleep(420)
    await shot('nukeseq-02-slam-' + vp)

    // Everything on screen must be inside the viewport.
    const clipped = []
    const check = (label, obj) => {
      if (!obj) return
      const b = obj.getBounds()
      if (b.x < -1 || b.y < -1 || b.right > VP.w + 1 || b.bottom > VP.h + 1) {
        clipped.push(label + ' ' + Math.round(b.x) + ',' + Math.round(b.y) +
          ' ' + Math.round(b.width) + 'x' + Math.round(b.height))
      }
    }
    if (ov) {
      check('headline', ov.headline); check('subhead', ov.subhead)
      check('medallion', ov.medallion)
      note('  medallion ' + Math.round(ov.medallion.displayWidth) + 'x' +
        Math.round(ov.medallion.displayHeight) +
        ' headline ' + Math.round(ov.headline.width) + 'x' + Math.round(ov.headline.height))
    }
    note('  clipped: ' + (clipped.length ? clipped.join(' | ') : 'nothing'))

    await until(() => !g.nukeEarned, 6000)
    note('earned overlay closed; rareAbility=' + g.status.rareAbility +
      ' modalOpen=' + g.modalOpen + ' HUD visible=' + hud.cameras.main.visible)

    // --- 2. Launch confirmation -----------------------------------------
    await sleep(400)
    g.armAbility('serverNuke')
    await sleep(500)
    const lp = g.nukeLaunch
    note('launch: panel=' + !!lp + ' modalOpen=' + g.modalOpen +
      ' HUD visible=' + hud.cameras.main.visible + ' casting=' + g.casting)
    await shot('nukeseq-03-launch-' + vp)
    const clip2 = []
    if (lp) {
      const bb = lp.button.getBounds()
      note('  button ' + Math.round(bb.width) + 'x' + Math.round(bb.height) +
        ' at ' + Math.round(bb.centerX) + ',' + Math.round(bb.centerY))
      const cb = lp.closeHit.getBounds()
      note('  X hit ' + Math.round(cb.width) + 'x' + Math.round(cb.height) +
        ' at ' + Math.round(cb.centerX) + ',' + Math.round(cb.centerY) +
        '; distance from the dome centre ' +
        Math.round(Math.hypot(cb.centerX - bb.centerX, cb.centerY - bb.centerY)) + 'px')
      for (const [n, o] of [['button', lp.button], ['X', lp.closeHit]]) {
        const b = o.getBounds()
        if (b.x < -1 || b.y < -1 || b.right > VP.w + 1 || b.bottom > VP.h + 1) {
          clip2.push(n)
        }
      }
    }
    note('  clipped: ' + (clip2.length ? clip2.join(', ') : 'nothing'))

    // A tap on empty space must do nothing at all.
    const before = { open: !!g.nukeLaunch, rare: g.status.rareAbility, casting: g.casting }
    await click(VP.w * 0.82, VP.h * 0.5)
    await sleep(250)
    note('  tap on empty space: panel still open=' + !!g.nukeLaunch +
      ' rare=' + g.status.rareAbility + ' casting=' + g.casting +
      (!!g.nukeLaunch === before.open && g.casting === before.casting ? '  (nothing happened)' : '  *** SOMETHING HAPPENED ***'))

    // The X cancels and the ability survives.
    const cb2 = g.nukeLaunch.closeHit.getBounds()
    await click(cb2.centerX, cb2.centerY)
    await sleep(300)
    note('  tap the X: panel=' + !!g.nukeLaunch + ' rare=' + g.status.rareAbility +
      ' casting=' + g.casting + ' modalOpen=' + g.modalOpen)

    // And the dome fires it.
    g.armAbility('serverNuke')
    await sleep(450)
    const hb = g.nukeLaunch.hit.getBounds()
    await click(hb.centerX, hb.centerY)
    await sleep(200)
    await shot('nukeseq-04-pressed-' + vp)
    await sleep(700)
    note('  press the dome: panel=' + !!g.nukeLaunch + ' casting=' + g.casting +
      ' rare=' + g.status.rareAbility)
    await sleep(2500)
    note('  after the cast: rare=' + g.status.rareAbility + ' casting=' + g.casting)
    return
  }

  if (scenario === 'rollspeed') {
    for (const k of ['Title', 'Splash', 'Boot', 'Game', 'Hud', 'Loadout']) game.scene.stop(k)
    game.scene.start('Credits')
    await until(() => running('Credits'), 8000)
    await sleep(300)
    const sc = scene('Credits')
    const C = (await import('./js/data/credits.json', { with: { type: 'json' } })).default
    let bottom = 0
    for (const o of sc.roll.list) {
      if (!o.getBounds) continue
      const b = o.getBounds()
      bottom = Math.max(bottom, b.bottom - sc.roll.y)
    }
    const H = 720
    const travel = bottom + H
    note('roll height ' + Math.round(bottom) + 'px, travel ' + Math.round(travel) + 'px')
    for (const secs of [50, 60, 70, 80, 90, 100]) {
      note('   ' + String(secs).padStart(3) + 's -> ' + (travel / secs).toFixed(0) + ' px/sec' +
        (secs === C.scrollSeconds ? '   <- configured' : ''))
    }
    // A 26px credit line occupies LINE_H = 46px, so this is how long one line
    // is on screen at each speed.
    note('one credit line is on screen for:')
    for (const secs of [60, 75, 90]) {
      note('   ' + secs + 's -> ' + ((H) / (travel / secs)).toFixed(1) + 's per screenful, ' +
        (46 / (travel / secs)).toFixed(2) + 's per line')
    }
    return
  }

  if (scenario === 'fps') {
    // Framerate with the scatter, the tavern ambience and a full wave.
    g.status.peanuts = 99999
    await build(3, 0)
    await build(1, 1)
    g.startWave()
    await sleep(9000)
    const sample = async (label) => {
      const frames = []
      let last = performance.now()
      const t0 = performance.now()
      while (performance.now() - t0 < 4000) {
        await new Promise((r) => requestAnimationFrame(r))
        const now = performance.now()
        frames.push(now - last)
        last = now
      }
      frames.sort((a, b) => a - b)
      const mean = frames.reduce((a, b) => a + b, 0) / frames.length
      const p95 = frames[Math.floor(frames.length * 0.95)]
      note('  ' + label + ': ' + (1000 / mean).toFixed(1) + ' fps mean, worst 5% of frames ' +
        p95.toFixed(1) + 'ms, ' + frames.length + ' frames')
    }
    note('viewport ' + VP.w + 'x' + VP.h)
    note('scatter props on the board: ' + g.scatterCount)
    note('enemies alive: ' + g.enemies.length + '  towers: ' + g.towers.length)
    await sample('with scatter + ambience')

    // The same board with the decoration hidden, so the cost is measured
    // rather than asserted.
    const deco = g.children.list.filter((o) => o.depth <= -900 + 3 && o.visible)
    for (const o of deco) o.setVisible(false)
    await sample('decoration hidden (' + deco.length + ' objects)')
    for (const o of deco) o.setVisible(true)
    return
  }

  if (scenario === 'music') {
    // Requirement 8: title, loadout, a full level, back to title, three times.
    // Only one track audible at a time, and nothing accumulating.
    const M = await import('./js/systems/Music.js')
    // The harness never produces a real user gesture the browser trusts, so
    // the unlock is asked for directly. Everything after this is the real
    // code path.
    const A = await import('./js/systems/Audio.js')
    note('audio unavailable: ' + A.audioUnavailable() + '  muted: ' + A.isMuted() + '  volume: ' + A.getVolume())
    M.unlockMusic()
    M.playTrack('battle')
    await sleep(400)
    note('after a direct playTrack: track=' + M.currentTrack() + ' elements=' + document.querySelectorAll('audio').length)

    const state = (label) => {
      // Counted through the module, not the DOM: `new Audio()` is never
      // attached to the document, so querySelectorAll finds nothing and would
      // have reported a clean bill of health whatever the code did.
      const rep = M.deckReport()
      const playing = rep.filter((d) => !d.paused && d.volume > 0.001)
      note('  ' + label.padEnd(22) +
        ' routed=' + JSON.stringify(M.routedDecks()) +
        ' track=' + String(M.currentTrack()) +
        '  decks=' + JSON.stringify(M.audibleTracks()) +
        '  elements=' + M.liveElementCount() +
        '  audible=' + playing.length +
        '  ' + JSON.stringify(rep.map((d) => (d.id ?? '-') + '@' + d.volume.toFixed(2))))
      return { els: M.liveElementCount(), decks: M.audibleTracks().length, audible: playing.length }
    }

    const worst = { els: 0, decks: 0, audible: 0 }
    const record = (s) => {
      worst.els = Math.max(worst.els, s.els)
      worst.decks = Math.max(worst.decks, s.decks)
      worst.audible = Math.max(worst.audible, s.audible)
    }

    note('viewport ' + VP.w + 'x' + VP.h)
    for (let run = 1; run <= 3; run++) {
      note('run ' + run + ':')
      for (const k of ['Game', 'Loadout', 'Credits']) game.scene.stop(k)
      game.scene.start('Title')
      await until(() => running('Title'), 8000)
      await sleep(1400)
      record(state('title'))
      const afterTitle = M.currentTrack()

      game.scene.stop('Title')
      game.scene.start('Loadout')
      await until(() => running('Loadout'), 8000)
      await sleep(300)
      const afterLoadout = M.currentTrack()
      record(state('loadout'))
      note('    title -> loadout kept the same track: ' +
        (afterTitle === afterLoadout ? 'YES (' + afterTitle + ')' : 'NO *** it changed ***'))
      // And it must not have restarted: the element is the same object and
      // its clock has kept running.
      const t1 = M.currentPosition()
      await sleep(700)
      const t2 = M.currentPosition()
      note('    and it kept playing rather than restarting: ' +
        (t2 > t1 ? 'YES (' + t1.toFixed(1) + 's -> ' + t2.toFixed(1) + 's)' : 'position did not advance (no audio device?)'))

      game.scene.stop('Loadout')
      game.scene.start('Game')
      game.scene.start('Hud')
      await until(() => running('Game'), 10000)
      await sleep(1600)
      record(state('level'))

      game.scene.stop('Game'); game.scene.stop('Hud')
      game.scene.start('Title')
      await until(() => running('Title'), 8000)
      await sleep(1600)
      record(state('back to title'))
    }
    note('WORST OVER 3 RUNS: <audio> elements=' + worst.els +
      '  decks loaded=' + worst.decks + '  audible at once=' + worst.audible)
    note('RESULT ' + (worst.els <= 2 && worst.decks <= 2 && worst.audible <= 1
      ? 'no accumulation, never more than one audible'
      : '*** LEAK ***'))
    return
  }

  if (scenario === 'levels') {
    // Level-matching, measured rather than guessed.
    //
    // "By ear" is not available to me, so the next most honest thing is to
    // measure what the ear is responding to: not peak, which both files hit,
    // but the RMS of the loud parts — roughly how loud a track SEEMS.
    const MJ = (await import('./js/data/music.json', { with: { type: 'json' } })).default
    const ctx = new (window.AudioContext || window.webkitAudioContext)()
    const out = []
    for (const [id, t] of Object.entries(MJ.tracks)) {
      const res = await fetch('/' + MJ.root + t.file + '.' + t.format)
      const buf = await ctx.decodeAudioData(await res.arrayBuffer())
      const ch = buf.getChannelData(0)
      // Window into 300ms blocks, take the RMS of each, then average the
      // loudest half. Averaging everything lets a quiet intro drag an
      // orchestral track's number down and mis-match it against a
      // wall-of-sound electro one.
      const win = Math.floor(buf.sampleRate * 0.3)
      const blocks = []
      let peak = 0
      for (let i = 0; i + win < ch.length; i += win) {
        let sum = 0
        for (let j = i; j < i + win; j++) {
          const v = ch[j]
          sum += v * v
          const a = v < 0 ? -v : v
          if (a > peak) peak = a
        }
        blocks.push(Math.sqrt(sum / win))
      }
      blocks.sort((a, b) => b - a)
      const loud = blocks.slice(0, Math.max(1, Math.floor(blocks.length / 2)))
      const rms = loud.reduce((a, b) => a + b, 0) / loud.length
      const db = (x) => (20 * Math.log10(Math.max(1e-6, x))).toFixed(1)
      out.push({ id, gain: t.gain, rms, peak, secs: buf.duration })
      note(id.padEnd(14) + ' ' + Math.round(buf.duration) + 's  peak ' + db(peak) + ' dBFS' +
        '  loud-half RMS ' + db(rms) + ' dBFS  (configured gain ' + t.gain + ')')
    }
    // What the two would sound like at their configured gains, and what gain
    // would actually match them.
    const [a, b] = out
    const db = (x) => (20 * Math.log10(Math.max(1e-6, x))).toFixed(1)
    note('at the configured gains: ' +
      out.map((t) => t.id + ' ' + db(t.rms * t.gain) + ' dBFS').join('  vs  '))
    note('difference at those gains: ' +
      (20 * Math.log10((a.rms * a.gain) / (b.rms * b.gain))).toFixed(1) + ' dB' +
      '  (0 dB would be matched)')
    // The mastered track is the reference; the MIDI render is levelled to it.
    const ref = out.find((t) => t.id === 'battle')
    for (const t of out) {
      if (t.id === ref.id) continue
      note('to match ' + ref.id + ' at ' + ref.gain + ', ' + t.id + ' wants gain ' +
        ((ref.rms * ref.gain) / t.rms).toFixed(3) + '  (currently ' + t.gain + ')')
    }
    note('headroom check: loudest output would be ' +
      db(Math.max(...out.map((t) => t.peak * t.gain))) + ' dBFS peak')
    return
  }

  if (scenario === 'goblin') {
    // "Only the very first enemy to emerge from the entrance archway in a run."
    //
    // Four ways to get that wrong, so all four are watched here rather than
    // sampled: per enemy, per wave, at the spawn instead of at the arch, and
    // once ever instead of once per run.
    const MAPD = (await import('./js/data/map.json', { with: { type: 'json' } })).default
    const AJ = (await import('./js/data/audio.json', { with: { type: 'json' } })).default
    const mouthX = MAPD.entrance.emergeFromX
    note('viewport ' + VP.w + 'x' + VP.h)
    note('lane starts at x=' + MAPD.waypoints[0][0] + ', off the plate behind the stone;' +
      ' the arch mouth is x=' + mouthX + '. A cue fired at the spawn would be ' +
      Math.round(mouthX - MAPD.waypoints[0][0]) + ' world px early, with the enemy invisible.')
    note('arch mouth x=' + mouthX + '  cue gain ' + AJ.cues['goblin-spawn'].gain +
      ' on bus "' + AJ.cues['goblin-spawn'].bus + '" at ' + AJ.buses[AJ.cues['goblin-spawn'].bus])

    // Every cue the game plays, with the argument it was played at. Patched on
    // the manager rather than on the module, so what is recorded is what the
    // real code path actually asked the engine for.
    const heard = []
    const realPlay = game.sound.play.bind(game.sound)
    game.sound.play = (key, cfg) => {
      heard.push({ key, vol: cfg && cfg.volume, t: performance.now() })
      return realPlay(key, cfg)
    }
    note('cue file loaded: ' + game.cache.audio.exists('goblin-spawn'))

    const goblins = () => heard.filter((h) => h.key === 'goblin-spawn')
    const t0 = performance.now()
    // Where the first enemy was, and how visible it was, at the moment the
    // line fired. This is the whole "timed with the fade-in, not before" claim.
    let atCue = null
    let firstSeen = null
    const watch = () => {
      for (const e of g.enemies) {
        if (!e.alive) continue
        const a = e.art ? e.art.alpha : 1
        if (firstSeen === null && a > 0) firstSeen = { x: e.x, t: performance.now() }
      }
      if (atCue === null && goblins().length > 0) {
        const e = g.enemies.find((x) => x.alive)
        atCue = e
          ? { x: Math.round(e.x), alpha: e.art ? +e.art.alpha.toFixed(3) : 1,
              t: goblins()[0].t }
          : { x: null, alpha: null, t: goblins()[0].t }
      }
    }

    g.startWave()
    while (performance.now() - t0 < 22000) { watch(); await sleep(30) }
    await shot('goblin-arch-' + VP.w + 'x' + VP.h)

    const first = goblins()[0]
    note('wave 1: the line played ' + goblins().length + ' time(s)' +
      (goblins().length === 1 ? '  correct' : '  *** SHOULD BE EXACTLY 1 ***'))
    if (first) {
      note('  volume asked for: ' + first.vol.toFixed(3) +
        '   (gain x bus x master volume)')
      note('  leading enemy at the moment it fired: x=' + atCue.x +
        '  alpha=' + atCue.alpha +
        (atCue.x !== null && atCue.x >= mouthX - 2
          ? '   at or past the arch mouth' : '   *** BEFORE THE ARCH MOUTH ***'))
      note('  fired ' + (firstSeen ? Math.round(first.t - firstSeen.t) + 'ms after' : 'on the same tick as') +
        ' the first enemy became visible at all (0 would be exactly on the fade-in)')
    }
    note('  other cues heard this wave: ' +
      JSON.stringify([...new Set(heard.map((h) => h.key))].filter((k) => k !== 'goblin-spawn')))

    // Not per wave. Let wave one finish and wave two start.
    const before = goblins().length
    const t1 = performance.now()
    while (performance.now() - t1 < 30000) {
      if (g.status.phase === 'ready') g.startWave()
      await sleep(120)
    }
    note('after reaching wave ' + g.status.wave + ': total plays ' + goblins().length +
      (goblins().length === before ? '  still once — not per wave' : '  *** PLAYED AGAIN ***'))

    // But once per RUN, not once ever. A fresh run greets the player again.
    heard.length = 0
    game.scene.stop('Game'); game.scene.stop('Hud')
    await sleep(300)
    await startRun()
    const t2 = performance.now()
    while (performance.now() - t2 < 20000 && goblins().length === 0) {
      if (scene('Game').status.phase === 'ready') scene('Game').startWave()
      await sleep(80)
    }
    note('RESULT second run: the line played ' + goblins().length + ' time(s)' +
      (goblins().length === 1 ? '  correct — once per run' : '  *** the second run is silent ***'))
    return
  }

  if (scenario === 'voices') {
    // The two new lines, on the moments they belong to — and the thing that
    // cannot be checked from the source, which is what actually comes out at
    // the mixer when a wave is firing over the top of one.
    const AJ = (await import('./js/data/audio.json', { with: { type: 'json' } })).default
    const A = await import('./js/systems/Audio.js')
    const BUS = AJ.buses.voice, DUCK = AJ.voiceDuck, VOL = A.getVolume()
    note('viewport ' + VP.w + 'x' + VP.h)
    note('voice bus ' + BUS + ', everything else ducks to ' + DUCK +
      ' while a line is sounding, master volume ' + VOL)
    for (const k of ['goblin-spawn', 'haymaker-voice', 'dadmode-voice']) {
      note('  ' + k.padEnd(15) + ' loaded=' + game.cache.audio.exists(k) +
        '  gain ' + AJ.cues[k].gain + '  ' + AJ.cues[k].durationMs + 'ms' +
        '  expect volume ' + (AJ.cues[k].gain * BUS * VOL).toFixed(3))
    }

    const heard = []
    const realPlay = game.sound.play.bind(game.sound)
    game.sound.play = (key, cfg) => {
      heard.push({ key, vol: cfg && cfg.volume, t: performance.now() })
      return realPlay(key, cfg)
    }
    const since = (t) => heard.filter((h) => h.t >= t)
    const got = (k) => heard.filter((h) => h.key === k)

    // --- HAYMAKER, refused. A press that lands no punch says nothing.
    const before = got('haymaker-voice').length
    g.castHaymaker()   // no wave yet, so nothing is in reach
    note('refused press (nothing in reach): line played ' +
      (got('haymaker-voice').length - before) + ' time(s)' +
      (got('haymaker-voice').length === before ? '  correct — silent' : '  *** IT TALKED ***'))

    // --- HAYMAKER, landed.
    // Onto the lane: the hero starts well off it, and a wave that never comes
    // within haymaker range proves nothing about a cue fired on the punch.
    const wp = (await import('./js/data/map.json', { with: { type: 'json' } })).default.waypoints
    const mid = wp[Math.floor(wp.length / 2)]
    g.orderHero(mid[0], mid[1])
    g.startWave()
    const reached = await until(() => g.enemies.some((e) =>
      e.alive && Math.hypot(e.x - g.hero.x, e.y - g.hero.y) <= g.hero.def.haymaker.range), 60000)
    note('an enemy came into haymaker range: ' + reached +
      '  (hero at ' + Math.round(g.hero.x) + ',' + Math.round(g.hero.y) + ')')
    const tPunch = performance.now()
    g.castHaymaker()
    const hv = got('haymaker-voice')[0]
    note('haymaker: line played ' + got('haymaker-voice').length + ' time(s)' +
      (hv ? '  at volume ' + hv.vol.toFixed(3) : '  *** SILENT ***'))
    if (hv) {
      const want = AJ.cues['haymaker-voice'].gain * BUS * VOL
      note('   expected ' + want.toFixed(3) + ' — ' +
        (Math.abs(hv.vol - want) < 0.001 ? 'matches' : '*** MIXED WRONG ***'))
      // The punch's own impact cue goes off in the same call. It must have
      // stepped back for the line rather than sitting on top of it.
      const punch = since(tPunch).find((h) => h.key === 'haymaker')
      const full = AJ.cues.haymaker.gain * VOL
      note('   the punch effect alongside it: ' +
        (punch ? punch.vol.toFixed(3) + ' against ' + full.toFixed(3) + ' unducked — ' +
          (punch.vol < full * 0.75 ? 'stepped back' : '*** DID NOT DUCK ***')
          : 'not heard'))
    }

    // --- DAD MODE. Through the game's own damage path, which is the only
    // route into announceLastStand.
    const tDad = performance.now()
    g.damageHero(99999)
    await sleep(120)
    const dv = got('dadmode-voice')[0]
    const sting = since(tDad).find((h) => h.key === 'last-stand')
    note('DAD MODE: lastStandActive=' + g.hero.lastStandActive +
      '  line ' + (dv ? 'played at ' + dv.vol.toFixed(3) : '*** SILENT ***') +
      '  sting ' + (sting ? 'played at ' + sting.vol.toFixed(3) : 'MISSING'))
    if (dv && sting) {
      note('   the line is ' + (20 * Math.log10(dv.vol / sting.vol)).toFixed(1) +
        ' dB over the sting it plays across' +
        (dv.vol > sting.vol ? '  — audible over its own transformation' : '  *** BURIED ***'))
    }

    // --- And it is not cut off. Watch the whole 2.2s with a wave firing.
    const dur = AJ.cues['dadmode-voice'].durationMs
    const t0 = performance.now()
    while (performance.now() - t0 < dur + 300) await sleep(50)
    // Measured from the LINE, not from the damage. hero-hit and the sting are
    // played in the same synchronous call, and a cue that started before the
    // line cannot step back for it — counting those as failures said the duck
    // was broken when it was doing exactly what it can.
    const tLine = dv ? dv.t : tDad
    const during = heard.filter((h) => h.t >= tLine && h.t <= tLine + dur && h.key !== 'dadmode-voice')
    const kinds = [...new Set(during.map((h) => h.key))]
    let ducked = 0, plain = 0
    for (const h of during) {
      const def = AJ.cues[h.key]
      if (!def || def.bus === 'voice') continue
      const full = def.gain * VOL
      if (h.vol < full * 0.75) ducked++; else plain++
    }
    note('while the line was talking, ' + during.length + ' other cue(s) started: ' +
      JSON.stringify(kinds))
    note('   ducked ' + ducked + ', at full level ' + plain)
    note('   the line was never stopped: ' +
      (got('dadmode-voice').length === 1 ? 'played once and left alone' : '*** RETRIGGERED ***'))
    note('RESULT ' + (hv && dv && plain === 0 && got('dadmode-voice').length === 1
      ? 'both lines fire on their moment, mixed as measured, and everything else steps back'
      : '*** see above ***'))
    return
  }

  if (scenario === 'looptrack') {
    // The level 1 track does not loop seamlessly and fades out at the end, so
    // it repeats with a gap and fades back in rather than cutting. Watched at
    // the seam rather than assumed: seek to just before the end and follow it
    // over.
    const M = await import('./js/systems/Music.js')
    const MJ = (await import('./js/data/music.json', { with: { type: 'json' } })).default
    const id = MJ.screens.Game
    const t = MJ.tracks[id]
    note('level 1 track: ' + id + '  "' + t.title + '" by ' + t.artist + '  ' + t.license)
    note('gap ' + t.loopGapMs + 'ms, fade back in over ' + t.loopFadeMs + 'ms')

    M.unlockMusic()
    M.playTrack(id)
    await until(() => M.currentTrack() === id, 8000)
    await sleep(800)
    const rep0 = M.deckReport().find((d) => d.id === id)
    if (!rep0 || rep0.paused) { note('*** the track is not playing; no audio device? ***'); return }
    note('playing: duration ' + M.currentDuration().toFixed(1) + 's  looping attribute: ' +
      M.loopAttribute() + '  (false is correct for a gapped loop — the gap is ours)')

    // Land 1.2s from the end and sample across the seam.
    M.seekCurrent(Math.max(0, M.currentDuration() - 1.2))
    const samples = []
    const t0 = performance.now()
    while (performance.now() - t0 < 6000) {
      const d = M.deckReport().find((x) => x.id === id)
      samples.push({ ms: Math.round(performance.now() - t0), pos: +M.currentPosition().toFixed(2),
        vol: d ? +d.volume.toFixed(3) : 0 })
      await sleep(100)
    }
    // The seam is where the position goes backwards.
    let wrap = -1
    for (let i = 1; i < samples.length; i++) if (samples[i].pos < samples[i - 1].pos) { wrap = i; break }
    if (wrap < 0) { note('*** never reached the end of the track in 6s ***'); return }
    // The gap starts when the position STOPS, not at the wrap: the element
    // holds its last position while it is paused, so the wrap is the end of
    // the gap rather than the start of it. Measuring from the wrap alone
    // reported a 100ms gap where there was a 900ms one.
    let stop = wrap - 1
    while (stop > 0 && samples[stop - 1].pos === samples[wrap - 1].pos) stop--
    const gapMs = samples[wrap].ms - samples[stop].ms
    note('seam: position froze at +' + samples[stop].ms + 'ms, restarted at +' +
      samples[wrap].ms + 'ms  — gap ' + gapMs + 'ms (asked for ' + t.loopGapMs + ')')
    for (const s of samples.slice(Math.max(0, stop - 2), wrap + 12)) {
      note('   +' + String(s.ms).padStart(4) + 'ms  pos ' + String(s.pos).padStart(7) +
        's  level ' + s.vol.toFixed(3))
    }
    // Silence is not "level 0" during the gap — the element is PAUSED, and the
    // gain node is a separate thing. What has to be true is that the track
    // comes back QUIETLY and rises, rather than arriving at full level.
    const after = samples.slice(wrap, wrap + 14)
    const top = Math.max(...samples.map((s) => s.vol))
    const startedQuiet = after[0].vol <= top * 0.35
    const rose = after[after.length - 1].vol > after[0].vol
    const gapOk = Math.abs(gapMs - t.loopGapMs) <= 250
    note('RESULT ' + (gapOk && startedQuiet && rose
      ? 'gapped ' + gapMs + 'ms and faded back in from ' + after[0].vol.toFixed(3) +
        ' to ' + after[after.length - 1].vol.toFixed(3) + ' — not a hard cut'
      : '*** wrong: gap ' + gapMs + 'ms (want ' + t.loopGapMs + '), came back at ' +
        after[0].vol.toFixed(3) + ' of ' + top.toFixed(3) + ', rose ' + rose + ' ***'))
    return
  }

  if (scenario === 'padart') {
    // The painted flagstone, at both viewport sizes and both ends of the zoom
    // band: does it read as a build site, or does it vanish into the grass?
    //
    // The second half of that is a MEASUREMENT, not a look. "Disappears into
    // the grass" means the pixels where the pad is are the same colour as the
    // pixels around it, and a screenshot can be squinted at either way.
    const D = (await import('./js/data/display.json', { with: { type: 'json' } })).default
    const A = await import('./js/systems/Art.js')
    const P = (await import('./js/data/presentation.json', { with: { type: 'json' } })).default
    const AJ = (await import('./js/data/art.json', { with: { type: 'json' } })).default
    const cam = g.cameras.main
    const key = A.ART.prop.buildPadQuiet
    const dpr = window.devicePixelRatio || 1
    note('viewport ' + VP.w + 'x' + VP.h + '  devicePixelRatio ' + dpr)
    note('quiet marker key: ' + key + '  loaded=' + game.textures.exists(key) +
      '  file ' + AJ.files[key])
    note('asked for ' + P.buildPad.quietScreenWidth + ' screen px across at the default zoom of '
      + D.camera.defaultZoom)

    const quiet = g.pads.filter((pd) => pd.texture.key === key)
    const signs = g.pads.filter((pd) => pd.texture.key !== key)
    note('pads: ' + g.pads.length + ' — ' + quiet.length + ' flagstone, ' + signs.length +
      ' sign' + (signs.length === 1 ? '  correct' : '  *** SHOULD BE EXACTLY 1 ***'))
    if (quiet.length === 0) {
      // THE MISSING-FILE CASE, which is the one this asset has failed before.
      // Not an error to bail on: the point is that the game is still running,
      // still playable, and saying loudly what is wrong. Rename the file out
      // of tools/harness/stage/assets/props to reproduce it.
      note('*** NO FLAGSTONE PADS: the art did not load ***')
      note('   the game booted anyway: bootFailed=' + bootBroken +
        ', ' + g.pads.length + ' spots all fell back to the sign')
      const banner = document.getElementById('missing-art')
      note('   and it says so: banner ' + (banner ? '"' + banner.textContent + '"' : 'MISSING'))
      await shot('padart-nofile-' + VP.w + 'x' + VP.h)
      return
    }
    const q = quiet[0]
    note('world size ' + q.displayWidth.toFixed(1) + ' x ' + q.displayHeight.toFixed(1) + ' px' +
      '  (source ' + q.texture.source[0].width + 'x' + q.texture.source[0].height + ')')

    // Reading the canvas directly. Under the harness's software path this is
    // the CANVAS renderer, so getImageData is real pixels.
    const ctx = game.canvas.getContext('2d')
    const patch = (cx, cy, r) => {
      const x = Math.max(0, Math.round(cx - r)), y = Math.max(0, Math.round(cy - r))
      const w = Math.min(game.canvas.width - x, Math.round(r * 2))
      const h = Math.min(game.canvas.height - y, Math.round(r * 2))
      if (w <= 0 || h <= 0) return null
      const d = ctx.getImageData(x, y, w, h).data
      let R = 0, G = 0, B = 0, n = 0
      for (let i = 0; i < d.length; i += 4) { R += d[i]; G += d[i+1]; B += d[i+2]; n++ }
      return { r: R / n, g: G / n, b: B / n }
    }
    const contrast = (a, b) => Math.sqrt((a.r-b.r)**2 + (a.g-b.g)**2 + (a.b-b.b)**2)

    for (const zName of ['min', 'default', 'max']) {
      const z = (zName === 'min' ? D.camera.minZoom
        : zName === 'max' ? D.camera.maxZoom : D.camera.defaultZoom) * dpr
      g.rig.setTargetZoom(z)
      await until(() => Math.abs(cam.zoom - z) < 0.01, 5000)
      // A flagstone in the middle of the view, so it is not clipped by an edge.
      await lookAt(q.x, q.y)
      await sleep(260)
      // Screen size, in CSS pixels — the unit the size was asked for in.
      const screenW = q.displayWidth * cam.zoom / dpr
      const screenH = q.displayHeight * cam.zoom / dpr
      // Canvas coordinates for the sampling, which are device pixels.
      const px = (q.x - cam.worldView.x) * cam.zoom + cam.x
      const py = (q.y - cam.worldView.y) * cam.zoom + cam.y
      const half = q.displayWidth * cam.zoom / 2
      const inside = patch(px, py, Math.max(2, half * 0.28))
      const outside = patch(px + half * 1.9, py, Math.max(2, half * 0.22))
      const dc = inside && outside ? contrast(inside, outside) : -1
      note('at ' + zName + ' zoom ' + (cam.zoom / dpr).toFixed(2) + ': ' +
        screenW.toFixed(0) + ' x ' + screenH.toFixed(0) + ' screen px' +
        (zName === 'default'
          ? '  (asked for ' + P.buildPad.quietScreenWidth + ' across — ' +
            // Deliberately loose. Every pad carries a per-instance scale
            // jitter and a slow breathing pulse, so a live measurement is up
            // to a tenth either side of nominal and a tight bound here would
            // fail on the animation working correctly.
            (Math.abs(screenW - P.buildPad.quietScreenWidth) <= P.buildPad.quietScreenWidth * 0.12
              ? 'matches, within the jitter and the pulse' : '*** OFF ***') + ')'
          : ''))
      note('   pad rgb ' + (inside ? [inside.r, inside.g, inside.b].map((v) => Math.round(v)).join(',') : '?') +
        '  grass beside it ' + (outside ? [outside.r, outside.g, outside.b].map((v) => Math.round(v)).join(',') : '?') +
        '  separation ' + dc.toFixed(1) +
        (dc >= 24 ? '  reads clearly' : dc >= 12 ? '  faint' : '  *** DISAPPEARS INTO THE GRASS ***'))
      await shot('padart-' + zName + '-' + VP.w + 'x' + VP.h)
    }

    // And the sign is still the loudest thing on the board.
    if (signs.length === 1) {
      note('the one sign is ' + signs[0].displayWidth.toFixed(0) + 'x' +
        signs[0].displayHeight.toFixed(0) + ' world px against the flagstone\'s ' +
        q.displayWidth.toFixed(0) + 'x' + q.displayHeight.toFixed(0) +
        (signs[0].displayHeight > q.displayHeight ? '  — still taller' : '  *** OUTGROWN ***'))
      await lookAt(signs[0].x, signs[0].y)
      await sleep(200)
      await shot('padart-sign-' + VP.w + 'x' + VP.h)
    }
    return
  }

  if (scenario === 'signs') {
    // Exactly one full-size DO NOT BUILD HERE sign on the whole map.
    const A = await import('./js/systems/Art.js')
    const M = (await import('./js/data/map.json', { with: { type: 'json' } })).default
    const signKey = A.ART.prop.buildPad
    const pads = g.pads.map((p, i) => ({
      i, key: p.texture.key,
      h: Math.round(p.displayHeight), w: Math.round(p.displayWidth),
      x: Math.round(p.x), y: Math.round(p.y),
    }))
    const signs = pads.filter((p) => p.key === signKey)
    note('viewport ' + VP.w + 'x' + VP.h)
    note('build pads: ' + pads.length)
    for (const p of pads) note('   spot ' + p.i + '  ' + p.key + '  ' + p.w + 'x' + p.h + '  at ' + p.x + ',' + p.y)
    note('FULL-SIZE SIGNS: ' + signs.length + (signs.length === 1 ? '  correct' : '  *** SHOULD BE EXACTLY 1 ***'))
    const e = M.waypoints[0]
    const d = M.buildSpots.map((sp, i) => [i, Math.hypot(sp[0] - e[0], sp[1] - e[1])])
    d.sort((a, b) => a[1] - b[1])
    note('nearest spot to the entrance is ' + d[0][0] + ' at ' + Math.round(d[0][1]) +
      'px; the sign is on ' + g.signSpotIndex +
      (d[0][0] === g.signSpotIndex ? '  correct' : '  *** WRONG SPOT ***'))
    note('scatter props on the board: ' + g.scatterCount)
    await shot('signs-' + VP.w + 'x' + VP.h)
    return
  }

  if (scenario === 'edges') {
    // Drag hard in all four directions, at min and max zoom, and check the
    // view never reaches past the artwork. Flat green behind the map is what
    // the player was seeing.
    const cam = g.cameras.main
    const D = (await import('./js/data/display.json', { with: { type: 'json' } })).default
    const W = D.width, H = D.height
    let worst = { name: '', over: 0 }
    const check = (label) => {
      const v = cam.worldView
      const over = Math.max(-v.x, -v.y, v.right - W, v.bottom - H, 0)
      if (over > worst.over) worst = { name: label, over }
      return over
    }
    for (const zName of ['min', 'max']) {
      // Scaled by the device ratio, exactly as GameScene scales the band it
      // hands the rig. The raw JSON numbers are in screen pixels per world
      // unit against a CSS pixel; the rig's are against a device pixel. Asking
      // for the raw floor on a retina screen asks for something below the
      // floor, and both ends then clamp to the same value.
      const dz = window.devicePixelRatio || 1
      const z = (zName === 'min' ? D.camera.minZoom : D.camera.maxZoom) * dz
      // Through the rig. Writing cam.zoom directly is eased away on the next
      // frame, which is how the first version of this check reported 1.70 and
      // 1.74 while claiming to be testing 1.31 and 2.37.
      g.rig.setTargetZoom(z)
      await until(() => Math.abs(cam.zoom - z) < 0.01, 4000)
      await sleep(200)
      note('at ' + zName + ' zoom ' + cam.zoom.toFixed(2) + ' (' +
        (cam.width / cam.zoom / W * 100).toFixed(1) + '% of the map width):')
      for (const [dir, dx, dy] of [['left', 1600, 0], ['right', -1600, 0],
                                   ['up', 0, 1600], ['down', 0, -1600]]) {
        // A hard fling, then time for any bounce to play out.
        const cx = VP.w / 2, cy = VP.h / 2
        mouse('mousedown', cx, cy)
        for (let i = 1; i <= 12; i++) {
          mouse('mousemove', cx + (dx * i) / 12, cy + (dy * i) / 12)
          await sleep(12)
        }
        mouse('mouseup', cx + dx, cy + dy)
        // Momentum has to settle before the view is judged.
        await sleep(1400)
        const over = check(zName + '/' + dir)
        const v = cam.worldView
        note('   drag ' + dir.padEnd(6) + ' view x ' + Math.round(v.x) + '..' + Math.round(v.right) +
          ' y ' + Math.round(v.y) + '..' + Math.round(v.bottom) +
          (over > 0.5 ? '   *** ' + over.toFixed(0) + 'px OF GREEN ***' : '   inside the map'))
      }
    }
    note('worst overscroll anywhere: ' + worst.over.toFixed(1) + 'px' +
      (worst.over > 0.5 ? ' at ' + worst.name : ''))
    note('RESULT ' + (worst.over <= 0.5 ? 'the view never leaves the artwork'
      : '*** GREEN BLEEDS IN ***'))
    await shot('edges-' + VP.w + 'x' + VP.h)
    return
  }

  if (scenario === 'tavern') {
    // The glow and smoke coordinates were estimated off the painted plate, so
    // they have to be looked at rather than trusted.
    const cam = g.cameras.main
    const M = (await import('./js/data/map.json', { with: { type: 'json' } })).default
    const lights = M.ambient.lights
    const cx = lights.reduce((a, l) => a + l.x, 0) / lights.length
    const cy = lights.reduce((a, l) => a + l.y, 0) / lights.length
    cam.centerOn(cx, cy - 20)
    note('lights ' + lights.length + ' centred on ' + Math.round(cx) + ',' + Math.round(cy))
    note('chimney ' + JSON.stringify(M.ambient.chimneys))
    await sleep(400)
    await shot('tavern-01-' + VP.w + 'x' + VP.h)
    await sleep(2200)
    await shot('tavern-02-smoke-' + VP.w + 'x' + VP.h)
    // Alphas must be moving, and not in unison.
    const glows = g.children.list.filter((o) => o.type === 'Image' && o.blendMode === 1)
    note('additive glows on the board: ' + glows.length)
    const a1 = glows.map((o) => o.alpha.toFixed(3))
    await sleep(500)
    const a2 = glows.map((o) => o.alpha.toFixed(3))
    note('alphas moved: ' + (a1.join() !== a2.join() ? 'yes' : 'NO *** static ***'))
    note('all in unison: ' + (new Set(a2).size <= 1 ? 'YES *** they should differ ***' : 'no, ' + new Set(a2).size + ' distinct'))
    note('alpha range now ' + Math.min(...glows.map((o) => o.alpha)).toFixed(2) +
      '..' + Math.max(...glows.map((o) => o.alpha)).toFixed(2))
    return
  }

  if (scenario === 'pauseresume') {
    // THE REPORTED FAILURE, end to end and through real input: start a run,
    // start a wave, tap PAUSE, tap RESUME, and check the wave actually moves
    // again. "The dialog closed" is not the assertion — enemies advancing is.
    for (const k of ['Title', 'Splash', 'Credits', 'Boot', 'Loadout']) game.scene.stop(k)
    const RS = await import('./js/systems/RunState.js')
    RS.setRunState({ heroId: 'cory', openingTowers: ['withholding', 'rounding'],
      abilities: ['molotov', 'glacier'], reserveTowers: [] })
    game.scene.start('Game')
    await until(() => running('Game'), 12000)
    await until(() => running('Hud'), 12000)
    await sleep(700)
    const g = scene('Game'), hud = scene('Hud')
    note('viewport ' + VP.w + 'x' + VP.h)

    // Get a wave moving, so "did it resume" has something to measure.
    g.startWave()
    await until(() => g.enemies.length > 0, 12000)
    await sleep(700)
    const before = g.enemies[0] ? { x: g.enemies[0].x, y: g.enemies[0].y } : null
    note('wave running, ' + g.enemies.length + ' enemies on the board')
    await shot('pause-01-playing-' + VP.w + 'x' + VP.h)

    // Tap PAUSE where it actually is, through the DOM.
    const pr = hud.layout.pause
    await click(pr.x + pr.width / 2, pr.y + pr.height / 2)
    await sleep(500)
    const paused = !game.scene.isActive('Game')
    note('after tapping pause: Game active = ' + game.scene.isActive('Game') +
      '  (paused = ' + paused + ')')
    const all = []
    const walkAll = (list) => { for (const o of list) { all.push(o); if (o.list) walkAll(o.list) } }
    walkAll(hud.children.list)
    const resume = all.find((o) => o.type === 'Text' && /RESUME/.test(String(o.text ?? '')))
    note('RESUME label found: ' + (resume ? 'YES' : 'NO *** the dialog did not open ***'))
    await shot('pause-02-paused-' + VP.w + 'x' + VP.h)

    // Is anything actually able to receive the tap?
    note('  Hud input enabled: ' + (hud.input ? hud.input.enabled : 'no input plugin'))
    note('  Hud camera visible: ' + hud.cameras.main.visible)
    const hits = []
    for (const o of all) {
      if (!o.input || !o.input.enabled) continue
      const b = o.getBounds ? o.getBounds() : null
      if (b) hits.push(Math.round(b.centerX) + ',' + Math.round(b.centerY) +
        ' ' + Math.round(b.width) + 'x' + Math.round(b.height))
    }
    note('  interactive objects in the Hud: ' + hits.length)

    if (resume) {
      const rb = resume.getBounds()
      note('pressing RESUME at ' + Math.round(rb.centerX) + ',' + Math.round(rb.centerY))
      await click(rb.centerX, rb.centerY)
      await sleep(600)
    }
    const backOn = game.scene.isActive('Game')
    note('after tapping RESUME: Game active = ' + backOn)

    // The real question: is the world moving again?
    await sleep(900)
    const after = g.enemies[0] ? { x: g.enemies[0].x, y: g.enemies[0].y } : null
    const moved = before && after ? Math.hypot(after.x - before.x, after.y - before.y) : -1
    note('the lead enemy moved ' + (moved < 0 ? 'n/a' : moved.toFixed(1) + 'px') + ' across the pause')
    await shot('pause-03-resumed-' + VP.w + 'x' + VP.h)
    note('RESULT ' + (paused && backOn && moved > 2
      ? 'pause and resume both work'
      : '*** THE GAME CANNOT BE RESUMED ***'))
    return
  }

  if (scenario === 'pausedismiss') {
    // THE LOCK-UP. Tap pause, then tap the dim backdrop instead of RESUME.
    // The dialog is dismissable, so the backdrop closes it — without calling
    // onCancel and without resuming the world. GameScene stays paused, the
    // HUD's `paused` flag stays true, and the pause button's own guard then
    // refuses to open the dialog again. No way back.
    for (const k of ['Title', 'Splash', 'Credits', 'Boot', 'Loadout']) game.scene.stop(k)
    const RS = await import('./js/systems/RunState.js')
    RS.setRunState({ heroId: 'cory', openingTowers: ['withholding', 'rounding'],
      abilities: ['molotov', 'glacier'], reserveTowers: [] })
    game.scene.start('Game')
    await until(() => running('Game'), 12000)
    await until(() => running('Hud'), 12000)
    await sleep(700)
    const g = scene('Game'), hud = scene('Hud')
    note('viewport ' + VP.w + 'x' + VP.h)
    g.startWave()
    await until(() => g.enemies.length > 0, 12000)
    await sleep(600)
    const before = { x: g.enemies[0].x, y: g.enemies[0].y }

    const pr = hud.layout.pause
    await click(pr.x + pr.width / 2, pr.y + pr.height / 2)
    await sleep(400)
    note('1. tapped PAUSE      -> Game active = ' + game.scene.isActive('Game'))

    // The backdrop: a corner, well away from the panel in the middle.
    await click(12, 12)
    await sleep(400)
    const all = []
    const walkAll = (list) => { for (const o of list) { all.push(o); if (o.list) walkAll(o.list) } }
    walkAll(hud.children.list)
    const stillUp = all.some((o) => o.type === 'Text' && /RESUME/.test(String(o.text ?? '')))
    note('2. tapped the BACKDROP -> dialog still up = ' + stillUp +
      ', Game active = ' + game.scene.isActive('Game'))
    await shot('dismiss-01-after-backdrop-' + VP.w + 'x' + VP.h)

    // Now try to get back in. This is the move a real player makes.
    await click(pr.x + pr.width / 2, pr.y + pr.height / 2)
    await sleep(500)
    const all2 = []
    walkAll(hud.children.list)
    for (const o of hud.children.list) all2.push(o)
    const reopened = []
    const walk2 = (list) => { for (const o of list) { reopened.push(o); if (o.list) walk2(o.list) } }
    walk2(hud.children.list)
    const back = reopened.some((o) => o.type === 'Text' && /RESUME/.test(String(o.text ?? '')))
    note('3. tapped PAUSE again -> dialog reopened = ' + back +
      ', Game active = ' + game.scene.isActive('Game'))

    // The panel must have survived the backdrop tap, because that tap is what
    // used to strand the game. Then finish the journey the player would.
    const resume = reopened.find((o) => o.type === 'Text' && /RESUME/.test(String(o.text ?? '')))
    if (resume) {
      const rb = resume.getBounds()
      await click(rb.centerX, rb.centerY)
      await sleep(600)
    }
    note('4. tapped RESUME      -> Game active = ' + game.scene.isActive('Game'))
    await sleep(900)
    const after = { x: g.enemies[0].x, y: g.enemies[0].y }
    const moved = Math.hypot(after.x - before.x, after.y - before.y)
    note('the lead enemy moved ' + moved.toFixed(1) + 'px in total')
    await shot('dismiss-02-recovered-' + VP.w + 'x' + VP.h)
    note('RESULT ' + (back && game.scene.isActive('Game') && moved > 2
      ? 'the backdrop cannot strand the game, and RESUME still works'
      : '*** THE GAME IS FROZEN AND THE PAUSE BUTTON NO LONGER RESPONDS ***'))
    return
  }

  if (scenario === 'pixels') {
    // RENDER-QUALITY DIAGNOSTIC. Reports only; changes nothing.
    const c = game.canvas, r = c.getBoundingClientRect()
    note('=== 1. CONFIG ===')
    const cfg = game.config
    note('  renderer: ' + (game.renderer.type === Phaser.WEBGL ? 'WEBGL' : 'CANVAS'))
    note('  pixelArt: ' + cfg.pixelArt + '   antialias: ' + cfg.antialias +
      '   antialiasGL: ' + cfg.antialiasGL)
    note('  roundPixels: ' + cfg.roundPixels + '   mipmapFilter: ' +
      JSON.stringify(cfg.mipmapFilter))
    note('  scale mode: ' + cfg.scaleMode + ' (RESIZE=' + Phaser.Scale.RESIZE + ')' +
      '   autoRound: ' + cfg.autoRound)
    note('  config.resolution: ' + cfg.resolution + '   (Phaser ' + Phaser.VERSION + ')')

    note('=== 2. CANVAS vs DEVICE PIXELS ===')
    note('  devicePixelRatio: ' + window.devicePixelRatio)
    note('  canvas backing store: ' + c.width + 'x' + c.height)
    note('  canvas CSS size:      ' + Math.round(r.width) + 'x' + Math.round(r.height))
    {
      const g3 = scene('Game')
      if (g3) {
        note('  Game world cam: ' + g3.cameras.main.width + 'x' + g3.cameras.main.height +
          '  zoom ' + g3.cameras.main.zoom.toFixed(3))
        const ui = g3.cameras.cameras.find((c) => c.name === 'ui')
        if (ui) note('  Game ui cam:    ' + ui.width + 'x' + ui.height + '  zoom ' + ui.zoom.toFixed(3))
      }
      const h3 = scene('Hud')
      if (h3) note('  Hud cam:        ' + h3.cameras.main.width + 'x' + h3.cameras.main.height +
        '  zoom ' + h3.cameras.main.zoom.toFixed(3))
    }
    note('  game.scale: ' + game.scale.width + 'x' + game.scale.height +
      '  displaySize ' + Math.round(game.scale.displaySize.width) + 'x' +
      Math.round(game.scale.displaySize.height))
    const backingPerCss = c.width / Math.max(1, r.width)
    note('  BACKING STORE PER CSS PIXEL: ' + backingPerCss.toFixed(3) +
      '   (device wants ' + window.devicePixelRatio + ')')
    note('  => rendering at ' + (backingPerCss / window.devicePixelRatio * 100).toFixed(0) +
      '% of the device\'s physical resolution')

    note('=== 3. FILTERING AND MIPMAPS ===')
    const gl = game.renderer.gl
    note('  renderer mipmapFilter: ' + game.renderer.mipmapFilter +
      '  (NEAREST=' + (gl ? gl.NEAREST : '?') + ', LINEAR=' + (gl ? gl.LINEAR : '?') +
      ', LINEAR_MIPMAP_LINEAR=' + (gl ? gl.LINEAR_MIPMAP_LINEAR : '?') + ')')
    const sample = ['hero-cory', 'turret-ledger', 'enemy-filer', 'map-level1',
      'scatter-rock-large', 'ui-plate-wide']
    for (const k of sample) {
      if (!game.textures.exists(k)) { note('  ' + k + ': NOT LOADED'); continue }
      const src = game.textures.get(k).source[0]
      note('  ' + k.padEnd(20) + ' ' + src.width + 'x' + src.height +
        '  scaleMode=' + src.scaleMode + ' (LINEAR=' + Phaser.ScaleModes.LINEAR +
        ', NEAREST=' + Phaser.ScaleModes.NEAREST + ')' +
        '  mipmaps=' + (src.glTexture && src.isPowerOf2 ? 'possible' : 'no (NPOT)') +
        '  POT=' + src.isPowerOf2)
    }

    note('  GL context: ' + (window.WebGL2RenderingContext && gl instanceof WebGL2RenderingContext
      ? 'WebGL2 (NPOT mipmaps ALLOWED)' : 'WebGL1 (NPOT mipmaps FORBIDDEN by spec)'))
    let npot = 0, tot = 0
    for (const k of game.textures.getTextureKeys()) {
      const src = game.textures.get(k).source[0]
      if (!src) continue
      tot++
      if (!src.isPowerOf2) npot++
    }
    note('  textures: ' + tot + ' total, ' + npot + ' non-power-of-two')

    note('=== 4/5. SOURCE PIXELS vs SCREEN PIXELS ===')
    const disp = (await import('./js/data/display.json', { with: { type: 'json' } })).default
    const art = (await import('./js/data/art.json', { with: { type: 'json' } })).default
    const Z = disp.camera
    note('  zoom band: min ' + Z.minZoom + '  default ' + Z.defaultZoom + '  max ' + Z.maxZoom)
    // The map plate is not in art.render and has no displayHeight, so it fell
    // out of the table below. It is the single biggest thing on screen.
    {
      const ms = game.textures.get('map-level1').source[0]
      const g2 = scene('Game')
      const plate = g2 && g2.children.list.find((o) => o.texture && o.texture.key === 'map-level1')
      const worldW = plate ? plate.displayWidth : disp.width
      note('  MAP PLATE  source ' + ms.width + 'x' + ms.height + '  drawn at ' +
        Math.round(worldW) + ' world px')
      for (const [lbl, z] of [['min', Z.minZoom], ['default', Z.defaultZoom], ['max', Z.maxZoom]]) {
        const onScreen = worldW * z
        const ratio = onScreen / ms.width
        note('    @' + lbl.padEnd(8) + ' ' + Math.round(onScreen) + 'px on screen from ' +
          ms.width + 'px of source = ' + ratio.toFixed(2) + 'x' +
          (ratio > 1 ? '  *** MAGNIFIED ***' : ''))
      }
    }
    note('  key                  source   world   screen@min  @default  @max   worst ratio')
    const rows = []
    for (const [k, rr] of Object.entries(art.render)) {
      if (!rr.displayHeight || !game.textures.exists(k)) continue
      const srcH = game.textures.get(k).source[0].height
      const atMax = rr.displayHeight * Z.maxZoom
      const ratio = atMax / srcH
      rows.push({ k, srcH, world: rr.displayHeight,
        mn: rr.displayHeight * Z.minZoom, df: rr.displayHeight * Z.defaultZoom, mx: atMax, ratio })
    }
    rows.sort((a, b) => b.ratio - a.ratio)
    for (const q of rows) {
      note('  ' + q.k.padEnd(20) + ' ' + String(q.srcH).padStart(5) + '  ' +
        q.world.toFixed(0).padStart(6) + '  ' + q.mn.toFixed(0).padStart(9) + '  ' +
        q.df.toFixed(0).padStart(8) + '  ' + q.mx.toFixed(0).padStart(5) + '   ' +
        q.ratio.toFixed(2) + (q.ratio > 1 ? '  *** MAGNIFIED ***' : ''))
    }
    const mag = rows.filter((q) => q.ratio > 1)
    note('  sprites magnified beyond their source at max zoom: ' + mag.length +
      (mag.length ? ' -> ' + mag.map((q) => q.k).join(', ') : ''))
    return
  }

  if (scenario === 'gateway') {
    // REQUIREMENT 11, watched frame by frame rather than judged from a still.
    // Nothing may appear or disappear in open ground: an enemy that is visible
    // at all must be at or past the arch mouth, and an enemy that leaves must
    // leave at the gate rather than anywhere else.
    const MAPD = (await import('./js/data/map.json', { with: { type: 'json' } })).default
    const mouthX = MAPD.entrance.emergeFromX
    const clearX = MAPD.entrance.clearOfArchX
    const gateX = MAPD.exit.gateX
    note('viewport ' + VP.w + 'x' + VP.h)
    note('arch mouth x=' + mouthX + '  clear of arch x=' + clearX + '  gate face x=' + gateX)

    // Deliberately no towers. With a board that can kill, wave one dies on the
    // way and the gate is never reached — the first run of this scenario
    // reported "left at the gate: 0" and proved nothing about the exit.
    g.startWave()

    // Look at the arch while the first enemies come out of it, then at the
    // gate. The rig owns the centre, so it is written through the rig's own
    // target rather than onto the camera, which would be eased away.
    const look = async (x, y, name, ms) => {
      g.rig.targetCenterX = x
      g.rig.targetCenterY = y
      await sleep(ms)
      await shot(name + '-' + VP.w + 'x' + VP.h)
    }
    await look(90, 400, 'gateway-arch', 2600)

    const seen = new Map()
    let visibleBeforeArch = 0, worstEarly = null
    let fadedInOpen = 0, worstFade = null
    let samples = 0
    const watch = () => {
      samples++
      for (const e of g.enemies) {
        if (!e.alive) continue
        const a = e.art ? e.art.alpha : 1
        seen.set(e, { x: e.x, y: e.y, alpha: a })
        // (a) nothing visible before the arch mouth
        if (a > 0.02 && e.x < mouthX - 1) {
          visibleBeforeArch++
          if (!worstEarly || e.x < worstEarly.x) worstEarly = { x: e.x, alpha: a }
        }
        // (b) nothing part-transparent once past the arch: no fade in open
        //     ground, and no fade-out at the exit either.
        if (a < 0.98 && e.x > clearX + 1) {
          fadedInOpen++
          if (!worstFade || a < worstFade.alpha) worstFade = { x: e.x, alpha: a }
        }
      }
    }
    const t0 = performance.now()
    let lookedAtGate = false, shotGate = false
    let lastCount = 0
    const departures = []
    while (performance.now() - t0 < 26000) {
      const before = new Map(seen)
      const alive = new Set(g.enemies.filter((e) => e.alive))
      for (const [e, last] of before) {
        if (!alive.has(e) && !departures.some((d) => d.e === e)) {
          departures.push({ e, x: last.x, y: last.y, alpha: last.alpha })
        }
      }
      watch()
      lastCount = g.enemies.length
      if (!lookedAtGate && performance.now() - t0 > 14000) {
        lookedAtGate = true
        g.rig.targetCenterX = 1150
        g.rig.targetCenterY = 390
      }
      if (lookedAtGate && !shotGate && performance.now() - t0 > 20000) {
        shotGate = true
        await shot('gateway-gate-' + VP.w + 'x' + VP.h)
      }
      await new Promise((r) => requestAnimationFrame(r))
    }

    note('sampled ' + samples + ' frames, ' + departures.length + ' enemies left the board')
    note('  visible before the arch mouth: ' + visibleBeforeArch + ' frames' +
      (worstEarly ? ' (worst x=' + worstEarly.x.toFixed(0) + ' alpha ' + worstEarly.alpha.toFixed(2) + ')' : ''))
    note('  part-transparent past the arch: ' + fadedInOpen + ' frames' +
      (worstFade ? ' (worst x=' + worstFade.x.toFixed(0) + ' alpha ' + worstFade.alpha.toFixed(2) + ')' : ''))

    // Every enemy that left did so either by dying to a tower or at the gate.
    const atGate = departures.filter((d) => d.x >= gateX - 12)
    const killed = departures.filter((d) => d.x < gateX - 12)
    note('  left at the gate: ' + atGate.length + '   killed on the way: ' + killed.length)
    const fadedOut = departures.filter((d) => d.x >= gateX - 12 && d.alpha < 0.98)
    note('  arrived at the gate part-transparent: ' + fadedOut.length + ' (must be 0)')
    for (const d of atGate.slice(0, 4)) {
      note('    gate arrival at x=' + d.x.toFixed(0) + ' alpha ' + d.alpha.toFixed(2))
    }

    const occ = g.archOccluders || []
    note('  arch occluders drawn: ' + occ.length +
      (occ.length ? ' at depth ' + occ.map((o) => o.depth.toFixed(0)).join(', ') : ''))
    await shot('gateway-' + VP.w + 'x' + VP.h)
    const ok = visibleBeforeArch === 0 && fadedInOpen === 0 && fadedOut.length === 0 && occ.length === 2
    note('RESULT ' + (ok
      ? 'nothing appears or disappears in open ground'
      : '*** SOMETHING APPEARS OR DISAPPEARS IN OPEN GROUND ***'))
    return
  }

  if (scenario === 'nuke') {
    // WHERE IS THE NUKE BUTTON, REALLY. Reports the ability-bar slot and the
    // launch overlay's button: position, size, which camera draws each, and
    // whether the hit area matches what is drawn.
    const hud = scene('Hud')
    const uiCam = g.cameras.cameras.find((c) => c.name === 'ui')
    const worldCam = g.cameras.main
    const D = (await import('./js/data/display.json', { with: { type: 'json' } })).default
    const dpr = window.devicePixelRatio || 1
    note('viewport ' + VP.w + 'x' + VP.h + '  dpr ' + dpr +
      '  world zoom ' + worldCam.zoom.toFixed(2))

    // Grant it the way the game does.
    g.status.rareAbility = 'serverNuke'
    // Generous: the software rasteriser runs at a few frames a second at
    // device resolution, and the bar rebuilds on an update tick.
    await sleep(4000)
    note('slot key string now: ' + (hud.slotKeys || '(none)'))

    const all = []
    const walkAll = (list, lvl) => { for (const o of list) { all.push([o, lvl]); if (o.list) walkAll(o.list, lvl + 1) } }
    walkAll(hud.children.list, 0)
    note('--- ABILITY BAR SLOTS (Hud) ---')
    for (const sl of hud.slots || []) {
      const r = sl.region
      const ib = sl.icon.getBounds()
      const hb = sl.hit.getBounds()
      note('  ' + String(r.id).padEnd(14) + ' slot x=' + Math.round(r.x) + ' cx=' + Math.round(r.cx) +
        ' boxH=' + Math.round(r.boxH) + '  icon ' + Math.round(ib.width) + 'x' + Math.round(ib.height) +
        ' at ' + Math.round(ib.centerX) + ',' + Math.round(ib.centerY) +
        '  hit ' + Math.round(hb.width) + 'x' + Math.round(hb.height) +
        ' at ' + Math.round(hb.centerX) + ',' + Math.round(hb.centerY) +
        '  visible=' + sl.icon.visible + ' interactive=' + !!(sl.hit.input && sl.hit.input.enabled))
    }

    const passes = []
    // Now the launch overlay.
    g.openNukeLaunch()
    await sleep(900)
    const ov = g.nukeLaunch
    note('--- LAUNCH OVERLAY ---')
    note('  overlay open: ' + !!ov)
    if (ov && ov.button) {
      const b = ov.button.getBounds()
      const inWorld = worldCam && !worldCam.renderList ? '?' : null
      note('  button ' + Math.round(b.width) + 'x' + Math.round(b.height) +
        ' at ' + Math.round(b.centerX) + ',' + Math.round(b.centerY) +
        '  texture ' + ov.button.texture.key +
        '  scrollFactor ' + ov.button.scrollFactorX)
      // The FILTER LIVES ON THE CONTAINER, not on a child inside it: a
      // container renders its whole subtree, so a child's own cameraFilter is
      // never consulted. Reading the child reported "drawn by both cameras"
      // for an overlay that was correctly split.
      const layer = ov.layer
      note('  layer scrollFactor ' + layer.scrollFactorX +
        '  children ' + layer.list.length)
      note('  world cam ignores the layer: ' + ((layer.cameraFilter & worldCam.id) !== 0))
      note('  ui cam ignores the layer:    ' + (uiCam ? ((layer.cameraFilter & uiCam.id) !== 0) : 'no ui cam'))
      note('  blocker: world ignores ' + ((ov.blocker.cameraFilter & worldCam.id) !== 0) +
        ', ui ignores ' + (uiCam ? ((ov.blocker.cameraFilter & uiCam.id) !== 0) : '?'))
      const hb2 = ov.hit.getBounds()
      note('  hit ' + Math.round(hb2.width) + 'x' + Math.round(hb2.height) +
        ' at ' + Math.round(hb2.centerX) + ',' + Math.round(hb2.centerY) +
        '   button/hit centre delta ' +
        Math.round(Math.hypot(hb2.centerX - b.centerX, hb2.centerY - b.centerY)) + 'px')
      note('  viewport is ' + VP.w + 'x' + VP.h + ', so on-screen means 0..' + VP.w)
      const off = b.x < -1 || b.right > VP.w + 1 || b.y < -1 || b.bottom > VP.h + 1
      note('  RESULT button ' + (off ? '*** OFF SCREEN / OVERSIZED ***' : 'is within the viewport'))
    }
    // THE ACCEPTANCE TEST: tap it, at both ends of the zoom band, through the
    // real input system. A button that measures correctly and does not fire is
    // still broken.
    const D2 = D.camera
    const dz = window.devicePixelRatio || 1
    for (const [name, z] of [['min', D2.minZoom * dz], ['max', D2.maxZoom * dz]]) {
      // Re-grant AND re-open. The first pass consumes the nuke, so granting
      // alone leaves no overlay and the second pass measured nothing — which
      // read as "did not fire" when the button was never on screen.
      if (!g.nukeLaunch) {
        g.status.rareAbility = 'serverNuke'
        await sleep(500)
        g.openNukeLaunch()
        await until(() => !!g.nukeLaunch, 4000)
        await sleep(300)
      }
      g.rig.setTargetZoom(z)
      await until(() => Math.abs(worldCam.zoom - z) < 0.05, 5000)
      await sleep(250)
      const o2 = g.nukeLaunch
      if (!o2) { note('  at ' + name + ' zoom: no overlay open'); continue }
      const bb = o2.button.getBounds()
      const hb = o2.hit.getBounds()
      note('  at ' + name + ' zoom ' + worldCam.zoom.toFixed(2) + ': button ' +
        Math.round(bb.width) + 'x' + Math.round(bb.height) + ' at ' +
        Math.round(bb.centerX) + ',' + Math.round(bb.centerY) +
        '  hit ' + Math.round(hb.width) + 'x' + Math.round(hb.height))
      const before = g.enemies.length
      const firedBefore = g.status.rareAbility
      await click(hb.centerX, hb.centerY)
      await sleep(1200)
      const fired = g.status.rareAbility !== firedBefore || !g.nukeLaunch
      note('    tapped at ' + Math.round(hb.centerX) + ',' + Math.round(hb.centerY) +
        ' -> fired: ' + (fired ? 'YES' : 'NO *** NOT TAPPABLE ***') +
        '  (rareAbility ' + String(firedBefore) + ' -> ' + String(g.status.rareAbility) + ')')
      await shot('nuke-' + name + '-' + VP.w + 'x' + VP.h)
      passes.push(fired)
    }
    note('RESULT ' + (passes.length === 2 && passes.every(Boolean)
      ? 'the nuke button is tappable and fires at both ends of the zoom band'
      : '*** THE NUKE BUTTON DID NOT FIRE ***'))
    return
  }

  if (scenario === 'icons') {
    // The tower panel with the real icons: sizes, that no button carries text,
    // and that the price sits below the plate rather than on it.
    g.status.peanuts = 99999
    await build(3, 0)
    await sleep(400)
    const t = g.towers[0]
    g.openTowerRing ? g.openTowerRing(t) : g.selectTower(t)
    await until(() => !!g.panel, 5000)
    await sleep(500)
    note('viewport ' + VP.w + 'x' + VP.h + '  dpr ' + (window.devicePixelRatio || 1))
    const layer = g.panel.layer
    const kids = layer.list
    const imgs = kids.filter((o) => o.texture && /icon-|generated-icon/.test(o.texture.key))
    // Non-empty only. plateButton keeps its own label object and we pass '',
    // so every button carries an empty Text that draws nothing — counting it
    // reported the price as sitting on the plate when it is not there at all.
    const texts = kids.filter((o) => o.type === 'Text' && String(o.text ?? '').trim() !== '')
    note('panel: ' + kids.length + ' objects, ' + imgs.length + ' icons, ' + texts.length + ' texts')
    for (const im of imgs) {
      const b = im.getBounds()
      note('  ' + String(im.texture.key).padEnd(24) +
        Math.round(b.width) + 'x' + Math.round(b.height) +
        ' at ' + Math.round(b.centerX) + ',' + Math.round(b.centerY))
    }
    // No button may carry a word. The only text on a button row is the price,
    // and it must sit BELOW the plate.
    let worstIconPx = 999, labelsOnButtons = 0, priceOnPlate = 0
    for (const btn of g.panel.buttons || []) {
      const hb = btn.hit.getBounds()
      const label = String(btn.text?.text ?? '')
      if (label.trim() !== '') labelsOnButtons++
      const inside = imgs.filter((im) => {
        const b = im.getBounds()
        return Math.abs(b.centerX - hb.centerX) < 4 && Math.abs(b.centerY - hb.centerY) < 4
      })
      for (const im of inside) worstIconPx = Math.min(worstIconPx, im.getBounds().height)
      for (const tx of texts) {
        const b = tx.getBounds()
        if (Math.abs(b.centerX - hb.centerX) < 6 && b.centerY < hb.bottom - 2 && b.centerY > hb.y) {
          priceOnPlate++
          note('    OVERLAP: "' + tx.text + '" centreY ' + Math.round(b.centerY) +
            ' inside plate ' + Math.round(hb.y) + '..' + Math.round(hb.bottom))
        }
      }
      note('  button at ' + Math.round(hb.centerX) + ',' + Math.round(hb.centerY) +
        ' ' + Math.round(hb.width) + 'x' + Math.round(hb.height) +
        '  label="' + label + '"  icon ' + (inside.length ? Math.round(inside[0].getBounds().height) + 'px' : 'NONE'))
    }
    note('  smallest button icon: ' + worstIconPx + 'px  (floor is 40)')
    note('  buttons carrying text: ' + labelsOnButtons + ' (must be 0)')
    note('  prices drawn on a plate: ' + priceOnPlate + ' (must be 0)')
    await shot('icons-' + VP.w + 'x' + VP.h)
    const ok = worstIconPx >= 40 && labelsOnButtons === 0 && priceOnPlate === 0 && imgs.length >= 4
    note('RESULT ' + (ok ? 'icons only, at 40px, prices beneath'
      : '*** THE UPGRADE RING IS NOT RIGHT ***'))
    return
  }

  if (scenario === 'regressions') {
    // Read-only diagnosis of the reported regressions that need a renderer.
    // Nothing here changes the game.
    const M = (await import('./js/data/map.json', { with: { type: 'json' } })).default
    const cam = g.cameras.main
    const dpr = window.devicePixelRatio || 1
    note('viewport ' + VP.w + 'x' + VP.h + '  canvas ' + game.canvas.width + 'x' + game.canvas.height +
      '  dpr ' + dpr)

    // --- 2. THE MODAL SCRIM. Which camera draws it, how big it is, and what
    //        the canvas actually looks like once it is up.
    const ctx = game.canvas.getContext('2d')
    const lum = (x, y, w2, h2) => {
      const d = ctx.getImageData(Math.max(0, x | 0), Math.max(0, y | 0),
        Math.max(1, w2 | 0), Math.max(1, h2 | 0)).data
      let s2 = 0, n = 0
      for (let i = 0; i < d.length; i += 4) { s2 += (d[i] * 0.299 + d[i+1] * 0.587 + d[i+2] * 0.114); n++ }
      return s2 / n
    }
    const CW = game.canvas.width, CH = game.canvas.height
    // Look at the middle of the map first, so the scrim is measured over a
    // busy frame rather than over whatever the camera happened to show.
    await lookAt(640, 360)
    const before = [lum(0,0,CW/2,CH/2), lum(CW/2,0,CW/2,CH/2), lum(0,CH/2,CW/2,CH/2), lum(CW/2,CH/2,CW/2,CH/2)]
    g.showTicket({ label: 'JACKPOT', payout: 500 }, 30)
    await sleep(500)
    const t = g.ticket
    if (!t) { note('*** the ticket did not open ***') } else {
      const b = t.blocker
      const bb = b.getBounds()
      const uiOnly = (b.cameraFilter & 0) === 0
      note('2. SCRIM: rect ' + Math.round(b.width) + 'x' + Math.round(b.height) +
        ' at ' + Math.round(b.x) + ',' + Math.round(b.y) + ' origin ' + b.originX + ',' + b.originY +
        '  scrollFactor ' + b.scrollFactorX)
      note('   its bounds ' + Math.round(bb.x) + ',' + Math.round(bb.y) + ' ' +
        Math.round(bb.width) + 'x' + Math.round(bb.height) +
        '  viewport is 0,0 ' + VP.w + 'x' + VP.h)
      note('   drawn by: world=' + !(b.cameraFilter & (1 << 0)) + ' (filter ' + b.cameraFilter + ')')
      const after = [lum(0,0,CW/2,CH/2), lum(CW/2,0,CW/2,CH/2), lum(0,CH/2,CW/2,CH/2), lum(CW/2,CH/2,CW/2,CH/2)]
      note('   quadrant luminance before ' + before.map((v) => v.toFixed(0)).join(' / ') +
        '   after ' + after.map((v) => v.toFixed(0)).join(' / '))
      note('   (quadrants include the bright card, so they answer nothing on their own)')
      // THE CORNERS are what answer it: far from the card, so any change there
      // is the scrim and only the scrim.
      const K = 40
      const corner = (x, y) => lum(x, y, K, K)
      const cAfter = [corner(0,0), corner(CW-K,0), corner(0,CH-K), corner(CW-K,CH-K)]
      note('   CORNER luminance after: ' + cAfter.map((v) => v.toFixed(0)).join(' / ') +
        '  (TL / TR / BL / BR)')
      const spread = Math.max(...cAfter) - Math.min(...cAfter)
      note('   corners agree to within ' + spread.toFixed(0) +
        (spread < 12 ? '  — the scrim reaches all four' : '  *** THE SCRIM DOES NOT REACH THEM ALL ***'))
      // Walk a row and a column looking for the hard edges the report saw.
      const row = Math.round(CH * 0.75), col = Math.round(CW * 0.25)
      const edgesX = [], edgesY = []
      let prev = lum(0, row, 4, 4)
      for (let x = 4; x < CW - 4; x += 4) {
        const v = lum(x, row, 4, 4)
        if (Math.abs(v - prev) > 18) edgesX.push(x)
        prev = v
      }
      prev = lum(col, 0, 4, 4)
      for (let y = 4; y < CH - 4; y += 4) {
        const v = lum(col, y, 4, 4)
        if (Math.abs(v - prev) > 18) edgesY.push(y)
        prev = v
      }
      note('   hard edges across row y=' + row + ': ' + JSON.stringify(edgesX.slice(0, 8)))
      note('   hard edges down col x=' + col + ': ' + JSON.stringify(edgesY.slice(0, 8)))
      await shot('regress-scrim-' + VP.w + 'x' + VP.h)
      t.destroy?.()
      await sleep(200)
    }

    // --- 6. THE HUD OVER THE MAP. Where the painted tavern sign lands on the
    //        glass, and what the HUD puts there.
    // Camera arithmetic gives CANVAS pixels, which are device pixels. The
    // viewport is CSS pixels. Comparing the two is how a tower sitting in the
    // middle of the screen reported as off it.
    const proj = (wx, wy) => [((wx - cam.worldView.x) * cam.zoom + cam.x) / dpr,
      ((wy - cam.worldView.y) * cam.zoom + cam.y) / dpr]
    const signBox = [930, 103, 1007, 147]   // measured off the new plate
    // Point the camera AT the sign: whether the HUD covers it is a question
    // about where it lands on the glass when it is on screen at all.
    // Not centred on the sign — the complaint is that the HUD covers it, so
    // the camera goes where that happens: the sign up in the top right.
    const halfW = (VP.w / (cam.zoom / dpr)) / 2
    const halfH = (VP.h / (cam.zoom / dpr)) / 2
    await lookAt(signBox[0] - halfW * 0.55, signBox[3] + halfH * 0.55)
    await sleep(250)
    const [sx0, sy0] = proj(signBox[0], signBox[1])
    const [sx1, sy1] = proj(signBox[2], signBox[3])
    note('6. the painted COURJAHAN\'S TAVERN sign projects to ' +
      Math.round(sx0) + ',' + Math.round(sy0) + ' .. ' + Math.round(sx1) + ',' + Math.round(sy1))
    const hr = g.layout.heroRow
    note('   the HUD hero row is at ' + Math.round(hr.x) + ',' + Math.round(hr.y) + ' ' +
      Math.round(hr.width) + 'x' + Math.round(hr.height) +
      (sx1 > hr.x && sx0 < hr.x + hr.width && sy1 > hr.y && sy0 < hr.y + hr.height
        ? '  *** THEY OVERLAP ***' : '  clear'))

    // --- 7. WHERE A BUILT TOWER ENDS UP.
    const sp = g.build.freeSpots()[0]
    g.status.peanuts = 99999
    // As a player would: look at the pad before tapping it.
    await lookAt(sp.x, sp.y)
    g.openPadRing(sp)
    await sleep(200)
    const opt = g.ring.hitBoxes[0]
    await click(opt.rect.x + opt.rect.width / 2, opt.rect.y + opt.rect.height / 2)
    await sleep(160)
    const cf = g.ring.hitBoxes.find((x) => x.id === 'ring:confirm')
    await click(cf.rect.x + cf.rect.width / 2, cf.rect.y + cf.rect.height / 2)
    await sleep(400)
    const tw = g.towers[g.towers.length - 1]
    note('7. asked for spot ' + sp.index + ' at world ' + Math.round(sp.x) + ',' + Math.round(sp.y) +
      '; tower is at ' + (tw ? Math.round(tw.x) + ',' + Math.round(tw.y) : 'NOT BUILT') +
      (tw && Math.hypot(tw.x - sp.x, tw.y - sp.y) < 2 ? '  same place' : '  *** MOVED ***'))
    if (tw) {
      const [tx, ty] = proj(tw.x, tw.y)
      note('   on the glass at ' + Math.round(tx) + ',' + Math.round(ty) +
        ' in a ' + VP.w + 'x' + VP.h + ' viewport' +
        (tx >= 0 && ty >= 0 && tx <= VP.w && ty <= VP.h ? '  on screen' : '  *** OFF SCREEN ***'))
    }
    await shot('regress-tower-' + VP.w + 'x' + VP.h)

    // --- 8. HOW OFTEN THE CAMERA SHAKES, over a real wave.
    let shakes = 0
    const realShake = cam.shake.bind(cam)
    cam.shake = (d, i) => { shakes++; return realShake(d, i) }
    const gateShakes = []
    const realLeak = g.leak?.bind(g)
    g.startWave()
    const t0 = performance.now()
    while (performance.now() - t0 < 45000 && g.status.phase === 'wave') await sleep(200)
    note('8. camera.shake fired ' + shakes + ' time(s) in ' +
      Math.round((performance.now() - t0) / 1000) + 's of wave 1')
    note('   the gate in the new plate is OPEN, so a slam impact has nothing to slam into')
    void gateShakes; void realLeak
    return
  }

  if (scenario === 'ring') {
    // THE RING, RENDERED. The placement is proved exhaustively in
    // tests/ringlayout.test.ts — every pad, every option count, both zoom
    // ends, both viewports, notched and not. What a browser adds is the part
    // arithmetic cannot see: that the buttons are really where the geometry
    // says, that the icons drew, and that a real press buys a real tower.
    //
    // Reach is decided by POSITION, never by whether a handler fired. A
    // synthetic press dispatched on the canvas hit-tests a point 194px below
    // the display exactly as happily as one in the middle of it, which is how
    // the old build menu passed a reachability check while being unusable.
    const P = (await import('./js/data/presentation.json', { with: { type: 'json' } })).default
    const D = (await import('./js/data/display.json', { with: { type: 'json' } })).default
    const RL = await import('./js/systems/RingLayout.js')
    const dpr = window.devicePixelRatio || 1
    g.status.peanuts = 99999
    await sleep(400)
    note('viewport ' + VP.w + 'x' + VP.h + '  dpr ' + dpr)
    note('button ' + P.ring.buttonSize + 'px carrying a ' + P.ring.iconSize + 'px icon, panel '
      + P.ring.panelWidth + 'px wide')

    const area = () => RL.usableArea(VP.w, VP.h, {top: 0, right: 0, bottom: 0, left: 0}, {
      countersBottom: g.layout.counters.y + g.layout.counters.height,
      abilitiesTop: g.layout.abilities.y,
    }, P.ring.areaMargin)
    const inside = (r, a) => r.x >= a.x - 0.5 && r.y >= a.y - 0.5
      && r.x + r.width <= a.x + a.width + 0.5 && r.y + r.height <= a.y + a.height + 0.5

    const check = (label) => {
      const a = area()
      const boxes = g.ring ? g.ring.hitBoxes : []
      const off = boxes.filter((b) => !inside(b.rect, a))
      const rb = g.ring ? g.ring.bounds : null
      // The panel's RECORDED height against what it actually drew. A component
      // that reports one height and draws another places itself correctly and
      // still hangs off the screen — which is exactly the bug that got here.
      const pb = g.ring ? g.ring.panelBounds : null
      if (pb) {
        let lo = 1e9, hi = -1e9
        for (const o of g.ring.panelLayer.list) {
          if (!o.getBounds) continue
          const b = o.getBounds()
          if (b.height <= 0) continue
          lo = Math.min(lo, b.y); hi = Math.max(hi, b.bottom)
        }
        const drawn = Math.round(hi - lo)
        note('      panel box ' + Math.round(pb.x) + ',' + Math.round(pb.y) + ' ' +
          Math.round(pb.width) + 'x' + Math.round(pb.height) + '  drew ' + drawn +
          'px from y ' + Math.round(lo) + ' to ' + Math.round(hi))
      }
      note('  ' + label.padEnd(26) + boxes.length + ' pressable, ' +
        (off.length === 0 ? 'all on screen' : '*** ' + off.length + ' OFF SCREEN ***') +
        (rb ? '  ring ' + Math.round(rb.width) + 'x' + Math.round(rb.height)
          + ' at ' + Math.round(rb.x) + ',' + Math.round(rb.y) : ''))
      for (const b of off) {
        note('      ' + b.id + ' at ' + Math.round(b.rect.x) + ',' + Math.round(b.rect.y) +
          ' ' + Math.round(b.rect.width) + 'x' + Math.round(b.rect.height) +
          ' against ' + Math.round(a.x) + ',' + Math.round(a.y) + ' ' +
          Math.round(a.width) + 'x' + Math.round(a.height))
      }
      // No two pressable regions may overlap: one of them could never be hit.
      let clashes = 0
      for (let i = 0; i < boxes.length; i++) {
        for (let j = i + 1; j < boxes.length; j++) {
          const A = boxes[i].rect, B = boxes[j].rect
          if (A.x < B.x + B.width && B.x < A.x + A.width
            && A.y < B.y + B.height && B.y < A.y + A.height) clashes++
        }
      }
      if (clashes > 0) note('      *** ' + clashes + ' PAIRS OF HIT AREAS OVERLAP ***')
      return { off: off.length, clashes, n: boxes.length }
    }

    let worst = { off: 0, clashes: 0 }
    const record = (r) => { worst.off += r.off; worst.clashes += r.clashes }

    // EVERY PAD, at min and max zoom, with and without a description open.
    for (const zName of ['min', 'max']) {
      const z = (zName === 'min' ? D.camera.minZoom : D.camera.maxZoom) * dpr
      g.rig.setTargetZoom(z)
      await until(() => Math.abs(g.cameras.main.zoom - z) < 0.01, 5000)
      note('at ' + zName + ' zoom ' + (g.cameras.main.zoom / dpr).toFixed(2) + ':')
      for (const sp of g.build.freeSpots()) {
        await lookAt(sp.x, sp.y)
        g.openPadRing(sp)
        await sleep(160)
        record(check('spot ' + sp.index + ' ring'))
        // Open each option's description in turn: the panel is a different
        // size for every tower, so one of them is not a sample.
        const opts = g.ring ? g.ring.hitBoxes.filter((b) => b.id !== 'ring:confirm' && b.id !== 'ring:cancel') : []
        for (const o of opts) {
          const b = o.rect
          await click(b.x + b.width / 2, b.y + b.height / 2)
          await sleep(120)
          record(check('  panel for ' + o.id))
        }
        if (sp.index === 0 && zName === 'min') await shot('ring-pad-' + VP.w + 'x' + VP.h)
        g.ring?.close()
        await sleep(80)
      }
    }

    // A REAL PURCHASE, through the two presses the design requires.
    g.rig.setTargetZoom(D.camera.defaultZoom * dpr)
    await until(() => Math.abs(g.cameras.main.zoom - D.camera.defaultZoom * dpr) < 0.02, 5000)
    const sp = g.build.freeSpots()[0]
    await lookAt(sp.x, sp.y)
    g.openPadRing(sp)
    await sleep(200)
    const before = g.towers.length
    const first = g.ring.hitBoxes[0]
    await click(first.rect.x + first.rect.width / 2, first.rect.y + first.rect.height / 2)
    await sleep(200)
    note('after one press on a ring button: towers ' + before + ' -> ' + g.towers.length +
      (g.towers.length === before ? '  correct — it opened a description, it did not buy'
        : '  *** IT BOUGHT SOMETHING ON THE FIRST TAP ***'))
    const confirm = g.ring.hitBoxes.find((b) => b.id === 'ring:confirm')
