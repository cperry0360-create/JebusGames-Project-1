<!doctype html><meta charset="utf-8"><title>compare</title><body><script type="module">
// What a re-encode actually costs, where a person would see it.
//
// PSNR is one number for four million pixels and it hides where the error
// went. This crops the same regions out of the original and the candidate,
// magnifies both the way the game magnifies the plate, and puts an amplified
// difference beside them.
const q = new URLSearchParams(location.search)
const src = q.get('src'), cand = q.get('cand'), zoom = Number(q.get('zoom') || 2.4)
const log = (m) => fetch('/log', { method: 'POST', body: m })

const load = async (p) => { const i = new Image(); i.src = p; await i.decode(); return i }
const a = await load('/' + src)
const b = await load('/' + cand)
await log(`${src} ${a.naturalWidth}x${a.naturalHeight} vs ${cand} ${b.naturalWidth}x${b.naturalHeight}`)

const pix = (img) => {
  const c = new OffscreenCanvas(img.naturalWidth, img.naturalHeight)
  const x = c.getContext('2d', { willReadFrequently: true })
  x.drawImage(img, 0, 0)
  return x.getImageData(0, 0, img.naturalWidth, img.naturalHeight)
}
const A = pix(a), B = pix(b)
const W = A.width

// Regions worth looking at, in SOURCE pixels: hard painted outlines are where
// a lossy codec rings, and flat gradients are where it bands. Both are worse
// than the average pixel, which is the point of choosing rather than sampling.
const CROP = 180
const regions = JSON.parse(q.get('regions'))

for (const r of regions) {
  const x0 = Math.max(0, Math.min(W - CROP, r.x - CROP / 2))
  const y0 = Math.max(0, Math.min(A.height - CROP, r.y - CROP / 2))
  const cell = Math.round(CROP * zoom)
  const out = new OffscreenCanvas(cell * 3 + 24, cell + 26)
  const g = out.getContext('2d')
  g.fillStyle = '#101010'; g.fillRect(0, 0, out.width, out.height)
  // Difference, amplified, built first so it can be drawn like the others.
  const diff = new OffscreenCanvas(CROP, CROP)
  const dg = diff.getContext('2d')
  const dd = dg.createImageData(CROP, CROP)
  let worst = 0, sum = 0
  for (let y = 0; y < CROP; y++) {
    for (let x = 0; x < CROP; x++) {
      const i = ((y0 + y) * W + (x0 + x)) * 4, j = (y * CROP + x) * 4
      let m = 0
      for (let c = 0; c < 3; c++) {
        const e = Math.abs(A.data[i + c] - B.data[i + c])
        if (e > m) m = e
        sum += e
      }
      if (m > worst) worst = m
      const v = Math.min(255, m * 8)
      dd.data[j] = v; dd.data[j + 1] = v; dd.data[j + 2] = v; dd.data[j + 3] = 255
    }
  }
  dg.putImageData(dd, 0, 0)

  const put = (img, ix, label) => {
    g.save()
    g.imageSmoothingEnabled = true
    g.imageSmoothingQuality = 'high'
    g.drawImage(img, x0, y0, CROP, CROP, 8 + ix * (cell + 8), 22, cell, cell)
    g.restore()
    g.fillStyle = '#e8e8e8'; g.font = '13px monospace'
    g.fillText(label, 8 + ix * (cell + 8), 15)
  }
  put(a, 0, 'PNG ' + r.name)
  put(b, 1, cand.split('/').pop())
  g.imageSmoothingEnabled = true
  g.drawImage(diff, 0, 0, CROP, CROP, 8 + 2 * (cell + 8), 22, cell, cell)
  g.fillStyle = '#e8e8e8'; g.fillText('difference x8', 8 + 2 * (cell + 8), 15)

  const blob = await out.convertToBlob({ type: 'image/png' })
  await fetch('/save/cmp_' + r.name + '.png', { method: 'POST', body: blob })
  await log(`${r.name.padEnd(14)} at ${r.x},${r.y}: worst channel error ${worst}, `
    + `mean ${(sum / (CROP * CROP * 3)).toFixed(2)} over the crop`)
}
await fetch('/done', { method: 'POST', body: '{}' })
</script></body>
