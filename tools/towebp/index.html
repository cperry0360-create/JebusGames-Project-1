<!doctype html><meta charset="utf-8"><title>towebp</title><body><script type="module">
// Re-encodes a list of PNGs to WebP and verifies each one against its source.
//
// Chromium is the encoder because this environment has no cwebp, no
// ImageMagick and no PIL, and every package registry answers 403. That is not
// a compromise: the libwebp inside the browser is the same library cwebp would
// call. What it does NOT expose is libwebp's `method` knob -- the encoder runs
// at Chromium's own effort setting -- so a cwebp -m 6 pass would be a little
// smaller at the same quality, never a different picture.
//
// Every file is checked before it is kept: identical dimensions, an alpha
// channel that still matches, and PSNR over the pixels a player can actually
// see (alpha > 0), which is the only place a lossy encoder can hurt.
const QUALITY = 0.95
const targets = await (await fetch('/list')).json()
const log = (m) => fetch('/log', { method: 'POST', body: m })

const results = []
for (const src of targets) {
  const img = new Image()
  img.src = '/' + src
  await img.decode()
  const w = img.naturalWidth, h = img.naturalHeight

  const cv = new OffscreenCanvas(w, h)
  const ctx = cv.getContext('2d', { willReadFrequently: true })
  ctx.drawImage(img, 0, 0)
  const ref = ctx.getImageData(0, 0, w, h).data

  const blob = await cv.convertToBlob({ type: 'image/webp', quality: QUALITY })

  // Decode what we are about to write and compare it to the source.
  const bmp = await createImageBitmap(blob)
  const c2 = new OffscreenCanvas(bmp.width, bmp.height)
  const x2 = c2.getContext('2d', { willReadFrequently: true })
  x2.drawImage(bmp, 0, 0)
  const got = x2.getImageData(0, 0, bmp.width, bmp.height).data

  // Error is measured on PREMULTIPLIED channels, which is what a compositor
  // actually draws. Straight RGB is the wrong ruler here: a pixel at alpha 1
  // divides its colour by 1/255 on the way out, so a single unit of rounding
  // in a nearly invisible pixel reads as a 255-unit error nobody can see, and
  // it swamps the average. Alpha itself is compared exactly.
  let sq = 0, n = 0, worst = 0, alphaWorst = 0, alphaOff = 0, litPx = 0
  for (let i = 0; i < ref.length; i += 4) {
    const ra = ref[i + 3], ga = got[i + 3]
    const da = Math.abs(ga - ra)
    if (da > alphaWorst) alphaWorst = da
    if (da > 0) alphaOff++
    if (ra === 0 && ga === 0) continue      // invisible: RGB there is meaningless
    litPx++
    for (let c = 0; c < 3; c++) {
      const e = (got[i + c] * ga - ref[i + c] * ra) / 255
      sq += e * e; n++
      if (Math.abs(e) > worst) worst = Math.abs(e)
    }
  }
  const mse = n ? sq / n : 0
  const psnr = mse === 0 ? Infinity : 10 * Math.log10(255 * 255 / mse)
  const rec = {
    src,
    dest: src.replace(/\.png$/, '.webp'),
    w, h,
    sameSize: bmp.width === w && bmp.height === h,
    srcBytes: (await (await fetch('/' + src)).blob()).size,
    bytes: blob.size,
    psnr, alphaWorst, alphaOff, litPx, worst,
  }
  if (!rec.sameSize) {
    await log(`REFUSED ${src}: ${w}x${h} became ${bmp.width}x${bmp.height}`)
    results.push({ ...rec, written: false })
    continue
  }
  await fetch('/save?path=' + encodeURIComponent(rec.dest), { method: 'POST', body: blob })
  results.push({ ...rec, written: true })
  await log(`${rec.dest.padEnd(52)} ${(rec.srcBytes / 1e6).toFixed(2)} -> ${(rec.bytes / 1e6).toFixed(2)} MB`
    + `  (${(100 - 100 * rec.bytes / rec.srcBytes).toFixed(0)}% off)  PSNR ${psnr.toFixed(1)} dB`
    + `  alpha off by <=${alphaWorst} on ${alphaOff}px`)
}
await fetch('/done', { method: 'POST', body: JSON.stringify(results, null, 1) })
</script></body>
